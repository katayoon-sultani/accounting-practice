u0627\u06CC \u06A9\u0647 \u0641\u0631\u0648\u0634 \u06CC\u0627 \u06A9\u0627\u0631 \u0627\u0646\u062C\u0627\u0645 \u0634\u062F\u0647 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u0646\u062F\u060C \u062D\u062A\u06CC \u0627\u06AF\u0631 \u0628\u0639\u062F\u0627\u064B \u067E\u0631\u062F\u0627\u062E\u062A \u0634\u0648\u0646\u062F.","\u0628\u062F\u0647\u06CC \u0627\u062D\u062A\u0645\u0627\u0644\u06CC (\u0645\u062B\u0644 \u062F\u0639\u0648\u0627\u06CC \u062D\u0642\u0648\u0642\u06CC) \u0627\u06AF\u0631 \u0627\u062D\u062A\u0645\u0627\u0644 \u0648\u0642\u0648\u0639\u0634 \u0632\u06CC\u0627\u062F \u0648 \u0645\u0628\u0644\u063A\u0634 \u0642\u0627\u0628\u0644 \u062A\u062E\u0645\u06CC\u0646 \u0628\u0627\u0634\u062F \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F\u061B \u0627\u06AF\u0631 \u0627\u062D\u062A\u0645\u0627\u0644\u0634 \u0645\u062A\u0648\u0633\u0637 \u0628\u0627\u0634\u062F \u0641\u0642\u0637 \u062F\u0631 \u06CC\u0627\u062F\u062F\u0627\u0634\u062A\u200C\u0647\u0627 \u0627\u0641\u0634\u0627 \u0645\u06CC\u200C\u0634\u0648\u062F\u061B \u0648 \u0627\u06AF\u0631 \u0628\u0639\u06CC\u062F \u0628\u0627\u0634\u062F\u060C \u0647\u06CC\u0686 \u06A9\u0627\u0631\u06CC \u0644\u0627\u0632\u0645 \u0646\u06CC\u0633\u062A."]},formulas:[{name:{en:"Sales tax",fa:"\u0645\u0627\u0644\u06CC\u0627\u062A \u0641\u0631\u0648\u0634"},formula:{en:"Sales tax = Sales \xD7 Tax rate",fa:"\u0645\u0627\u0644\u06CC\u0627\u062A \u0641\u0631\u0648\u0634 = \u0645\u0628\u0644\u063A \u0641\u0631\u0648\u0634 \xD7 \u0646\u0631\u062E \u0645\u0627\u0644\u06CC\u0627\u062A"},example:{en:"6,000 \xD7 5% = 300 \u2192 cash 6,300",fa:"\u06F6\u066C\u06F0\u06F0\u06F0 \xD7 \u06F5\u066A = \u06F3\u06F0\u06F0 \u2190 \u0646\u0642\u062F \u06F6\u066C\u06F3\u06F0\u06F0"}},{name:{en:"Note payable interest",fa:"\u0628\u0647\u0631\u0647\u0654 \u0633\u0646\u062F \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC"},formula:{en:"Interest = Principal \xD7 Rate \xD7 (Days \xF7 360)",fa:"\u0628\u0647\u0631\u0647 = \u0627\u0635\u0644 \xD7 \u0646\u0631\u062E \xD7 (\u0631\u0648\u0632\u0647\u0627 \xF7 \u06F3\u06F6\u06F0)"},example:{en:"2,000 \xD7 12% \xD7 (60 \xF7 360) = 40",fa:"\u06F2\u066C\u06F0\u06F0\u06F0 \xD7 \u06F1\u06F2\u066A \xD7 (\u06F6\u06F0\xF7\u06F3\u06F6\u06F0) = \u06F4\u06F0"}},{name:{en:"Employee net pay",fa:"\u062D\u0642\u0648\u0642 \u062E\u0627\u0644\u0635 \u06A9\u0627\u0631\u0645\u0646\u062F"},formula:{en:"Net pay = Gross pay \u2212 All deductions",fa:"\u062D\u0642\u0648\u0642 \u062E\u0627\u0644\u0635 = \u062D\u0642\u0648\u0642 \u0646\u0627\u062E\u0627\u0644\u0635 \u2212 \u0647\u0645\u0647\u0654 \u06A9\u0633\u0648\u0631\u0627\u062A"},example:{en:"2,000 \u2212 153 \u2212 213 = 1,634",fa:"\u06F2\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u06F5\u06F3 \u2212 \u06F2\u06F1\u06F3 = \u06F1\u066C\u06F6\u06F3\u06F4"}},{name:{en:"FICA tax",fa:"\u0645\u0627\u0644\u06CC\u0627\u062A \u062A\u0623\u0645\u06CC\u0646 \u0627\u062C\u062A\u0645\u0627\u0639\u06CC"},formula:{en:"FICA = Gross pay \xD7 7.65% (6.2% Social Security + 1.45% Medicare)",fa:"\u062A\u0623\u0645\u06CC\u0646 \u0627\u062C\u062A\u0645\u0627\u0639\u06CC = \u062D\u0642\u0648\u0642 \u0646\u0627\u062E\u0627\u0644\u0635 \xD7 \u06F7\u066B\u06F6\u06F5\u066A (\u06F6\u066B\u06F2\u066A \u0628\u0627\u0632\u0646\u0634\u0633\u062A\u06AF\u06CC + \u06F1\u066B\u06F4\u06F5\u066A \u062F\u0631\u0645\u0627\u0646)"},example:{en:"2,000 \xD7 7.65% = 153",fa:"\u06F2\u066C\u06F0\u06F0\u06F0 \xD7 \u06F7\u066B\u06F6\u06F5\u066A = \u06F1\u06F5\u06F3"}},{name:{en:"Warranty",fa:"\u06AF\u0627\u0631\u0627\u0646\u062A\u06CC"},formula:{en:"Warranty expense = Sales \xD7 Estimated percent",fa:"\u0647\u0632\u06CC\u0646\u0647\u0654 \u06AF\u0627\u0631\u0627\u0646\u062A\u06CC = \u0641\u0631\u0648\u0634 \xD7 \u062F\u0631\u0635\u062F \u062A\u062E\u0645\u06CC\u0646\u06CC"},example:{en:"16,000 \xD7 4% = 640",fa:"\u06F1\u06F6\u066C\u06F0\u06F0\u06F0 \xD7 \u06F4\u066A = \u06F6\u06F4\u06F0"}},{name:{en:"Times interest earned",fa:"\u0646\u0633\u0628\u062A \u067E\u0648\u0634\u0634 \u0628\u0647\u0631\u0647"},formula:{en:"Times interest earned = Income before interest and taxes \xF7 Interest expense",fa:"\u067E\u0648\u0634\u0634 \u0628\u0647\u0631\u0647 = \u0633\u0648\u062F \u0642\u0628\u0644 \u0627\u0632 \u0628\u0647\u0631\u0647 \u0648 \u0645\u0627\u0644\u06CC\u0627\u062A \xF7 \u0647\u0632\u06CC\u0646\u0647\u0654 \u0628\u0647\u0631\u0647"},example:{en:"120,000 \xF7 20,000 = 6 times",fa:"\u06F1\u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F2\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F6 \u0628\u0627\u0631"}}]},{id:10,title:{en:"Accounting for Long-Term Liabilities",fa:"\u0628\u062F\u0647\u06CC\u200C\u0647\u0627\u06CC \u0628\u0644\u0646\u062F\u0645\u062F\u062A"},summary:{en:["Bonds let a company borrow from many investors. The company promises to pay interest periodically and repay the par value at maturity. Advantages: owners' control is not diluted and interest is tax-deductible. Disadvantage: interest and principal must be paid.","If the contract rate equals the market rate, bonds sell at par. If the contract rate is below the market rate, they sell at a discount (cheaper); if above, at a premium (more expensive).","A discount or premium is amortized over the bond's life. With straight-line, the same amount each period. A discount makes interest expense higher than cash interest, and a premium makes it lower.","The carrying value of discount bonds starts below par and rises each period; premium bonds start above par and fall. At maturity, both equal par value.","Installment notes split each payment into interest (on the remaining principal) and principal reduction. A mortgage is secured by an asset."],fa:["\u0627\u0648\u0631\u0627\u0642 \u0642\u0631\u0636\u0647 \u0631\u0627\u0647\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0634\u0631\u06A9\u062A \u0627\u0632 \u0645\u0631\u062F\u0645 \u0642\u0631\u0636 \u0628\u06AF\u06CC\u0631\u062F. \u0634\u0631\u06A9\u062A \u0642\u0648\u0644 \u0645\u06CC\u200C\u062F\u0647\u062F \u062F\u0631 \u062F\u0648\u0631\u0647\u200C\u0647\u0627\u06CC \u0645\u0634\u062E\u0635 \u0628\u0647\u0631\u0647 \u0628\u067E\u0631\u062F\u0627\u0632\u062F \u0648 \u062F\u0631 \u0633\u0631\u0631\u0633\u06CC\u062F\u060C \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0631\u0627 \u0628\u0631\u06AF\u0631\u062F\u0627\u0646\u062F. \u0645\u0632\u06CC\u062A\u0634 \u0627\u06CC\u0646 \u0627\u0633\u062A \u06A9\u0647 \u0645\u0627\u0644\u06A9\u06CC\u062A \u0633\u0647\u0627\u0645\u200C\u062F\u0627\u0631\u0627\u0646 \u06A9\u0645 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0628\u0647\u0631\u0647 \u0627\u0632 \u0645\u0627\u0644\u06CC\u0627\u062A \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F\u061B \u0639\u06CC\u0628\u0634 \u0627\u06CC\u0646 \u0627\u0633\u062A \u06A9\u0647 \u0628\u0647\u0631\u0647 \u0648 \u0627\u0635\u0644 \u0628\u0627\u06CC\u062F \u062D\u062A\u0645\u0627\u064B \u067E\u0631\u062F\u0627\u062E\u062A \u0634\u0648\u0646\u062F.","\u0627\u06AF\u0631 \u0646\u0631\u062E \u0627\u0648\u0631\u0627\u0642 \u0628\u0627 \u0646\u0631\u062E \u0628\u0627\u0632\u0627\u0631 \u0628\u0631\u0627\u0628\u0631 \u0628\u0627\u0634\u062F\u060C \u0627\u0648\u0631\u0627\u0642 \u0628\u0647 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0641\u0631\u0648\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F. \u0627\u06AF\u0631 \u0646\u0631\u062E \u0627\u0648\u0631\u0627\u0642 \u06A9\u0645\u062A\u0631 \u0627\u0632 \u0628\u0627\u0632\u0627\u0631 \u0628\u0627\u0634\u062F\u060C \u0628\u0627 \u06A9\u0633\u0631 (\u0627\u0631\u0632\u0627\u0646\u200C\u062A\u0631) \u0648 \u0627\u06AF\u0631 \u0628\u06CC\u0634\u062A\u0631 \u0628\u0627\u0634\u062F\u060C \u0628\u0627 \u0635\u0631\u0641 (\u06AF\u0631\u0627\u0646\u200C\u062A\u0631) \u0641\u0631\u0648\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F.","\u06A9\u0633\u0631 \u06CC\u0627 \u0635\u0631\u0641 \u062F\u0631 \u0637\u0648\u0644 \u0639\u0645\u0631 \u0627\u0648\u0631\u0627\u0642 \u0645\u0633\u062A\u0647\u0644\u06A9 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0628\u0627 \u0631\u0648\u0634 \u062E\u0637 \u0645\u0633\u062A\u0642\u06CC\u0645\u060C \u0647\u0631 \u062F\u0648\u0631\u0647 \u0645\u0628\u0644\u063A \u0645\u0633\u0627\u0648\u06CC. \u06A9\u0633\u0631\u060C \u0647\u0632\u06CC\u0646\u0647\u0654 \u0628\u0647\u0631\u0647 \u0631\u0627 \u0628\u06CC\u0634\u062A\u0631 \u0627\u0632 \u0628\u0647\u0631\u0647\u0654 \u0646\u0642\u062F\u06CC \u0645\u06CC\u200C\u06A9\u0646\u062F \u0648 \u0635\u0631\u0641\u060C \u0622\u0646 \u0631\u0627 \u06A9\u0645\u062A\u0631.","\u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u0627\u0648\u0631\u0627\u0642 \u0628\u0627 \u06A9\u0633\u0631 \u0627\u0632 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0634\u0631\u0648\u0639 \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0647\u0631 \u062F\u0648\u0631\u0647 \u0628\u0627\u0644\u0627 \u0645\u06CC\u200C\u0631\u0648\u062F\u061B \u0628\u0627 \u0635\u0631\u0641\u060C \u0628\u0627\u0644\u0627\u062A\u0631 \u0634\u0631\u0648\u0639 \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0647\u0631 \u062F\u0648\u0631\u0647 \u067E\u0627\u06CC\u06CC\u0646 \u0645\u06CC\u200C\u0622\u06CC\u062F. \u062F\u0631 \u0633\u0631\u0631\u0633\u06CC\u062F\u060C \u0647\u0631 \u062F\u0648 \u0628\u0631\u0627\u0628\u0631 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0645\u06CC\u200C\u0634\u0648\u0646\u062F.","\u0627\u0633\u0646\u0627\u062F \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC \u0627\u0642\u0633\u0627\u0637\u06CC \u0647\u0631 \u0642\u0633\u0637 \u0631\u0627 \u0628\u0647 \u062F\u0648 \u0628\u062E\u0634 \u062A\u0642\u0633\u06CC\u0645 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F: \u0628\u0647\u0631\u0647 (\u0631\u0648\u06CC \u0645\u0627\u0646\u062F\u0647\u0654 \u0627\u0635\u0644) \u0648 \u06A9\u0627\u0647\u0634 \u0627\u0635\u0644. \u0648\u0627\u0645 \u0631\u0647\u0646\u06CC \u0628\u0627 \u06CC\u06A9 \u062F\u0627\u0631\u0627\u06CC\u06CC \u062A\u0636\u0645\u06CC\u0646 \u0645\u06CC\u200C\u0634\u0648\u062F."]},formulas:[{name:{en:"Cash interest per period",fa:"\u0628\u0647\u0631\u0647\u0654 \u0646\u0642\u062F\u06CC \u0647\u0631 \u062F\u0648\u0631\u0647"},formula:{en:"Cash interest = Par value \xD7 Contract rate \xD7 (Fraction of year)",fa:"\u0628\u0647\u0631\u0647\u0654 \u0646\u0642\u062F\u06CC = \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \xD7 \u0646\u0631\u062E \u0627\u0648\u0631\u0627\u0642 \xD7 (\u06A9\u0633\u0631\u06CC \u0627\u0632 \u0633\u0627\u0644)"},example:{en:"100,000 \xD7 8% \xD7 \xBD = 4,000",fa:"\u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \xD7 \u06F8\u066A \xD7 \xBD = \u06F4\u066C\u06F0\u06F0\u06F0"}},{name:{en:"Discount or premium",fa:"\u06A9\u0633\u0631 \u06CC\u0627 \u0635\u0631\u0641"},formula:{en:"Discount = Par \u2212 Issue price | Premium = Issue price \u2212 Par",fa:"\u06A9\u0633\u0631 = \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u2212 \u0642\u06CC\u0645\u062A \u0641\u0631\u0648\u0634 | \u0635\u0631\u0641 = \u0642\u06CC\u0645\u062A \u0641\u0631\u0648\u0634 \u2212 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC"},example:{en:"100,000 \u2212 96,000 = 4,000 discount",fa:"\u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F9\u06F6\u066C\u06F0\u06F0\u06F0 = \u06F4\u066C\u06F0\u06F0\u06F0 \u06A9\u0633\u0631"}},{name:{en:"Straight-line amortization",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u062E\u0637 \u0645\u0633\u062A\u0642\u06CC\u0645 \u06A9\u0633\u0631 \u06CC\u0627 \u0635\u0631\u0641"},formula:{en:"Amortization per period = Discount or premium \xF7 Number of interest periods",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0647\u0631 \u062F\u0648\u0631\u0647 = \u06A9\u0633\u0631 \u06CC\u0627 \u0635\u0631\u0641 \xF7 \u062A\u0639\u062F\u0627\u062F \u062F\u0648\u0631\u0647\u200C\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A \u0628\u0647\u0631\u0647"},example:{en:"4,000 \xF7 8 = 500",fa:"\u06F4\u066C\u06F0\u06F0\u06F0 \xF7 \u06F8 = \u06F5\u06F0\u06F0"}},{name:{en:"Interest expense with a discount",fa:"\u0647\u0632\u06CC\u0646\u0647\u0654 \u0628\u0647\u0631\u0647 \u0628\u0627 \u06A9\u0633\u0631"},formula:{en:"Interest expense = Cash interest + Discount amortization",fa:"\u0647\u0632\u06CC\u0646\u0647\u0654 \u0628\u0647\u0631\u0647 = \u0628\u0647\u0631\u0647\u0654 \u0646\u0642\u062F\u06CC + \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u06A9\u0633\u0631"},example:{en:"4,000 + 500 = 4,500",fa:"\u06F4\u066C\u06F0\u06F0\u06F0 + \u06F5\u06F0\u06F0 = \u06F4\u066C\u06F5\u06F0\u06F0"}},{name:{en:"Interest expense with a premium",fa:"\u0647\u0632\u06CC\u0646\u0647\u0654 \u0628\u0647\u0631\u0647 \u0628\u0627 \u0635\u0631\u0641"},formula:{en:"Interest expense = Cash interest \u2212 Premium amortization",fa:"\u0647\u0632\u06CC\u0646\u0647\u0654 \u0628\u0647\u0631\u0647 = \u0628\u0647\u0631\u0647\u0654 \u0646\u0642\u062F\u06CC \u2212 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0635\u0631\u0641"},example:{en:"4,000 \u2212 500 = 3,500",fa:"\u06F4\u066C\u06F0\u06F0\u06F0 \u2212 \u06F5\u06F0\u06F0 = \u06F3\u066C\u06F5\u06F0\u06F0"}},{name:{en:"Bond carrying value",fa:"\u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u0627\u0648\u0631\u0627\u0642"},formula:{en:"Carrying value = Par \u2212 Unamortized discount (or + Unamortized premium)",fa:"\u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC = \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u2212 \u06A9\u0633\u0631 \u0645\u0633\u062A\u0647\u0644\u06A9\u200C\u0646\u0634\u062F\u0647 (\u06CC\u0627 + \u0635\u0631\u0641 \u0645\u0633\u062A\u0647\u0644\u06A9\u200C\u0646\u0634\u062F\u0647)"},example:{en:"100,000 \u2212 3,500 = 96,500",fa:"\u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F3\u066C\u06F5\u06F0\u06F0 = \u06F9\u06F6\u066C\u06F5\u06F0\u06F0"}},{name:{en:"Debt-to-equity ratio",fa:"\u0646\u0633\u0628\u062A \u0628\u062F\u0647\u06CC \u0628\u0647 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645"},formula:{en:"Debt-to-equity = Total liabilities \xF7 Total equity",fa:"\u0646\u0633\u0628\u062A = \u06A9\u0644 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 \xF7 \u06A9\u0644 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645"},example:{en:"300,000 \xF7 200,000 = 1.5",fa:"\u06F3\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F2\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F1\u066B\u06F5"}}]},{id:11,title:{en:"Corporate Reporting and Analysis",fa:"\u0634\u0631\u06A9\u062A\u200C\u0647\u0627\u06CC \u0633\u0647\u0627\u0645\u06CC"},summary:{en:["A corporation is a legal entity separate from its owners. Stockholders have limited liability, ownership is easily transferred, and the corporation has continuous life; but its income is taxed twice.","Par value is an arbitrary amount assigned to each share. When stock is sold above par, the par amount goes to Common Stock and the excess to Paid-In Capital in Excess of Par. Stock issued for noncash assets is recorded at market value.","A cash dividend has three dates: declaration (record the liability), record (no entry), and payment. A stock dividend gives new shares instead of cash. A stock split only increases the number of shares and lowers par per share, with no entry.","Preferred stock has priority over common stock for dividends. If it is cumulative, unpaid dividends from prior years (dividends in arrears) must be paid to preferred first.","Treasury stock is the company's own stock bought back from the market. It is not an asset; it reduces equity. Retained earnings increase with net income and decrease with losses and dividends."],fa:["\u0634\u0631\u06A9\u062A \u0633\u0647\u0627\u0645\u06CC \u06CC\u06A9 \u0634\u062E\u0635\u06CC\u062A \u062D\u0642\u0648\u0642\u06CC \u062C\u062F\u0627 \u0627\u0632 \u0635\u0627\u062D\u0628\u0627\u0646\u0634 \u0627\u0633\u062A. \u0633\u0647\u0627\u0645\u200C\u062F\u0627\u0631\u0627\u0646 \u0645\u0633\u0626\u0648\u0644\u06CC\u062A \u0645\u062D\u062F\u0648\u062F \u062F\u0627\u0631\u0646\u062F\u060C \u0645\u0627\u0644\u06A9\u06CC\u062A \u0631\u0627\u062D\u062A \u0645\u0646\u062A\u0642\u0644 \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0639\u0645\u0631 \u0634\u0631\u06A9\u062A \u0645\u062D\u062F\u0648\u062F \u0646\u06CC\u0633\u062A\u061B \u0648\u0644\u06CC \u0633\u0648\u062F \u0634\u0631\u06A9\u062A \u062F\u0648\u0628\u0627\u0631 \u0645\u0627\u0644\u06CC\u0627\u062A \u0645\u06CC\u200C\u062E\u0648\u0631\u062F.","\u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0645\u0628\u0644\u063A\u06CC \u0642\u0631\u0627\u0631\u062F\u0627\u062F\u06CC \u0628\u0631\u0627\u06CC \u0647\u0631 \u0633\u0647\u0645 \u0627\u0633\u062A. \u0648\u0642\u062A\u06CC \u0633\u0647\u0627\u0645 \u0628\u0627\u0644\u0627\u062A\u0631 \u0627\u0632 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0641\u0631\u0648\u062E\u062A\u0647 \u0634\u0648\u062F\u060C \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0628\u0647 \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC \u0648 \u0645\u0627\u0632\u0627\u062F\u0634 \u0628\u0647 \xAB\u0635\u0631\u0641 \u0633\u0647\u0627\u0645\xBB \u0645\u06CC\u200C\u0631\u0648\u062F. \u0627\u06AF\u0631 \u0633\u0647\u0627\u0645 \u062F\u0631 \u0628\u0631\u0627\u0628\u0631 \u062F\u0627\u0631\u0627\u06CC\u06CC \u063A\u06CC\u0631\u0646\u0642\u062F\u06CC \u062F\u0627\u062F\u0647 \u0634\u0648\u062F\u060C \u0628\u0627 \u0627\u0631\u0632\u0634 \u0628\u0627\u0632\u0627\u0631 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F.","\u0633\u0648\u062F \u0646\u0642\u062F\u06CC \u0633\u0647 \u062A\u0627\u0631\u06CC\u062E \u062F\u0627\u0631\u062F: \u062A\u0627\u0631\u06CC\u062E \u0627\u0639\u0644\u0627\u0645 (\u062B\u0628\u062A \u0628\u062F\u0647\u06CC)\u060C \u062A\u0627\u0631\u06CC\u062E \u062B\u0628\u062A \u0645\u0627\u0644\u06A9\u06CC\u062A (\u062B\u0628\u062A\u06CC \u0646\u062F\u0627\u0631\u062F) \u0648 \u062A\u0627\u0631\u06CC\u062E \u067E\u0631\u062F\u0627\u062E\u062A. \u0633\u0648\u062F \u0633\u0647\u0645\u06CC \u0628\u0647 \u062C\u0627\u06CC \u067E\u0648\u0644\u060C \u0633\u0647\u0627\u0645 \u062C\u062F\u06CC\u062F \u0645\u06CC\u200C\u062F\u0647\u062F. \u062A\u062C\u0632\u06CC\u0647\u0654 \u0633\u0647\u0627\u0645 \u0641\u0642\u0637 \u062A\u0639\u062F\u0627\u062F \u0633\u0647\u0627\u0645 \u0631\u0627 \u0632\u06CC\u0627\u062F \u0648 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0647\u0631 \u0633\u0647\u0645 \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u062F \u0648 \u062B\u0628\u062A\u06CC \u0646\u062F\u0627\u0631\u062F.","\u0633\u0647\u0627\u0645 \u0645\u0645\u062A\u0627\u0632 \u062F\u0631 \u062F\u0631\u06CC\u0627\u0641\u062A \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u0628\u0631 \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC \u0627\u0648\u0644\u0648\u06CC\u062A \u062F\u0627\u0631\u062F. \u0627\u06AF\u0631 \u0633\u0648\u062F \u0622\u0646 \xAB\u0627\u0646\u0628\u0627\u0634\u062A\u0646\u06CC\xBB \u0628\u0627\u0634\u062F\u060C \u0633\u0648\u062F\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0646\u0634\u062F\u0647\u0654 \u0633\u0627\u0644\u200C\u0647\u0627\u06CC \u0642\u0628\u0644 \u0647\u0645 \u0628\u0627\u06CC\u062F \u0627\u0648\u0644 \u0628\u0647 \u0633\u0647\u0627\u0645 \u0645\u0645\u062A\u0627\u0632 \u062F\u0627\u062F\u0647 \u0634\u0648\u062F.","\u0633\u0647\u0627\u0645 \u062E\u0632\u0627\u0646\u0647 \u0633\u0647\u0627\u0645\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0634\u0631\u06A9\u062A \u0627\u0632 \u0628\u0627\u0632\u0627\u0631 \u067E\u0633 \u062E\u0631\u06CC\u062F\u0647. \u0627\u06CC\u0646 \u0633\u0647\u0627\u0645 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0646\u06CC\u0633\u062A \u0648 \u0627\u0632 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u0628\u0627 \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0632\u06CC\u0627\u062F \u0648 \u0628\u0627 \u0632\u06CC\u0627\u0646 \u0648 \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F."]},formulas:[{name:{en:"Issuing stock above par",fa:"\u0635\u062F\u0648\u0631 \u0633\u0647\u0627\u0645 \u0628\u0627\u0644\u0627\u062A\u0631 \u0627\u0632 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC"},formula:{en:"Common Stock = Shares \xD7 Par; Excess = Cash received \u2212 Total par",fa:"\u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC = \u062A\u0639\u062F\u0627\u062F \xD7 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC\u061B \u0635\u0631\u0641 \u0633\u0647\u0627\u0645 = \u067E\u0648\u0644 \u062F\u0631\u06CC\u0627\u0641\u062A\u06CC \u2212 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u06A9\u0644"},example:{en:"1,000 shares \xD7 12 = 12,000; par 10 \u2192 10,000 stock + 2,000 excess",fa:"\u06F1\u06F0\u06F0\u06F0 \u0633\u0647\u0645 \xD7 \u06F1\u06F2 = \u06F1\u06F2\u066C\u06F0\u06F0\u06F0\u061B \u0627\u0633\u0645\u06CC \u06F1\u06F0 \u2190 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \u0633\u0647\u0627\u0645 + \u06F2\u066C\u06F0\u06F0\u06F0 \u0635\u0631\u0641"}},{name:{en:"Preferred dividend",fa:"\u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u0645\u0645\u062A\u0627\u0632"},formula:{en:"Annual preferred dividend = Preferred par \xD7 Dividend rate",fa:"\u0633\u0648\u062F \u0633\u0627\u0644\u0627\u0646\u0647\u0654 \u0645\u0645\u062A\u0627\u0632 = \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0645\u0645\u062A\u0627\u0632 \xD7 \u0646\u0631\u062E \u0633\u0648\u062F"},example:{en:"100,000 \xD7 9% = 9,000",fa:"\u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \xD7 \u06F9\u066A = \u06F9\u066C\u06F0\u06F0\u06F0"}},{name:{en:"Earnings per share",fa:"\u0633\u0648\u062F \u0647\u0631 \u0633\u0647\u0645"},formula:{en:"EPS = (Net income \u2212 Preferred dividends) \xF7 Weighted-average common shares",fa:"\u0633\u0648\u062F \u0647\u0631 \u0633\u0647\u0645 = (\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u2212 \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u0645\u0645\u062A\u0627\u0632) \xF7 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC"},example:{en:"(100,000 \u2212 20,000) \xF7 40,000 = 2",fa:"(\u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u06F0\u066C\u06F0\u06F0\u06F0) \xF7 \u06F4\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F2"}},{name:{en:"Price-earnings ratio",fa:"\u0646\u0633\u0628\u062A \u0642\u06CC\u0645\u062A \u0628\u0647 \u0633\u0648\u062F"},formula:{en:"P/E = Market price per share \xF7 EPS",fa:"\u0642\u06CC\u0645\u062A \u0628\u0647 \u0633\u0648\u062F = \u0642\u06CC\u0645\u062A \u0628\u0627\u0632\u0627\u0631 \u0647\u0631 \u0633\u0647\u0645 \xF7 \u0633\u0648\u062F \u0647\u0631 \u0633\u0647\u0645"},example:{en:"30 \xF7 2 = 15",fa:"\u06F3\u06F0 \xF7 \u06F2 = \u06F1\u06F5"}},{name:{en:"Dividend yield",fa:"\u0628\u0627\u0632\u062F\u0647 \u0633\u0648\u062F \u0633\u0647\u0627\u0645"},formula:{en:"Dividend yield = Annual cash dividend per share \xF7 Market price per share",fa:"\u0628\u0627\u0632\u062F\u0647 = \u0633\u0648\u062F \u0646\u0642\u062F\u06CC \u0633\u0627\u0644\u0627\u0646\u0647\u0654 \u0647\u0631 \u0633\u0647\u0645 \xF7 \u0642\u06CC\u0645\u062A \u0628\u0627\u0632\u0627\u0631 \u0647\u0631 \u0633\u0647\u0645"},example:{en:"1.5 \xF7 30 = 5%",fa:"\u06F1\u066B\u06F5 \xF7 \u06F3\u06F0 = \u06F5\u066A"}},{name:{en:"Stock split",fa:"\u062A\u062C\u0632\u06CC\u0647\u0654 \u0633\u0647\u0627\u0645"},formula:{en:"New shares = Old shares \xD7 Split ratio; New par = Old par \xF7 Ratio",fa:"\u062A\u0639\u062F\u0627\u062F \u062C\u062F\u06CC\u062F = \u062A\u0639\u062F\u0627\u062F \u0642\u0628\u0644\u06CC \xD7 \u0646\u0633\u0628\u062A \u062A\u062C\u0632\u06CC\u0647\u061B \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u062C\u062F\u06CC\u062F = \u0627\u0633\u0645\u06CC \u0642\u0628\u0644\u06CC \xF7 \u0646\u0633\u0628\u062A"},example:{en:"2-for-1: 1,000 shares at $10 \u2192 2,000 shares at $5",fa:"\u062A\u062C\u0632\u06CC\u0647\u0654 \u06F2 \u0628\u0647 \u06F1: \u06F1\u06F0\u06F0\u06F0 \u0633\u0647\u0645 \u06F1\u06F0 \u062F\u0644\u0627\u0631\u06CC \u2190 \u06F2\u06F0\u06F0\u06F0 \u0633\u0647\u0645 \u06F5 \u062F\u0644\u0627\u0631\u06CC"}}]},{id:12,title:{en:"Reporting Cash Flows",fa:"\u0635\u0648\u0631\u062A \u062C\u0631\u06CC\u0627\u0646 \u0648\u062C\u0648\u0647 \u0646\u0642\u062F"},summary:{en:["The statement of cash flows shows where cash came from and where it went during a period. It has three sections.","Operating activities: the company's day-to-day business, such as cash from customers and payments to suppliers and employees. Investing activities: buying and selling long-term assets and investments. Financing activities: borrowing and repaying, issuing stock, and paying dividends.","Activities with no cash (such as buying land by issuing stock) are not in the main statement; they are disclosed separately.","In the indirect method, we start with net income. Add noncash expenses like depreciation and losses on asset sales, and subtract gains. Then subtract increases in current assets and add decreases; add increases in current liabilities and subtract decreases.","The total of the three sections is the net change in cash, which must equal the difference between beginning and ending cash on the balance sheet."],fa:["\u0635\u0648\u0631\u062A \u062C\u0631\u06CC\u0627\u0646 \u0648\u062C\u0648\u0647 \u0646\u0642\u062F \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u067E\u0648\u0644 \u0646\u0642\u062F \u062F\u0631 \u06CC\u06A9 \u062F\u0648\u0631\u0647 \u0627\u0632 \u06A9\u062C\u0627 \u0622\u0645\u062F \u0648 \u06A9\u062C\u0627 \u0631\u0641\u062A. \u0627\u06CC\u0646 \u0635\u0648\u0631\u062A \u0633\u0647 \u0628\u062E\u0634 \u062F\u0627\u0631\u062F.","\u0641\u0639\u0627\u0644\u06CC\u062A\u200C\u0647\u0627\u06CC \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC: \u06A9\u0627\u0631 \u0631\u0648\u0632\u0645\u0631\u0647\u0654 \u0634\u0631\u06A9\u062A\u060C \u0645\u062B\u0644 \u062F\u0631\u06CC\u0627\u0641\u062A \u0627\u0632 \u0645\u0634\u062A\u0631\u06CC \u0648 \u067E\u0631\u062F\u0627\u062E\u062A \u0628\u0647 \u0641\u0631\u0648\u0634\u0646\u062F\u0647 \u0648 \u06A9\u0627\u0631\u0645\u0646\u062F. \u0641\u0639\u0627\u0644\u06CC\u062A\u200C\u0647\u0627\u06CC \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC: \u062E\u0631\u06CC\u062F \u0648 \u0641\u0631\u0648\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC \u0628\u0644\u0646\u062F\u0645\u062F\u062A \u0648 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC\u200C\u0647\u0627. \u0641\u0639\u0627\u0644\u06CC\u062A\u200C\u0647\u0627\u06CC \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC: \u0642\u0631\u0636 \u06AF\u0631\u0641\u062A\u0646 \u0648 \u0628\u0627\u0632\u067E\u0631\u062F\u0627\u062E\u062A\u060C \u0635\u062F\u0648\u0631 \u0633\u0647\u0627\u0645\u060C \u0648 \u067E\u0631\u062F\u0627\u062E\u062A \u0633\u0648\u062F \u0633\u0647\u0627\u0645.","\u0641\u0639\u0627\u0644\u06CC\u062A\u200C\u0647\u0627\u06CC\u06CC \u06A9\u0647 \u067E\u0648\u0644 \u0646\u0642\u062F \u0646\u062F\u0627\u0631\u0646\u062F (\u0645\u062B\u0644 \u062E\u0631\u06CC\u062F \u0632\u0645\u06CC\u0646 \u0628\u0627 \u0635\u062F\u0648\u0631 \u0633\u0647\u0627\u0645) \u062F\u0631 \u0635\u0648\u0631\u062A \u0627\u0635\u0644\u06CC \u0646\u0645\u06CC\u200C\u0622\u06CC\u0646\u062F \u0648 \u062C\u062F\u0627\u06AF\u0627\u0646\u0647 \u0627\u0641\u0634\u0627 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F.","\u062F\u0631 \u0631\u0648\u0634 \u063A\u06CC\u0631\u0645\u0633\u062A\u0642\u06CC\u0645\u060C \u0627\u0632 \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0634\u0631\u0648\u0639 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645. \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627\u06CC \u063A\u06CC\u0631\u0646\u0642\u062F\u06CC \u0645\u062B\u0644 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0648 \u0632\u06CC\u0627\u0646 \u0641\u0631\u0648\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0631\u0627 \u0627\u0636\u0627\u0641\u0647\u060C \u0648 \u0633\u0648\u062F \u0641\u0631\u0648\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645. \u0628\u0639\u062F \u0627\u0641\u0632\u0627\u06CC\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC \u062C\u0627\u0631\u06CC \u0631\u0627 \u06A9\u0645 \u0648 \u06A9\u0627\u0647\u0634 \u0622\u0646\u200C\u0647\u0627 \u0631\u0627 \u0627\u0636\u0627\u0641\u0647 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645\u061B \u0627\u0641\u0632\u0627\u06CC\u0634 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627\u06CC \u062C\u0627\u0631\u06CC \u0631\u0627 \u0627\u0636\u0627\u0641\u0647 \u0648 \u06A9\u0627\u0647\u0634 \u0622\u0646\u200C\u0647\u0627 \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645.","\u062C\u0645\u0639 \u0633\u0647 \u0628\u062E\u0634\u060C \u062A\u063A\u06CC\u06CC\u0631 \u062E\u0627\u0644\u0635 \u067E\u0648\u0644 \u0646\u0642\u062F \u0627\u0633\u062A \u0648 \u0628\u0627\u06CC\u062F \u0628\u0627 \u0641\u0631\u0642 \u067E\u0648\u0644 \u0646\u0642\u062F \u0627\u0648\u0644 \u0648 \u0622\u062E\u0631 \u062F\u0648\u0631\u0647 \u062F\u0631 \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647 \u0628\u0631\u0627\u0628\u0631 \u0628\u0627\u0634\u062F."]},formulas:[{name:{en:"Net change in cash",fa:"\u062A\u063A\u06CC\u06CC\u0631 \u062E\u0627\u0644\u0635 \u067E\u0648\u0644 \u0646\u0642\u062F"},formula:{en:"Net change = Operating + Investing + Financing",fa:"\u062A\u063A\u06CC\u06CC\u0631 \u062E\u0627\u0644\u0635 = \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC + \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC + \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC"},example:{en:"20,000 \u2212 15,000 + 5,000 = 10,000",fa:"\u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u06F5\u066C\u06F0\u06F0\u06F0 + \u06F5\u066C\u06F0\u06F0\u06F0 = \u06F1\u06F0\u066C\u06F0\u06F0\u06F0"}},{name:{en:"Indirect method",fa:"\u0631\u0648\u0634 \u063A\u06CC\u0631\u0645\u0633\u062A\u0642\u06CC\u0645"},formula:{en:"Operating cash flow = Net income + Depreciation + Losses \u2212 Gains \xB1 Changes in current assets and liabilities",fa:"\u062C\u0631\u06CC\u0627\u0646 \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC = \u0633\u0648\u062F \u062E\u0627\u0644\u0635 + \u0627  \u06A9\u0646\u06CC\u062F | \u06A9\u0627\u0647\u0634 \u0628\u062F\u0647\u06CC \u062C\u0627\u0631\u06CC \u2190 \u06A9\u0645 \u06A9\u0646\u06CC\u062F"},example:{en:"Payables fell 1,000 \u2192 subtract 1,000 from net income",fa:"\u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC\u200C\u0647\u0627 \u06F1\u066C\u06F0\u06F0\u06F0 \u06A9\u0645 \u0634\u062F \u2190 \u06F1\u066C\u06F0\u06F0\u06F0 \u0627\u0632 \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F"}},{name:{en:"Ending cash",fa:"\u067E\u0648\u0644 \u0646\u0642\u062F \u067E\u0627\u06CC\u0627\u0646 \u062F\u0648\u0631\u0647"},formula:{en:"Ending cash = Beginning cash + Net change",fa:"\u067E\u0648\u0644 \u0646\u0642\u062F \u067E\u0627\u06CC\u0627\u0646 = \u067E\u0648\u0644 \u0646\u0642\u062F \u0627\u0648\u0644 + \u062A\u063A\u06CC\u06CC\u0631 \u062E\u0627\u0644\u0635"},example:{en:"12,000 + 10,000 = 22,000",fa:"\u06F1\u06F2\u066C\u06F0\u06F0\u06F0 + \u06F1\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F2\u06F2\u066C\u06F0\u06F0\u06F0"}},{name:{en:"Cash flow on total assets",fa:"\u062C\u0631\u06CC\u0627\u0646 \u0646\u0642\u062F \u0628\u0647 \u06A9\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"},formula:{en:"Ratio = Operating cash flow \xF7 Average total assets",fa:"\u0646\u0633\u0628\u062A = \u062C\u0631\u06CC\u0627\u0646 \u0646\u0642\u062F \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \xF7 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u06A9\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"},example:{en:"20,000 \xF7 250,000 = 8%",fa:"\u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F2\u06F5\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F8\u066A"}}]}];var Xn=E(ze()),Km=(e,a)=>fetch(e,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(a)}).then(t=>t.json()).finally(()=>window.dispatchEvent(new Event("progress-changed"))),Jm=(e,a,t)=>Km("/api/attempt",{exerciseId:e,chapter:a,correct:t}),$m=(e,a,t)=>Km("/api/cards",{cardId:e,chapter:a,known:t}),Wm=(e,a)=>f \u06CC\u0634 \u06F3\u06F0\u066C\u06F0\u06F0\u06F0 \u0627\u0633\u062A. \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u0686\u0642\u062F\u0631 \u0627\u0633\u062A\u061F"},answer:5e4,tolerance:.5,explanation:{en:"Equity = Assets \u2212 Liabilities = 80,000 \u2212 30,000 = 50,000",fa:"\u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 = \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u2212 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 = \u06F8\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F3\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F5\u06F0\u066C\u06F0\u06F0\u06F0"}},{id:"c1-04",chapter:1,level:1,type:"fill",question:{en:"A company has revenues of 12,000 and expenses of 7,500. What is net income?",fa:"\u062F\u0631\u0622\u0645\u062F \u0634\u0631\u06A9\u062A \u06F1\u06F2\u066C\u06F0\u06F0\u06F0 \u0648 \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627\u06CC\u0634 \u06F7\u066C\u06F5\u06F0\u06F0 \u0627\u0633\u062A. \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0686\u0642\u062F\u0631 \u0627\u0633\u062A\u061F"},answer:4500,tolerance:.5,explanation:{en:"Net income = 12,000 \u2212 7,500 = 4,500",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 = \u06F1\u06F2\u066C\u06F0\u06F0\u06F0 \u2212 \u06F7\u066C\u06F5\u06F0\u06F0 = \u06F4\u066C\u06F5\u06F0\u06F0"}},{id:"c1-05",chapter:1,level:2,type:"mcq",question:{en:"A company buys equipment for cash. What is the effect on the accounting equation?",fa:"\u0634\u0631\u06A9\u062A \u062A\u062C\u0647\u06CC\u0632\u0627\u062A\u06CC \u0631\u0627 \u0646\u0642\u062F\u06CC \u0645\u06CC\u200C\u062E\u0631\u062F. \u0627\u062B\u0631\u0634 \u0631\u0648\u06CC \u0645\u0639\u0627\u062F\u0644\u0647\u0654 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u0686\u06CC\u0633\u062A\u061F"},options:{en:["Assets increase, liabilities increase","One asset increases and another decreases; total assets do not change","Assets decrease, equity decreases","No effect"],fa:["\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0632\u06CC\u0627\u062F\u060C \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 \u0632\u06CC\u0627\u062F","\u06CC\u06A9 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0632\u06CC\u0627\u062F \u0648 \u06CC\u06A9 \u062F\u0627\u0631\u0627\u06CC\u06CC \u06A9\u0645\u061B \u062C\u0645\u0639 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u062A\u063A\u06CC\u06CC\u0631 \u0646\u0645\u06CC\u200C\u06A9\u0646\u062F","\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u06A9\u0645\u060C \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u06A9\u0645","\u0647\u06CC\u0686 \u0627\u062B\u0631\u06CC \u0646\u062F\u0627\u0631\u062F"]},answer:1,explanation:{en:"Equipment (an asset) increases and Cash (an asset) decreases by the same amount.",fa:"\u062A\u062C\u0647\u06CC\u0632\u0627\u062A (\u062F\u0627\u0631\u0627\u06CC\u06CC) \u0632\u06CC\u0627\u062F \u0648 \u067E\u0648\u0644 \u0646\u0642\u062F (\u062F\u0627\u0631\u0627\u06CC\u06CC) \u0628\u0647 \u0647\u0645\u0627\u0646 \u0627\u0646\u062F\u0627\u0632\u0647 \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"c1-06",chapter:1,level:2,type:"mcq",question:{en:"Which principle says assets are recorded at their purchase price?",fa:"\u06A9\u062F\u0627\u0645 \u0627\u0635\u0644 \u0645\u06CC\u200C\u06AF\u0648\u06CC\u062F \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0628\u0627 \u0642\u06CC\u0645\u062A \u062E\u0631\u06CC\u062F \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u0646\u062F\u061F"},options:{en:["Revenue recognition principle","Expense recognition (matching) principle","Cost principle","Going-concern assumption"],fa:["\u0627\u0635\u0644 \u0634\u0646\u0627\u0633\u0627\u06CC\u06CC \u062F\u0631\u0622\u0645\u062F","\u0627\u0635\u0644 \u062A\u0637\u0627\u0628\u0642 \u0647\u0632\u06CC\u0646\u0647","\u0627\u0635\u0644 \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647","\u0641\u0631\u0636 \u062A\u062F\u0627\u0648\u0645 \u0641\u0639\u0627\u0644\u06CC\u062A"]},answer:2,explanation:{en:"Under the cost principle, entries are based on the actual transaction price.",fa:"\u0637\u0628\u0642 \u0627\u0635\u0644 \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647\u060C \u062B\u0628\u062A \u0628\u0631 \u0627\u0633\u0627\u0633 \u0642\u06CC\u0645\u062A \u0648\u0627\u0642\u0639\u06CC \u0645\u0639\u0627\u0645\u0644\u0647 \u0627\u0633\u062A."}},{id:"c1-07",chapter:1,level:2,type:"fill",question:{en:"Beginning retained earnings are 10,000, net income is 6,000, and dividends are 2,500. What are ending retained earnings?",fa:"\u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647\u0654 \u0627\u0648\u0644 \u0633\u0627\u0644 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u06F6\u066C\u06F0\u06F0\u06F0 \u0648 \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u067E\u0631\u062F\u0627\u062E\u062A\u06CC \u06F2\u066C\u06F5\u06F0\u06F0 \u0627\u0633\u062A. \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647\u0654 \u067E\u0627\u06CC\u0627\u0646 \u0633\u0627\u0644 \u0686\u0642\u062F\u0631 \u0627\u0633\u062A\u061F"},answer:13500,tolerance:.5,explanation:{en:"10,000 + 6,000 \u2212 2,500 = 13,500",fa:"\u06F1\u06F0\u066C\u06F0\u06F0\u06F0 + \u06F6\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F5\u06F0\u06F0 = \u06F1\u06F3\u066C\u06F5\u06F0\u06F0"}},{id:"c1-08",chapter:1,level:3,type:"fill",question:{en:"Net income is 25,000 and average total assets are 200,000. What is return on assets in percent? (Enter the number only.)",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u06F2\u06F5\u066C\u06F0\u06F0\u06F0 \u0648 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u06A9\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u06F2\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u0627\u0633\u062A. \u0628\u0627\u0632\u062F\u0647 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0686\u0646\u062F \u062F\u0631\u0635\u062F \u0627\u0633\u062A\u061F (\u0641\u0642\u0637 \u0639\u062F\u062F \u062F\u0631\u0635\u062F \u0631\u0627 \u0628\u0646\u0648\u06CC\u0633\u06CC\u062F)"},answer:12.5,tolerance:.5,explanation:{en:"25,000 \xF7 200,000 = 0.125, which is 12.5%",fa:"\u06F2\u06F5\u066C\u06F0\u06F0\u06F0 \xF7 \u06F2\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F0\u066B\u06F1\u06F2\u06F5 \u06CC\u0639\u0646\u06CC \u06F1\u06F2\u066B\u06F5\u066A"}},{id:"c1-09",chapter:1,level:3,type:"mcq",question:{en:"What is the correct order for preparing the financial statements?",fa:"\u062A\u0631\u062A\u06CC\u0628 \u062F\u0631\u0633\u062A \u062A\u0647\u06CC\u0647\u0654 \u0635\u0648\u0631\u062A\u200C\u0647\u0627\u06CC \u0645\u0627\u0644\u06CC \u06A9\u062F\u0627\u0645 \u0627\u0633\u062A\u061F"},options:{en:["Balance sheet \u2192 Income statement \u2192 Retained earnings","Income statement \u2192 Retained earnings \u2192 Balance sheet \u2192 Cash flows","Cash flows \u2192 Balance sheet \u2192 Income statement","Retained earnings \u2192 Income statement \u2192 Balance sheet"],fa:["\u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647 \u2190 \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646 \u2190 \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647","\u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646 \u2190 \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u2190 \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647 \u2190 \u062C\u0631\u06CC\u0627\u0646 \u0648\u062C\u0648\u0647 \u0646\u0642\u062F","\u062C\u0631\u06CC\u0627\u0646 \u0648\u062C\u0648\u0647 \u0646\u0642\u062F \u2190 \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647 \u2190 \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646","\u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u2190 \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646 \u2190 \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647"]},answer:1,explanation:{en:"Net income flows from the income statement to the statement of retained earnings, and ending retained earnings flows to the balance sheet.",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0627\u0632 \u0635\u0648\u0631\u062A \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646 \u0628\u0647 \u0635\u0648\u0631\u062A \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u0645\u06CC\u200C\u0631\u0648\u062F \u0648 \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647\u0654 \u067E\u0627\u06CC\u0627\u0646 \u062F\u0648\u0631\u0647 \u0628\u0647 \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647."}},{id:"c1-10",chapter:1,level:3,type:"statement",question:{en:"Put each item of Arya Company in the right category and compute net income.",fa:"\u0627\u0642\u0644\u0627\u0645 \u0634\u0631\u06A9\u062A \xAB\u0622\u0631\u06CC\u0627\xBB \u0631\u0627 \u062F\u0631 \u0635\u0648\u0631\u062A \u062F\u0631\u0633\u062A \u0642\u0631\u0627\u0631 \u062F\u0647\u06CC\u062F \u0648 \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0631\u0627 \u062D\u0633\u0627\u0628 \u06A9\u0646\u06CC\u062F."},categories:{en:["Revenue","Expense","Asset","Liability"],fa:["\u062F\u0631\u0622\u0645\u062F","\u0647\u0632\u06CC\u0646\u0647","\u062F\u0627\u0631\u0627\u06CC\u06CC","\u0628\u062F\u0647\u06CC"]},items:[{name:{en:"Service revenue",fa:"\u062F\u0631\u0622\u0645\u062F \u062E\u062F\u0645\u0627\u062A"},amount:9e3,category:0},{name:{en:"Rent expense",fa:"\u0647\u0632\u06CC\u0646\u0647\u0654 \u0627\u062C\u0627\u0631\u0647"},amount:2e3,category:1},{name:{en:"Wages expense",fa:"\u0647\u0632\u06CC\u0646\u0647\u0654 \u062F\u0633\u062A\u0645\u0632\u062F"},amount:3200,category:1},{name:{en:"Cash",fa:"\u067E\u0648\u0644 \u0646\u0642\u062F"},amount:7e3,category:2},{name:{en:"Accounts payable",fa:"\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC"},amount:1500,category:3},{name:{en:"Utilities expense",fa:"\u0647\u0632\u06CC\u0646\u0647\u0654 \u0622\u0628 \u0648 \u0628\u0631\u0642"},amount:300,category:1},{name:{en:"Equipment",fa:"\u062A\u062C\u0647\u06CC\u0632\u0627\u062A"},amount:5e3,category:2}],targetLabel:{en:"Net income",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635"},target:3500,explanation:{en:"Net income = Revenue 9,000 \u2212 Expenses (2,000 + 3,200 + 300) = 3,500. Assets and liabilities go to the balance sheet, not the income statement.",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 = \u062F\u0631\u0622\u0645\u062F \u06F9\u066C\u06F0\u06F0\u06F0 \u2212 \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627 (\u06F2\u066C\u06F0\u06F0\u06F0 + \u06F3\u066C\u06F2\u06F0\u06F0 + \u06F3\u06F0\u06F0) = \u06F3\u066C\u06F5\u06F0\u06F0. \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0648 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 \u0628\u0647 \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647 \u0645\u06CC\u200C\u0631\u0648\u0646\u062F\u060C \u0646\u0647 \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646."}},{id:"c2-01",chapter:2,level:1,type:"mcq",question:{en:"Which account increases with a DEBIT?",fa:"\u06A9\u062F\u0627\u0645 \u062D\u0633\u0627\u0628 \u0628\u0627 \xAB\u0628\u062F\u0647\u06A9\u0627\u0631\xBB \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},options:{en:["Accounts Payable","Service Revenue","Rent Expense","Common Stock"],fa:["\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC","\u062F\u0631\u0622\u0645\u062F \u062E\u062F\u0645\u0627\u062A","\u0647\u0632\u06CC\u0646\u0647\u0654 \u0627\u062C\u0627\u0631\u0647","\u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC"]},answer:2,explanation:{en:"Expenses, like assets, increase with debits.",fa:"\u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627 \u0645\u062B\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0628\u0627 \u0628\u062F\u0647\u06A9\u0627\u0631 \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u0634\u0648\u0646\u062F."}},{id:"c2-02",chapter:2,level:1,type:"mcq",question:{en:"What is the normal balance of Unearned Revenue?",fa:"\u0645\u0627\u0646\u062F\u0647\u0654 \u0639\u0627\u062F\u06CC \u062D\u0633\u0627\u0628 \xAB\u062F\u0631\u0622\u0645\u062F \u067E\u06CC\u063 32\u06CC\u0627\u062F \u2190 \u0628\u062F\u0647\u06A9\u0627\u0631. \u062F\u0631\u0622\u0645\u062F \u0632\u06CC\u0627\u062F \u2190 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631."}},{id:"c2-07",chapter:2,level:2,type:"journal",question:{en:"The company performed $1,600 of services; the customer will pay later.",fa:"\u0634\u0631\u06A9\u062A \u06A9\u0627\u0631\u06CC \u0628\u0647 \u0627\u0631\u0632\u0634 \u06F1\u066C\u06F6\u06F0\u06F0 \u062F\u0644\u0627\u0631 \u0627\u0646\u062C\u0627\u0645 \u062F\u0627\u062F\u060C \u0648\u0644\u06CC \u0645\u0634\u062A\u0631\u06CC \u0628\u0639\u062F\u0627\u064B \u067E\u0648\u0644 \u0645\u06CC\u200C\u062F\u0647\u062F."},lines:[{account:"ar",side:"D",amount:1600},{account:"service_rev",side:"C",amount:1600}],extra:["cash","unearned"],explanation:{en:"The customer now owes us \u2192 debit Accounts Receivable. Revenue is recorded now because the work is done.",fa:"\u0645\u0634\u062A\u0631\u06CC \u0628\u062F\u0647\u06A9\u0627\u0631 \u0634\u062F \u2190 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u0628\u062F\u0647\u06A9\u0627\u0631. \u062F\u0631\u0622\u0645\u062F \u0647\u0645\u06CC\u0646 \u062D\u0627\u0644\u0627 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F \u0686\u0648\u0646 \u06A9\u0627\u0631 \u0627\u0646\u062C\u0627\u0645 \u0634\u062F\u0647."}},{id:"c2-08",chapter:2,level:3,type:"journal",question:{en:"The company received $3,000 from a customer for work it will do next month.",fa:"\u0634\u0631\u06A9\u062A \u06F3\u066C\u06F0\u06F0\u06F0 \u062F\u0644\u0627\u0631 \u0627\u0632 \u0645\u0634\u062A\u0631\u06CC \u0628\u0627\u0628\u062A \u06A9\u0627\u0631\u06CC \u06AF\u0631\u0641\u062A \u06A9\u0647 \u0645\u0627\u0647 \u0622\u06CC\u0646\u062F\u0647 \u0627\u0646\u062C\u0627\u0645 \u0645\u06CC\u200C\u062F\u0647\u062F."},lines:[{account:"cash",side:"D",amount:3e3},{account:"unearned",side:"C",amount:3e3}],extra:["service_rev","ar"],explanation:{en:"The work is not done yet, so this is not 0631\u062F \u0634\u062F\u0647","\u06CC\u06A9 \u0645\u0639\u0627\u0645\u0644\u0647 \u0627\u0635\u0644\u0627\u064B \u062B\u0628\u062A \u0646\u0634\u062F\u0647","\u06CC\u06A9 \u0639\u062F\u062F \u0641\u0642\u0637 \u062F\u0631 \u06CC\u06A9 \u0637\u0631\u0641 \u0627\u0634\u062A\u0628\u0627\u0647 \u0646\u0648\u0634\u062A\u0647 \u0634\u062F\u0647","\u062C\u0645\u0639 \u06CC\u06A9 \u0633\u062A\u0648\u0646 \u0627\u0634\u062A\u0628\u0627\u0647 \u0634\u062F\u0647"]},answer:1,explanation:{en:"If a whole transaction is left out, both sides are short by the same amount and the trial balance still balances.",fa:"\u0627\u06AF\u0631 \u06CC\u06A9 \u0645\u0639\u0627\u0645\u0644\u0647 \u06A9\u0644\u0627\u064B \u062C\u0627 \u0627\u0641\u062A\u0627\u062F\u0647 \u0628\u0627\u0634\u062F\u060C \u0647\u0631 \u062F\u0648 \u0637\u0631\u0641 \u0628\u0647 \u06CC\u06A9 \u0627\u0646\u062F\u0627\u0632\u0647 \u06A9\u0645 \u0627\u0633\u062A \u0648 \u062A\u0631\u0627\u0632 \u0628\u0631\u0627\u0628\u0631 \u0645\u06CC\u200C\u0645\u0627\u0646\u062F."}},{id:"c3-01",chapter:3,level:1,type:"mcq",question:{en:"Under accrual accounting, when is revenue recorded?",fa:"\u0637\u0628\u0642 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062A\u0639\u0647\u062F\u06CC\u060C \u062F\u0631\u0622\u0645\u062F \u06A9\u0650\u06CC \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},options:{en:["When cash is received","When the work is done","At year-end","When the contract is signed"],fa:["\u0648\u0642\u062A\u06CC \u067E\u0648\u0644 \u062F\u0631\u06CC\u0627\u0641\u062A \u0634\u0648\u062F","\u0648\u0642\u062A\u06CC \u06A9\u0627\u0631 \u0627\u0646\u062C\u0627\u0645 \u0634\u0648\u062F","\u0622\u062E\u0631 \u0633\u0627\u0644","\u0648\u0642\u062A\u06CC \u0642\u0631\u0627\u0631\u062F\u0627\u062F \u0627\u0645\u0636\u0627 \u0634\u0648\u062F"]},answer:1,explanation:{en:"Revenue recognition principle: revenue is recorded when it is earned.",fa:"\u0627\u0635\u0644 \u0634\u0646\u0627\u0633\u0627\u06CC\u06CC \u062F\u0631\u0622\u0645\u062F: \u062F\u0631\u0622\u0645\u062F \u0648\u0642\u062A\u06CC \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F \u06A9\u0647 \u06A9\u0633\u0628 \u0634\u062F\u0647 \u0628\u0627\u0634\u062F."}},{id:"c3-02",chapter:3,level:1,type:"journal",question:{en:"The Supplies account shows 9,720 and the month-end count shows 8,670. Record the adjusting entry.",fa:"\u0645\u0627\u0646\u062F\u0647\u0654 \u062F\u0641\u062A\u0631\u06CC \u0644\u0648\u0627\u0632\u0645 \u06F9\u066C\u06F7\u06F2\u06F0 \u0627\u0633\u062A \u0648 \u0634\u0645\u0627\u0631\u0634 \u0622\u062E\u0631 \u0645\u0627\u0647 \u06F8\u066C\u06F6\u06F7\u06F0 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F. \u062B\u0628\u062A \u0627\u0635\u0644\u0627\u062D\u06CC \u0631\u0627 \u0628\u0646\u0648\u06CC\u0633\u06CC\u062F."},lines:[{account:"supplies_exp",side:"D",amount:1050},{account:"supplies",side:"C",amount:1050}],extra:["cash","prepaid_ins"],explanation:{en:"Supplies used = 9,720 \u2212 8,670 = 1,050.",fa:"\u0644\u0648\u0627\u0632\u0645 \u0645\u0635\u0631\u0641\u200C\u0634\u062F\u0647 = \u06F9\u066C\u06F7\u06F2\u06F0 \u2212 \u06F8\u066C\u06F6\u06F7\u06F0 = \u06F1\u066C\u06F0\u06F5\u06F0."}},{id:"c3-03",chapter:3,level:2,type:"journal",question:{en:"A 24-month insurance policy costing 2,400 was paid in advance. Record the adjusting entry for one month.",fa:"\u0628\u06CC\u0645\u0647\u0654 \u06F2\u06F4 \u0645\u0627\u0647\u0647 \u0628\u0647 \u0645\u0628\u0644\u063A \u06F2\u066C\u06F4\u06F0\u06F0 \u0627\u0632 \u0642\u0628\u0644 \u067E\u0631\u062F\u0627\u062E\u062A \u0634\u062F\u0647 \u0628\u0648\u062F. \u062B\u0628\u062A \u0627\u0635\u0644\u0627\u062D\u06CC \u06CC\u06A9 \u0645\u0627\u0647 \u0631\u0627 \u0628\u0646\u0648\u06CC\u0633\u06CC\u062F."},lines:[{account:"insurance_exp",side:"D",amount:100},{account:"prepaid_ins",side:"C",amount:100}],extra:["cash","supplies_exp"],explanation:{en:"2,400 \xF7 24 = 100 per month.",fa:"\u06F2\u066C\u06F4\u06F0\u06F0 \xF7 \u06F2\u06F4 = \u06F1\u06F0\u06F0 \u062F\u0631 \u0645\u0627\u0647."}},{id:"c3-04",chapter:3,level:2,type:"journal",question:{en:"Monthly depreciation on equipment is 375. Record the adjusting entry.",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0645\u0627\u0647\u0627\u0646\u0647\u0654 \u062A\u062C\u0647\u06CC\u0632\u0627\u062A \u06F3\u06F7\u06F5 \u0627\u0633\u062A. \u062B\u0628\u062A \u0627\u0635\u0644\u0627\u062D\u06CC \u0631\u0627 \u0628\u0646\u0648\u06CC\u0633\u06CC\u062F."},lines:[{account:"dep_exp",side:"D",amount:375},{account:"accum_dep",side:"C",amount:375}],extra:["equipment","cash"],explanation:{en:"Depreciation is not taken directly from Equipment; it goes to Accumulated Depreciation.",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0645\u0633\u062A\u0642\u06CC\u0645\u0627\u064B \u0627\u0632 \u062A\u062C\u0647\u06CC\u0632\u0627\u062A \u06A9\u0645 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F\u061B \u0628\u0647 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u0645\u06CC\u200C\u0631\u0648\u062F."}},{id:"c3-05",chapter:3,level:2,type:"journal",question:{en:"Of 3,000 of unearned revenue, 250 was earned this month.",fa:"\u0627\u0632 \u06F3\u066C\u06F0\u06F0\u06F0 \u062F\u0631\u0622\u0645\u062F \u067E\u06CC\u0634\u200C\u062F\u0631\u06CC\u0627\u0641\u062A\u060C \u06F2\u06F5\u06F0 \u0622\u0646 \u062F\u0631 \u0627\u06CC\u0646 \u0645\u0627\u0647 \u06A9\u0633\u0628 \u0634\u062F."},lines:[{account:"unearned",side:"D",amount:250},{account:"service_rev",side:"C",amount:250}],extra:["cash","ar"],explanation:{en:"The liability decreases \u2192 debit. Revenue earned \u2192 credit.",fa:"\u0628\u062F\u0647\u06CC \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F \u2190 \u0628\u062F\u0647\u06A9\u0627\u0631. \u062F\u0631\u0622\u0645\u062F \u06A9\u0633\u0628 \u0634\u062F \u2190 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631."}},{id:"c3-06",chapter:3,level:3,type:"journal",question:{en:"Wages of 210 for the last three days of the month have not been paid.",fa:"\u062F\u0 \u06F0 \u0648 \u0637\u0628\u0642 \u0634\u0645\u0627\u0631\u0634 \u06F8\u066C\u06F2\u06F0\u06F0 \u0627\u0633\u062A. \u062B\u0628\u062A \u0627\u0635\u0644\u0627\u062D\u06CC \u06A9\u0633\u0631\u06CC \u0627\u0646\u0628\u0627\u0631\u061F"},lines:[{account:"cogs",side:"D",amount:300},{account:"inv",side:"C",amount:300}],extra:["cash","sales_ret"],explanation:{en:"Shrinkage = 8,500 \u2212 8,200 = 300, added to cost of goods sold.",fa:"\u06A9\u0633\u0631\u06CC = \u06F8\u066C\u06F5\u06F0\u06F0 \u2212 \u06F8\u066C\u06F2\u06F0\u06F0 = \u06F3\u06F0\u06F0\u060C \u0628\u0647 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0627\u0636\u0627\u0641\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"c4-12",chapter:4,level:3,type:"fill",question:{en:"Sales are 30,000, sales returns 1,000, cost of goods sold 18,000, and operating expenses 6,000. What is net income?",fa:"\u0641\u0631\u0648\u0634 \u06F3\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0628\u0631\u06AF\u0634\u062A \u0627\u0632 \u0641\u0631\u0648\u0634 \u06F1\u066C\u06F0\u06F0\u06F0\u060C \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u06F1\u06F8\u066C\u06F0\u06F0\u06F0\u060C \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627\u06CC \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \u06F6\u066C\u06F0\u06F0\u06F0. \u0633\u0648\u062F \u062E\u0627\u0644\u0635\u061F"},answer:5e3,tolerance:.5,explanation:{en:"Net sales 29,000 \u2212 18,000 = gross profit 11,000; \u2212 6,000 = 5,000",fa:"\u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635 \u06F2\u06F9\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u06F8\u066C\u06F0\u06F0\u06F0 = \u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635 \u06F1\u06F1\u066C\u06F0\u06F0\u06F0\u061B \u2212 \u06F6\u066C\u06F0\u06F0\u06F0 = \u06F5\u066C\u06F0\u06F0\u06F0"}},{id:"c5-01",chapter:5,level:1,type:"mcq",question:{en:"You gave goods to another store to sell for you. Whose inventory are they in?",fa:"\u06A9\u0627\u0644\u0627\u06CC\u06CC \u0631\u0627 \u0628\u0647 \u0645\u063A\u0627\u0632\u0647\u0654 \u062F\u06CC\u06AF\u0631\u06CC \u062F\u0627\u062F\u0647\u200C\u0627\u06CC\u062F \u062A\u0627 \u0628\u0631\u0627\u06CC\u062A\u0627\u0646 \u0628\u0641\u0631\u0648\u0634\u062F. \u0627\u06CC\u0646 \u06A9\u0627\u0644\u0627 \u062F\u0631 \u0645\u0648\u062C\u0648\u062F\u06CC \u0686\u0647 \u06A9\u0633\u06CC \u0627\u0633\u062A\u061F"},options:{en:["The store selling them (consignee)","Yours (consignor)","Neither","Half each"],fa:["\u0645\u063A\u0627\u0632\u0647\u200C\u0627\u06CC \u06A9\u0647 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u062F (\u0627\u0645\u0627\u0646\u062A\u200C\u062F\u0627\u0631)","\u0634\u0645\u0627 (\u0627\u0645\u0627\u0646\u062A\u200C\u06AF\u0630\u0627\u0631)","\u0647\u06CC\u0686\u200C\u06A9\u062F\u0627\u0645","\u0646\u0635\u0641\u200C\u0646\u0635\u0641"]},answer:1,explanation:{en:"Consigned goods belong to their owner until sold.",fa:"\u06A9\u0627\u0644\u0627\u06CC \u0627\u0645\u0627\u0646\u06CC \u062A\u0627 \u0648\u0642\u062A\u06CC \u0641\u0631\u0648\u062E\u062A\u0647 \u0646\u0634\u062F\u0647 \u0645\u0627\u0644 \u0635\u0627\u062D\u0628 \u0622\u0646 \u0627\u0633\u062A."}},{id:"c5-02",chapter:5,level:1,type:"mcq",question:{en:"You bought goods FOB destination and they are on the truck now. Are they in your inventory?",fa:"\u06A9\u0627\u0644\u0627\u06CC\u06CC \u0628\u0627 \u0634\u0631\u0637 \xAB\u062A\u062D\u0648\u06CC\u0644 \u062F\u0631 \u0645\u0642\u0635\u062F\xBB \u062E\u0631\u06CC\u062F\u0647\u200C\u0627\u06CC\u062F \u0648 \u0627\u0644\u0627\u0646 \u062F\u0631 \u06A9\u0627\u0645\u06CC\u0648\u0646 \u0627\u0633\u062A. \u0622\u06CC\u0627 \u062C\u0632\u0648 \u0645\u0648\u062C\u0648\u062F\u06CC \u0634\u0645\u0627\u0633\u062A\u061F"},options:{en:["Yes","No, they still belong to the seller","Only half","It depends on FIFO"],fa:["\u0628\u0644\u0647","\u0646\u0647\u060C \u0647\u0646\u0648\u0632 \u0645\u0627\u0644 \u0641\u0631\u0648\u0634\u0646\u062F\u0647 \u0627\u0633\u062A","\u0641\u0642\u0637 \u0646\u0635\u0641\u0634","\u0628\u0633\u062A\u06AF\u06CC \u0628\u0647 \u0631\u0648\u0634 \u0627\u0648\u0644 \u0642\u062F\u06CC\u0645\u06CC\u200C\u0647\u0627 \u062F\u0627\u0631\u062F"]},answer:1,explanation:{en:"With FOB destination, ownership passes when the goods arrive.",fa:"\u0628\u0627 \u062A\u062D\u0648\u06CC\u0644 \u062F\u0631 \u0645\u0642\u0635\u062F\u060C \u0645\u0627\u0644\u06A9\u06CC\u062A \u0648\u0642\u062A\u06CC \u0645\u0646\u062A\u0642\u0644 \u0645\u06CC\u200C\u0634\u0648\u062F \u06A9\u0647 \u06A9\u0627\u0644\u0627 \u0628\u0631\u0633\u062F."}},{id:"c5-03",chapter:5,level:1,type:"fill",question:{en:"Price 1,000, discount 20, shipping 50, import duties 30. What is the inventory cost?",fa:"\u0642\u06CC\u0645\u062A \u06A9\u0627\u0644\u0627 \u06F1\u066C\u06F0\u06F0\u06F0\u060C \u062A\u062E\u0641\u06CC\u0641 \u06F2\u06F0\u060C \u062D\u0645\u0644 \u06F5\u06F0 \u0648 \u0639\u0648\u0627\u0631\u0636 \u06AF\u0645\u0631\u06A9\u06CC \u06F3\u06F0. \u0628\u0647\u0627\u06CC \u0645\u0648\u062C\u0648\u062F\u06CC \u06A9\u0627\u0644\u0627\u061F"},answer:1060,tolerance:.5,explanation:{en:"1,000 \u2212 20 + 50 + 30 = 1,060",fa:"\u06F1\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u06F0 + \u06F5\u06F0 + \u06F3\u06F0 = \u06F1\u066C\u06F0\u06F6\u06F0"}},{id:"c5-04",chapter:5,level:1,type:"fill",question:{en:"You have three rings costing 500, 700, and 900. The 500 ring was sold. Using specific identification, what is ending inventory?",fa:"\u0633\u0647 \u0627\u0646\u06AF\u0634\u062A\u0631 \u0628\u0627 \u0628\u0647\u0627\u06CC \u06F5\u06F0\u06F0\u060C \u06F7\u06F0\u06F0 \u0648 \u06F9\u06F0\u06F0 \u062F\u0627\u0631\u06CC\u062F. \u0627\u0646\u06AF\u0634\u062A\u0631 \u06F5\u06F0\u06F0 \u062F\u0644\u0627\u0631\u06CC \u0641\u0631\u0648\u062E\u062A\u0647 \u0634\u062F. \u0628\u0647 \u0631\u0648\u0634 \u0634\u0646\u0627\u0633\u0627\u06CC\u06CC \u0648\u06CC\u0698\u0647\u060C \u0645\u0648\u062C\u0648\u062F\u06CC \u067E\u0627\u06CC\u0627\u0646 \u062F\u0648\u0631\u0647 \u0686\u0642\u062F\u0631 \u0627\u0633\u062A\u061F"},answer:1600,tolerance:.5,explanation:{en:"Remaining: 700 + 900 = 1,600",fa:"\u0645\u0627\u0646\u062F\u0647: \u06F7\u06F0\u06F0 + \u06F9\u06F0\u06F0 = \u06F1\u066C\u06F6\u06F0\u06F0"}},{id:"c5-05",chapter:5,level:2,type:"fill",question:{en:"You have 2 boxes at 10 (old) and 4 boxes at 20 (new) and sell 3 boxes. Using FIFO, what is cost of goods sold?",fa:"\u06F2 \u062C\u0639\u0628\u0647 \u0628\u0647 \u0642\u06CC\u0645\u062A \u06F1\u06F0 (\u0642\u062F\u06CC\u0645\u06CC) \u0648 \u06F4 \u062C\u0639\u0628\u0647 \u0628\u0647 \u0642\u06CC\u0645\u062A \u06F2\u06F0 (\u062C\u062F\u06CC\u062F) \u062F\u0627\u0631\u06CC\u062F \u0648 \u06F3 \u062C\u0639\u0628\u0647 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u06CC\u062F. \u0628\u0647 \u0631\u0648\u0634 \u0627\u0648\u0644 \u0642\u062F\u06CC\u0645\u06CC\u200C\u0647\u0627\u060C \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647\u061F"},answer:40,tolerance:.5,explanation:{en:"10 + 10 + 20 = 40",fa:"\u06F1\u06F0 + \u06F1\u06F0 + \u06F2\u06F0 = \u06F4\u06F0"}},{id:"c5-06",chapter:5,level:2,type:"fill",question:{en:"You have 2 boxes at 10 (old) and 4 boxes at 20 (new) and sell 3 boxes. Using LIFO, what is ending inventory?",fa:"\u06F2 \u062C\u0639\u0628\u0647 \u0628\u0647 \u0642\u06CC\u0645\u062A \u06F1\u06F0 (\u0642\u062F\u06CC\u0645\u06CC) \u0648 \u06F4 \u062C\u0639\u0628\u0647 \u0628\u0647 \u0642\u06CC\u0645\u062A \u06F2\u06F0 (\u062C\u062F\u06CC\u062F) \u062F\u0627\u0631\u06CC\u062F \u0648 \u06F3 \u062C\u0639\u0628\u0647 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u06CC\u062F. \u0628\u0647 \u0631\u0648\u0634 \u0627\u0648\u0644 \u062C\u062F\u06CC\u062F\u0647\u0627\u060C \u0645\u0648\u062C\u0648\u062F\u06CC \u067E\u0627\u06CC\u0627\u0646 \u062F\u0648\u0631\u0647\u061F"},answer:40,tolerance:.5,explanation:{en:"Sold: 20 + 20 + 20 = 60; total = 100; remaining = 40",fa:"\u0641\u0631\u0648\u062E\u062A\u0647\u200C\u0634\u062F\u0647: \u06F2\u06F0 + \u06F2\u06F0 + \u06F2\u06F0 = \u06F6\u06F0\u061B \u06A9\u0644 = \u06F1\u06F0\u06F0\u061B \u0645\u0627\u0646\u062F\u0647 = \u06F4\u06F0"}},{id:"c5-07",chapter:5,level:2,type:"fill",question:{en:"You have 2 boxes at 10 and 2 boxes at 20 and sell 3 boxes. Using weighted average, what is cost of goods sold?",fa:"\u06F2 \u062C\u0639\u0628\u0647 \u0628\u0647 \u0642\u06CC\u0645\u062A \u06F1\u06F0 \u0648 \u06F2 \u062C\u0639\u0628\u0647 \u0628\u0647 \u0642\u06CC\u0645\u062A \u06F2\u06F0 \u062F\u0627\u0631\u06CC\u062F \u0648 \u06F3 \u062C\u0639\u0628\u0647 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u06CC\u062F. \u0628\u0647 \u0631\u0648\u0634 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0648\u0632\u0648\u0646\u060C \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647\u061F"},answer:45,tolerance:.5,explanation:{en:"Average = 60 \xF7 4 = 15; 3 \xD7 15 = 45",fa:"\u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 = \u06F6\u06F0 \xF7 \u06F4 = \u06F1\u06F5\u061B \u06F3 \xD7 \u06F1\u06F5 = \u06F4\u06F5"}},{id:"c5-08",chapter:5,level:2,type:"mcq",question:{en:"Prices are rising. Which method shows the highest gross profit?",fa:"\u0642\u06CC\u0645\u062A\u200C\u0647\u0627 \u062F\u0631 \u062D\u0627\u0644 \u0627\u0641\u0632\u0627\u06CC\u0634 \u0627\u0633\u062A. \u06A9\u062F\u0627\u0645 \u0631\u0648\u0634 \u0628\u06CC\u0634\u062A\u0631\u06CC\u0646 \u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635 \u0631\u0627 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F\u061F"},options:{en:["LIFO","FIFO","Weighted average","All equal"],fa:["\u0627\u0648\u0644 \u062C\u062F\u06CC\u062F\u0647\u0627","\u0627\u0648\u0644 \u0642\u062F\u06CC\u0645\u06CC\u200C\u0647\u0627","\u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0648\u0632\u0648\u0646","\u0647\u0645\u0647 \u0628\u0631\u0627\u0628\u0631\u0646\u062F"]},answer:1,explanation:{en:"FIFO sends the old, cheaper costs to cost of goods sold, so COGS is lower and profit higher.",fa:"\u0627\u0648\u0644 \u0642\u062F\u06CC\u0645\u06CC\u200C\u0647\u0627 \u06A9\u0627\u0644\u0627\u0647\u0627\u06CC \u0627\u0631\u0632\u0627\u0646 \u0642\u062F\u06CC\u0645\u06CC \u0631\u0627 \u0628\u0647 \u0628\u0647\u0627\u06CC \u0641\u0631\u0648\u0634 \u0645\u06CC\u200C\u0628\u0631\u062F\u060C \u067E\u0633 \u0628\u0647\u0627\u06CC \u0641\u0631\u0648\u0634 \u06A9\u0645\u062A\u0631 \u0648 \u0633\u0648\u062F \u0628\u06CC\u0634\u062A\u0631 \u0627\u0633\u062A."}},{id:"c5-09",chapter:5,level:3,type:"mcq",question:{en:"Prices are rising. Which method gives the lowest taxes?",fa:"\u0642\u06CC\u0645\u062A\u200C\u0647\u0627 \u062F\u0631 \u062D\u0627\u0644 \u0627\u0641\u0632\u0627\u06CC\u0634 \u0627\u0633\u062A. \u06A9\u062F\u0627\u0645 \u0631\u0648\u0634 \u06A9\u0645\u062A\u0631\u06CC\u0646 \u0645\u0627\u0644\u06CC\u0627\u062A \u0631\u0627 \u062F\u0627\u0631\u062F\u061F"},options:{en:["FIFO","LIFO","Weighted average","Specific identification"],fa:["\u0627\u0648\u0644 \u0642\u062F\u06CC\u0645\u06CC\u200C\u0647\u0627","\u0627\u0648\u0644 \u062C\u062F\u06CC\u062F\u0647\u0627","\u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0648\u0632\u0648\u0646","\u0634\u0646\u0627\u0633\u0627\u06CC\u06CC \u0648\u06CC\u0698\u0647"]},answer:1,explanation:{en:"LIFO has the highest cost of goods sold, so profit and taxes are lower.",fa:"\u0627\u0648\u0644 \u062C\u062F\u06CC\u062F\u0647\u0627 \u0628\u06CC\u0634\u062A\u0631\u06CC\u0646 \u0628\u0647\u0627\u06CC \u0641\u0631\u0648\u0634 \u0631\u0627 \u062F\u0627\u0631\u062F\u060C \u067E\u0633 \u0633\u0648\u062F \u0648 \u0645\u0627\u0644\u06CC\u0627\u062A \u06A9\u0645\u062A\u0631 \u0627\u0633\u062A."}},{id:"c5-10",chapter:5,level:3,type:"fill",question:{en:"A bike cost 300 and its replacement cost today is 250. Under lower of cost or market, what is the write-down?",fa:"\u062F\u0648\u0686\u0631\u062E\u0647\u200C\u0627\u06CC \u06F3\u06F0\u06F0 \u062E\u0631\u06CC\u062F\u0647 \u0634\u062F\u0647 \u0648 \u0642\u06CC\u0645\u062A \u062E\u0631\u06CC\u062F \u062F\u0648\u0628\u0627\u0631\u0647\u0654 \u0622\u0646 \u0627\u0645\u0631\u0648\u0632 \u06F2\u06F5\u06F0 \u0627\u0633\u062A. \u0637\u0628\u0642 \u0642\u0627\u0639\u062F\u0647\u0654 \u0627\u0642\u0644 \u0628\u0647\u0627 \u06CC\u0627 \u0628\u0627\u0632\u0627\u0631\u060C \u0645\u0628\u0644\u063A \u06A9\u0627\u0647\u0634 \u0627\u0631\u0632\u0634 \u0686\u0642\u062F\u0631 \u0627\u0633\u062A\u061F"},answer:50,tolerance:.5,explanation:{en:"Report at 250; write-down = 300 \u2212 250 = 50",fa:"\u06AF\u0632\u0627\u0631\u0634 \u0628\u0627 \u06F2\u06F5\u06F0\u061B \u06A9\u0627\u0647\u0634 = \u06F3\u06F0\u06F0 \u2212 \u06F2\u06F5\u06F0 = \u06F5\u06F0"}},{id:"c5-11",chapter:5,level:3,type:"journal",question:{en:"Inventory cost is 500 and market value is 400. Record the write-down.",fa:"\u0628\u0647\u0627\u06CC \u0645\u0648\u062C\u0648\u062F\u06CC \u06A9\u0627\u0644\u0627 \u06F5\u06F0\u06F0 \u0648 \u0627\u0631\u0632\u0634 \u0628\u0627\u0632\u0627\u0631 \u0622\u0646 \u06F4\u06F0\u06F0 \u0627\u0633\u062A. \u062B\u0628\u062A \u06A9\u0627\u0647\u0634 \u0627\u0631\u0632\u0634 \u0631\u0627 \u0628\u0646\u0648\u06CC\u0633\u06CC\u062F."},lines:[{account:"cogs",side:"D",amount:100},{account:"inv",side:"C",amount:100}],extra:["sales","cash"],explanation:{en:"The write-down is added to cost of goods sold and taken out of inventory.",fa:"\u06A9\u0627\u0647\u0634 \u0627\u0631\u0632\u0634 \u0628\u0647 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0627\u0636\u0627\u0641\u0647 \u0648 \u0627\u0632 \u0645\u0648\u062C\u0648\u062F\u06CC \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"c6-01",chapter:6,level:1,type:"mcq",question:{en:"One person both keeps the cash and writes the cash records. Which principle is violated?",fa:"\u06CC\u06A9 \u0646\u0641\u0631 \u0647\u0645 \u067E\u0648\u0644 \u0635\u0646\u062F\u0648\u0642 \u0631\u0627 \u0646\u06AF\u0647 \u0645\u06CC\u200C\u062F\u0627\u0631\u062F \u0648 \u0647\u0645 \u062F\u0641\u062A\u0631 \u0635\u0646\u062F\u0648\u0642 \u0631\u0627 \u0645\u06CC\u200C\u0646\u0648\u06CC\u0633\u062F. \u06A9\u062F\u0627\u0645 \u0627\u0635\u0644 \u0631\u0639\u0627\u06CC\u062A \u0646\u0634\u062F\u0647\u061F"},options:{en:["Establish responsibilities","Separate recordkeeping from custody of assets","Insure assets","Apply technological controls"],fa:["\u0645\u0634\u062E\u0635 \u06A9\u0631\u062F\u0646 \u0645\u0633\u0626\u0648\u0644\u06CC\u062A","\u062C\u062F\u0627 \u06A9\u0631\u062F\u0646 \u0646\u06AF\u0647\u062F\u0627\u0631\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC \u0627\u0632 \u062B\u0628\u062A \u0622\u0646","\u0628\u06CC\u0645\u0647\u0654 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627","\u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0627\u0632 \u062A\u06A9\u0646\u0648\u0644\u0648\u0698\u06CC"]},answer:1,explanation:{en:"The person who holds the cash must not keep its records.",fa:"\u06A9\u0633\u06CC \u06A9\u0647 \u067E\u0648\u0644 \u0631\u0627 \u0646\u06AF\u0647 \u0645\u06CC\u200C\u062F\u0627\u0631\u062F \u0646\u0628\u0627\u06CC\u062F \u062F\u0641\u062A\u0631\u0634 \u0631\u0627 \u0628\u0646\u0648\u06CC\u0633\u062F."}},{id:"c6-02",chapter:6,level:1,type:"mcq",question:{en:"Three people use the cash register and no one knows who caused a shortage. Which principle is violated?",fa:"\u0633\u0647 \u0646\u0641\u0631 \u0635\u0646\u062F\u0648\u0642 \u0631\u0627 \u0628\u0627\u0632 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F \u0648 \u06A9\u0633\u06CC \u0646\u0645\u06CC\u200C\u062F\u0627\u0646\u062F \u06A9\u0645\u0628\u0648\u062F \u06A9\u0627\u0631 \u06A9\u06CC\u0633\u062A. \u06A9\u062F\u0627\u0645 \u0627\u0635\u0644 \u0631\u0639\u0627\u06CC\u062A \u0646\u0634\u062F\u0647\u061F"},options:{en:["Establish responsibilities","Divide responsibility for related transactions","Independent reviews","Adequate records"],fa:["\u0645\u0634\u062E\u0635 \u06A9\u0631\u062F\u0646 \u0645\u0633\u0626\u0648\u0644\u06CC\u062A","\u062A\u0642\u0633\u06CC\u0645 \u06A9\u06
