ref:Sv(e),onClick:s=>{window.__pendingTab=i||null,t&&t(s)},...n,children:a})}var Ds=T(xe());function Wh(){let e=location.hash.slice(1);if(e==="mistakes")return"/mistakes";let a=e.match(/^chapter-(\d+)$/);return a?"/chapter/"+a[1]:"/"}function zs(){let[e,a]=(0,Ds.useState)(Wh());return(0,Ds.useEffect)(()=>{let t=()=>a(Wh());return addEventListener("hashchange",t),()=>removeEventListener("hashchange",t)},[]),e}var em=T(xe());var pa=[{id:1,title:{en:"Accounting in Business",fa:"\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062F\u0631 \u06A9\u0633\u0628\u200C\u0648\u06A9\u0627\u0631"},summary:{en:["Accounting is an information system that identifies, records, and communicates an organization's business activities. It is called the language of business.","Two groups use accounting information: external users (shareholders, lenders, auditors, regulators) and internal users (purchasing, human resource, production, and sales managers).","Ethics and generally accepted accounting principles (GAAP) make reports reliable and comparable. The cost principle says assets are recorded at their purchase price, and the revenue recognition principle says revenue is recorded when the work is done.","The most important formula in the book is the accounting equation: Assets = Liabilities + Equity. Every transaction changes the equation, but both sides always stay equal.","The four financial statements are prepared in this order: income statement, statement of retained earnings, balance sheet, and statement of cash flows. Net income flows from the first to the second, and ending retained earnings flows to the balance sheet."],fa:["\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u06CC\u06A9 \u0633\u06CC\u0633\u062A\u0645 \u0627\u0637\u0644\u0627\u0639\u0627\u062A\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0641\u0639\u0627\u0644\u06CC\u062A\u200C\u0647\u0627\u06CC \u0645\u0627\u0644\u06CC \u06CC\u06A9 \u0633\u0627\u0632\u0645\u0627\u0646 \u0631\u0627 \u0634\u0646\u0627\u0633\u0627\u06CC\u06CC\u060C \u062B\u0628\u062A \u0648 \u06AF\u0632\u0627\u0631\u0634 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0628\u0647 \u0622\u0646 \xAB\u0632\u0628\u0627\u0646 \u06A9\u0633\u0628\u200C\u0648\u06A9\u0627\u0631\xBB \u0645\u06CC\u200C\u06AF\u0648\u06CC\u0646\u062F.","\u062F\u0648 \u06AF\u0631\u0648\u0647 \u0627\u0632 \u0627\u0637\u0644\u0627\u0639\u0627\u062A \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F: \u0627\u0633\u062A\u0641\u0627\u062F\u0647\u200C\u06A9\u0646\u0646\u062F\u06AF\u0627\u0646 \u0628\u06CC\u0631\u0648\u0646\u06CC (\u0633\u0647\u0627\u0645\u200C\u062F\u0627\u0631\u0627\u0646\u060C \u0648\u0627\u0645\u200C\u062F\u0647\u0646\u062F\u06AF\u0627\u0646\u060C \u062D\u0633\u0627\u0628\u0631\u0633\u0627\u0646\u060C \u062F\u0648\u0644\u062A) \u0648 \u0627\u0633\u062A\u0641\u0627\u062F\u0647\u200C\u06A9\u0646\u0646\u062F\u06AF\u0627\u0646 \u062F\u0631\u0648\u0646\u06CC (\u0645\u062F\u06CC\u0631\u0627\u0646 \u062E\u0631\u06CC\u062F\u060C \u0645\u0646\u0627\u0628\u0639 \u0627\u0646\u0633\u0627\u0646\u06CC\u060C \u062A\u0648\u0644\u06CC\u062F \u0648 \u0641\u0631\u0648\u0634).","\u0627\u062E\u0644\u0627\u0642 \u0648 \u0627\u0635\u0648\u0644 \u067E\u0630\u06CC\u0631\u0641\u062A\u0647\u200C\u0634\u062F\u0647\u0654 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC (GAAP) \u0628\u0627\u0639\u062B \u0645\u06CC\u200C\u0634\u0648\u0646\u062F \u06AF\u0632\u0627\u0631\u0634\u200C\u0647\u0627 \u0642\u0627\u0628\u0644 \u0627\u0639\u062A\u0645\u0627\u062F \u0648 \u0642\u0627\u0628\u0644 \u0645\u0642\u0627\u06CC\u0633\u0647 \u0628\u0627\u0634\u0646\u062F. \u0627\u0635\u0644 \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647 \u0645\u06CC\u200C\u06AF\u0648\u06CC\u062F \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0628\u0627 \u0642\u06CC\u0645\u062A \u062E\u0631\u06CC\u062F \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u0646\u062F\u060C \u0648 \u0627\u0635\u0644 \u0634\u0646\u0627\u0633\u0627\u06CC\u06CC \u062F\u0631\u0622\u0645\u062F \u0645\u06CC\u200C\u06AF\u0648\u06CC\u062F \u062F\u0631\u0622\u0645\u062F \u0648\u0642\u062A\u06CC \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F \u06A9\u0647 \u06A9\u0627\u0631 \u0627\u0646\u062C\u0627\u0645 \u0634\u062F\u0647 \u0628\u0627\u0634\u062F.","\u0645\u0647\u0645\u200C\u062A\u0631\u06CC\u0646 \u0641\u0631\u0645\u0648\u0644 \u06A9\u062A\u0627\u0628\u060C \u0645\u0639\u0627\u062F\u0644\u0647\u0654 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u0627\u0633\u062A: \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0628\u0631\u0627\u0628\u0631 \u0627\u0633\u062A \u0628\u0627 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 \u0628\u0647\u200C\u0639\u0644\u0627\u0648\u0647\u0654 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645. \u0647\u0631 \u0645\u0639\u0627\u0645\u0644\u0647 \u0627\u06CC\u0646 \u0645\u0639\u0627\u062F\u0644\u0647 \u0631\u0627 \u062A\u063A\u06CC\u06CC\u0631 \u0645\u06CC\u200C\u062F\u0647\u062F\u060C \u0648\u0644\u06CC \u062F\u0648 \u0637\u0631\u0641 \u0647\u0645\u06CC\u0634\u0647 \u0628\u0631\u0627\u0628\u0631 \u0645\u06CC\u200C\u0645\u0627\u0646\u0646\u062F.","\u0686\u0647\u0627\u0631 \u0635\u0648\u0631\u062A \u0645\u0627\u0644\u06CC \u0628\u0647 \u0627\u06CC\u0646 \u062A\u0631\u062A\u06CC\u0628 \u062A\u0647\u06CC\u0647 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F: \u0635\u0648\u0631\u062A \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646\u060C \u0635\u0648\u0631\u062A \u062A\u063A\u06CC\u06CC\u0631\u0627\u062A \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 (\u06CC\u0627 \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647)\u060C \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647\u060C \u0648 \u0635\u0648\u0631\u062A \u062C\u0631\u06CC\u0627\u0646 \u0648\u062C\u0648\u0647 \u0646\u0642\u062F. \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0627\u0632 \u0635\u0648\u0631\u062A \u0627\u0648\u0644 \u0628\u0647 \u0635\u0648\u0631\u062A \u062F\u0648\u0645 \u0645\u06CC\u200C\u0631\u0648\u062F\u060C \u0648 \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647\u0654 \u067E\u0627\u06CC\u0627\u0646 \u062F\u0648\u0631\u0647 \u0627\u0632 \u0635\u0648\u0631\u062A \u062F\u0648\u0645 \u0628\u0647 \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647."]},formulas:[{name:{en:"Accounting equation",fa:"\u0645\u0639\u0627\u062F\u0644\u0647\u0654 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC"},formula:{en:"Assets = Liabilities + Equity",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 = \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 + \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645"},example:{en:"Assets 50,000 and liabilities 20,000 \u2192 equity = 30,000",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC \u06F5\u06F0\u066C\u06F0\u06F0\u06F0 \u0648 \u0628\u062F\u0647\u06CC \u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \u2190 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 = \u06F3\u06F0\u066C\u06F0\u06F0\u06F0"}},{name:{en:"Expanded equation",fa:"\u0645\u0639\u0627\u062F\u0644\u0647\u0654 \u06AF\u0633\u062A\u0631\u062F\u0647"},formula:{en:"Assets = Liabilities + Common Stock + Revenues \u2212 Expenses \u2212 Dividends",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 = \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 + \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC + \u062F\u0631\u0622\u0645\u062F\u0647\u0627 \u2212 \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627 \u2212 \u0633\u0648\u062F \u0633\u0647\u0627\u0645"},example:{en:"Revenues 8,000 and expenses 5,000 \u2192 equity increases by 3,000",fa:"\u0627\u06AF\u0631 \u062F\u0631\u0622\u0645\u062F \u06F8\u066C\u06F0\u06F0\u06F0 \u0648 \u0647\u0632\u06CC\u0646\u0647 \u06F5\u066C\u06F0\u06F0\u06F0 \u0628\u0627\u0634\u062F\u060C \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u06F3\u066C\u06F0\u06F0\u06F0 \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u0634\u0648\u062F"}},{name:{en:"Net income",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635"},formula:{en:"Net income = Revenues \u2212 Expenses",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 = \u062F\u0631\u0622\u0645\u062F\u0647\u0627 \u2212 \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627"},example:{en:"12,000 \u2212 7,000 = 5,000",fa:"\u062F\u0631\u0622\u0645\u062F \u06F1\u06F2\u066C\u06F0\u06F0\u06F0 \u2212 \u0647\u0632\u06CC\u0646\u0647 \u06F7\u066C\u06F0\u06F0\u06F0 = \u06F5\u066C\u06F0\u06F0\u06F0"}},{name:{en:"Ending retained earnings",fa:"\u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647\u0654 \u067E\u0627\u06CC\u0627\u0646 \u062F\u0648\u0631\u0647"},formula:{en:"Ending RE = Beginning RE + Net income \u2212 Dividends",fa:"\u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647\u0654 \u067E\u0627\u06CC\u0627\u0646 = \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647\u0654 \u0627\u0648\u0644 + \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u2212 \u0633\u0648\u062F \u0633\u0647\u0627\u0645"},example:{en:"10,000 + 5,000 \u2212 2,000 = 13,000",fa:"\u06F1\u06F0\u066C\u06F0\u06F0\u06F0 + \u06F5\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F0\u06F0\u06F0 = \u06F1\u06F3\u066C\u06F0\u06F0\u06F0"}},{name:{en:"Return on assets",fa:"\u0628\u0627\u0632\u062F\u0647 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"},formula:{en:"ROA = Net income \xF7 Average total assets",fa:"\u0628\u0627\u0632\u062F\u0647 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 = \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \xF7 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u06A9\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"},example:{en:"20,000 \xF7 200,000 = 10%",fa:"\u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F2\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F1\u06F0\u066A"}}]},{id:2,title:{en:"Accounting for Business Transactions",fa:"\u062B\u0628\u062A \u0645\u0639\u0627\u0645\u0644\u0627\u062A \u062A\u062C\u0627\u0631\u06CC"},summary:{en:["An account is a separate record of increases and decreases in one item, such as Cash or Accounts Payable. The list of all accounts is the chart of accounts.","Every transaction affects at least two accounts. This is double-entry accounting. The left side of an account is the debit side and the right side is the credit side, and in every entry total debits equal total credits.","Assets, expenses, and dividends increase with debits. Liabilities, common stock, and revenues increase with credits. The side that increases an account is its normal balance.","The steps are: analyze the transaction \u2192 record it in the journal \u2192 post it to the ledger \u2192 prepare a trial balance \u2192 prepare the financial statements. A trial balance only shows that debits equal credits; it does not catch every error.","The debt ratio shows how much of the assets are financed with debt. A higher ratio means more risk."],fa:["\u062D\u0633\u0627\u0628 \u06CC\u0639\u0646\u06CC \u06CC\u06A9 \u062C\u0627\u06CC \u062C\u062F\u0627 \u0628\u0631\u0627\u06CC \u062B\u0628\u062A \u0627\u0641\u0632\u0627\u06CC\u0634 \u0648 \u06A9\u0627\u0647\u0634 \u06CC\u06A9 \u0642\u0644\u0645 \u0645\u0634\u062E\u0635\u060C \u0645\u062B\u0644 \u067E\u0648\u0644 \u0646\u0642\u062F \u06CC\u0627 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC. \u0641\u0647\u0631\u0633\u062A \u0647\u0645\u0647\u0654 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u06CC\u06A9 \u0634\u0631\u06A9\u062A \u0631\u0627 \xAB\u0641\u0647\u0631\u0633\u062A \u062D\u0633\u0627\u0628\u200C\u0647\u0627\xBB \u0645\u06CC\u200C\u06AF\u0648\u06CC\u0646\u062F.","\u0647\u0631 \u0645\u0639\u0627\u0645\u0644\u0647 \u062D\u062F\u0627\u0642\u0644 \u062F\u0648 \u062D\u0633\u0627\u0628 \u0631\u0627 \u062A\u063A\u06CC\u06CC\u0631 \u0645\u06CC\u200C\u062F\u0647\u062F. \u0628\u0647 \u0627\u06CC\u0646 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062F\u0648\u0637\u0631\u0641\u0647 \u0645\u06CC\u200C\u06AF\u0648\u06CC\u0646\u062F. \u0633\u0645\u062A \u0686\u067E \u0647\u0631 \u062D\u0633\u0627\u0628 \xAB\u0628\u062F\u0647\u06A9\u0627\u0631\xBB \u0648 \u0633\u0645\u062A \u0631\u0627\u0633\u062A \xAB\u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631\xBB \u0627\u0633\u062A\u060C \u0648 \u062F\u0631 \u0647\u0631 \u062B\u0628\u062A\u060C \u062C\u0645\u0639 \u0628\u062F\u0647\u06A9\u0627\u0631 \u0628\u0627 \u062C\u0645\u0639 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631 \u0628\u0631\u0627\u0628\u0631 \u0627\u0633\u062A.","\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u060C \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627 \u0648 \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u0627\u0639\u0644\u0627\u0645\u200C\u0634\u062F\u0647 \u0628\u0627 \u0628\u062F\u0647\u06A9\u0627\u0631 \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u0634\u0648\u0646\u062F. \u0628\u062F\u0647\u06CC\u200C\u0647\u0627\u060C \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC \u0648 \u062F\u0631\u0622\u0645\u062F\u0647\u0627 \u0628\u0627 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631 \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u0634\u0648\u0646\u062F. \u0628\u0647 \u0637\u0631\u0641\u06CC \u06A9\u0647 \u062D\u0633\u0627\u0628 \u0628\u0627 \u0622\u0646 \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u0634\u0648\u062F \xAB\u0645\u0627\u0646\u062F\u0647\u0654 \u0639\u0627\u062F\u06CC\xBB \u0645\u06CC\u200C\u06AF\u0648\u06CC\u0646\u062F.","\u0645\u0631\u0627\u062D\u0644 \u06A9\u0627\u0631: \u062A\u062D\u0644\u06CC\u0644 \u0645\u0639\u0627\u0645\u0644\u0647 \u2190 \u062B\u0628\u062A \u062F\u0631 \u062F\u0641\u062A\u0631 \u0631\u0648\u0632\u0646\u0627\u0645\u0647 \u2190 \u0627\u0646\u062A\u0642\u0627\u0644 \u0628\u0647 \u062F\u0641\u062A\u0631 \u06A9\u0644 \u2190 \u062A\u0647\u06CC\u0647\u0654 \u062A\u0631\u0627\u0632 \u0622\u0632\u0645\u0627\u06CC\u0634\u06CC \u2190 \u062A\u0647\u06CC\u0647\u0654 \u0635\u0648\u0631\u062A\u200C\u0647\u0627\u06CC \u0645\u0627\u0644\u06CC. \u062A\u0631\u0627\u0632 \u0622\u0632\u0645\u0627\u06CC\u0634\u06CC \u0641\u0642\u0637 \u0628\u0631\u0627\u0628\u0631\u06CC \u0628\u062F\u0647\u06A9\u0627\u0631 \u0648 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631 \u0631\u0627 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0648 \u0647\u0645\u0647\u0654 \u0627\u0634\u062A\u0628\u0627\u0647\u0627\u062A \u0631\u0627 \u067E\u06CC\u062F\u0627 \u0646\u0645\u06CC\u200C\u06A9\u0646\u062F.","\u0646\u0633\u0628\u062A \u0628\u062F\u0647\u06CC \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0686\u0647 \u0628\u062E\u0634\u06CC \u0627\u0632 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0628\u0627 \u0642\u0631\u0636 \u062A\u0623\u0645\u06CC\u0646 \u0634\u062F\u0647 \u0627\u0633\u062A. \u0647\u0631 \u0686\u0647 \u0627\u06CC\u0646 \u0646\u0633\u0628\u062A \u0628\u0627\u0644\u0627\u062A\u0631 \u0628\u0627\u0634\u062F\u060C \u0631\u06CC\u0633\u06A9 \u0634\u0631\u06A9\u062A \u0628\u06CC\u0634\u062A\u0631 \u0627\u0633\u062A."]},formulas:[{name:{en:"Debit and credit rules",fa:"\u0642\u0627\u0646\u0648\u0646 \u0628\u062F\u0647\u06A9\u0627\u0631 \u0648 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631"},formula:{en:"Assets, expenses, dividends \u2192 increase with debits | Liabilities, stock, revenues \u2192 increase with credits",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC\u060C \u0647\u0632\u06CC\u0646\u0647\u060C \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u2190 \u0628\u0627 \u0628\u062F\u0647\u06A9\u0627\u0631 \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u0634\u0648\u0646\u062F | \u0628\u062F\u0647\u06CC\u060C \u0633\u0647\u0627\u0645\u060C \u062F\u0631\u0622\u0645\u062F \u2190 \u0628\u0627 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631 \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u0634\u0648\u0646\u062F"},example:{en:"Buying equipment for cash: debit Equipment, credit Cash",fa:"\u062E\u0631\u06CC\u062F \u062A\u062C\u0647\u06CC\u0632\u0627\u062A \u0646\u0642\u062F\u06CC: \u062A\u062C\u0647\u06CC\u0632\u0627\u062A \u0628\u062F\u0647\u06A9\u0627\u0631\u060C \u067E\u0648\u0644 \u0646\u0642\u062F \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631"}},{name:{en:"Balanced entry",fa:"\u062A\u0639\u0627\u062F\u0644 \u0647\u0631 \u062B\u0628\u062A"},formula:{en:"Total debits = Total credits",fa:"\u062C\u0645\u0639 \u0628\u062F\u0647\u06A9\u0627\u0631\u0647\u0627 = \u062C\u0645\u0639 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631\u0647\u0627"},example:{en:"Supplies 500 debit = Cash 500 credit",fa:"\u0644\u0648\u0627\u0632\u0645 \u06F5\u06F0\u06F0 \u0628\u062F\u0647\u06A9\u0627\u0631 = \u067E\u0648\u0644 \u0646\u0642\u062F \u06F5\u06F0\u06F0 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631"}},{name:{en:"Account balance",fa:"\u0645\u0627\u0646\u062F\u0647\u0654 \u062D\u0633\u0627\u0628"},formula:{en:"Balance = Beginning balance + Increases \u2212 Decreases",fa:"\u0645\u0627\u0646\u062F\u0647 = \u0645\u0627\u0646\u062F\u0647 \u0627\u0648\u0644 + \u0627\u0641\u0632\u0627\u06CC\u0634\u200C\u0647\u0627 \u2212 \u06A9\u0627\u0647\u0634\u200C\u0647\u0627"},example:{en:"Cash: 1,000 + 400 \u2212 300 = 1,100",fa:"\u067E\u0648\u0644 \u0646\u0642\u062F: \u06F1\u066C\u06F0\u06F0\u06F0 + \u06F4\u06F0\u06F0 \u2212 \u06F3\u06F0\u06F0 = \u06F1\u066C\u06F1\u06F0\u06F0"}},{name:{en:"Debt ratio",fa:"\u0646\u0633\u0628\u062A \u0628\u062F\u0647\u06CC"},formula:{en:"Debt ratio = Total liabilities \xF7 Total assets",fa:"\u0646\u0633\u0628\u062A \u0628\u062F\u0647\u06CC = \u06A9\u0644 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 \xF7 \u06A9\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"},example:{en:"40,000 \xF7 100,000 = 40%",fa:"\u06F4\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F4\u06F0\u066A"}}]},{id:3,title:{en:"Adjusting Accounts for Financial Statements",fa:"\u0627\u0635\u0644\u0627\u062D \u062D\u0633\u0627\u0628\u200C\u0647\u0627 \u0628\u0631\u0627\u06CC \u0635\u0648\u0631\u062A\u200C\u0647\u0627\u06CC \u0645\u0627\u0644\u06CC"},summary:{en:["Accrual basis accounting records revenue when it is earned and expenses when they are incurred, not when cash changes hands. That is why some accounts must be adjusted at the end of each period.","There are four types of adjusting entries: (1) prepaid expenses, like insurance or supplies, part of which has been used; (2) unearned revenues, part of which has been earned; (3) accrued expenses, like wages not yet paid; and (4) accrued revenues, work done but not yet collected.","Depreciation spreads the cost of assets such as equipment over their useful lives. Instead of reducing the asset directly, we use the Accumulated Depreciation account.","A classified balance sheet splits assets and liabilities into current (within one year) and long-term.","At year-end, closing entries reset the temporary accounts (revenues, expenses, dividends) to zero and transfer their balances to Retained Earnings."],fa:["\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062A\u0639\u0647\u062F\u06CC \u0645\u06CC\u200C\u06AF\u0648\u06CC\u062F \u062F\u0631\u0622\u0645\u062F \u0648\u0642\u062A\u06CC \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F \u06A9\u0647 \u06A9\u0627\u0631 \u0627\u0646\u062C\u0627\u0645 \u0634\u0648\u062F\u060C \u0648 \u0647\u0632\u06CC\u0646\u0647 \u0648\u0642\u062A\u06CC \u06A9\u0647 \u0627\u062A\u0641\u0627\u0642 \u0628\u06CC\u0641\u062A\u062F\u061B \u0646\u0647 \u0648\u0642\u062A\u06CC \u06A9\u0647 \u067E\u0648\u0644 \u062C\u0627\u0628\u0647\u200C\u062C\u0627 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0628\u0631\u0627\u06CC \u0647\u0645\u06CC\u0646 \u0622\u062E\u0631 \u0647\u0631 \u062F\u0648\u0631\u0647 \u0628\u0639\u0636\u06CC \u062D\u0633\u0627\u0628\u200C\u0647\u0627 \u0628\u0627\u06CC\u062F \u0627\u0635\u0644\u0627\u062D \u0634\u0648\u0646\u062F.","\u0686\u0647\u0627\u0631 \u0646\u0648\u0639 \u062B\u0628\u062A \u0627\u0635\u0644\u0627\u062D\u06CC \u062F\u0627\u0631\u06CC\u0645: (\u06F1) \u067E\u06CC\u0634\u200C\u067E\u0631\u062F\u0627\u062E\u062A \u0647\u0632\u06CC\u0646\u0647\u060C \u0645\u062B\u0644 \u0628\u06CC\u0645\u0647 \u06CC\u0627 \u0644\u0648\u0627\u0632\u0645 \u06A9\u0647 \u0628\u062E\u0634\u06CC \u0627\u0632 \u0622\u0646 \u0645\u0635\u0631\u0641 \u0634\u062F\u0647\u061B (\u06F2) \u067E\u06CC\u0634\u200C\u062F\u0631\u06CC\u0627\u0641\u062A \u062F\u0631\u0622\u0645\u062F\u060C \u06A9\u0647 \u0628\u062E\u0634\u06CC \u0627\u0632 \u06A9\u0627\u0631 \u0627\u0646\u062C\u0627\u0645 \u0634\u062F\u0647\u061B (\u06F3) \u0647\u0632\u06CC\u0646\u0647\u0654 \u0645\u0639\u0648\u0642\u060C \u0645\u062B\u0644 \u062F\u0633\u062A\u0645\u0632\u062F\u06CC \u06A9\u0647 \u0647\u0646\u0648\u0632 \u067E\u0631\u062F\u0627\u062E\u062A \u0646\u0634\u062F\u0647\u061B (\u06F4) \u062F\u0631\u0622\u0645\u062F \u0645\u0639\u0648\u0642\u060C \u06A9\u0627\u0631\u06CC \u06A9\u0647 \u0627\u0646\u062C\u0627\u0645 \u0634\u062F\u0647 \u0648\u0644\u06CC \u067E\u0648\u0644\u0634 \u0647\u0646\u0648\u0632 \u0646\u06CC\u0627\u0645\u062F\u0647.","\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0647\u0632\u06CC\u0646\u0647\u0654 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC\u06CC \u0645\u062B\u0644 \u062A\u062C\u0647\u06CC\u0632\u0627\u062A \u0631\u0627 \u0628\u06CC\u0646 \u0633\u0627\u0644\u200C\u0647\u0627\u06CC \u0639\u0645\u0631\u0634\u0627\u0646 \u067E\u062E\u0634 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0628\u0647 \u062C\u0627\u06CC \u06A9\u0645 \u06A9\u0631\u062F\u0646 \u0645\u0633\u062A\u0642\u06CC\u0645 \u0627\u0632 \u062F\u0627\u0631\u0627\u06CC\u06CC\u060C \u0627\u0632 \u062D\u0633\u0627\u0628 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645.","\u062F\u0631 \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647\u0654 \u0637\u0628\u0642\u0647\u200C\u0628\u0646\u062F\u06CC\u200C\u0634\u062F\u0647\u060C \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0648 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 \u0628\u0647 \u062C\u0627\u0631\u06CC (\u06A9\u0645\u062A\u0631 \u0627\u0632 \u06CC\u06A9 \u0633\u0627\u0644) \u0648 \u0628\u0644\u0646\u062F\u0645\u062F\u062A \u062A\u0642\u0633\u06CC\u0645 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F.","\u0622\u062E\u0631 \u0633\u0627\u0644\u060C \u062B\u0628\u062A\u200C\u0647\u0627\u06CC \u0628\u0633\u062A\u0646 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u0645\u0648\u0642\u062A (\u062F\u0631\u0622\u0645\u062F\u060C \u0647\u0632\u06CC\u0646\u0647\u060C \u0633\u0648\u062F \u0633\u0647\u0627\u0645) \u0631\u0627 \u0635\u0641\u0631 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F \u0648 \u0645\u0627\u0646\u062F\u0647\u0654 \u0622\u0646\u200C\u0647\u0627 \u0631\u0627 \u0628\u0647 \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u0645\u0646\u062A\u0642\u0644 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F."]},formulas:[{name:{en:"Supplies used",fa:"\u0644\u0648\u0627\u0632\u0645 \u0645\u0635\u0631\u0641\u200C\u0634\u062F\u0647"},formula:{en:"Supplies used = Supplies balance \u2212 Supplies counted",fa:"\u0644\u0648\u0627\u0632\u0645 \u0645\u0635\u0631\u0641\u200C\u0634\u062F\u0647 = \u0645\u0627\u0646\u062F\u0647\u0654 \u062F\u0641\u062A\u0631\u06CC \u0644\u0648\u0627\u0632\u0645 \u2212 \u0644\u0648\u0627\u0632\u0645 \u0634\u0645\u0627\u0631\u0634\u200C\u0634\u062F\u0647"},example:{en:"9,720 \u2212 8,670 = 1,050 supplies expense",fa:"\u06F9\u066C\u06F7\u06F2\u06F0 \u2212 \u06F8\u066C\u06F6\u06F7\u06F0 = \u06F1\u066C\u06F0\u06F5\u06F0 \u0647\u0632\u06CC\u0646\u0647\u0654 \u0644\u0648\u0627\u0632\u0645"}},{name:{en:"Expired insurance",fa:"\u0628\u06CC\u0645\u0647\u0654 \u0645\u0646\u0642\u0636\u06CC\u200C\u0634\u062F\u0647"},formula:{en:"Monthly insurance expense = Total policy cost \xF7 Number of months",fa:"\u0647\u0632\u06CC\u0646\u0647\u0654 \u0628\u06CC\u0645\u0647\u0654 \u0645\u0627\u0647\u0627\u0646\u0647 = \u0645\u0628\u0644\u063A \u06A9\u0644 \u0628\u06CC\u0645\u0647 \xF7 \u062A\u0639\u062F\u0627\u062F \u0645\u0627\u0647\u200C\u0647\u0627"},example:{en:"2,400 \xF7 24 = 100 per month",fa:"\u06F2\u066C\u06F4\u06F0\u06F0 \xF7 \u06F2\u06F4 = \u06F1\u06F0\u06F0 \u062F\u0631 \u0645\u0627\u0647"}},{name:{en:"Straight-line depreciation",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u062E\u0637 \u0645\u0633\u062A\u0642\u06CC\u0645"},formula:{en:"Annual depreciation = (Cost \u2212 Salvage value) \xF7 Useful life",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644\u0627\u0646\u0647 = (\u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647 \u2212 \u0627\u0631\u0632\u0634 \u0627\u0633\u0642\u0627\u0637) \xF7 \u0633\u0627\u0644\u200C\u0647\u0627\u06CC \u0639\u0645\u0631"},example:{en:"(8,000 \u2212 2,000) \xF7 5 = 1,200",fa:"(\u06F8\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F0\u06F0\u06F0) \xF7 \u06F5 = \u06F1\u066C\u06F2\u06F0\u06F0"}},{name:{en:"Book value",fa:"\u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC"},formula:{en:"Book value = Cost \u2212 Accumulated depreciation",fa:"\u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC = \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647 \u2212 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0627\u0646\u0628\u0627\u0634\u062A\u0647"},example:{en:"8,000 \u2212 2,400 = 5,600",fa:"\u06F8\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F4\u06F0\u06F0 = \u06F5\u066C\u06F6\u06F0\u06F0"}},{name:{en:"Profit margin",fa:"\u062D\u0627\u0634\u06CC\u0647\u0654 \u0633\u0648\u062F"},formula:{en:"Profit margin = Net income \xF7 Net sales",fa:"\u062D\u0627\u0634\u06CC\u0647\u0654 \u0633\u0648\u062F = \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \xF7 \u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635"},example:{en:"15,000 \xF7 100,000 = 15%",fa:"\u06F1\u06F5\u066C\u06F0\u06F0\u06F0 \xF7 \u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F1\u06F5\u066A"}},{name:{en:"Current ratio",fa:"\u0646\u0633\u0628\u062A \u062C\u0627\u0631\u06CC"},formula:{en:"Current ratio = Current assets \xF7 Current liabilities",fa:"\u0646\u0633\u0628\u062A \u062C\u0627\u0631\u06CC = \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC \u062C\u0627\u0631\u06CC \xF7 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627\u06CC \u062C\u0627\u0631\u06CC"},example:{en:"60,000 \xF7 30,000 = 2",fa:"\u06F6\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F3\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F2"}}]},{id:4,title:{en:"Accounting for Merchandising Operations",fa:"\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u0634\u0631\u06A9\u062A\u200C\u0647\u0627\u06CC \u0628\u0627\u0632\u0631\u06AF\u0627\u0646\u06CC"},summary:{en:["A service company sells time and skills, but a merchandiser buys products and resells them. So it has an extra step: subtract cost of goods sold from net sales to get gross profit.","In a perpetual system, cost of goods sold is recorded after every sale. In a periodic system, it is computed only at the end of the period.","Credit terms such as 2/10, n/30 mean a 2% discount if paid within 10 days; otherwise the full amount is due in 30 days. In purchases, discounts, returns, and shipping costs (FOB shipping point) change Merchandise Inventory directly.","Every sale has two entries: a revenue side at the selling price (Accounts Receivable or Cash / Sales) and a cost side at cost (Cost of Goods Sold / Merchandise Inventory). A sales return also has two entries, but an allowance (customer keeps the goods) has only one.","At period-end, inventory shrinkage is added to cost of goods sold with an adjusting entry. The income statement can be multiple-step (showing gross profit and income from operations separately) or single-step."],fa:["\u0634\u0631\u06A9\u062A \u062E\u062F\u0645\u0627\u062A\u06CC \u0648\u0642\u062A \u0648 \u0645\u0647\u0627\u0631\u062A \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u062F\u060C \u0648\u0644\u06CC \u0634\u0631\u06A9\u062A \u0628\u0627\u0632\u0631\u06AF\u0627\u0646\u06CC \u06A9\u0627\u0644\u0627 \u0645\u06CC\u200C\u062E\u0631\u062F \u0648 \u062F\u0648\u0628\u0627\u0631\u0647 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u062F. \u0628\u0631\u0627\u06CC \u0647\u0645\u06CC\u0646 \u06CC\u06A9 \u0645\u0631\u062D\u0644\u0647\u0654 \u0627\u0636\u0627\u0641\u0647 \u062F\u0627\u0631\u062F: \u0627\u0648\u0644 \u0627\u0632 \u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635\u060C \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645 \u062A\u0627 \u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635 \u0628\u0647 \u062F\u0633\u062A \u0628\u06CC\u0627\u06CC\u062F.","\u062F\u0631 \u0633\u06CC\u0633\u062A\u0645 \u062F\u0627\u0626\u0645\u06CC\u060C \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0628\u0639\u062F \u0627\u0632 \u0647\u0631 \u0641\u0631\u0648\u0634 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F. \u062F\u0631 \u0633\u06CC\u0633\u062A\u0645 \u0627\u062F\u0648\u0627\u0631\u06CC\u060C \u0641\u0642\u0637 \u0622\u062E\u0631 \u062F\u0648\u0631\u0647 \u062D\u0633\u0627\u0628 \u0645\u06CC\u200C\u0634\u0648\u062F.","\u0634\u0631\u0627\u06CC\u0637 \u0627\u0639\u062A\u0628\u0627\u0631 \u0645\u062B\u0644 2/10, n/30 \u06CC\u0639\u0646\u06CC \u0627\u06AF\u0631 \u0638\u0631\u0641 \u06F1\u06F0 \u0631\u0648\u0632 \u067E\u0631\u062F\u0627\u062E\u062A \u0634\u0648\u062F \u06F2\u066A \u062A\u062E\u0641\u06CC\u0641 \u062F\u0627\u0631\u062F\u060C \u0648\u06AF\u0631\u0646\u0647 \u06A9\u0644 \u0645\u0628\u0644\u063A \u062A\u0627 \u06F3\u06F0 \u0631\u0648\u0632 \u0628\u0627\u06CC\u062F \u067E\u0631\u062F\u0627\u062E\u062A \u0634\u0648\u062F. \u062F\u0631 \u062E\u0631\u06CC\u062F\u060C \u062A\u062E\u0641\u06CC\u0641\u060C \u0628\u0631\u06AF\u0634\u062A \u0648 \u0647\u0632\u06CC\u0646\u0647\u0654 \u062D\u0645\u0644 (\u0628\u0627 \u062A\u062D\u0648\u06CC\u0644 \u062F\u0631 \u0645\u0628\u062F\u0623) \u0645\u0633\u062A\u0642\u06CC\u0645\u0627\u064B \u0645\u0648\u062C\u0648\u062F\u06CC \u06A9\u0627\u0644\u0627 \u0631\u0627 \u062A\u063A\u06CC\u06CC\u0631 \u0645\u06CC\u200C\u062F\u0647\u0646\u062F.","\u0647\u0631 \u0641\u0631\u0648\u0634 \u062F\u0648 \u062B\u0628\u062A \u062F\u0627\u0631\u062F: \u06CC\u06A9\u06CC \u0637\u0631\u0641 \u067E\u0648\u0644 \u0628\u0627 \u0642\u06CC\u0645\u062A \u0641\u0631\u0648\u0634 (\u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u06CC\u0627 \u0646\u0642\u062F / \u0641\u0631\u0648\u0634) \u0648 \u06CC\u06A9\u06CC \u0637\u0631\u0641 \u06A9\u0627\u0644\u0627 \u0628\u0627 \u0642\u06CC\u0645\u062A \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647 (\u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 / \u0645\u0648\u062C\u0648\u062F\u06CC \u06A9\u0627\u0644\u0627). \u0628\u0631\u06AF\u0634\u062A \u0627\u0632 \u0641\u0631\u0648\u0634 \u0647\u0645 \u062F\u0648 \u062B\u0628\u062A \u062F\u0627\u0631\u062F\u060C \u0648\u0644\u06CC \u062A\u062E\u0641\u06CC\u0641 \u0641\u0631\u0648\u0634 (\u06A9\u0627\u0644\u0627 \u0646\u0632\u062F \u0645\u0634\u062A\u0631\u06CC) \u0641\u0642\u0637 \u06CC\u06A9\u06CC.","\u0622\u062E\u0631 \u062F\u0648\u0631\u0647\u060C \u06A9\u0633\u0631\u06CC \u0627\u0646\u0628\u0627\u0631 \u0628\u0627 \u062B\u0628\u062A \u0627\u0635\u0644\u0627\u062D\u06CC \u0628\u0647 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0627\u0636\u0627\u0641\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0635\u0648\u0631\u062A \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0686\u0646\u062F\u0645\u0631\u062D\u0644\u0647\u200C\u0627\u06CC \u0628\u0627\u0634\u062F (\u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635 \u0648 \u0633\u0648\u062F \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \u0631\u0627 \u062C\u062F\u0627 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F) \u06CC\u0627 \u06CC\u06A9\u200C\u0645\u0631\u062D\u0644\u0647\u200C\u0627\u06CC."]},formulas:[{name:{en:"Gross profit",fa:"\u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635"},formula:{en:"Gross profit = Net sales \u2212 Cost of goods sold",fa:"\u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635 = \u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635 \u2212 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647"},example:{en:"50,000 \u2212 30,000 = 20,000",fa:"\u06F5\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F3\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F2\u06F0\u066C\u06F0\u06F0\u06F0"}},{name:{en:"Net sales",fa:"\u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635"},formula:{en:"Net sales = Sales \u2212 Sales discounts \u2212 Sales returns and allowances",fa:"\u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635 = \u0641\u0631\u0648\u0634 \u2212 \u062A\u062E\u0641\u06CC\u0641\u0627\u062A \u0641\u0631\u0648\u0634 \u2212 \u0628\u0631\u06AF\u0634\u062A \u0627\u0632 \u0641\u0631\u0648\u0634 \u0648 \u062A\u062E\u0641\u06CC\u0641\u0627\u062A"},example:{en:"50,000 \u2212 1,000 \u2212 2,000 = 47,000",fa:"\u06F5\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F0\u06F0\u06F0 = \u06F4\u06F7\u066C\u06F0\u06F0\u06F0"}},{name:{en:"Purchase discount",fa:"\u062A\u062E\u0641\u06CC\u0641 \u062E\u0631\u06CC\u062F"},formula:{en:"Discount = Discount % \xD7 (Purchase \u2212 Returns)",fa:"\u062A\u062E\u0641\u06CC\u0641 = \u062F\u0631\u0635\u062F \u062A\u062E\u0641\u06CC\u0641 \xD7 (\u0645\u0628\u0644\u063A \u062E\u0631\u06CC\u062F \u2212 \u0628\u0631\u06AF\u0634\u062A\u06CC\u200C\u0647\u0627)"},example:{en:"2% \xD7 (250 \u2212 50) = 4 \u2192 pay 196",fa:"\u06F2\u066A \xD7 (\u06F2\u06F5\u06F0 \u2212 \u06F5\u06F0) = \u06F4 \u2190 \u067E\u0631\u062F\u0627\u062E\u062A \u06F1\u06F9\u06F6"}},{name:{en:"Inventory shrinkage",fa:"\u06A9\u0633\u0631\u06CC \u0627\u0646\u0628\u0627\u0631"},formula:{en:"Shrinkage = Inventory per records \u2212 Inventory counted",fa:"\u06A9\u0633\u0631\u06CC = \u0645\u0648\u062C\u0648\u062F\u06CC \u0637\u0628\u0642 \u062F\u0641\u0627\u062A\u0631 \u2212 \u0645\u0648\u062C\u0648\u062F\u06CC \u0634\u0645\u0627\u0631\u0634\u200C\u0634\u062F\u0647"},example:{en:"21,250 \u2212 20,000 = 1,250",fa:"\u06F2\u06F1\u066C\u06F2\u06F5\u06F0 \u2212 \u06F2\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F1\u066C\u06F2\u06F5\u06F0"}},{name:{en:"Gross margin ratio",fa:"\u0646\u0633\u0628\u062A \u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635"},formula:{en:"Gross margin ratio = Gross profit \xF7 Net sales",fa:"\u0646\u0633\u0628\u062A \u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635 = \u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635 \xF7 \u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635"},example:{en:"20,000 \xF7 50,000 = 40%",fa:"\u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F5\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F4\u06F0\u066A"}},{name:{en:"Acid-test ratio",fa:"\u0646\u0633\u0628\u062A \u0622\u0646\u06CC"},formula:{en:"Acid-test = (Cash + Short-term investments + Receivables) \xF7 Current liabilities",fa:"\u0646\u0633\u0628\u062A \u0622\u0646\u06CC = (\u0646\u0642\u062F + \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC \u06A9\u0648\u062A\u0627\u0647\u200C\u0645\u062F\u062A + \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627) \xF7 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627\u06CC \u062C\u0627\u0631\u06CC"},example:{en:"30,000 \xF7 25,000 = 1.2",fa:"\u06F3\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F2\u06F5\u066C\u06F0\u06F0\u06F0 = \u06F1\u066B\u06F2"}}]},{id:5,title:{en:"Inventories and Cost of Sales",fa:"\u0645\u0648\u062C\u0648\u062F\u06CC \u06A9\u0627\u0644\u0627 \u0648 \u0628\u0647\u0627\u06CC \u0641\u0631\u0648\u0634"},summary:{en:["Merchandise inventory is all goods the company owns and holds for sale, wherever they are. Goods in transit shipped FOB shipping point belong to the buyer; consigned goods belong to the owner (consignor), not the store selling them (consignee).","Inventory cost includes all costs to get the goods ready for sale: invoice price minus discounts, plus shipping, insurance, storage, and import duties.","When the same item is bought at different prices, we choose one of four methods: specific identification, FIFO (oldest first), LIFO (newest first), and weighted average.","When prices are rising, FIFO gives the lowest cost of goods sold and the highest profit, and LIFO gives the highest cost of goods sold, the lowest profit, and the lowest taxes. Weighted average is always in between.","Lower of cost or market: if the replacement cost of the goods falls below their cost, the lower amount is reported."],fa:["\u0645\u0648\u062C\u0648\u062F\u06CC \u06A9\u0627\u0644\u0627 \u06CC\u0639\u0646\u06CC \u0647\u0645\u0647\u0654 \u06A9\u0627\u0644\u0627\u0647\u0627\u06CC\u06CC \u06A9\u0647 \u0645\u0627\u0644 \u0634\u0631\u06A9\u062A \u0627\u0633\u062A \u0648 \u0628\u0631\u0627\u06CC \u0641\u0631\u0648\u0634 \u0646\u06AF\u0647 \u062F\u0627\u0634\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F\u060C \u0647\u0631 \u062C\u0627 \u06A9\u0647 \u0628\u0627\u0634\u062F. \u06A9\u0627\u0644\u0627\u06CC \u062F\u0631 \u0631\u0627\u0647 \u0628\u0627 \u062A\u062D\u0648\u06CC\u0644 \u062F\u0631 \u0645\u0628\u062F\u0623 \u0645\u0627\u0644 \u062E\u0631\u06CC\u062F\u0627\u0631 \u0627\u0633\u062A\u061B \u06A9\u0627\u0644\u0627\u06CC \u0627\u0645\u0627\u0646\u06CC \u0645\u0627\u0644 \u0635\u0627\u062D\u0628 \u06A9\u0627\u0644\u0627\u0633\u062A\u060C \u0646\u0647 \u0645\u063A\u0627\u0632\u0647\u200C\u0627\u06CC \u06A9\u0647 \u0622\u0646 \u0631\u0627 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u062F.","\u0628\u0647\u0627\u06CC \u0645\u0648\u062C\u0648\u062F\u06CC \u0634\u0627\u0645\u0644 \u0647\u0645\u0647\u0654 \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627 \u062A\u0627 \u0622\u0645\u0627\u062F\u0647 \u0634\u062F\u0646 \u06A9\u0627\u0644\u0627 \u0628\u0631\u0627\u06CC \u0641\u0631\u0648\u0634 \u0627\u0633\u062A: \u0642\u06CC\u0645\u062A \u0641\u0627\u06A9\u062A\u0648\u0631 \u0645\u0646\u0647\u0627\u06CC \u062A\u062E\u0641\u06CC\u0641\u060C \u0628\u0647\u200C\u0639\u0644\u0627\u0648\u0647\u0654 \u062D\u0645\u0644\u060C \u0628\u06CC\u0645\u0647\u060C \u0627\u0646\u0628\u0627\u0631\u062F\u0627\u0631\u06CC \u0648 \u0639\u0648\u0627\u0631\u0636 \u06AF\u0645\u0631\u06A9\u06CC.","\u0648\u0642\u062A\u06CC \u06CC\u06A9 \u06A9\u0627\u0644\u0627 \u0628\u0627 \u0642\u06CC\u0645\u062A\u200C\u0647\u0627\u06CC \u0645\u062E\u062A\u0644\u0641 \u062E\u0631\u06CC\u062F\u0647 \u0634\u062F\u0647\u060C \u06CC\u06A9\u06CC \u0627\u0632 \u0686\u0647\u0627\u0631 \u0631\u0648\u0634 \u0631\u0627 \u0627\u0646\u062A\u062E\u0627\u0628 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645: \u0634\u0646\u0627\u0633\u0627\u06CC\u06CC \u0648\u06CC\u0698\u0647\u060C \u0627\u0648\u0644\u06CC\u0646 \u0648\u0627\u0631\u062F\u0647 \u0627\u0648\u0644\u06CC\u0646 \u0635\u0627\u062F\u0631\u0647 (\u0627\u0648\u0644 \u0642\u062F\u06CC\u0645\u06CC\u200C\u0647\u0627)\u060C \u0622\u062E\u0631\u06CC\u0646 \u0648\u0627\u0631\u062F\u0647 \u0627\u0648\u0644\u06CC\u0646 \u0635\u0627\u062F\u0631\u0647 (\u0627\u0648\u0644 \u062C\u062F\u06CC\u062F\u0647\u0627)\u060C \u0648 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0648\u0632\u0648\u0646.","\u0648\u0642\u062A\u06CC \u0642\u06CC\u0645\u062A\u200C\u0647\u0627 \u0628\u0627\u0644\u0627 \u0645\u06CC\u200C\u0631\u0648\u062F\u060C \u0631\u0648\u0634 \u0627\u0648\u0644 \u0642\u062F\u06CC\u0645\u06CC\u200C\u0647\u0627 \u06A9\u0645\u062A\u0631\u06CC\u0646 \u0628\u0647\u0627\u06CC \u0641\u0631\u0648\u0634 \u0648 \u0628\u06CC\u0634\u062A\u0631\u06CC\u0646 \u0633\u0648\u062F \u0631\u0627 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F\u060C \u0648 \u0631\u0648\u0634 \u0627\u0648\u0644 \u062C\u062F\u06CC\u062F\u0647\u0627 \u0628\u06CC\u0634\u062A\u0631\u06CC\u0646 \u0628\u0647\u0627\u06CC \u0641\u0631\u0648\u0634\u060C \u06A9\u0645\u062A\u0631\u06CC\u0646 \u0633\u0648\u062F \u0648 \u06A9\u0645\u062A\u0631\u06CC\u0646 \u0645\u0627\u0644\u06CC\u0627\u062A \u0631\u0627. \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0647\u0645\u06CC\u0634\u0647 \u0648\u0633\u0637 \u0627\u0633\u062A.","\u0642\u0627\u0639\u062F\u0647\u0654 \u0627\u0642\u0644 \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647 \u06CC\u0627 \u0627\u0631\u0632\u0634 \u0628\u0627\u0632\u0627\u0631: \u0627\u06AF\u0631 \u0642\u06CC\u0645\u062A \u062E\u0631\u06CC\u062F \u062F\u0648\u0628\u0627\u0631\u0647\u0654 \u06A9\u0627\u0644\u0627 \u0627\u0632 \u0628\u0647\u0627\u06CC \u0622\u0646 \u06A9\u0645\u062A\u0631 \u0634\u0648\u062F\u060C \u0639\u062F\u062F \u06A9\u0645\u062A\u0631 \u06AF\u0632\u0627\u0631\u0634 \u0645\u06CC\u200C\u0634\u0648\u062F."]},formulas:[{name:{en:"Goods available for sale",fa:"\u06A9\u0627\u0644\u0627\u06CC \u0622\u0645\u0627\u062F\u0647\u0654 \u0641\u0631\u0648\u0634"},formula:{en:"Goods available = Beginning inventory + Purchases = COGS + Ending inventory",fa:"\u06A9\u0627\u0644\u0627\u06CC \u0622\u0645\u0627\u062F\u0647\u0654 \u0641\u0631\u0648\u0634 = \u0645\u0648\u062C\u0648\u062F\u06CC \u0627\u0648\u0644 \u062F\u0648\u0631\u0647 + \u062E\u0631\u06CC\u062F\u0647\u0627 = \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 + \u0645\u0648\u062C\u0648\u062F\u06CC \u067E\u0627\u06CC\u0627\u0646 \u062F\u0648\u0631\u0647"},example:{en:"15 + 24 = 39 \u2192 if COGS is 23, ending = 16",fa:"\u06F1\u06F5 + \u06F2\u06F4 = \u06F3\u06F9 \u2190 \u0627\u06AF\u0631 \u0641\u0631\u0648\u062E\u062A\u0647\u200C\u0634\u062F\u0647 \u06F2\u06F3 \u0628\u0627\u0634\u062F\u060C \u0645\u0627\u0646\u062F\u0647 \u06F1\u06F6"}},{name:{en:"FIFO",fa:"\u0627\u0648\u0644 \u0642\u062F\u06CC\u0645\u06CC\u200C\u0647\u0627"},formula:{en:"COGS from the oldest purchases; ending inventory from the newest",fa:"\u0628\u0647\u0627\u06CC \u0641\u0631\u0648\u0634 \u0627\u0632 \u0642\u062F\u06CC\u0645\u06CC\u200C\u062A\u0631\u06CC\u0646 \u062E\u0631\u06CC\u062F\u0647\u0627\u061B \u0645\u0648\u062C\u0648\u062F\u06CC \u067E\u0627\u06CC\u0627\u0646 \u0627\u0632 \u062C\u062F\u06CC\u062F\u062A\u0631\u06CC\u0646\u200C\u0647\u0627"},example:{en:"3\xD75 and 3\xD78, sell 4 \u2192 15 + 8 = 23",fa:"\u06F3\xD7\u06F5 \u0648 \u06F3\xD7\u06F8\u060C \u0641\u0631\u0648\u0634 \u06F4 \u0639\u062F\u062F \u2190 \u06F1\u06F5 + \u06F8 = \u06F2\u06F3"}},{name:{en:"LIFO",fa:"\u0627\u0648\u0644 \u062C\u062F\u06CC\u062F\u0647\u0627"},formula:{en:"COGS from the newest purchases; ending inventory from the oldest",fa:"\u0628\u0647\u0627\u06CC \u0641\u0631\u0648\u0634 \u0627\u0632 \u062C\u062F\u06CC\u062F\u062A\u0631\u06CC\u0646 \u062E\u0631\u06CC\u062F\u0647\u0627\u061B \u0645\u0648\u062C\u0648\u062F\u06CC \u067E\u0627\u06CC\u0627\u0646 \u0627\u0632 \u0642\u062F\u06CC\u0645\u06CC\u200C\u062A\u0631\u06CC\u0646\u200C\u0647\u0627"},example:{en:"3\xD75 and 3\xD78, sell 4 \u2192 24 + 5 = 29",fa:"\u06F3\xD7\u06F5 \u0648 \u06F3\xD7\u06F8\u060C \u0641\u0631\u0648\u0634 \u06F4 \u0639\u062F\u062F \u2190 \u06F2\u06F4 + \u06F5 = \u06F2\u06F9"}},{name:{en:"Weighted average",fa:"\u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0648\u0632\u0648\u0646"},formula:{en:"Average cost per unit = Total cost of goods available \xF7 Units available",fa:"\u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0647\u0631 \u0648\u0627\u062D\u062F = \u0628\u0647\u0627\u06CC \u06A9\u0644 \u06A9\u0627\u0644\u0627\u06CC \u0645\u0648\u062C\u0648\u062F \xF7 \u062A\u0639\u062F\u0627\u062F \u06A9\u0627\u0644\u0627\u06CC \u0645\u0648\u062C\u0648\u062F"},example:{en:"39 \xF7 6 = 6.5 \u2192 4 \xD7 6.5 = 26",fa:"\u06F3\u06F9 \xF7 \u06F6 = \u06F6\u066B\u06F5 \u2190 \u06F4 \xD7 \u06F6\u066B\u06F5 = \u06F2\u06F6"}},{name:{en:"Lower of cost or market",fa:"\u0627\u0642\u0644 \u0628\u0647\u0627 \u06CC\u0627 \u0628\u0627\u0632\u0627\u0631"},formula:{en:"Reported amount = lower of (Cost, Market); write-down = Cost \u2212 Market",fa:"\u0645\u0628\u0644\u063A \u06AF\u0632\u0627\u0631\u0634\u200C\u0634\u062F\u0647 = \u06A9\u0645\u062A\u0631\u06CC\u0646\u0650 (\u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647\u060C \u0627\u0631\u0632\u0634 \u0628\u0627\u0632\u0627\u0631)\u061B \u06A9\u0627\u0647\u0634 = \u0628\u0647\u0627 \u2212 \u0628\u0627\u0632\u0627\u0631"},example:{en:"Cost 300, market 250 \u2192 report 250, write-down 50",fa:"\u0628\u0647\u0627 \u06F3\u06F0\u06F0\u060C \u0628\u0627\u0632\u0627\u0631 \u06F2\u06F5\u06F0 \u2190 \u06AF\u0632\u0627\u0631\u0634 \u06F2\u06F5\u06F0\u060C \u06A9\u0627\u0647\u0634 \u06F5\u06F0"}},{name:{en:"Inventory turnover",fa:"\u06AF\u0631\u062F\u0634 \u0645\u0648\u062C\u0648\u062F\u06CC \u06A9\u0627\u0644\u0627"},formula:{en:"Inventory turnover = COGS \xF7 Average inventory",fa:"\u06AF\u0631\u062F\u0634 \u0645\u0648\u062C\u0648\u062F\u06CC = \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \xF7 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0648\u062C\u0648\u062F\u06CC"},example:{en:"60,000 \xF7 15,000 = 4 times",fa:"\u06F6\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F1\u06F5\u066C\u06F0\u06F0\u06F0 = \u06F4 \u0628\u0627\u0631"}},{name:{en:"Days' sales in inventory",fa:"\u0631\u0648\u0632\u0647\u0627\u06CC \u0641\u0631\u0648\u0634 \u0645\u0648\u062C\u0648\u062F\u06CC"},formula:{en:"Days' sales = (Ending inventory \xF7 COGS) \xD7 365",fa:"\u0631\u0648\u0632\u0647\u0627\u06CC \u0641\u0631\u0648\u0634 = (\u0645\u0648\u062C\u0648\u062F\u06CC \u067E\u0627\u06CC\u0627\u0646 \xF7 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647) \xD7 \u06F3\u06F6\u06F5"},example:{en:"(15,000 \xF7 60,000) \xD7 365 \u2248 91 days",fa:"(\u06F1\u06F5\u066C\u06F0\u06F0\u06F0 \xF7 \u06F6\u06F0\u066C\u06F0\u06F0\u06F0) \xD7 \u06F3\u06F6\u06F5 \u2248 \u06F9\u06F1 \u0631\u0648\u0632"}}]},{id:6,title:{en:"Cash, Fraud, and Internal Control",fa:"\u0648\u062C\u0647 \u0646\u0642\u062F\u060C \u062A\u0642\u0644\u0628 \u0648 \u06A9\u0646\u062A\u0631\u0644 \u062F\u0627\u062E\u0644\u06CC"},summary:{en:["Internal control means the policies and procedures that protect assets, make accounting reliable, and prevent fraud and errors. The Sarbanes-Oxley Act requires public companies to have effective internal controls.","Key principles: establish responsibilities, maintain adequate records, insure assets and bond key employees, separate recordkeeping from custody of assets, divide responsibility for related transactions, apply technological controls, and perform regular independent reviews.","The fraud triangle has three sides: opportunity, pressure, and rationalization. Internal control mainly removes opportunity. Its limits: human error, collusion, and the cost-benefit constraint.","Cash includes currency, coins, bank deposits, and customer checks. If the cash in the register does not match the register record, we use Cash Over and Short. Petty cash is for small payments; when it is reimbursed, each expense is debited and Cash is credited.","A bank reconciliation explains the difference between the bank and book balances. Bank side: add deposits in transit, subtract outstanding checks. Book side: add collections and interest, subtract bank fees and NSF checks. Only book-side items need journal entries."],fa:["\u06A9\u0646\u062A\u0631\u0644 \u062F\u0627\u062E\u0644\u06CC \u06CC\u0639\u0646\u06CC \u0633\u06CC\u0627\u0633\u062A\u200C\u0647\u0627 \u0648 \u0631\u0648\u0634\u200C\u0647\u0627\u06CC\u06CC \u06A9\u0647 \u0627\u0632 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0645\u062D\u0627\u0641\u0638\u062A \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F\u060C \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u0631\u0627 \u0642\u0627\u0628\u0644 \u0627\u0639\u062A\u0645\u0627\u062F \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F\u060C \u0648 \u062C\u0644\u0648\u06CC \u062A\u0642\u0644\u0628 \u0648 \u0627\u0634\u062A\u0628\u0627\u0647 \u0631\u0627 \u0645\u06CC\u200C\u06AF\u06CC\u0631\u0646\u062F. \u0642\u0627\u0646\u0648\u0646 \u0633\u0627\u0631\u0628\u0646\u0632-\u0622\u06A9\u0633\u0644\u06CC \u0634\u0631\u06A9\u062A\u200C\u0647\u0627\u06CC \u0628\u0648\u0631\u0633\u06CC \u0631\u0627 \u0645\u062C\u0628\u0648\u0631 \u0628\u0647 \u062F\u0627\u0634\u062A\u0646 \u06A9\u0646\u062A\u0631\u0644 \u062F\u0627\u062E\u0644\u06CC \u0645\u0624\u062B\u0631 \u0645\u06CC\u200C\u06A9\u0646\u062F.","\u0627\u0635\u0648\u0644 \u0645\u0647\u0645: \u0645\u0633\u0626\u0648\u0644\u06CC\u062A \u0631\u0627 \u0645\u0634\u062E\u0635 \u06A9\u0646\u06CC\u062F\u060C \u0633\u0648\u0627\u0628\u0642 \u06A9\u0627\u0645\u0644 \u0646\u06AF\u0647 \u062F\u0627\u0631\u06CC\u062F\u060C \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0648 \u06A9\u0627\u0631\u0645\u0646\u062F\u0627\u0646 \u06A9\u0644\u06CC\u062F\u06CC \u0631\u0627 \u0628\u06CC\u0645\u0647 \u06A9\u0646\u06CC\u062F\u060C \u0646\u06AF\u0647\u062F\u0627\u0631\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC \u0631\u0627 \u0627\u0632 \u062B\u0628\u062A \u0622\u0646 \u062C\u062F\u0627 \u06A9\u0646\u06CC\u062F\u060C \u06A9\u0627\u0631\u0647\u0627\u06CC \u0645\u0631\u062A\u0628\u0637 \u0631\u0627 \u0628\u06CC\u0646 \u0686\u0646\u062F \u0646\u0641\u0631 \u062A\u0642\u0633\u06CC\u0645 \u06A9\u0646\u06CC\u062F\u060C \u0627\u0632 \u062A\u06A9\u0646\u0648\u0644\u0648\u0698\u06CC \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u06A9\u0646\u06CC\u062F\u060C \u0648 \u0628\u0627\u0632\u0631\u0633\u06CC \u0645\u0646\u0638\u0645 \u0648 \u0645\u0633\u062A\u0642\u0644 \u062F\u0627\u0634\u062A\u0647 \u0628\u0627\u0634\u06CC\u062F.","\u0645\u062B\u0644\u062B \u062A\u0642\u0644\u0628 \u0633\u0647 \u0636\u0644\u0639 \u062F\u0627\u0631\u062F: \u0641\u0631\u0635\u062A\u060C \u0641\u0634\u0627\u0631 \u0648 \u062A\u0648\u062C\u06CC\u0647. \u06A9\u0646\u062A\u0631\u0644 \u062F\u0627\u062E\u0644\u06CC \u0628\u06CC\u0634\u062A\u0631 \u0631\u0648\u06CC \u0627\u0632 \u0628\u06CC\u0646 \u0628\u0631\u062F\u0646 \u0641\u0631\u0635\u062A \u06A9\u0627\u0631 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0645\u062D\u062F\u0648\u062F\u06CC\u062A\u200C\u0647\u0627\u06CC \u0622\u0646: \u0627\u0634\u062A\u0628\u0627\u0647 \u0627\u0646\u0633\u0627\u0646\u06CC\u060C \u062A\u0628\u0627\u0646\u06CC\u060C \u0648 \u0627\u06CC\u0646\u06A9\u0647 \u0647\u0632\u06CC\u0646\u0647\u0654 \u06A9\u0646\u062A\u0631\u0644 \u0646\u0628\u0627\u06CC\u062F \u0627\u0632 \u0641\u0627\u06CC\u062F\u0647\u200C\u0627\u0634 \u0628\u06CC\u0634\u062A\u0631 \u0634\u0648\u062F.","\u0648\u062C\u0647 \u0646\u0642\u062F \u0634\u0627\u0645\u0644 \u0627\u0633\u06A9\u0646\u0627\u0633\u060C \u0633\u06A9\u0647\u060C \u062D\u0633\u0627\u0628 \u0628\u0627\u0646\u06A9\u06CC \u0648 \u0686\u06A9 \u0645\u0634\u062A\u0631\u06CC \u0627\u0633\u062A. \u0627\u06AF\u0631 \u067E\u0648\u0644 \u0635\u0646\u062F\u0648\u0642 \u0628\u0627 \u062B\u0628\u062A \u062F\u0633\u062A\u06AF\u0627\u0647 \u062C\u0648\u0631 \u0646\u0628\u0627\u0634\u062F\u060C \u0627\u0632 \u062D\u0633\u0627\u0628 \u0627\u0636\u0627\u0641\u0647 \u0648 \u06A9\u0633\u0631\u06CC \u0635\u0646\u062F\u0648\u0642 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645. \u062A\u0646\u062E\u0648\u0627\u0647\u200C\u06AF\u0631\u062F\u0627\u0646 \u0628\u0631\u0627\u06CC \u062E\u0631\u062C\u200C\u0647\u0627\u06CC \u06A9\u0648\u0686\u06A9 \u0627\u0633\u062A \u0648 \u062F\u0631 \u0634\u0627\u0631\u0698 \u062F\u0648\u0628\u0627\u0631\u0647\u060C \u0647\u0631 \u0647\u0632\u06CC\u0646\u0647 \u0628\u062F\u0647\u06A9\u0627\u0631 \u0648 \u067E\u0648\u0644 \u0646\u0642\u062F \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631 \u0645\u06CC\u200C\u0634\u0648\u062F.","\u0635\u0648\u0631\u062A \u0645\u063A\u0627\u06CC\u0631\u062A \u0628\u0627\u0646\u06A9\u06CC \u0641\u0631\u0642 \u0645\u0648\u062C\u0648\u062F\u06CC \u0628\u0627\u0646\u06A9 \u0648 \u062F\u0641\u0627\u062A\u0631 \u0631\u0627 \u062A\u0648\u0636\u06CC\u062D \u0645\u06CC\u200C\u062F\u0647\u062F. \u0637\u0631\u0641 \u0628\u0627\u0646\u06A9: \u0648\u0627\u0631\u06CC\u0632 \u062F\u0631 \u0631\u0627\u0647 \u0627\u0636\u0627\u0641\u0647\u060C \u0686\u06A9 \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0646\u0634\u062F\u0647 \u06A9\u0645. \u0637\u0631\u0641 \u062F\u0641\u0627\u062A\u0631: \u0648\u0635\u0648\u0644\u06CC \u0648 \u0633\u0648\u062F \u0628\u0627\u0646\u06A9\u06CC \u0627\u0636\u0627\u0641\u0647\u060C \u06A9\u0627\u0631\u0645\u0632\u062F \u0648 \u0686\u06A9 \u0628\u0631\u06AF\u0634\u062A\u06CC \u06A9\u0645. \u0641\u0642\u0637 \u0645\u0648\u0627\u0631\u062F \u0637\u0631\u0641 \u062F\u0641\u0627\u062A\u0631 \u062B\u0628\u062A \u0631\u0648\u0632\u0646\u0627\u0645\u0647 \u0645\u06CC\u200C\u062E\u0648\u0627\u0647\u0646\u062F."]},formulas:[{name:{en:"Cash over and short",fa:"\u0627\u0636\u0627\u0641\u0647 \u06CC\u0627 \u06A9\u0633\u0631\u06CC \u0635\u0646\u062F\u0648\u0642"},formula:{en:"Difference = Cash counted \u2212 Register record (negative = short, debit; positive = over, credit)",fa:"\u0641\u0631\u0642 = \u067E\u0648\u0644 \u0634\u0645\u0627\u0631\u0634\u200C\u0634\u062F\u0647 \u2212 \u062B\u0628\u062A \u062F\u0633\u062A\u06AF\u0627\u0647 (\u0645\u0646\u0641\u06CC = \u06A9\u0633\u0631\u06CC\u060C \u0628\u062F\u0647\u06A9\u0627\u0631\u061B \u0645\u062B\u0628\u062A = \u0627\u0636\u0627\u0641\u0647\u060C \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631)"},example:{en:"Register 800, counted 790 \u2192 short 10",fa:"\u062F\u0633\u062A\u06AF\u0627\u0647 \u06F8\u06F0\u06F0\u060C \u0634\u0645\u0627\u0631\u0634 \u06F7\u06F9\u06F0 \u2190 \u06A9\u0633\u0631\u06CC \u06F1\u06F0"}},{name:{en:"Petty cash reimbursement",fa:"\u0634\u0627\u0631\u0698 \u062A\u0646\u062E\u0648\u0627\u0647\u200C\u06AF\u0631\u062F\u0627\u0646"},formula:{en:"Reimbursement = Petty cash fund \u2212 Cash remaining",fa:"\u0645\u0628\u0644\u063A \u0634\u0627\u0631\u0698 = \u0645\u0628\u0644\u063A \u0627\u0648\u0644\u06CC\u0647\u0654 \u062A\u0646\u062E\u0648\u0627\u0647 \u2212 \u067E\u0648\u0644 \u0628\u0627\u0642\u06CC\u200C\u0645\u0627\u0646\u062F\u0647"},example:{en:"200 \u2212 80 = 120",fa:"\u06F2\u06F0\u06F0 \u2212 \u06F8\u06F0 = \u06F1\u06F2\u06F0"}},{name:{en:"Bank side",fa:"\u0637\u0631\u0641 \u0628\u0627\u0646\u06A9"},formula:{en:"Bank balance + Deposits in transit \u2212 Outstanding checks \xB1 Bank errors",fa:"\u0645\u0648\u062C\u0648\u062F\u06CC \u0628\u0627\u0646\u06A9 + \u0648\u0627\u0631\u06CC\u0632 \u062F\u0631 \u0631\u0627\u0647 \u2212 \u0686\u06A9\u200C\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0646\u0634\u062F\u0647 \xB1 \u0627\u0634\u062A\u0628\u0627\u0647 \u0628\u0627\u0646\u06A9"},example:{en:"3,000 + 400 \u2212 630 = 2,770",fa:"\u06F3\u066C\u06F0\u06F0\u06F0 + \u06F4\u06F0\u06F0 \u2212 \u06F6\u06F3\u06F0 = \u06F2\u066C\u06F7\u06F7\u06F0"}},{name:{en:"Book side",fa:"\u0637\u0631\u0641 \u062F\u0641\u0627\u062A\u0631"},formula:{en:"Book balance + Collections and interest \u2212 Bank fees and NSF checks \xB1 Book errors",fa:"\u0645\u0648\u062C\u0648\u062F\u06CC \u062F\u0641\u0627\u062A\u0631 + \u0648\u0635\u0648\u0644\u06CC \u0648 \u0633\u0648\u062F \u0628\u0627\u0646\u06A9\u06CC \u2212 \u06A9\u0627\u0631\u0645\u0632\u062F \u0648 \u0686\u06A9 \u0628\u0631\u06AF\u0634\u062A\u06CC \xB1 \u0627\u0634\u062A\u0628\u0627\u0647 \u062F\u0641\u0627\u062A\u0631"},example:{en:"2,800 \u2212 30 = 2,770",fa:"\u06F2\u066C\u06F8\u06F0\u06F0 \u2212 \u06F3\u06F0 = \u06F2\u066C\u06F7\u06F7\u06F0"}},{name:{en:"Days' sales uncollected",fa:"\u0631\u0648\u0632\u0647\u0627\u06CC \u0648\u0635\u0648\u0644 \u0645\u0637\u0627\u0644\u0628\u0627\u062A"},formula:{en:"Days' sales uncollected = (Accounts receivable \xF7 Net sales) \xD7 365",fa:"\u0631\u0648\u0632\u0647\u0627\u06CC \u0648\u0635\u0648\u0644 = (\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \xF7 \u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635) \xD7 \u06F3\u06F6\u06F5"},example:{en:"(20,000 \xF7 365,000) \xD7 365 = 20 days",fa:"(\u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F3\u06F6\u06F5\u066C\u06F0\u06F0\u06F0) \xD7 \u06F3\u06F6\u06F5 = \u06F2\u06F0 \u0631\u0648\u0632"}}]},{id:7,title:{en:"Accounting for Receivables",fa:"\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC"},summary:{en:["Accounts receivable are amounts customers owe from credit sales. Some of it is never collected; these are bad debts.","Direct write-off method: when we are sure a customer will not pay, we debit Bad Debts Expense and credit Accounts Receivable. It is simple but only allowed when amounts are immaterial.","Allowance method: at period-end we estimate the amount that will not be collected and record it (debit Bad Debts Expense / credit Allowance for Doubtful Accounts). Later, when a customer's account is written off, we debit the Allowance and credit Accounts Receivable, with no expense.","There are three ways to estimate: percent of sales (gives the expense directly), percent of receivables, and aging of receivables (both give the required allowance balance, so the current allowance balance must be considered).","A note receivable is a written promise to pay with interest. Interest = Principal \xD7 Rate \xD7 Time. A note paid at maturity is honored; one not paid is dishonored and goes back to Accounts Receivable."],fa:["\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u067E\u0648\u0644\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0645\u0634\u062A\u0631\u06CC\u200C\u0647\u0627 \u0628\u0627\u0628\u062A \u0641\u0631\u0648\u0634 \u0646\u0633\u06CC\u0647 \u0628\u0647 \u0634\u0631\u06A9\u062A \u0628\u062F\u0647\u06A9\u0627\u0631\u0646\u062F. \u0647\u0645\u06CC\u0634\u0647 \u0628\u062E\u0634\u06CC \u0627\u0632 \u0622\u0646 \u0648\u0635\u0648\u0644 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0628\u0647 \u0622\u0646 \xAB\u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0633\u0648\u062E\u062A\u200C\u0634\u062F\u0647\xBB \u0645\u06CC\u200C\u06AF\u0648\u06CC\u0646\u062F.","\u0631\u0648\u0634 \u062D\u0630\u0641 \u0645\u0633\u062A\u0642\u06CC\u0645: \u0647\u0631 \u0648\u0642\u062A \u0645\u0637\u0645\u0626\u0646 \u0634\u062F\u06CC\u0645 \u067E\u0648\u0644 \u06CC\u06A9 \u0645\u0634\u062A\u0631\u06CC \u0646\u0645\u06CC\u200C\u0622\u06CC\u062F\u060C \u0647\u0645\u0627\u0646 \u0645\u0648\u0642\u0639 \u0647\u0632\u06CC\u0646\u0647\u0654 \u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0633\u0648\u062E\u062A\u200C\u0634\u062F\u0647 \u0631\u0627 \u0628\u062F\u0647\u06A9\u0627\u0631 \u0648 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u0631\u0627 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645. \u0633\u0627\u062F\u0647 \u0627\u0633\u062A\u060C \u0648\u0644\u06CC \u0641\u0642\u0637 \u0648\u0642\u062A\u06CC \u0645\u062C\u0627\u0632 \u0627\u0633\u062A \u06A9\u0647 \u0645\u0628\u0644\u063A\u200C\u0647\u0627 \u06A9\u0648\u0686\u06A9 \u0628\u0627\u0634\u0646\u062F.","\u0631\u0648\u0634 \u0630\u062E\u06CC\u0631\u0647: \u0622\u062E\u0631 \u062F\u0648\u0631\u0647 \u0645\u0628\u0644\u063A\u06CC \u0631\u0627 \u06A9\u0647 \u0627\u062D\u062A\u0645\u0627\u0644\u0627\u064B \u0648\u0635\u0648\u0644 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F \u062A\u062E\u0645\u06CC\u0646 \u0645\u06CC\u200C\u0632\u0646\u06CC\u0645 \u0648 \u062B\u0628\u062A \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645 (\u0647\u0632\u06CC\u0646\u0647\u0654 \u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0633\u0648\u062E\u062A\u200C\u0634\u062F\u0647 \u0628\u062F\u0647\u06A9\u0627\u0631 / \u0630\u062E\u06CC\u0631\u0647 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631). \u0628\u0639\u062F\u0627\u064B \u0648\u0642\u062A\u06CC \u062D\u0633\u0627\u0628 \u06CC\u06A9 \u0645\u0634\u062A\u0631\u06CC \u062D\u0630\u0641 \u0645\u06CC\u200C\u0634\u0648\u062F\u060C \u0630\u062E\u06CC\u0631\u0647 \u0628\u062F\u0647\u06A9\u0627\u0631 \u0648 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631 \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0647\u06CC\u0686 \u0647\u0632\u06CC\u0646\u0647\u200C\u0627\u06CC \u062B\u0628\u062A \u0646\u0645\u06CC\u200C\u0634\u0648\u062F.","\u062A\u062E\u0645\u06CC\u0646 \u0633\u0647 \u0631\u0648\u0634 \u062F\u0627\u0631\u062F: \u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u0641\u0631\u0648\u0634 (\u0645\u0633\u062A\u0642\u06CC\u0645\u0627\u064B \u0647\u0632\u06CC\u0646\u0647 \u0631\u0627 \u0645\u06CC\u200C\u062F\u0647\u062F)\u060C \u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627\u060C \u0648 \u0633\u0646\u06CC \u06A9\u0631\u062F\u0646 \u062D\u0633\u0627\u0628\u200C\u0647\u0627 (\u0647\u0631 \u062F\u0648\u060C \u0645\u0627\u0646\u062F\u0647\u0654 \u0644\u0627\u0632\u0645 \u0630\u062E\u06CC\u0631\u0647 \u0631\u0627 \u0645\u06CC\u200C\u062F\u0647\u0646\u062F \u0648 \u0628\u0627\u06CC\u062F \u0645\u0627\u0646\u062F\u0647\u0654 \u0641\u0639\u0644\u06CC \u0630\u062E\u06CC\u0631\u0647 \u0631\u0627 \u062F\u0631 \u0646\u0638\u0631 \u06AF\u0631\u0641\u062A).","\u0627\u0633\u0646\u0627\u062F \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u0642\u0648\u0644 \u06A9\u062A\u0628\u06CC \u067E\u0631\u062F\u0627\u062E\u062A \u0628\u0627 \u0628\u0647\u0631\u0647 \u0627\u0633\u062A. \u0628\u0647\u0631\u0647 = \u0627\u0635\u0644 \xD7 \u0646\u0631\u062E \xD7 \u0645\u062F\u062A. \u0627\u06AF\u0631 \u0633\u0646\u062F \u0633\u0631 \u0645\u0648\u0639\u062F \u067E\u0631\u062F\u0627\u062E\u062A \u0634\u0648\u062F \xAB\u0648\u0635\u0648\u0644\u200C\u0634\u062F\u0647\xBB \u0648 \u0627\u06AF\u0631 \u0646\u0634\u0648\u062F \xAB\u0646\u06A9\u0648\u0644\u200C\u0634\u062F\u0647\xBB \u0627\u0633\u062A \u0648 \u0628\u0647 \u062D\u0633\u0627\u0628 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u0628\u0631\u0645\u06CC\u200C\u06AF\u0631\u062F\u062F."]},formulas:[{name:{en:"Realizable value",fa:"\u0627\u0631\u0632\u0634 \u0642\u0627\u0628\u0644 \u0628\u0627\u0632\u06CC\u0627\u0641\u062A"},formula:{en:"Realizable value = Accounts receivable \u2212 Allowance for doubtful accounts",fa:"\u0627\u0631\u0632\u0634 \u0642\u0627\u0628\u0644 \u0628\u0627\u0632\u06CC\u0627\u0641\u062A = \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u2212 \u0630\u062E\u06CC\u0631\u0647\u0654 \u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0645\u0634\u06A9\u0648\u06A9\u200C\u0627\u0644\u0648\u0635\u0648\u0644"},example:{en:"200,000 \u2212 2,400 = 197,600",fa:"\u06F2\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F4\u06F0\u06F0 = \u06F1\u06F9\u06F7\u066C\u06F6\u06F0\u06F0"}},{name:{en:"Percent of sales method",fa:"\u0631\u0648\u0634 \u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u0641\u0631\u0648\u0634"},formula:{en:"Bad debts expense = Credit sales \xD7 Percent",fa:"\u0647\u0632\u06CC\u0646\u0647\u0654 \u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0633\u0648\u062E\u062A\u200C\u0634\u062F\u0647 = \u0641\u0631\u0648\u0634 \u0646\u0633\u06CC\u0647 \xD7 \u062F\u0631\u0635\u062F"},example:{en:"400,000 \xD7 0.6% = 2,400",fa:"\u06F4\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \xD7 \u06F0\u066B\u06F6\u066A = \u06F2\u066C\u06F4\u06F0\u06F0"}},{name:{en:"Percent of receivables (credit allowance balance)",fa:"\u0631\u0648\u0634 \u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 (\u0645\u0627\u0646\u062F\u0647\u0654 \u0630\u062E\u06CC\u0631\u0647 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631)"},formula:{en:"Entry = Required allowance \u2212 Current credit balance",fa:"\u062B\u0628\u062A = \u0645\u0627\u0646\u062F\u0647\u0654 \u0644\u0627\u0632\u0645 \u0630\u062E\u06CC\u0631\u0647 \u2212 \u0645\u0627\u0646\u062F\u0647\u0654 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631 \u0641\u0639\u0644\u06CC"},example:{en:"Required 2,500, current 200 credit \u2192 entry 2,300",fa:"\u0644\u0627\u0632\u0645 \u06F2\u066C\u06F5\u06F0\u06F0\u060C \u0641\u0639\u0644\u06CC \u06F2\u06F0\u06F0 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631 \u2190 \u062B\u0628\u062A \u06F2\u066C\u06F3\u06F0\u06F0"}},{name:{en:"When the allowance has a debit balance",fa:"\u0648\u0642\u062A\u06CC \u0645\u0627\u0646\u062F\u0647\u0654 \u0630\u062E\u06CC\u0631\u0647 \u0628\u062F\u0647\u06A9\u0627\u0631 \u0627\u0633\u062A"},formula:{en:"Entry = Required allowance + Current debit balance",fa:"\u062B\u0628\u062A = \u0645\u0627\u0646\u062F\u0647\u0654 \u0644\u0627\u0632\u0645 \u0630\u062E\u06CC\u0631\u0647 + \u0645\u0627\u0646\u062F\u0647\u0654 \u0628\u062F\u0647\u06A9\u0627\u0631 \u0641\u0639\u0644\u06CC"},example:{en:"Required 2,228, current 500 debit \u2192 entry 2,728",fa:"\u0644\u0627\u0632\u0645 \u06F2\u066C\u06F2\u06F2\u06F8\u060C \u0641\u0639\u0644\u06CC \u06F5\u06F0\u06F0 \u0628\u062F\u0647\u06A9\u0627\u0631 \u2190 \u062B\u0628\u062A \u06F2\u066C\u06F7\u06F2\u06F8"}},{name:{en:"Note interest",fa:"\u0628\u0647\u0631\u0647\u0654 \u0633\u0646\u062F"},formula:{en:"Interest = Principal \xD7 Annual rate \xD7 (Time \xF7 12 months or 360 days)",fa:"\u0628\u0647\u0631\u0647 = \u0627\u0635\u0644 \xD7 \u0646\u0631\u062E \u0633\u0627\u0644\u0627\u0646\u0647 \xD7 (\u0645\u062F\u062A \xF7 \u06F1\u06F2 \u0645\u0627\u0647 \u06CC\u0627 \u06F3\u06F6\u06F0 \u0631\u0648\u0632)"},example:{en:"10,000 \xD7 12% \xD7 (90 \xF7 360) = 300",fa:"\u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \xD7 \u06F1\u06F2\u066A \xD7 (\u06F9\u06F0\xF7\u06F3\u06F6\u06F0) = \u06F3\u06F0\u06F0"}},{name:{en:"Accounts receivable turnover",fa:"\u06AF\u0631\u062F\u0634 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627"},formula:{en:"Turnover = Net sales \xF7 Average accounts receivable",fa:"\u06AF\u0631\u062F\u0634 = \u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635 \xF7 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC"},example:{en:"600,000 \xF7 50,000 = 12 times",fa:"\u06F6\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F5\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F1\u06F2 \u0628\u0627\u0631"}}]},{id:8,title:{en:"Accounting for Long-Term Assets",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC \u0628\u0644\u0646\u062F\u0645\u062F\u062A"},summary:{en:["Plant assets (land, buildings, equipment) are tangible and used in operations for more than one year. Their cost includes all costs to get them ready for use, such as shipping, installation, and testing. Land is not depreciated.","If several assets are bought together for one price (a lump-sum purchase), the price is split based on each asset's market value.","There are three depreciation methods: straight-line (same amount each year), units-of-production (based on usage), and double-declining-balance (more in early years). Declining-balance ignores salvage value in the rate, but book value must never go below salvage value.","Revenue expenditures (normal repairs) are expensed; capital expenditures (that extend life or capacity) are added to the asset's cost. A change in estimated life or salvage value affects only the remaining years.","When an asset is discarded or sold, first update depreciation to the disposal date. If cash received is more than book value, there is a gain; if less, a loss. Natural resources are expensed through depletion and intangible assets (like patents) through amortization."],fa:["\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC \u062B\u0627\u0628\u062A (\u0645\u062B\u0644 \u0632\u0645\u06CC\u0646\u060C \u0633\u0627\u062E\u062A\u0645\u0627\u0646\u060C \u062A\u062C\u0647\u06CC\u0632\u0627\u062A) \u0645\u0644\u0645\u0648\u0633\u200C\u0627\u0646\u062F \u0648 \u0628\u06CC\u0634 \u0627\u0632 \u06CC\u06A9 \u0633\u0627\u0644 \u062F\u0631 \u06A9\u0627\u0631 \u0634\u0631\u06A9\u062A \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F. \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647\u0654 \u0622\u0646\u200C\u0647\u0627 \u0634\u0627\u0645\u0644 \u0647\u0645\u0647\u0654 \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627\u06CC \u0644\u0627\u0632\u0645 \u0628\u0631\u0627\u06CC \u0622\u0645\u0627\u062F\u0647 \u0634\u062F\u0646\u0634\u0627\u0646 \u0627\u0633\u062A\u060C \u0645\u062B\u0644 \u062D\u0645\u0644\u060C \u0646\u0635\u0628 \u0648 \u0622\u0632\u0645\u0627\u06CC\u0634. \u0632\u0645\u06CC\u0646 \u0645\u0633\u062A\u0647\u0644\u06A9 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F.","\u0627\u06AF\u0631 \u0686\u0646\u062F \u062F\u0627\u0631\u0627\u06CC\u06CC \u0628\u0627 \u0647\u0645 \u0628\u0647 \u06CC\u06A9 \u0642\u06CC\u0645\u062A \u062E\u0631\u06CC\u062F\u0647 \u0634\u0648\u0646\u062F\u060C \u0642\u06CC\u0645\u062A \u0628\u0647 \u0646\u0633\u0628\u062A \u0627\u0631\u0632\u0634 \u0628\u0627\u0632\u0627\u0631 \u0647\u0631 \u06A9\u062F\u0627\u0645 \u0628\u06CC\u0646 \u0622\u0646\u200C\u0647\u0627 \u062A\u0642\u0633\u06CC\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F.","\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0647 \u0631\u0648\u0634 \u062F\u0627\u0631\u062F: \u062E\u0637 \u0645\u0633\u062A\u0642\u06CC\u0645 (\u0647\u0631 \u0633\u0627\u0644 \u06CC\u06A9 \u0645\u0628\u0644\u063A)\u060C \u0648\u0627\u062D\u062F \u062A\u0648\u0644\u06CC\u062F (\u0628\u0631 \u0627\u0633\u0627\u0633 \u0645\u06CC\u0632\u0627\u0646 \u0627\u0633\u062A\u0641\u0627\u062F\u0647)\u060C \u0648 \u0646\u0632\u0648\u0644\u06CC \u0645\u0636\u0627\u0639\u0641 (\u0633\u0627\u0644\u200C\u0647\u0627\u06CC \u0627\u0648\u0644 \u0628\u06CC\u0634\u062A\u0631). \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0646\u0632\u0648\u0644\u06CC \u0627\u0631\u0632\u0634 \u0627\u0633\u0642\u0627\u0637 \u0631\u0627 \u062F\u0631 \u0646\u0631\u062E \u0644\u062D\u0627\u0638 \u0646\u0645\u06CC\u200C\u06A9\u0646\u062F\u060C \u0648\u0644\u06CC \u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u0647\u0631\u06AF\u0632 \u0646\u0628\u0627\u06CC\u062F \u0632\u06CC\u0631 \u0627\u0631\u0632\u0634 \u0627\u0633\u0642\u0627\u0637 \u0628\u0631\u0648\u062F.","\u0645\u062E\u0627\u0631\u062C \u062F\u0631\u0622\u0645\u062F\u06CC (\u062A\u0639\u0645\u06CC\u0631\u0627\u062A \u0639\u0627\u062F\u06CC) \u0647\u0632\u06CC\u0646\u0647 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F\u061B \u0645\u062E\u0627\u0631\u062C \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u0627\u06CC (\u06A9\u0647 \u0639\u0645\u0631 \u06CC\u0627 \u0638\u0631\u0641\u06CC\u062A \u0631\u0627 \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F) \u0628\u0647 \u0628\u0647\u0627\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC \u0627\u0636\u0627\u0641\u0647 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F. \u062A\u063A\u06CC\u06CC\u0631 \u062F\u0631 \u062A\u062E\u0645\u06CC\u0646 \u0639\u0645\u0631 \u06CC\u0627 \u0627\u0631\u0632\u0634 \u0627\u0633\u0642\u0627\u0637 \u0641\u0642\u0637 \u0631\u0648\u06CC \u0633\u0627\u0644\u200C\u0647\u0627\u06CC \u0628\u0627\u0642\u06CC\u200C\u0645\u0627\u0646\u062F\u0647 \u0627\u062B\u0631 \u062F\u0627\u0631\u062F.","\u062F\u0631 \u06A9\u0646\u0627\u0631 \u06AF\u0630\u0627\u0634\u062A\u0646 \u06CC\u0627 \u0641\u0631\u0648\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC\u060C \u0627\u0648\u0644 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u062A\u0627 \u062A\u0627\u0631\u06CC\u062E \u0641\u0631\u0648\u0634 \u0628\u0647\u200C\u0631\u0648\u0632 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0627\u06AF\u0631 \u067E\u0648\u0644 \u062F\u0631\u06CC\u0627\u0641\u062A\u06CC \u0627\u0632 \u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u0628\u06CC\u0634\u062A\u0631 \u0628\u0627\u0634\u062F \u0633\u0648\u062F\u060C \u0648 \u0627\u06AF\u0631 \u06A9\u0645\u062A\u0631 \u0628\u0627\u0634\u062F \u0632\u06CC\u0627\u0646 \u0627\u0633\u062A. \u0645\u0646\u0627\u0628\u0639 \u0637\u0628\u06CC\u0639\u06CC \u0628\u0627 \u062A\u062E\u0644\u06CC\u0647 \u0648 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC \u0646\u0627\u0645\u0634\u0647\u0648\u062F (\u0645\u062B\u0644 \u062D\u0642 \u0627\u062E\u062A\u0631\u0627\u0639) \u0628\u0627 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0646\u0627\u0645\u0634\u0647\u0648\u062F \u0647\u0632\u06CC\u0646\u0647 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F."]},formulas:[{name:{en:"Straight-line",fa:"\u062E\u0637 \u0645\u0633\u062A\u0642\u06CC\u0645"},formula:{en:"Annual depreciation = (Cost \u2212 Salvage) \xF7 Useful life",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644\u0627\u0646\u0647 = (\u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647 \u2212 \u0627\u0631\u0632\u0634 \u0627\u0633\u0642\u0627\u0637) \xF7 \u0633\u0627\u0644\u200C\u0647\u0627\u06CC \u0639\u0645\u0631"},example:{en:"(10,000 \u2212 1,000) \xF7 5 = 1,800",fa:"(\u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u066C\u06F0\u06F0\u06F0) \xF7 \u06F5 = \u06F1\u066C\u06F8\u06F0\u06F0"}},{name:{en:"Units-of-production",fa:"\u0648\u0627\u062D\u062F \u062A\u0648\u0644\u06CC\u062F"},formula:{en:"Per unit = (Cost \u2212 Salvage) \xF7 Total units; yearly = Per unit \xD7 Units this year",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0647\u0631 \u0648\u0627\u062D\u062F = (\u0628\u0647\u0627 \u2212 \u0627\u0633\u0642\u0627\u0637) \xF7 \u06A9\u0644 \u0648\u0627\u062D\u062F\u0647\u0627\u06CC \u062A\u0648\u0644\u06CC\u062F\u061B \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644 = \u0648\u0627\u062D\u062F \xD7 \u062A\u0648\u0644\u06CC\u062F \u0627\u0645\u0633\u0627\u0644"},example:{en:"(10,000 \u2212 1,000) \xF7 36,000 = 0.25; 7,000 \xD7 0.25 = 1,750",fa:"(\u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u066C\u06F0\u06F0\u06F0) \xF7 \u06F3\u06F6\u066C\u06F0\u06F0\u06F0 = \u06F0\u066B\u06F2\u06F5\u061B \u06F7\u066C\u06F0\u06F0\u06F0 \xD7 \u06F0\u066B\u06F2\u06F5 = \u06F1\u066C\u06F7\u06F5\u06F0"}},{name:{en:"Double-declining-balance",fa:"\u0646\u0632\u0648\u0644\u06CC \u0645\u0636\u0627\u0639\u0641"},formula:{en:"Rate = 2 \xF7 Useful life; yearly = Beginning book value \xD7 Rate",fa:"\u0646\u0631\u062E = \u06F2 \xF7 \u0633\u0627\u0644\u200C\u0647\u0627\u06CC \u0639\u0645\u0631\u061B \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644 = \u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u0627\u0648\u0644 \u0633\u0627\u0644 \xD7 \u0646\u0631\u062E"},example:{en:"5-year life \u2192 40%; year 1: 10,000 \xD7 40% = 4,000",fa:"\u0639\u0645\u0631 \u06F5 \u0633\u0627\u0644 \u2190 \u06F4\u06F0\u066A\u061B \u0633\u0627\u0644 \u0627\u0648\u0644: \u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \xD7 \u06F4\u06F0\u066A = \u06F4\u066C\u06F0\u06F0\u06F0"}},{name:{en:"Partial-year depreciation",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0628\u062E\u0634\u06CC \u0627\u0632 \u0633\u0627\u0644"},formula:{en:"Depreciation = Annual depreciation \xD7 (Months used \xF7 12)",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 = \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644\u0627\u0646\u0647 \xD7 (\u0645\u0627\u0647\u200C\u0647\u0627\u06CC \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \xF7 \u06F1\u06F2)"},example:{en:"1,800 \xD7 3/12 = 450",fa:"\u06F1\u066C\u06F8\u06F0\u06F0 \xD7 \u06F3/\u06F1\u06F2 = \u06F4\u06F5\u06F0"}},{name:{en:"Change in estimate",fa:"\u062A\u063A\u06CC\u06CC\u0631 \u062F\u0631 \u062A\u062E\u0645\u06CC\u0646"},formula:{en:"New depreciation = (Book value \u2212 New salvage) \xF7 Remaining years",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u062C\u062F\u06CC\u062F = (\u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u2212 \u0627\u0633\u0642\u0627\u0637 \u062C\u062F\u06CC\u062F) \xF7 \u0633\u0627\u0644\u200C\u0647\u0627\u06CC \u0628\u0627\u0642\u06CC\u200C\u0645\u0627\u0646\u062F\u0647"},example:{en:"(6,400 \u2212 500) \xF7 3 \u2248 1,967",fa:"(\u06F6\u066C\u06F4\u06F0\u06F0 \u2212 \u06F5\u06F0\u06F0) \xF7 \u06F3 \u2248 \u06F1\u066C\u06F9\u06F6\u06F7"}},{name:{en:"Gain or loss on sale",fa:"\u0633\u0648\u062F \u06CC\u0627 \u0632\u06CC\u0627\u0646 \u0641\u0631\u0648\u0634"},formula:{en:"Gain (loss) = Cash received \u2212 Book value",fa:"\u0633\u0648\u062F (\u0632\u06CC\u0627\u0646) = \u067E\u0648\u0644 \u062F\u0631\u06CC\u0627\u0641\u062A\u06CC \u2212 \u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC"},example:{en:"Received 3,000, book value 2,000 \u2192 gain 1,000",fa:"\u062F\u0631\u06CC\u0627\u0641\u062A\u06CC \u06F3\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u06F2\u066C\u06F0\u06F0\u06F0 \u2190 \u0633\u0648\u062F \u06F1\u066C\u06F0\u06F0\u06F0"}},{name:{en:"Depletion",fa:"\u062A\u062E\u0644\u06CC\u0647\u0654 \u0645\u0646\u0627\u0628\u0639 \u0637\u0628\u06CC\u0639\u06CC"},formula:{en:"Per unit = (Cost \u2212 Salvage) \xF7 Total units; yearly = Per unit \xD7 Units extracted",fa:"\u062A\u062E\u0644\u06CC\u0647\u0654 \u0647\u0631 \u0648\u0627\u062D\u062F = (\u0628\u0647\u0627 \u2212 \u0627\u0633\u0642\u0627\u0637) \xF7 \u06A9\u0644 \u0648\u0627\u062D\u062F\u0647\u0627\u061B \u0647\u0632\u06CC\u0646\u0647\u0654 \u0633\u0627\u0644 = \u0648\u0627\u062D\u062F \xD7 \u0627\u0633\u062A\u062E\u0631\u0627\u062C \u0627\u0645\u0633\u0627\u0644"},example:{en:"500,000 \xF7 250,000 tons = 2 \u2192 85,000 \xD7 2 = 170,000",fa:"\u06F5\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F2\u06F5\u06F0\u066C\u06F0\u06F0\u06F0 \u062A\u0646 = \u06F2 \u2190 \u06F8\u06F5\u066C\u06F0\u06F0\u06F0 \xD7 \u06F2 = \u06F1\u06F7\u06F0\u066C\u06F0\u06F0\u06F0"}},{name:{en:"Total asset turnover",fa:"\u06AF\u0631\u062F\u0634 \u06A9\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"},formula:{en:"Turnover = Net sales \xF7 Average total assets",fa:"\u06AF\u0631\u062F\u0634 = \u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635 \xF7 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u06A9\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"},example:{en:"400,000 \xF7 200,000 = 2",fa:"\u06F4\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F2\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F2"}}]},{id:9,title:{en:"Accounting for Current Liabilities",fa:"\u0628\u062F\u0647\u06CC\u200C\u0647\u0627\u06CC \u062C\u0627\u0631\u06CC"},summary:{en:["A liability is an obligation to be paid in the future with cash, goods, or services. Current liabilities are due within one year (or one operating cycle); long-term liabilities are due later.","Known liabilities: accounts payable, sales taxes (collected from customers and owed to the government), unearned revenue (like concert tickets sold in advance), and short-term notes payable with interest.","Payroll: income taxes and FICA taxes are withheld from the employee's gross pay, and the employee receives net pay. The employer also pays its own share of FICA plus federal and state unemployment taxes, which are its expenses.","Estimated liabilities such as warranties and bonuses are recorded in the same period as the related sales or work, even if they are paid later.","A contingent liability (like a lawsuit) is recorded if it is probable and can be estimated; disclosed in the notes only if it is reasonably possible; and ignored if it is remote."],fa:["\u0628\u062F\u0647\u06CC \u062A\u0639\u0647\u062F\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0628\u0627\u06CC\u062F \u062F\u0631 \u0622\u06CC\u0646\u062F\u0647 \u0628\u0627 \u067E\u0648\u0644\u060C \u06A9\u0627\u0644\u0627 \u06CC\u0627 \u062E\u062F\u0645\u0627\u062A \u067E\u0631\u062F\u0627\u062E\u062A \u0634\u0648\u062F. \u0628\u062F\u0647\u06CC \u062C\u0627\u0631\u06CC \u0638\u0631\u0641 \u06CC\u06A9 \u0633\u0627\u0644 (\u06CC\u0627 \u06CC\u06A9 \u0686\u0631\u062E\u0647\u0654 \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC) \u067E\u0631\u062F\u0627\u062E\u062A \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0628\u062F\u0647\u06CC \u0628\u0644\u0646\u062F\u0645\u062F\u062A \u062F\u06CC\u0631\u062A\u0631.","\u0628\u062F\u0647\u06CC\u200C\u0647\u0627\u06CC \u0645\u0639\u0644\u0648\u0645: \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC\u060C \u0645\u0627\u0644\u06CC\u0627\u062A \u0641\u0631\u0648\u0634 (\u06A9\u0647 \u0634\u0631\u06A9\u062A \u0627\u0632 \u0645\u0634\u062A\u0631\u06CC \u0645\u06CC\u200C\u06AF\u06CC\u0631\u062F \u0648 \u0628\u0647 \u062F\u0648\u0644\u062A \u0645\u06CC\u200C\u062F\u0647\u0
