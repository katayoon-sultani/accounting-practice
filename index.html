0}],extra:["bad_debts","cash"],explanation:{en:"No expense is recorded when writing off an account under the allowance method.",fa:"\u062F\u0631 \u062D\u0630\u0641 \u062D\u0633\u0627\u0628 \u0628\u0627 \u0631\u0648\u0634 \u0630\u062E\u06CC\u0631\u0647\u060C \u0647\u0632\u06CC\u0646\u0647\u200C\u0627\u06CC \u062B\u0628\u062A \u0646\u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"c7-04",chapter:7,level:1,type:"fill",question:{en:"Accounts receivable are 200,000 and the allowance is 2,400. What is the realizable value?",fa:"\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u06F2\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u0648 \u0630\u062E\u06CC\u0631\u0647 \u06F2\u066C\u06F4\u06F0\u06F0 \u0627\u0633\u062A. \u0627\u0631\u0632\u0634 \u0642\u0627\u0628\u0644 \u0628\u0627\u0632\u06CC\u0627\u0641\u062A\u061F"},answer:197600,tolerance:.5,explanation:{en:"200,000 \u2212 2,400 = 197,600",fa:"\u06F2\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F4\u06F0\u06F0 = \u06F1\u06F9\u06F7\u066C\u06F6\u06F0\u06F0"}},{id:"c7-05",chapter:7,level:2,type:"fill",question:{en:"Credit sales are 400,000 and 0.6% are uncollectible. What is bad debts expense using percent of sales?",fa:"\u0641\u0631\u0648\u0634 \u0646\u0633\u06CC\u0647 \u06F4\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u0627\u0633\u062A \u0648 \u06F0\u066B\u06F6\u066A \u0622\u0646 \u0633\u0648\u062E\u062A \u0645\u06CC\u200C\u0634\u0648\u062F. \u0647\u0632\u06CC\u0646\u0647\u0654 \u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0633\u0648\u062E\u062A\u200C\u0634\u062F\u0647 \u0628\u0647 \u0631\u0648\u0634 \u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u0641\u0631\u0648\u0634\u061F"},answer:2400,tolerance:.5,explanation:{en:"400,000 \xD7 0.6% = 2,400",fa:"\u06F4\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \xD7 \u06F0\u066B\u06F6\u066A = \u06F2\u066C\u06F4\u06F0\u06F0"}},{id:"c7-06",chapter:7,level:2,type:"fill",question:{en:"The required allowance is 2,500 and the allowance now has a 200 credit balance. What is the adjusting entry amount?",fa:"\u0645\u0627\u0646\u062F\u0647\u0654 \u0644\u0627\u0632\u0645 \u0630\u062E\u06CC\u0631\u0647 \u06F2\u066C\u06F5\u06F0\u06F0 \u0627\u0633\u062A \u0648 \u0630\u062E\u06CC\u0631\u0647 \u0627\u0644\u0627\u0646 \u06F2\u06F0\u06F0 \u0645\u0627\u0646\u062F\u0647\u0654 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631 \u062F\u0627\u0631\u062F. \u0645\u0628\u0644\u063A \u062B\u0628\u062A \u0627\u0635\u0644\u0627\u062D\u06CC\u061F"},answer:2300,tolerance:.5,explanation:{en:"2,500 \u2212 200 = 2,300",fa:"\u06F2\u066C\u06F5\u06F0\u06F0 \u2212 \u06F2\u06F0\u06F0 = \u06F2\u066C\u06F3\u06F0\u06F0"}},{id:"c7-07",chapter:7,level:3,type:"fill",question:{en:"The required allowance is 2,228 and the allowance now has a 500 debit balance. What is the adjusting entry amount?",fa:"\u0645\u0627\u0646\u062F\u0647\u0654 \u0644\u0627\u0632\u0645 \u0630\u062E\u06CC\u0631\u0647 \u06F2\u066C\u06F2\u06F2\u06F8 \u0627\u0633\u062A \u0648 \u0630\u062E\u06CC\u0631\u0647 \u0627\u0644\u0627\u0646 \u06F5\u06F0\u06F0 \u0645\u0627\u0646\u062F\u0647\u0654 \u0628\u062F\u0647\u06A9\u0627\u0631 \u062F\u0627\u0631\u062F. \u0645\u0628\u0644\u063A \u062B\u0628\u062A \u0627\u0635\u0644\u0627\u062D\u06CC\u061F"},answer:2728,tolerance:.5,explanation:{en:"With a debit balance we add: 2,228 + 500 = 2,728",fa:"\u0628\u0627 \u0645\u0627\u0646\u062F\u0647\u0654 \u0628\u062F\u0647\u06A9\u0627\u0631 \u062C\u0645\u0639 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645: \u06F2\u066C\u06F2\u06F2\u06F8 + \u06F5\u06F0\u06F0 = \u06F2\u066C\u06F7\u06F2\u06F8"}},{id:"c7-08",chapter:7,level:2,type:"fill",question:{en:"A 10,000 note at 12% for 90 days (360-day year). What is the interest?",fa:"\u0633\u0646\u062F\u06CC \u0628\u0647 \u0645\u0628\u0644\u063A \u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \u0628\u0627 \u0646\u0631\u062E \u06F1\u06F2\u066A \u0628\u0631\u0627\u06CC \u06F9\u06F0 \u0631\u0648\u0632 (\u0633\u0627\u0644 \u06F3\u06F6\u06F0 \u0631\u0648\u0632\u0647). \u0628\u0647\u0631\u0647 \u0686\u0642\u062F\u0631 \u0627\u0633\u062A\u061F"},answer:300,tolerance:.5,explanation:{en:"10,000 \xD7 12% \xD7 90/360 = 300",fa:"\u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \xD7 \u06F1\u06F2\u066A \xD7 \u06F9\u06F0/\u06F3\u06F6\u06F0 = \u06F3\u06F0\u06F0"}},{id:"c7-09",chapter:7,level:3,type:"journal",question:{en:"A 90-day, 12%, 10,000 note was collected at maturity.",fa:"\u0633\u0646\u062F \u06F9\u06F0 \u0631\u0648\u0632\u0647\u0654 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \u0628\u0627 \u0646\u0631\u062E \u06F1\u06F2\u066A \u0633\u0631 \u0645\u0648\u0639\u062F \u0648\u0635\u0648\u0644 \u0634\u062F."},lines:[{account:"cash",side:"D",amount:10300},{account:"interest_rev",side:"C",amount:300},{account:"notes_rec",side:"C",amount:1e4}],extra:["ar","interest_rec"],explanation:{en:"The principal leaves Notes Receivable and the interest is revenue.",fa:"\u0627\u0635\u0644 \u0627\u0632 \u0627\u0633\u0646\u0627\u062F \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0628\u0647\u0631\u0647 \u062F\u0631\u0622\u0645\u062F \u0627\u0633\u062A."}},{id:"c7-10",chapter:7,level:3,type:"mcq",question:{en:"Which estimation method gives the EXPENSE amount directly, ignoring the current allowance balance?",fa:"\u06A9\u062F\u0627\u0645 \u0631\u0648\u0634 \u062A\u062E\u0645\u06CC\u0646 \xAB\u0645\u0633\u062A\u0642\u06CC\u0645\u0627\u064B \u0645\u0628\u0644\u063A \u0647\u0632\u06CC\u0646\u0647\xBB \u0631\u0627 \u0645\u06CC\u200C\u062F\u0647\u062F\u060C \u0628\u062F\u0648\u0646 \u062A\u0648\u062C\u0647 \u0628\u0647 \u0645\u0627\u0646\u062F\u0647\u0654 \u0641\u0639\u0644\u06CC \u0630\u062E\u06CC\u0631\u0647\u061F"},options:{en:["Percent of sales","Percent of receivables","Aging of receivables","Direct write-off"],fa:["\u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u0641\u0631\u0648\u0634","\u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627","\u0633\u0646\u06CC \u06A9\u0631\u062F\u0646 \u062D\u0633\u0627\u0628\u200C\u0647\u0627","\u062D\u0630\u0641 \u0645\u0633\u062A\u0642\u06CC\u0645"]},answer:0,explanation:{en:"Percent of sales is the income statement approach.",fa:"\u0631\u0648\u0634 \u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u0641\u0631\u0648\u0634 \u0631\u0648\u06CC\u06A9\u0631\u062F \u0635\u0648\u0631\u062A \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646 \u0627\u0633\u062A."}},{id:"c7-11",chapter:7,level:3,type:"fill",question:{en:"Net sales are 600,000 and average accounts receivable are 50,000. What is receivables turnover?",fa:"\u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635 \u06F6\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u0648 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u06F5\u06F0\u066C\u06F0\u06F0\u06F0. \u06AF\u0631\u062F\u0634 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627\u061F"},answer:12,tolerance:.5,explanation:{en:"600,000 \xF7 50,000 = 12",fa:"\u06F6\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F5\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F1\u06F2"}},{id:"c8-01",chapter:8,level:1,type:"mcq",question:{en:"Which asset is NOT depreciated?",fa:"\u06A9\u062F\u0627\u0645 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0645\u0633\u062A\u0647\u0644\u06A9 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},options:{en:["Building","Equipment","Land","Vehicle"],fa:["\u0633\u0627\u062E\u062A\u0645\u0627\u0646","\u062A\u062C\u0647\u06CC\u0632\u0627\u062A","\u0632\u0645\u06CC\u0646","\u0648\u0633\u06CC\u0644\u0647\u0654 \u0646\u0642\u0644\u06CC\u0647"]},answer:2,explanation:{en:"Land does not have a limited useful life.",fa:"\u0632\u0645\u06CC\u0646 \u0639\u0645\u0631 \u0645\u062D\u062F\u0648\u062F \u0646\u062F\u0627\u0631\u062F."}},{id:"c8-02",chapter:8,level:1,type:"fill",question:{en:"Machine price 9,000, shipping 300, installation 700. What is the cost?",fa:"\u0642\u06CC\u0645\u062A \u0645\u0627\u0634\u06CC\u0646 \u06F9\u066C\u06F0\u06F0\u06F0\u060C \u062D\u0645\u0644 \u06F3\u06F0\u06F0 \u0648 \u0646\u0635\u0628 \u06F7\u06F0\u06F0. \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647\u061F"},answer:1e4,tolerance:.5,explanation:{en:"All costs to get it ready for use: 10,000",fa:"\u0647\u0645\u0647\u0654 \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627\u06CC \u0644\u0627\u0632\u0645 \u0628\u0631\u0627\u06CC \u0622\u0645\u0627\u062F\u0647\u200C\u0633\u0627\u0632\u06CC: \u06F1\u06F0\u066C\u06F0\u06F0\u06F0"}},{id:"c8-03",chapter:8,level:1,type:"fill",question:{en:"Cost 10,000, salvage 1,000, life 5 years. What is annual straight-line depreciation?",fa:"\u0628\u0647\u0627 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0633\u0642\u0627\u0637 \u06F1\u066C\u06F0\u06F0\u06F0\u060C \u0639\u0645\u0631 \u06F5 \u0633\u0627\u0644. \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644\u0627\u0646\u0647\u0654 \u062E\u0637 \u0645\u0633\u062A\u0642\u06CC\u0645\u061F"},answer:1800,tolerance:.5,explanation:{en:"(10,000 \u2212 1,000) \xF7 5 = 1,800",fa:"(\u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u066C\u06F0\u06F0\u06F0) \xF7 \u06F5 = \u06F1\u066C\u06F8\u06F0\u06F0"}},{id:"c8-04",chapter:8,level:2,type:"fill",question:{en:"Cost 10,000, salvage 1,000, total output 36,000 units. This year 7,000 units were produced. What is this year's units-of-production depreciation?",fa:"\u0628\u0647\u0627 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0633\u0642\u0627\u0637 \u06F1\u066C\u06F0\u06F0\u06F0\u060C \u06A9\u0644 \u062A\u0648\u0644\u06CC\u062F \u06F3\u06F6\u066C\u06F0\u06F0\u06F0 \u0648\u0627\u062D\u062F. \u0627\u0645\u0633\u0627\u0644 \u06F7\u066C\u06F0\u06F0\u06F0 \u0648\u0627\u062D\u062F \u062A\u0648\u0644\u06CC\u062F \u0634\u062F. \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0627\u0645\u0633\u0627\u0644 (\u0648\u0627\u062D\u062F \u062A\u0648\u0644\u06CC\u062F)\u061F"},answer:1750,tolerance:.5,explanation:{en:"Rate = 9,000 \xF7 36,000 = 0.25; 7,000 \xD7 0.25 = 1,750",fa:"\u0646\u0631\u062E = \u06F9\u066C\u06F0\u06F0\u06F0 \xF7 \u06F3\u06F6\u066C\u06F0\u06F0\u06F0 = \u06F0\u066B\u06F2\u06F5\u061B \u06F7\u066C\u06F0\u06F0\u06F0 \xD7 \u06F0\u066B\u06F2\u06F5 = \u06F1\u066C\u06F7\u06F5\u06F0"}},{id:"c8-05",chapter:8,level:2,type:"fill",question:{en:"Cost 10,000, salvage 1,000, life 5 years. What is first-year double-declining-balance depreciation?",fa:"\u0628\u0647\u0627 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0633\u0642\u0627\u0637 \u06F1\u066C\u06F0\u06F0\u06F0\u060C \u0639\u0645\u0631 \u06F5 \u0633\u0627\u0644. \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644 \u0627\u0648\u0644 \u0628\u0647 \u0631\u0648\u0634 \u0646\u0632\u0648\u0644\u06CC \u0645\u0636\u0627\u0639\u0641\u061F"},answer:4e3,tolerance:.5,explanation:{en:"Rate = 2 \xF7 5 = 40%; 10,000 \xD7 40% = 4,000 (salvage is ignored in the rate)",fa:"\u0646\u0631\u062E = \u06F2\xF7\u06F5 = \u06F4\u06F0\u066A\u061B \u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \xD7 \u06F4\u06F0\u066A = \u06F4\u066C\u06F0\u06F0\u06F0 (\u0627\u0633\u0642\u0627\u0637 \u062F\u0631 \u0646\u0631\u062E \u0644\u062D\u0627\u0638 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F)"}},{id:"c8-06",chapter:8,level:3,type:"fill",question:{en:"Same asset (cost 10,000, 5-year life, double-declining-balance): what is second-year depreciation?",fa:"\u0647\u0645\u0627\u0646 \u062F\u0627\u0631\u0627\u06CC\u06CC (\u0628\u0647\u0627 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0639\u0645\u0631 \u06F5 \u0633\u0627\u0644\u060C \u0646\u0632\u0648\u0644\u06CC \u0645\u0636\u0627\u0639\u0641): \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644 \u062F\u0648\u0645\u061F"},answer:2400,tolerance:.5,explanation:{en:"Book value at the start of year 2 = 6,000; \xD7 40% = 2,400",fa:"\u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u0627\u0648\u0644 \u0633\u0627\u0644 \u062F\u0648\u0645 = \u06F6\u066C\u06F0\u06F0\u06F0\u061B \xD7 \u06F4\u06F0\u066A = \u06F2\u066C\u06F4\u06F0\u06F0"}},{id:"c8-07",chapter:8,level:2,type:"fill",question:{en:"Annual depreciation is 1,800 and the asset was bought on October 1. What is depreciation for the first year (to December 31)?",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644\u0627\u0646\u0647 \u06F1\u066C\u06F8\u06F0\u06F0 \u0627\u0633\u062A \u0648 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0627\u0648\u0644 \u0627\u06A9\u062A\u0628\u0631 \u062E\u0631\u06CC\u062F\u0647 \u0634\u062F. \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644 \u0627\u0648\u0644 (\u062A\u0627 \u06F3\u06F1 \u062F\u0633\u0627\u0645\u0628\u0631)\u061F"},answer:450,tolerance:.5,explanation:{en:"1,800 \xD7 3/12 = 450",fa:"\u06F1\u066C\u06F8\u06F0\u06F0 \xD7 \u06F3/\u06F1\u06F2 = \u06F4\u06F5\u06F0"}},{id:"c8-08",chapter:8,level:2,type:"journal",question:{en:"Equipment costing 8,000 with accumulated depreciation of 6,000 was sold for 3,000 cash.",fa:"\u062A\u062C\u0647\u06CC\u0632\u0627\u062A\u06CC \u0628\u0627 \u0628\u0647\u0627\u06CC \u06F8\u066C\u06F0\u06F0\u06F0 \u0648 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0627\u0646\u0628\u0627\u0634\u062A\u0647\u0654 \u06F6\u066C\u06F0\u06F0\u06F0 \u0628\u0647 \u0645\u0628\u0644\u063A \u06F3\u066C\u06F0\u06F0\u06F0 \u0646\u0642\u062F \u0641\u0631\u0648\u062E\u062A\u0647 \u0634\u062F."},lines:[{account:"cash",side:"D",amount:3e3},{account:"accum_dep",side:"D",amount:6e3},{account:"equipment",side:"C",amount:8e3},{account:"gain_sale",side:"C",amount:1e3}],extra:["loss_sale","dep_exp"],explanation:{en:"Book value = 2,000; gain = 3,000 \u2212 2,000 = 1,000.",fa:"\u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC = \u06F2\u066C\u06F0\u06F0\u06F0\u061B \u0633\u0648\u062F = \u06F3\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F0\u06F0\u06F0 = \u06F1\u066C\u06F0\u06F0\u06F0."}},{id:"c8-09",chapter:8,level:3,type:"journal",question:{en:"Equipment costing 16,000 with accumulated depreciation of 12,000 was sold for 2,500 cash.",fa:"\u062A\u062C\u0647\u06CC\u0632\u0627\u062A\u06CC \u0628\u0627 \u0628\u0647\u0627\u06CC \u06F1\u06F6\u066C\u06F0\u06F0\u06F0 \u0648 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0627\u0646\u0628\u0627\u0634\u062A\u0647\u0654 \u06F1\u06F2\u066C\u06F0\u06F0\u06F0 \u0628\u0647 \u0645\u0628\u0644\u063A \u06F2\u066C\u06F5\u06F0\u06F0 \u0646\u0642\u062F \u0641\u0631\u0648\u062E\u062A\u0647 \u0634\u062F."},lines:[{account:"cash",side:"D",amount:2500},{account:"accum_dep",side:"D",amount:12e3},{account:"loss_sale",side:"D",amount:1500},{account:"equipment",side:"C",amount:16e3}],extra:["gain_sale","dep_exp"],explanation:{en:"Book value = 4,000; loss = 4,000 \u2212 2,500 = 1,500.",fa:"\u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC = \u06F4\u066C\u06F0\u06F0\u06F0\u061B \u0632\u06CC\u0627\u0646 = \u06F4\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F5\u06F0\u06F0 = \u06F1\u066C\u06F5\u06F0\u06F0."}},{id:"c8-10",chapter:8,level:3,type:"journal",question:{en:"This year's depletion on a mine is 170,000.",fa:"\u062A\u062E\u0644\u06CC\u0647\u0654 \u0627\u0645\u0633\u0627\u0644 \u06CC\u06A9 \u0645\u0639\u062F\u0646 \u06F1\u06F7\u06F0\u066C\u06F0\u06F0\u06F0 \u0645\u062D\u0627\u0633\u0628\u0647 \u0634\u062F."},lines:[{account:"depletion_exp",side:"D",amount:17e4},{account:"accum_depletion",side:"C",amount:17e4}],extra:["mineral","dep_exp"],explanation:{en:"Depletion, like depreciation, uses an accumulated account.",fa:"\u062A\u062E\u0644\u06CC\u0647 \u0645\u062B\u0644 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9\u060C \u0628\u0627 \u062D\u0633\u0627\u0628 \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"c8-11",chapter:8,level:3,type:"mcq",question:{en:"Replacing a machine's engine extends its life by 3 years. What kind of expenditure is it?",fa:"\u062A\u0639\u0648\u06CC\u0636 \u0645\u0648\u062A\u0648\u0631 \u06CC\u06A9 \u062F\u0633\u062A\u06AF\u0627\u0647 \u06A9\u0647 \u0639\u0645\u0631\u0634 \u0631\u0627 \u06F3 \u0633\u0627\u0644 \u0628\u06CC\u0634\u062A\u0631 \u0645\u06CC\u200C\u06A9\u0646\u062F\u060C \u0686\u0647 \u0646\u0648\u0639 \u0645\u062E\u0627\u0631\u062C\u06CC \u0627\u0633\u062A\u061F"},options:{en:["Revenue expenditure, expensed","Capital expenditure, added to the asset's cost","A loss","Revenue"],fa:["\u0645\u062E\u0627\u0631\u062C \u062F\u0631\u0622\u0645\u062F\u06CC\u060C \u0647\u0632\u06CC\u0646\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F","\u0645\u062E\u0627\u0631\u062C \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u0627\u06CC\u060C \u0628\u0647 \u0628\u0647\u0627\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC \u0627\u0636\u0627\u0641\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F","\u0632\u06CC\u0627\u0646","\u062F\u0631\u0622\u0645\u062F"]},answer:1,explanation:{en:"It extends the asset's life, so it is a capital expenditure.",fa:"\u0686\u0648\u0646 \u0639\u0645\u0631 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0631\u0627 \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u06A9\u0646\u062F\u060C \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u0627\u06CC \u0627\u0633\u062A."}},{id:"c9-01",chapter:9,level:1,type:"mcq",question:{en:"Which item is a current liability?",fa:"\u06A9\u062F\u0627\u0645 \u0645\u0648\u0631\u062F \u0628\u062F\u0647\u06CC \u062C\u0627\u0631\u06CC \u0627\u0633\u062A\u061F"},options:{en:["A 10-year loan","Accounts payable","20-year bonds","Building"],fa:["\u0648\u0627\u0645 \u06F1\u06F0 \u0633\u0627\u0644\u0647","\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC","\u0627\u0648\u0631\u0627\u0642 \u0642\u0631\u0636\u0647\u0654 \u06F2\u06F0 \u0633\u0627\u0644\u0647","\u0633\u0627\u062E\u062A\u0645\u0627\u0646"]},answer:1,explanation:{en:"Accounts payable are usually paid within weeks.",fa:"\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC \u0645\u0639\u0645\u0648\u0644\u0627\u064B \u0638\u0631\u0641 \u0686\u0646\u062F \u0647\u0641\u062A\u0647 \u067E\u0631\u062F\u0627\u062E\u062A \u0645\u06CC\u200C\u0634\u0648\u0646\u062F."}},{id:"c9-02",chapter:9,level:1,type:"j 645 \u062F\u0648 \u0628\u0631\u0627\u0628\u0631 \u0645\u06CC\u200C\u0634\u0648\u062F"]},answer:1,explanation:{en:"A split has no journal entry; only the number of shares and par value change.",fa:"\u062A\u062C\u0632\u06CC\u0647 \u062B\u0628\u062A \u0631\u0648\u0632\u0646\u0627\u0645\u0647 \u0646\u062F\u0627\u0631\u062F\u061B \u0641\u0642\u0637 \u062A\u0639\u062F\u0627\u062F \u0648 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u062A\u063A\u06CC\u06CC\u0631 \u0645\u06CC\u200C\u06A9\u0646\u062F."}},{id:"c11-08",chapter:11,level:3,type:"journal",question:{en:"The company bought back 500 of its own shares at $20 per share in cash.",fa:"\u0634\u0631\u06A9\u062A \u06F5\u06F0\u06F0 \u0633\u0647\u0645 \u062E\u0648\u062F\u0634 \u0631\u0627 \u0647\u0631 \u0633\u0647\u0645 \u06F2\u06F0 \u062F\u0644\u0627\u0631 \u0646\u0642\u062F \u067E\u0633 \u062E\u0631\u06CC\u062F."},lines:[{account:"treasury",side:"D",amount:1e4},{account:"cash",side:"C",amount:1e4}],extra:["common","retained"],explanation:{en:"Treasury stock reduces equity; it is not an asset.",fa:"\u0633\u0647\u0627\u0645 \u062E\u0632\u0627\u0646\u0647 \u0627\u0632 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F\u061B \u062F\u0627\u0631\u0627\u06CC\u06CC \u0646\u06CC\u0633\u062A."}},{id:"c11-09",chapter:11,level:3,type:"fill",question:{en:"Cumulative preferred stock of 100,000 at 9% has one year of dividends in arrears. This year 20,000 of dividends were declared. How much do common stockholders get?",fa:"\u0633\u0647\u0627\u0645 \u0645\u0645\u062A\u0627\u0632 \u0627\u0646\u0628\u0627\u0634\u062A\u0646\u06CC \u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u0628\u0627 \u0633\u0648\u062F \u06F9\u066A\u060C \u06CC\u06A9 \u0633\u0627\u0644 \u0633\u0648\u062F \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0646\u0634\u062F\u0647 \u062F\u0627\u0631\u062F. \u0627\u0645\u0633\u0627\u0644 \u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \u0633\u0648\u062F \u0627\u0639\u0644\u0627\u0645 \u0634\u062F. \u0633\u0647\u0645 \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC \u0686\u0642\u062F\u0631 \u0627\u0633\u062A\u061F"},answer:2e3,tolerance:.5,explanation:{en:"Preferred: 9,000 in arrears + 9,000 this year = 18,000; common: 20,000 \u2212 18,000 = 2,000",fa:"\u0645\u0645\u062A\u0627\u0632: \u06F9\u066C\u06F0\u06F0\u06F0 \u0633\u0627\u0644 \u0642\u0628\u0644 + \u06F9\u066C\u06F0\u06F0\u06F0 \u0627\u0645\u0633\u0627\u0644 = \u06F1\u06F8\u066C\u06F0\u06F0\u06F0\u061B \u0639\u0627\u062F\u06CC: \u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u06F8\u066C\u06F0\u06F0\u06F0 = \u06F2\u066C\u06F0\u06F0\u06F0"}},{id:"c11-10",chapter:11,level:3,type:"fill",question:{en:"Net income 100,000, preferred dividends 20,000, 40,000 common shares. What is EPS?",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u0645\u0645\u062A\u0627\u0632 \u06F2\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC \u06F4\u06F0\u066C\u06F0\u06F0\u06F0 \u0633\u0647\u0645. \u0633\u0648\u062F \u0647\u0631 \u0633\u0647\u0645\u061F"},answer:2,tolerance:.01,explanation:{en:"(100,000 \u2212 20,000) \xF7 40,000 = 2",fa:"(\u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u06F0\u066C\u06F0\u06F0\u06F0) \xF7 \u06F4\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F2"}},{id:"c11-11",chapter:11,level:3,type:"fill",question:{en:"The share price is 30 and EPS is 2. What is the price-earnings ratio?",fa:"\u0642\u06CC\u0645\u062A \u0633\u0647\u0645 \u06F3\u06F0 \u0648 \u0633\u0648\u062F \u0647\u0631 \u0633\u0647\u0645 \u06F2 \u0627\u0633\u062A. \u0646\u0633\u0628\u062A \u0642\u06CC\u0645\u062A \u0628\u0647 \u0633\u0648\u062F\u061F"},answer:15,tolerance:.5,explanation:{en:"30 \xF7 2 = 15",fa:"\u06F3\u06F0 \xF7 \u06F2 = \u06F1\u06F5"}},{id:"c12-01",chapter:12,level:1,type:"mcq",question:{en:"In which section of the statement of cash flows is buying equipment for cash reported?",fa:"\u062E\u0631\u06CC\u062F \u062A\u062C\u0647\u06CC\u0632\u0627\u062A \u0646\u0642\u062F\u06CC \u062F\u0631 \u06A9\u062F\u0627\u0645 \u0628\u062E\u0634 \u0635\u0648\u0631\u062A \u062C\u0631\u06CC\u0627\u0646 \u0648\u062C\u0648\u0647 \u0646\u0642\u062F \u0645\u06CC\u200C\u0622\u06CC\u062F\u061F"},options:{en:["Operating","Investing","Financing","Not reported"],fa:["\u0639\u0645\u0644\u06CC\u0627\u062A\u06CC","\u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC","\u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC","\u0646\u0645\u06CC\u200C\u0622\u06CC\u062F"]},answer:1,explanation:{en:"Buying and selling long-term assets \u2192 investing.",fa:"\u062E\u0631\u06CC\u062F \u0648 \u0641\u0631\u0648\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC \u0628\u0644\u0646\u062F\u0645\u062F\u062A \u2190 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC."}},{id:"c12-02",chapter:12,level:1,type:"mcq",question:{en:"In which section is paying dividends reported?",fa:"\u067E\u0631\u062F\u0627\u062E\u062A \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u062F\u0631 \u06A9\u062F\u0627\u0645 \u0628\u062E\u0634 \u0645\u06CC\u200C\u0622\u06CC\u062F\u061F"},options:{en:["Operating","Investing","Financing","Not reported"],fa:["\u0639\u0645\u0644\u06CC\u0627\u062A\u06CC","\u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC","\u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC","\u0646\u0645\u06CC\u200C\u0622\u06CC\u062F"]},answer:2,explanation:{en:"Transactions with owners and lenders \u2192 financing.",fa:"\u0645\u0639\u0627\u0645\u0644\u0627\u062A \u0628\u0627 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u0648 \u0648\u0627\u0645\u200C\u062F\u0647\u0646\u062F\u06AF\u0627\u0646 \u2190 \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC."}},{id:"c12-03",chapter:12,level:1,type:"mcq",question:{en:"In which section is cash received from customers reported?",fa:"\u062F 632\u0627\u06CC\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC \u062C\u0627\u0631\u06CC \u2190 \u06A9\u0645 \u06A9\u0646\u06CC\u062F."}},{id:"c12-07",chapter:12,level:2,type:"fill",question:{en:"Net income 38,000, depreciation 24,000, increase in receivables 2,000. What is operating cash flow?",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u06F3\u06F8\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u06F2\u06F4\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0641\u0632\u0627\u06CC\u0634 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u06F2\u066C\u06F0\u06F0\u06F0. \u062C\u0631\u06CC\u0627\u0646 \u0646\u0642\u062F \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC\u061F"},answer:6e4,tolerance:.5,explanation:{en:"38,000 + 24,000 \u2212 2,000 = 60,000",fa:"\u06F3\u06F8\u066C\u06F0\u06F0\u06F0 + \u06F2\u06F4\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F0\u06F0\u06F0 = \u06F6\u06F0\u066C\u06F0\u06F0\u06F0"}},{id:"c12-08",chapter:12,level:3,type:"fill",question:{en:"Net income 38,000, depreciation 24,000, loss on sale of assets 6,000, gain on sale of assets 16,000, increase in receivables 2,000, increase in payables 1,000. What is operating cash flow?",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u06F3\u06F8\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u06F2\u06F4\u066C\u06F0\u06F0\u06F0\u060C \u0632\u06CC\u0627\u0646 \u0641\u0631\u0648\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC \u06F6\u066C\u06F0\u06F0\u06F0\u060C \u0633\u0648\u062F \u0641\u0631\u0648\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC \u06F1\u06F6\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0641\u0632\u0627\u06CC\u0634 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u06F2\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0641\u0632\u0627\u06CC\u0634 \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC\u200C\u0647\u0627 \u06F1\u066C\u06F0\u06F0\u06F0. \u062C\u0631\u06CC\u0627\u0646 \u0646\u0642\u062F \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC\u061F"},answer:51e3,tolerance:.5,explanation:{en:"38,000 + 24,000 + 6,000 \u2212 16,000 \u2212 2,000 + 1,000 = 51,000",fa:"\u06F3\u06F8\u066C\u06F0\u06F0\u06F0 + \u06F2\u06F4\u066C\u06F0\u06F0\u06F0 + \u06F6\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u06F6\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F0\u06F0\u06F0 + \u06F1\u066C\u06F0\u06F0\u06F0 = \u06F5\u06F1\u066C\u06F0\u06F0\u06F0"}},{id:"c12-09",chapter:12,level:2,type:"fill",question:{en:"Operating cash flow 20,000, investing \u221215,000, financing 5,000. What is the net change in cash?",fa:"\u062C\u0631\u06CC\u0627\u0646 \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \u06F2\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC -\u06F1\u06F5\u066C\u06F0\u06F0\u06F0\u060C \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC \u06F5\u066C\u06F0\u06F0\u06F0. \u062A\u063A\u06CC\u06CC\u0631 \u062E\u0627\u0644\u0635 \u067E\u0648\u0644 \u0646\u0642\u062F\u061F"},answer:1e4,tolerance:.5,explanation:{en:"20,000 \u2212 15,000 + 5,000 = 10,000",fa:"\u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u06F5\u066C\u06F0\u06F0\u06F0 + \u06F5\u066C\u06F0\u06F0\u06F0 = \u06F1\u06F0\u066C\u06F0\u06F0\u06F0"}},{id:"c12-10",chapter:12,level:2,type:"fill",question:{en:"Beginning cash is 12,000 and the net change is 10,000. What is ending cash?",fa:"\u067E\u0648\u0644 \u0646\u0642\u062F \u0627\u0648\u0644 \u0633\u0627\u0644 \u06F1\u06F2\u066C\u06F0\u06F0\u06F0 \u0648 \u062A\u063A\u06CC\u06CC\u0631 \u062E\u0627\u0644\u0635 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0. \u067E\u0648\u0644 \u0646\u0642\u062F \u067E\u0627\u06CC\u0627\u0646 \u0633\u0627\u0644\u061F"},answer:22e3,tolerance:.5,explanation:{en:"12,000 + 10,000 = 22,000",fa:"\u06F1\u06F2\u066C\u06F0\u06F0\u06F0 + \u06F1\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F2\u06F2\u066C\u06F0\u06F0\u06F0"}},{id:"c12-11",chapter:12,level:3,type:"statement",question:{en:"Put each cash flow in the right section and compute the net change in cash. (Positive = cash 6F0\u066C\u06F0\u06F0\u06F0 + \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC (\u06F1\u06F2\u066C\u06F0\u06F0\u06F0\u2212) + \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC \u06F2\u066C\u06F0\u06F0\u06F0 = \u06F1\u06F0\u066C\u06F0\u06F0\u06F0"}}];var fm=[{id:"f1-01",chapter:1,front:{en:"Accounting Equation",fa:"\u0645\u0639\u0627\u062F\u0644\u0647\u0654 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC"},back:{en:"Assets = Liabilities + Equity",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 = \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 + \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645"}},{id:"f1-02",chapter:1,front:{en:"Asset",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC"},back:{en:"A resource the company owns that gives future benefit, like cash and equipment.",fa:"\u0645\u0646\u0628\u0639\u06CC \u06A9\u0647 \u0645\u0627\u0644 \u0634\u0631\u06A9\u062A \u0627\u0633\u062A \u0648 \u062F\u0631 \u0622\u06CC\u0646\u062F\u0647 \u0641\u0627\u06CC\u062F\u0647 \u062F\u0627\u0631\u062F\u060C \u0645\u062B\u0644 \u067E\u0648\u0644 \u0646\u0642\u062F \u0648 \u062A\u062C\u0647\u06CC\u0632\u0627\u062A."}},{id:"f1-03",chapter:1,front:{en:"Liability",fa:"\u0628\u062F\u0647\u06CC"},back:{en:"An obligation to pay others, like accounts payable.",fa:"\u062A\u0639\u0647\u062F \u0634\u0631\u06A9\u062A \u0628\u0647 \u067E\u0631\u062F\u0627\u062E\u062A \u0628\u0647 \u062F\u06CC\u06AF\u0631\u0627\u0646\u060C \u0645\u062B\u0644 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC."}},{id:"f1-04",chapter:1,front:{en:"Equity",fa:"\u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645"},back:{en:"The owners' claim on assets after subtracting liabilities.",fa:"\u0633\u0647\u0645 \u0635\u0627\u062D\u0628\u0627\u0646 \u0634\u0631\u06A9\u062A \u0627\u0632 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u060C \u0628\u0639\u062F \u0627\u0632 \u06A9\u0645 \u06A9\u0631\u062F\u0646 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627."}},{id:"f1-05",chapter:1,front:{en:"Cost Principle",fa:"\u0627\u0635\u0644 \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647"},back:{en:"Assets are recorded at the actual transaction price.",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0628\u0627 \u0642\u06CC\u0645\u062A \u0648\u0627\u0642\u0639\u06CC \u0645\u0639\u0627\u0645\u0644\u0647 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u0646\u062F."}},{id:"f1-06",chapter:1,front:{en:"Revenue Recognition Principle",fa:"\u0627\u0635\u0644 \u0634\u0646\u0627\u0633\u0627\u06CC\u06CC \u062F\u0631\u0622\u0645\u062F"},back:{en:"Revenue is recorded when the work is done.",fa:"\u062F\u0631\u0622\u0645\u062F \u0648\u0642\u062A\u06CC \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F \u06A9\u0647 \u06A9\u0627\u0631 \u0627\u0646\u062C\u0627\u0645 \u0634\u062F\u0647 \u0628\u0627\u0634\u062F."}},{id:"f1-07",chapter:1,front:{en:"Return on Assets",fa:"\u0628\u0627\u0632\u062F\u0647 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"},back:{en:"Net income \xF7 Average total assets",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \xF7 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u06A9\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"}},{id:"f1-08",chapter:1,front:{en:"External Users",fa:"\u0627\u0633\u062A\u0641\u0627\u062F\u0647\u200C\u06A9\u0646\u0646\u062F\u06AF\u0627\u0646 \u0628\u06CC\u0631\u0648\u0646\u06CC"},back:{en:"People outside the company, like shareholders and banks.",fa:"\u0627\u0641\u0631\u0627\u062F\u06CC \u0628\u06CC\u0631\u0648\u0646 \u0627\u0632 \u0634\u0631\u06A9\u062A\u060C \u0645\u062B\u0644 \u0633\u0647\u0627\u0645\u200C\u062F\u0627\u0631\u0627\u0646 \u0648 \u0628\u0627\u0646\u06A9\u200C\u0647\u0627."}},{id:"f2-01",chapter:2,front:{en:"Debit",fa:"\u0628\u062F\u0647\u06A9\u0627\u0631"},back:{en:"The left side of an account.",fa:"\u0633\u0645\u062A \u0686\u067E \u062D\u0633\u0627\u0628."}},{id:"f2-02",chapter:2,front:{en:"Credit",fa:"\u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631"},back:{en:"The right side of an account.",fa:"\u0633\u0645\u062A \u0631\u0627\u0633\u062A \u062D\u0633\u0627\u0628."}},{id:"f2-03",chapter:2,front:{en:"Double-Entry Accounting",fa:"\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062F\u0648\u0637\u0631\u0641\u0647"},back:{en:"Every transaction affects at least two accounts and debits = credits.",fa:"\u0647\u0631 \u0645\u0639\u0627\u0645\u0644\u0647 \u062D\u062F\u0627\u0642\u0644 \u062F\u0648 \u062D\u0633\u0627\u0628 \u0631\u0627 \u062A\u063A\u06CC\u06CC\u0631 \u0645\u06CC\u200C\u062F\u0647\u062F \u0648 \u0628\u062F\u0647\u06A9\u0627\u0631 = \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631."}},{id:"f2-04",chapter:2,front:{en:"Journal",fa:"\u062F\u0641\u062A\u0631 \u0631\u0648\u0632\u0646\u0627\u0645\u0647"},back:{en:"Where transactions are first recorded in date order.",fa:"\u062C\u0627\u06CC\u06CC \u06A9\u0647 \u0645\u0639\u0627\u0645\u0644\u0627\u062A \u0628\u0647 \u062A\u0631\u062A\u06CC\u0628 \u062A\u0627\u0631\u06CC\u062E \u0627\u0648\u0644 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u0646\u062F."}},{id:"f2-05",chapter:2,front:{en:"Ledger",fa:"\u062F\u0641\u062A\u0631 \u06A9\u0644"},back:{en:"The collection of all the company's accounts and their balances.",fa:"\u0645\u062C\u0645\u0648\u0639\u0647\u0654 \u0647\u0645\u0647\u0654 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u0634\u0631\u06A9\u062A \u0628\u0627 \u0645\u0627\u0646\u062F\u0647\u200C\u0647\u0627\u06CC\u0634\u0627\u0646."}},{id:"f2-06",chapter:2,front:{en:"Trial Balance",fa:"\u062A\u0631\u0627\u0632 \u0622\u0632\u0645\u0627\u06CC\u0634\u06CC"},back:{en:"A list of all account balances to check that debits equal credits.",fa:"\u0641\u0647\u0631\u0633\u062A \u0645\u0627\u0646\u062F\u0647\u200C\u0647\u0627\u06CC \u0647\u0645\u0647\u0654 \u062D\u0633\u0627\u0628\u200C\u0647\u0627 \u0628\u0631\u0627\u06CC \u0628\u0631\u0631\u0633\u06CC \u0628\u0631\u0627\u0628\u0631\u06CC \u0628\u062F\u0647\u06A9\u0627\u0631 \u0648 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631."}},{id:"f2-07",chapter:2,front:{en:"Normal Balance",fa:"\u0645\u0627\u0646\u062F\u0647\u0654 \u0639\u0627\u062F\u06CC"},back:{en:"The side that increases an account.",fa:"\u0637\u0631\u0641\u06CC \u06A9\u0647 \u062D\u0633\u0627\u0628 \u0628\u0627 \u0622\u0646 \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"f2-08",chapter:2,front:{en:"Debt Ratio",fa:"\u0646\u0633\u0628\u062A \u0628\u062F\u0647\u06CC"},back:{en:"Total liabilities \xF7 Total assets",fa:"\u06A9\u0644 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 \xF7 \u06A9\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"}},{id:"f3-01",chapter:3,front:{en:"Accrual Basis Accounting",fa:"\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062A\u0639\u0647\u062F\u06CC"},back:{en:"Recording revenues and expenses in the period they occur, not when cash moves.",fa:"\u062B\u0628\u062A \u062F\u0631\u0622\u0645\u062F \u0648 \u0647\u0632\u06CC\u0646\u0647 \u062F\u0631 \u062F\u0648\u0631\u0647\u0654 \u0648\u0642\u0648\u0639\u060C \u0646\u0647 \u0632\u0645\u0627\u0646 \u062C\u0627\u0628\u0647\u200C\u062C\u0627\u06CC\u06CC \u067E\u0648\u0644."}},{id:"f3-02",chapter:3,front:{en:"Prepaid Expense",fa:"\u067E\u06CC\u0634\u200C\u067E\u0631\u062F\u0627\u062E\u062A \u0647\u0632\u06CC\u0646\u0647"},back:{en:"An expense paid in advance, like insurance.",fa:"\u0647\u0632\u06CC\u0646\u0647\u200C\u0627\u06CC \u06A9\u0647 \u067E\u0648\u0644\u0634 \u0627\u0632 \u0642\u0628\u0644 \u062F\u0627\u062F\u0647 \u0634\u062F\u0647\u060C \u0645\u062B\u0644 \u0628\u06CC\u0645\u0647."}},{id:"f3-03",chapter:3,front:{en:"Unearned Revenue",fa:"\u062F\u0631\u0622\u0645\u062F \u067E\u06CC\u0634\u200C\u062F\u0631\u06CC\u0627\u0641\u062A"},back:{en:"Cash received in advance for work not yet done. It is a liability.",fa:"\u067E\u0648\u0644\u06CC \u06A9\u0647 \u0627\u0632 \u0642\u0628\u0644 \u06AF\u0631\u0641\u062A\u0647 \u0634\u062F\u0647 \u0648\u0644\u06CC \u06A9\u0627\u0631\u0634 \u0647\u0646\u0648\u0632 \u0627\u0646\u062C\u0627\u0645 \u0646\u0634\u062F\u0647. \u0628\u062F\u0647\u06CC \u0627\u0633\u062A."}},{id:"f3-04",chapter:3,front:{en:"Accrued Expense",fa:"\u0647\u0632\u06CC\u0646\u0647\u0654 \u0645\u0639\u0648\u0642"},back:{en:"An expense incurred but not yet paid.",fa:"\u0647\u0632\u06CC\u0646\u0647\u200C\u0627\u06CC \u06A9\u0647 \u0627\u062A\u0641\u0627\u0642 \u0627\u0641\u062A\u0627\u062F\u0647 \u0648\u0644\u06CC \u0647\u0646\u0648\u0632 \u067E\u0631\u062F\u0627\u062E\u062A \u0646\u0634\u062F\u0647."}},{id:"f3-05",chapter:3,front:{en:"Accrued Revenue",fa:"\u062F\u0631\u0622\u0645\u062F \u0645\u0639\u0648\u0642"},back:{en:"Revenue earned but not yet received.",fa:"\u062F\u0631\u0622\u0645\u062F\u06CC \u06A9\u0647 \u06A9\u0633\u0628 \u0634\u062F\u0647 \u0648\u0644\u06CC \u067E\u0648\u0644\u0634 \u0647\u0646\u0648\u0632 \u0646\u06CC\u0627\u0645\u062F\u0647."}},{id:"f3-06",chapter:3,front:{en:"Accumulated Depreciation",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0627\u0646\u0628\u0627\u0634\u062A\u0647"},back:{en:"Total depreciation on an asset to date; subtracted from its cost.",fa:"\u062C\u0645\u0639 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u06CC\u06A9 \u062F\u0627\u0631\u0627\u06CC\u06CC \u062A\u0627 \u0627\u0645\u0631\u0648\u0632\u061B \u0627\u0632 \u0628\u0647\u0627\u06CC \u0622\u0646 \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"f3-07",chapter:3,front:{en:"Closing Entries",fa:"\u062B\u0628\u062A\u200C\u0647\u0627\u06CC \u0628\u0633\u062A\u0646"},back:{en:"Resetting temporary accounts to zero and moving their balances to retained earnings.",fa:"\u0635\u0641\u0631 \u06A9\u0631\u062F\u0646 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u0645\u0648\u0642\u062A \u0648 \u0627\u0646\u062A\u0642\u0627\u0644 \u0645\u0627\u0646\u062F\u0647\u0654 \u0622\u0646\u200C\u0647\u0627 \u0628\u0647 \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647."}},{id:"f3-08",chapter:3,front:{en:"Current Ratio",fa:"\u0646\u0633\u0628\u062A \u062C\u0627\u0631\u06CC"},back:{en:"Current assets \xF7 Current liabilities",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC \u062C\u0627\u0631\u06CC \xF7 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627\u06CC \u062C\u0627\u0631\u06CC"}},{id:"f4-01",chapter:4,front:{en:"Cost of Goods Sold",fa:"\u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647"},back:{en:"The cost of the goods that were sold.",fa:"\u0642\u06CC\u0645\u062A\u06CC \u06A9\u0647 \u0628\u0631\u0627\u06CC \u06A9\u0627\u0644\u0627\u0647\u0627\u06CC \u0641\u0631\u0648\u062E\u062A\u0647\u200C\u0634\u062F\u0647 \u067E\u0631\u062F\u0627\u062E\u062A\u0647 \u0628\u0648\u062F\u06CC\u0645."}},{id:"f4-02",chapter:4,front:{en:"Gross Profit",fa:"\u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635"},back:{en:"Net sales \u2212 Cost of goods sold",fa:"\u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635 \u2212 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647"}},{id:"f4-03",chapter:4,front:{en:"Perpetual Inventory System",fa:"\u0633\u06CC\u0633\u062A\u0645 \u062F\u0627\u0626\u0645\u06CC"},back:{en:"Records cost of goods sold after every sale.",fa:"\u062B\u0628\u062A \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0628\u0639\u062F \u0627\u0632 \u0647\u0631 \u0641\u0631\u0648\u0634."}},{id:"f4-04",chapter:4,front:{en:"Periodic Inventory System",fa:"\u0633\u06CC\u0633\u062A\u0645 \u0627\u062F\u0648\u0627\u0631\u06CC"},back:{en:"Computes cost of goods sold only at period-end.",fa:"\u0645\u062D\u0627\u0633\u0628\u0647\u0654 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0641\u0642\u0637 \u0622\u062E\u0631 \u062F\u0648\u0631\u0647."}},{id:"f4-05",chapter:4,front:{en:"FOB Shipping Point",fa:"\u062A\u062D\u0648\u06CC\u0644 \u062F\u0631 \u0645\u0628\u062F\u0623"},back:{en:"Goods belong to the buyer once shipped; the buyer pays shipping.",fa:"\u06A9\u0627\u0644\u0627 \u0627\u0632 \u0644\u062D\u0638\u0647\u0654 \u0627\u0631\u0633\u0627\u0644 \u0645\u0627\u0644 \u062E\u0631\u06CC\u062F\u0627\u0631 \u0627\u0633\u062A\u061B \u062E\u0631\u06CC\u062F\u0627\u0631 \u062D\u0645\u0644 \u0631\u0627 \u0645\u06CC\u200C\u062F\u0647\u062F."}},{id:"f4-06",chapter:4,front:{en:"FOB Destination",fa:"\u062A\u062D\u0648\u06CC\u0644 \u062F\u0631 \u0645\u0642\u0635\u062F"},back:{en:"Goods belong to the buyer when they arrive; the seller pays shipping.",fa:"\u06A9\u0627\u0644\u0627 \u0648\u0642\u062A\u06CC \u0628\u0631\u0633\u062F \u0645\u0627\u0644 \u062E\u0631\u06CC\u062F\u0627\u0631 \u0627\u0633\u062A\u061B \u0641\u0631\u0648\u0634\u0646\u062F\u0647 \u062D\u0645\u0644 \u0631\u0627 \u0645\u06CC\u200C\u062F\u0647\u062F."}},{id:"f4-07",chapter:4,front:{en:"Sales Discounts",fa:"\u062A\u062E\u0641\u06CC\u0641\u0627\u062A \u0641\u0631\u0648\u0634"},back:{en:"A discount the seller gives for early payment.",fa:"\u062A\u062E\u0641\u06CC\u0641\u06CC \u06A9\u0647 \u0641\u0631\u0648\u0634\u0646\u062F\u0647 \u0628\u0631\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A \u0632\u0648\u062F\u0647\u0646\u06AF\u0627\u0645 \u0645\u06CC\u200C\u062F\u0647\u062F."}},{id:"f4-08",chapter:4,front:{en:"Inventory Shrinkage",fa:"\u06A9\u0633\u0631\u06CC \u0627\u0646\u0628\u0627\u0631"},back:{en:"Lost or stolen inventory; records \u2212 count.",fa:"\u06A9\u0627\u0644\u0627\u06CC \u06AF\u0645\u200C\u0634\u062F\u0647 \u06CC\u0627 \u062F\u0632\u062F\u06CC\u062F\u0647\u200C\u0634\u062F\u0647\u061B \u0645\u0648\u062C\u0648\u062F\u06CC \u062F\u0641\u0627\u062A\u0631 \u2212 \u0634\u0645\u0627\u0631\u0634."}},{id:"f5-01",chapter:5,front:{en:"FIFO",fa:"\u0627\u0648\u0644 \u0642\u062F\u06CC\u0645\u06CC\u200C\u0647\u0627"},back:{en:"The oldest goods are sold first.",fa:"\u0642\u062F\u06CC\u0645\u06CC\u200C\u062A\u0631\u06CC\u0646 \u06A9\u0627\u0644\u0627 \u0627\u0648\u0644 \u0641\u0631\u0648\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"f5-02",chapter:5,front:{en:"LIFO",fa:"\u0627\u0648\u0644 \u062C\u062F\u06CC\u062F\u0647\u0627"},back:{en:"The newest goods are sold first.",fa:"\u062C\u062F\u06CC\u062F\u062A\u0631\u06CC\u0646 \u06A9\u0627\u0644\u0627 \u0627\u0648\u0644 \u0641\u0631\u0648\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"f5-03",chapter:5,front:{en:"Weighted Average",fa:"\u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0648\u0632\u0648\u0646"},back:{en:"The average cost of all goods available.",fa:"\u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0642\u06CC\u0645\u062A \u0647\u0645\u0647\u0654 \u06A9\u0627\u0644\u0627\u0647\u0627\u06CC \u0645\u0648\u062C\u0648\u062F."}},{id:"f5-04",chapter:5,front:{en:"Specific Identification",fa:"\u0634\u0646\u0627\u0633\u0627\u06CC\u06CC \u0648\u06CC\u0698\u0647"},back:{en:"Uses the exact cost of the item sold.",fa:"\u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0627\u0632 \u0642\u06CC\u0645\u062A \u062F\u0642\u06CC\u0642 \u0647\u0645\u0627\u0646 \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u062E\u062A\u0647\u200C\u0634\u062F\u0647."}},{id:"f5-05",chapter:5,front:{en:"Consignor",fa:"\u0627\u0645\u0627\u0646\u062A\u200C\u06AF\u0630\u0627\u0631"},back:{en:"The owner of goods another store sells; they stay in its inventory.",fa:"\u0635\u0627\u062D\u0628 \u06A9\u0627\u0644\u0627\u06CC\u06CC \u06A9\u0647 \u062F\u06CC\u06AF\u0631\u06CC \u0628\u0631\u0627\u06CC\u0634 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u062F\u061B \u06A9\u0627\u0644\u0627 \u062F\u0631 \u0645\u0648\u062C\u0648\u062F\u06CC \u0627\u0648\u0633\u062A."}},{id:"f5-06",chapter:5,front:{en:"Consignee",fa:"\u0627\u0645\u0627\u0646\u062A\u200C\u062F\u0627\u0631"},back:{en:"The store selling another's goods; they are not in its inventory.",fa:"\u0645\u063A\u0627\u0632\u0647\u200C\u0627\u06CC \u06A9\u0647 \u06A9\u0627\u0644\u0627\u06CC \u062F\u06CC\u06AF\u0631\u06CC \u0631\u0627 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u062F\u061B \u062F\u0631 \u0645\u0648\u062C\u0648\u062F\u06CC\u200C\u0627\u0634 \u0646\u0645\u06CC\u200C\u0622\u06CC\u062F."}},{id:"f5-07",chapter:5,front:{en:"Lower of Cost or Market",fa:"\u0627\u0642\u0644 \u0628\u0647\u0627 \u06CC\u0627 \u0628\u0627\u0632\u0627\u0631"},back:{en:"Report inventory at the lower of cost and replacement cost.",fa:"\u06AF\u0632\u0627\u0631\u0634 \u0645\u0648\u062C\u0648\u062F\u06CC \u0628\u0627 \u06A9\u0645\u062A\u0631\u06CC\u0646\u0650 \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647 \u0648 \u0642\u06CC\u0645\u062A \u062E\u0631\u06CC\u062F \u062F\u0648\u0628\u0627\u0631\u0647."}},{id:"f5-08",chapter:5,front:{en:"Net Realizable Value",fa:"\u0627\u0631\u0632\u0634 \u062E\u0627\u0644\u0635 \u0628\u0627\u0632\u06CC\u0627\u0641\u062A\u0646\u06CC"},back:{en:"Selling price minus costs to sell.",fa:"\u0642\u06CC\u0645\u062A \u0641\u0631\u0648\u0634 \u0645\u0646\u0647\u0627\u06CC \u0647\u0632\u06CC\u0646\u0647\u0654 \u0641\u0631\u0648\u0634."}},{id:"f6-01",chapter:6,front:{en:"Internal Control",fa:"\u06A9\u0646\u062A\u0631\u0644 \u062F\u0627\u062E\u0644\u06CC"},back:{en:"Policies that protect assets and make accounting reliable.",fa:"\u0633\u06CC\u0627\u0633\u062A\u200C\u0647\u0627\u06CC\u06CC \u0628\u0631\u0627\u06CC \u062D\u0641\u0627\u0638\u062A \u0627\u0632 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0648 \u0642\u0627\u0628\u0644 \u0627\u0639\u062A\u0645\u0627\u062F \u06A9\u0631\u062F\u0646 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC."}},{id:"f6-02",chapter:6,front:{en:"Fraud Triangle",fa:"\u0645\u062B\u0644\u062B \u062A\u0642\u0644\u0628"},back:{en:"Opportunity, pressure, and rationalization.",fa:"\u0641\u0631\u0635\u062A\u060C \u0641\u0634\u0627\u0631 \u0648 \u062A\u0648\u062C\u06CC\u0647."}},{id:"f6-03",chapter:6,front:{en:"Collusion",fa:"\u062A\u0628\u0627\u0646\u06CC"},back:{en:"Two or more people secretly working together to get around controls.",fa:"\u0647\u0645\u06A9\u0627\u0631\u06CC \u067E\u0646\u0647\u0627\u0646\u06CC \u062F\u0648 \u06CC\u0627 \u0686\u0646\u062F \u0646\u0641\u0631 \u0628\u0631\u0627\u06CC \u062F\u0648\u0631 \u0632\u062F\u0646 \u06A9\u0646\u062A\u0631\u0644\u200C\u0647\u0627."}},{id:"f6-04",chapter:6,front:{en:"Petty Cash",fa:"\u062A\u0646\u062E\u0648\u0627\u0647\u200C\u06AF\u0631\u062F\u0627\u0646"},back:{en:"A small cash fund for minor payments.",fa:"\u0635\u0646\u062F\u0648\u0642 \u06A9\u0648\u0686\u06A9 \u067E\u0648\u0644 \u0646\u0642\u062F \u0628\u0631\u0627\u06CC \u062E\u0631\u062C\u200C\u0647\u0627\u06CC \u0631\u06CC\u0632."}},{id:"f6-05",chapter:6,front:{en:"Cash Over and Short",fa:"\u0627\u0636\u0627\u0641\u0647 \u0648 \u06A9\u0633\u0631\u06CC \u0635\u0646\u062F\u0648\u0642"},back:{en:"The difference between cash counted and the register record.",fa:"\u0641\u0631\u0642 \u067E\u0648\u0644 \u0634\u0645\u0631\u062F\u0647\u200C\u0634\u062F\u0647 \u0628\u0627 \u062B\u0628\u062A \u062F\u0633\u062A\u06AF\u0627\u0647 \u0635\u0646\u062F\u0648\u0642."}},{id:"f6-06",chapter:6,front:{en:"Deposit in Transit",fa:"\u0648\u0627\u0631\u06CC\u0632 \u062F\u0631 \u0631\u0627\u0647"},back:{en:"Cash deposited but not yet recorded by the bank; add to the bank side.",fa:"\u067E\u0648\u0644\u06CC \u06A9\u0647 \u0648\u0627\u0631\u06CC\u0632 \u0634\u062F\u0647 \u0648\u0644\u06CC \u0628\u0627\u0646\u06A9 \u0647\u0646\u0648\u0632 \u062B\u0628\u062A \u0646\u06A9\u0631\u062F\u0647\u061B \u0628\u0647 \u0637\u0631\u0641 \u0628\u0627\u0646\u06A9 \u0627\u0636\u0627\u0641\u0647."}},{id:"f6-07",chapter:6,front:{en:"Outstanding Check",fa:"\u0686\u06A9 \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0646\u0634\u062F\u0647"},back:{en:"A check written but not yet cleared by the bank; subtract from the bank side.",fa:"\u0686\u06A9\u06CC \u06A9\u0647 \u062F\u0627\u062F\u0647 \u0634\u062F\u0647 \u0648\u0644\u06CC \u0647\u0646\u0648\u0632 \u0628\u0647 \u0628\u0627\u0646\u06A9 \u0646\u0631\u0633\u06CC\u062F\u0647\u061B \u0627\u0632 \u0637\u0631\u0641 \u0628\u0627\u0646\u06A9 \u06A9\u0645."}},{id:"f6-08",chapter:6,front:{en:"NSF Check",fa:"\u0686\u06A9 \u0628\u0631\u06AF\u0634\u062A\u06CC"},back:{en:"A customer check returned for insufficient funds; subtract from the book side.",fa:"\u0686\u06A9 \u0645\u0634\u062A\u0631\u06CC \u06A9\u0647 \u062D\u0633\u0627\u0628\u0634 \u067E\u0648\u0644 \u0646\u062F\u0627\u0634\u062A\u061B \u0627\u0632 \u0637\u0631\u0641 \u062F\u0641\u0627\u062A\u0631 \u06A9\u0645."}},{id:"f7-01",chapter:7,front:{en:"Accounts Receivable",fa:"\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC"},back:{en:"Amounts customers owe from credit sales.",fa:"\u067E\u0648\u0644\u06CC \u06A9\u0647 \u0645\u0634\u062A\u0631\u06CC\u200C\u0647\u0627 \u0628\u0627\u0628\u062A \u0641\u0631\u0648\u0634 \u0646\u0633\u06CC\u0647 \u0628\u062F\u0647\u06A9\u0627\u0631\u0646\u062F."}},{id:"f7-02",chapter:7,front:{en:"Direct Write-Off Method",fa:"\u0631\u0648\u0634 \u062D\u0630\u0641 \u0645\u0633\u062A\u0642\u06CC\u0645"},back:{en:"Records the expense only when sure the cash will not come.",fa:"\u062B\u0628\u062A \u0647\u0632\u06CC\u0646\u0647 \u0641\u0642\u0637 \u0648\u0642\u062A\u06CC \u0645\u0637\u0645\u0626\u0646 \u0634\u062F\u06CC\u0645 \u067E\u0648\u0644 \u0646\u0645\u06CC\u200C\u0622\u06CC\u062F."}},{id:"f7-03",chapter:7,front:{en:"Allowance Method",fa:"\u0631\u0648\u0634 \u0630\u062E\u06CC\u0631\u0647"},back:{en:"Estimates bad debts in the same period as the sale.",fa:"\u062A\u062E\u0645\u06CC\u0646 \u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0633\u0648\u062E\u062A\u200C\u0634\u062F\u0647 \u062F\u0631 \u0647\u0645\u0627\u0646 \u062F\u0648\u0631\u0647\u0654 \u0641\u0631\u0648\u0634."}},{id:"f7-04",chapter:7,front:{en:"Allowance for Doubtful Accounts",fa:"\u0630\u062E\u06CC\u0631\u0647\u0654 \u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0645\u0634\u06A9\u0648\u06A9\u200C\u0627\u0644\u0648\u0635\u0648\u0644"},back:{en:"A contra account to receivables for amounts likely uncollectible.",fa:"\u062D\u0633\u0627\u0628 \u06A9\u0627\u0647\u0646\u062F\u0647\u0654 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u0628\u0631\u0627\u06CC \u0645\u0628\u0627\u0644\u063A \u0627\u062D\u062A\u0645\u0627\u0644\u0627\u064B \u063A\u06CC\u0631\u0642\u0627\u0628\u0644 \u0648\u0635\u0648\u0644."}},{id:"f7-05",chapter:7,front:{en:"Aging of Receivables",fa:"\u0633\u0646\u06CC \u06A9\u0631\u062F\u0646 \u062D\u0633\u0627\u0628\u200C\u0647\u0627"},back:{en:"Grouping receivables by how long they are past due and applying a bad-debt percent to each group.",fa:"\u062A\u0642\u0633\u06CC\u0645 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u0628\u0631 \u0627\u0633\u0627\u0633 \u0645\u062F\u062A \u06AF\u0630\u0634\u062A\u0647 \u0648 \u0627\u0639\u0645\u0627\u0644 \u062F\u0631\u0635\u062F \u0633\u0648\u062E\u062A \u0628\u0647 \u0647\u0631 \u06AF\u0631\u0648\u0647."}},{id:"f7-06",chapter:7,front:{en:"Note Receivable",fa:"\u0633\u0646\u062F \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC"},back:{en:"A customer's written promise to pay an amount with interest on a set date.",fa:"\u0642\u0648\u0644 \u06A9\u062A\u0628\u06CC \u0645\u0634\u062A\u0631\u06CC \u0628\u0647 \u067E\u0631\u062F\u0627\u062E\u062A \u0645\u0628\u0644\u063A\u06CC \u0628\u0627 \u0628\u0647\u0631\u0647 \u062F\u0631 \u062A\u0627\u0631\u06CC\u062E \u0645\u0639\u06CC\u0646."}},{id:"f7-07",chapter:7,front:{en:"Dishonored Note",fa:"\u0633\u0646\u062F \u0646\u06A9\u0648\u0644\u200C\u0634\u062F\u0647"},back:{en:"A note not paid at maturity.",fa:"\u0633\u0646\u062F\u06CC \u06A9\u0647 \u0633\u0631 \u0645\u0648\u0639\u062F \u067E\u0631\u062F\u0627\u062E\u062A \u0646\u0634\u062F\u0647."}},{id:"f7-08",chapter:7,front:{en:"Accounts Receivable Turnover",fa:"\u06AF\u0631\u062F\u0634 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627"},back:{en:"Net sales \xF7 Average receivables",fa:" 2\u0627\u062A",en:"Loss on Sale of Equipment"}};var dm=[{id:"q1-01",chapter:1,question:{en:"What is accounting, and why is it called the language of business?",fa:"\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u0686\u06CC\u0633\u062A \u0648 \u0686\u0631\u0627 \u0628\u0647 \u0622\u0646 \u0632\u0628\u0627\u0646 \u06A9\u0633\u0628\u200C\u0648\u06A9\u0627\u0631 \u0645\u06CC\u200C\u06AF\u0648\u06CC\u0646\u062F\u061F"},answer:{en:"Accounting is an information system that identifies, records, and communicates a business's economic activities. It is called the language of business because owners, managers, lenders, and investors all use its reports to understand the business and make decisions.",fa:"\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u06CC\u06A9 \u0633\u06CC\u0633\u062A\u0645 \u0627\u0637\u0644\u0627\u0639\u0627\u062A\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0641\u0639\u0627\u0644\u06CC\u062A\u200C\u0647\u0627\u06CC \u0627\u0642\u062A\u0635\u0627\u062F\u06CC \u06CC\u06A9 \u06A9\u0633\u0628\u200C\u0648\u06A9\u0627\u0631 \u0631\u0627 \u0634\u0646\u0627\u0633\u0627\u06CC\u06CC\u060C \u062B\u0628\u062A \u0648 \u06AF\u0632\u0627\u0631\u0634 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0628\u0647 \u0622\u0646 \u0632\u0628\u0627\u0646 \u06A9\u0633\u0628\u200C\u0648\u06A9\u0627\u0631 \u0645\u06CC\u200C\u06AF\u0648\u06CC\u0646\u062F \u0686\u0648\u0646 \u0635\u0627\u062D\u0628\u0627\u0646\u060C \u0645\u062F\u06CC\u0631\u0627\u0646\u060C \u0648\u0627\u0645\u200C\u062F\u0647\u0646\u062F\u06AF\u0627\u0646 \u0648 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u0627\u0646 \u0647\u0645\u0647 \u0627\u0632 \u06AF\u0632\u0627\u0631\u0634\u200C\u0647\u0627\u06CC \u0622\u0646 \u0628\u0631\u0627\u06CC \u0641\u0647\u0645\u06CC\u062F\u0646 \u06A9\u0633\u0628\u200C\u0648\u06A9\u0627\u0631 \u0648 \u062A\u0635\u0645\u06CC\u0645\u200C\u06AF\u06CC\u0631\u06CC \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F."}},{id:"q1-02",chapter:1,question:{en:"Who uses accounting information, and how do internal and external users differ?",fa:"\u0686\u0647 \u06A9\u0633\u0627\u0646\u06CC \u0627\u0632 \u0627\u0637\u0644\u0627\u0639\u0627\u062A \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F \u0648 \u0641\u0631\u0642 \u0627\u0633\u062A\u0641\u0627\u062F\u0647\u200C\u06A9\u0646\u0646\u062F\u06AF\u0627\u0646 \u062F\u0631\u0648\u0646\u06CC \u0648 \u0628\u06CC\u0631\u0648\u0646\u06CC \u0686\u06CC\u0633\u062A\u061F"},answer:{en:"External users (shareholders, lenders, regulators) are outside the company and rely on published financial statements to decide whether to invest, lend, or approve. Internal users (managers in purchasing, production, HR, sales) are inside the company and use more detailed reports to plan and control daily operations.",fa:"\u0627\u0633\u062A\u0641\u0627\u062F\u0647\u200C\u06A9\u0646\u0646\u062F\u06AF\u0627\u0646 \u0628\u06CC\u0631\u0648\u0646\u06CC (\u0633\u0647\u0627\u0645\u200C\u062F\u0627\u0631\u0627\u0646\u060C \u0648\u0627\u0645\u200C\u062F\u0647\u0646\u062F\u06AF\u0627\u0646\u060C \u0646\u0647\u0627\u062F\u0647\u0627\u06CC \u0646\u0638\u0627\u0631\u062A\u06CC) \u0628\u06CC\u0631\u0648\u0646 \u0627\u0632 \u0634\u0631\u06A9\u062A\u200C\u0627\u0646\u062F \u0648 \u0628\u0631\u0627\u06CC \u062A\u0635\u0645\u06CC\u0645 \u0628\u0647 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC \u06CC\u0627 \u0648\u0627\u0645 \u062F\u0627\u062F\u0646 \u0628\u0647 \u0635\u0648\u0631\u062A\u200C\u0647\u0627\u06CC \u0645\u0627\u0644\u06CC \u0645\u0646\u062A\u0634\u0631\u0634\u062F\u0647 \u062A\u06A9\u06CC\u0647 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F. \u0627\u0633\u062A\u0641\u0627\u062F\u0647\u200C\u06A9\u0646\u0646\u062F\u06AF\u0627\u0646 \u062F\u0631\u0648\u0646\u06CC (\u0645\u062F\u06CC\u0631\u0627\u0646 \u062E\u0631\u06CC\u062F\u060C \u062A\u0648\u0644\u06CC\u062F\u060C \u0645\u0646\u0627\u0628\u0639 \u0627\u0646\u0633\u0627\u0646\u06CC \u0648 \u0641\u0631\u0648\u0634) \u062F\u0627\u062E\u0644 \u0634\u0631\u06A9\u062A\u200C\u0627\u0646\u062F \u0648 \u0627\u0632 \u06AF\u0632\u0627\u0631\u0634\u200C\u0647\u0627\u06CC \u062C\u0632\u0626\u06CC\u200C\u062A\u0631 \u0628\u0631\u0627\u06CC \u0628\u0631\u0646\u0627\u0645\u0647\u200C\u0631\u06CC\u0632\u06CC \u0648 \u06A9\u0646\u062A\u0631\u0644 \u06A9\u0627\u0631 \u0631\u0648\u0632\u0645\u0631\u0647 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F."}},{id:"q1-03",chapter:1,question:{en:"Why do we need ethics and GAAP in accounting? What problem do they solve?",fa:"\u0686\u0631\u0627 \u062F\u0631 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u0628\u0647 \u0627\u062E\u0644\u0627\u0642 \u0648 \u0627\u0635\u0648\u0644 \u067E\u0630\u06CC\u0631\u0641\u062A\u0647\u200C\u0634\u062F\u0647 (GAAP) \u0646\u06CC\u0627\u0632 \u062F\u0627\u0631\u06CC\u0645\u061F \u0686\u0647 \u0645\u0634\u06A9\u0644\u06CC \u0631\u0627 \u062D\u0644 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F\u061F"},answer:{en:"Without common rules and honest behavior, each company could report numbers however it liked, and users could not trust or compare reports. GAAP gives everyone the same rules, and ethics makes sure accountants follow them honestly. Together they make financial information reliable and comparable.",fa:"\u0628\u062F\u0648\u0646 \u0642\u0648\u0627\u0646\u06CC\u0646 \u0645\u0634\u062A\u0631\u06A9 \u0648 \u0631\u0641\u062A\u0627\u0631 \u0635\u0627\u062F\u0642\u0627\u0646\u0647\u060C \u0647\u0631 \u0634\u0631\u06A9\u062A \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u0633\u062A \u0627\u0639\u062F\u0627\u062F \u0631\u0627 \u0647\u0631 \u0637\u0648\u0631 \u0628\u062E\u0648\u0627\u0647\u062F \u06AF\u0632\u0627\u0631\u0634 \u06A9\u0646\u062F \u0648 \u06A9\u0633\u06CC \u0646\u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u0633\u062A \u0628\u0647 \u06AF\u0632\u0627\u0631\u0634\u200C\u0647\u0627 \u0627\u0639\u062A\u0645\u0627\u062F \u06A9\u0646\u062F \u06CC\u0627 \u0622\u0646\u200C\u0647\u0627 \u0631\u0627 \u0645\u0642\u0627\u06CC\u0633\u0647 \u06A9\u0646\u062F. GAAP \u0628\u0647 \u0647\u0645\u0647 \u0642\u0648\u0627\u0646\u06CC\u0646 \u06CC\u06A9\u0633\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0648 \u0627\u062E\u0644\u0627\u0642 \u0628\u0627\u0639\u062B \u0645\u06CC\u200C\u0634\u0648\u062F \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u0627\u0646 \u0635\u0627\u062F\u0642\u0627\u0646\u0647 \u0627\u0632 \u0622\u0646 \u067E\u06CC\u0631\u0648\u06CC \u06A9\u0646\u0646\u062F. \u0646\u062A\u06CC\u062C\u0647: \u0627\u0637\u0644\u0627\u0639\u0627\u062A \u0645\u0627\u0644\u06CC \u0642\u0627\u0628\u0644 \u0627\u0639\u062A\u0645\u0627\u062F \u0648 \u0642\u0627\u0628\u0644 \u0645\u0642\u0627\u06CC\u0633\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"q1-04",chapter:1,question:{en:"What does the accounting equation mean, and why must it always balance?",fa:"\u0645\u0639\u0627\u062F\u0644\u0647\u0654 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u06CC\u0639\u0646\u06CC \u0686\u0647 \u0648 \u0686\u0631\u0627 \u0628\u0627\u06CC\u062F \u0647\u0645\u06CC\u0634\u0647 \u0628\u0631\u0627\u0628\u0631 \u0628\u0645\u0627\u0646\u062F\u061F"},answer:{en:"Assets = Liabilities + Equity means everything a company owns was paid for either by borrowing (liabilities) or by the owners (equity). Every transaction has two sides, so it changes the equation in a way that keeps both sides equal. If it doesn't balance, there is an error.",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC = \u0628\u062F\u0647\u06CC + \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u06CC\u0639\u0646\u06CC \u0647\u0631 \u0686\u0647 \u0634\u0631\u06A9\u062A \u062F\u0627\u0631\u062F\u060C \u06CC\u0627 \u0628\u0627 \u0642\u0631\u0636 (\u0628\u062F\u0647\u06CC) \u062E\u0631\u06CC\u062F\u0647 \u0634\u062F\u0647 \u06CC\u0627 \u0628\u0627 \u067E\u0648\u0644 \u0635\u0627\u062D\u0628\u0627\u0646 (\u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645). \u0647\u0631 \u0645\u0639\u0627\u0645\u0644\u0647 \u062F\u0648 \u0637\u0631\u0641 \u062F\u0627\u0631\u062F\u060C \u067E\u0633 \u0645\u0639\u0627\u062F\u0644\u0647 \u0631\u0627 \u0637\u0648\u0631\u06CC \u062A\u063A\u06CC\u06CC\u0631 \u0645\u06CC\u200C\u062F\u0647\u062F \u06A9\u0647 \u062F\u0648 \u0637\u0631\u0641 \u0628\u0631\u0627\u0628\u0631 \u0628\u0645\u0627\u0646\u0646\u062F. \u0627\u06AF\u0631 \u0628\u0631\u0627\u0628\u0631 \u0646\u0628\u0627\u0634\u062F\u060C \u0627\u0634\u062A\u0628\u0627\u0647\u06CC \u0631\u062E \u062F\u0627\u062F\u0647 \u0627\u0633\u062A."}},{id:"q1-05",chapter:1,question:{en:"What are the four financial statements, and how are they connected?",fa:"\u0686\u0647\u0627\u0631 \u0635\u0648\u0631\u062A \u0645\u0627\u0644\u06CC \u06A9\u062F\u0627\u0645\u200C\u0627\u0646\u062F \u0648 \u0686\u0637\u0648\u0631 \u0628\u0647 \u0647\u0645 \u0648\u0635\u0644\u200C\u0627\u0646\u062F\u061F"},answer:{en:"The income statement shows revenues minus expenses (net income). Net income flows into the statement of retained earnings, which shows how retained earnings changed. Ending retained earnings flows into the balance sheet, which shows assets, liabilities, and equity at one date. The statement of cash flows explains how cash changed. They are linked, so they must be prepared in this order.",fa:"\u0635\u0648\u0631\u062A \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646 \u062F\u0631\u0622\u0645\u062F \u0645\u0646\u0647\u0627\u06CC \u0647\u0632\u06CC\u0646\u0647 (\u0633\u0648\u062F \u062E\u0627\u0644\u0635) \u0631\u0627 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F. \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0628\u0647 \u0635\u0648\u0631\u062A \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u0645\u06CC\u200C\u0631\u0648\u062F. \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647\u0654 \u067E\u0627\u06CC\u0627\u0646 \u062F\u0648\u0631\u0647 \u0628\u0647 \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647 \u0645\u06CC\u200C\u0631\u0648\u062F \u06A9\u0647 \u062F\u0627\u0631\u0627\u06CC\u06CC\u060C \u0628\u062F\u0647\u06CC \u0648 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u0631\u0627 \u062F\u0631 \u06CC\u06A9 \u062A\u0627\u0631\u06CC\u062E \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F. \u0635\u0648\u0631\u062A \u062C\u0631\u06CC\u0627\u0646 \u0648\u062C\u0648\u0647 \u0646\u0642\u062F \u062A\u0648\u0636\u06CC\u062D \u0645\u06CC\u200C\u062F\u0647\u062F \u067E\u0648\u0644 \u0646\u0642\u062F \u0686\u0637\u0648\u0631 \u062A\u063A\u06CC\u06CC\u0631 \u06A9\u0631\u062F. \u0686\u0648\u0646 \u0628\u0647 \u0647\u0645 \u0648\u0635\u0644\u200C\u0627\u0646\u062F\u060C \u0628\u0627\u06CC\u062F \u0628\u0647 \u0647\u0645\u06CC\u0646 \u062A\u0631\u062A\u06CC\u0628 \u062A\u0647\u06CC\u0647 \u0634\u0648\u0646\u062F."}},{id:"q1-06",chapter:1,question:{en:"What does return on assets (ROA) tell us, and what is its limitation?",fa:"\u0628\u0627\u0632\u062F\u0647 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0686\u0647 \u0686\u06CC\u0632\u06CC \u0628\u0647 \u0645\u0627 \u0645\u06CC\u200C\u06AF\u0648\u06CC\u062F \u0648 \u0686\u0647 \u0645\u062D\u062F\u0648\u062F\u06CC\u062A\u06CC \u062F\u0627\u0631\u062F\u061F"},answer:{en:"ROA (net income \xF7 average total assets) shows how well a company uses its assets to earn profit. A higher ROA means more profit from each dollar of assets. Its limitation: it depends on accrual profit, and it should be compared with past years or similar companies, because a 'good' ROA differs by industry.",fa:"\u0628\u0627\u0632\u062F\u0647 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 (\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \xF7 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627) \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0634\u0631\u06A9\u062A \u0686\u0642\u062F\u0631 \u062E\u0648\u0628 \u0627\u0632 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC\u0634 \u0633\u0648\u062F \u0645\u06CC\u200C\u0633\u0627\u0632\u062F. \u0639\u062F\u062F \u0628\u0627\u0644\u0627\u062A\u0631 \u06CC\u0639\u0646\u06CC \u0633\u0648\u062F \u0628\u06CC\u0634\u062A\u0631 \u0627\u0632 \u0647\u0631 \u062F\u0644\u0627\u0631 \u062F\u0627\u0631\u0627\u06CC\u06CC. \u0645\u062D\u062F\u0648\u062F\u06CC\u062A\u0634: \u0628\u0647 \u0633\u0648\u062F \u062A\u0639\u0647\u062F\u06CC \u0648\u0627\u0628\u0633\u062A\u0647 \u0627\u0633\u062A \u0648 \u0628\u0627\u06CC\u062F \u0628\u0627 \u0633\u0627\u0644\u200C\u0647\u0627\u06CC \u0642\u0628\u0644 \u06CC\u0627 \u0634\u0631\u06A9\u062A\u200C\u0647\u0627\u06CC \u0645\u0634\u0627\u0628\u0647 \u0645\u0642\u0627\u06CC\u0633\u0647 \u0634\u0648\u062F\u060C \u0686\u0648\u0646 \u0639\u062F\u062F \xAB\u062E\u0648\u0628\xBB \u062F\u0631 \u0647\u0631 \u0635\u0646\u0639\u062A \u0641\u0631\u0642 \u0645\u06CC\u200C\u06A9\u0646\u062F."}},{id:"q2-01",chapter:2,question:{en:"What is double-entry accounting, and why is it used?",fa:"\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062F\u0648\u0637\u0631\u0641\u0647 \u0686\u06CC\u0633\u062A \u0648 \u0686\u0631\u0627 \u0627\u0632 \u0622\u0646 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645\u061F"},answer:{en:"Double-entry accounting means every transaction is recorded in at least two accounts, with total debits equal to total credits. It is used because every transaction has two sides (something received, something given), and it helps catch errors, since the books must balance.",fa:"\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062F\u0648\u0637\u0631\u0641\u0647 \u06CC\u0639\u0646\u06CC \u0647\u0631 \u0645\u0639\u0627\u0645\u0644\u0647 \u062D\u062F\u0627\u0642\u0644 \u062F\u0631 \u062F\u0648 \u062D\u0633\u0627\u0628 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u062C\u0645\u0639 \u062F\u0628\u06CC\u062A \u0628\u0627 \u062C\u0645\u0639 \u06A9\u0631\u06CC\u062F\u06CC\u062A \u0628\u0631\u0627\u0628\u0631 \u0627\u0633\u062A. \u0627\u0632 \u0622\u0646 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645 \u0686\u0648\u0646 \u0647\u0631 \u0645\u0639\u0627\u0645\u0644\u0647 \u062F\u0648 \u0637\u0631\u0641 \u062F\u0627\u0631\u062F (\u0686\u06CC\u0632\u06CC \u06AF\u0631\u0641\u062A\u0647 \u0648 \u0686\u06CC\u0632\u06CC \u062F\u0627\u062F\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F) \u0648 \u0628\u0647 \u067E\u06CC\u062F\u0627 \u06A9\u0631\u062F\u0646 \u0627\u0634\u062A\u0628\u0627\u0647 \u06A9\u0645\u06A9 \u0645\u06CC\u200C\u06A9\u0646\u062F\u060C \u0686\u0648\u0646 \u062F\u0641\u0627\u062A\u0631 \u0628\u0627\u06CC\u062F \u0645\u062A\u0639\u0627\u062F\u0644 \u0628\u0627\u0634\u0646\u062F."}},{id:"q2-02",chapter:2,question:{en:"What do debit and credit mean? Are they good or bad?",fa:"\u062F\u0628\u06CC\u062A \u0648 \u06A9\u0631\u06CC\u062F\u06CC\u062A \u06CC\u0639\u0646\u06CC \u0686\u0647\u061F \u062E\u0648\u0628\u200C\u0627\u0646\u062F \u06CC\u0627 \u0628\u062F\u061F"},answer:{en:"Debit means the left side of an account and credit means the right side. They are neither good nor bad. Whether a debit increases or decreases an account depends on the account type: assets, expenses, and dividends increase with debits; liabilities, equity, and revenues increase with credits.",fa:"\u062F\u0628\u06CC\u062A \u06CC\u0639\u0646\u06CC \u0633\u0645\u062A \u0686\u067E \u062D\u0633\u0627\u0628 \u0648 \u06A9\u0631\u06CC\u062F\u06CC\u062A \u06CC\u0639\u0646\u06CC \u0633\u0645\u062A \u0631\u0627\u0633\u062A. \u0646\u0647 \u062E\u0648\u0628\u200C\u0627\u0646\u062F \u0646\u0647 \u0628\u062F. \u0627\u06CC\u0646\u06A9\u0647 \u062F\u0628\u06CC\u062A \u062D\u0633\u0627\u0628 \u0631\u0627 \u0632\u06CC\u0627\u062F \u06A9\u0646\u062F \u06CC\u0627 \u06A9\u0645\u060C \u0628\u0647 \u0646\u0648\u0639 \u062D\u0633\u0627\u0628 \u0628\u0633\u062A\u06AF\u06CC \u062F\u0627\u0631\u062F: \u062F\u0627\u0631\u0627\u06CC\u06CC\u060C \u0647\u0632\u06CC\u0646\u0647 \u0648 \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u0628\u0627 \u062F\u0628\u06CC\u062A \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u0634\u0648\u0646\u062F\u061B \u0628\u062F\u0647\u06CC\u060C \u0633\u0647\u0627\u0645 \u0648 \u062F\u0631\u0622\u0645\u062F \u0628\u0627 \u06A9\u0631\u06CC\u062F\u06CC\u062A."}},{id:"q2-03",chapter:2,question:{en:"Why do we record transactions in a journal first and then post them to a ledger?",fa:"\u0686\u0631\u0627 \u0645\u0639\u0627\u0645\u0644\u0627\u062A \u0631\u0627 \u0627\u0648\u0644 \u062F\u0631 \u062F\u0641\u062A\u0631 \u0631\u0648\u0632\u0646\u0627\u0645\u0647 \u062B\u0628\u062A \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645 \u0648 \u0628\u0639\u062F \u0628\u0647 \u062F\u0641\u062A\u0631 \u06A9\u0644 \u0645\u0646\u062A\u0642\u0644 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645\u061F"},answer:{en:"The journal records each full transaction in date order, so we can see the whole story of each event in one place. The ledger groups the same information by account, so we can see the balance of each account (like Cash). Using both gives a complete history and up-to-date balances.",fa:"\u062F\u0641\u062A\u0631 \u0631\u0648\u0632\u0646\u0627\u0645\u0647 \u0647\u0631 \u0645\u0639\u0627\u0645\u0644\u0647 \u0631\u0627 \u06A9\u0627\u0645\u0644 \u0648 \u0628\u0647 \u062A\u0631\u062A\u06CC\u0628 \u062A\u0627\u0631\u06CC\u062E \u062B\u0628\u062A \u0645\u06CC\u200C\u06A9\u0646\u062F\u060C \u067E\u0633 \u062F\u0627\u0633\u062A\u0627\u0646 \u06A9\u0627\u0645\u0644 \u0647\u0631 \u0631\u0648\u06CC\u062F\u0627\u062F \u06CC\u06A9\u200C\u062C\u0627 \u062F\u06CC\u062F\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F. \u062F\u0641\u062A\u0631 \u06A9\u0644 \u0647\u0645\u0627\u0646 \u0627\u0637\u0644\u0627\u0639\u0627\u062A \u0631\u0627 \u0628\u0631 \u0627\u0633\u0627\u0633 \u062D\u0633\u0627\u0628 \u062F\u0633\u062A\u0647\u200C\u0628\u0646\u062F\u06CC \u0645\u06CC\u200C\u06A9\u0646\u062F\u060C \u067E\u0633 \u0645\u0627\u0646\u062F\u0647\u0654 \u0647\u0631 \u062D\u0633\u0627\u0628 (\u0645\u062B\u0644 \u067E\u0648\u0644 \u0646\u0642\u062F) \u062F\u06CC\u062F\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0628\u0627 \u0647\u0631 \u062F\u0648\u060C \u0647\u0645 \u062A\u0627\u0631\u06CC\u062E\u0686\u0647\u0654 \u06A9\u0627\u0645\u0644 \u062F\u0627\u0631\u06CC\u0645 \u0648 \u0647\u0645 \u0645\u0627\u0646\u062F\u0647\u200C\u0647\u0627\u06CC \u0628\u0647\u200C\u0631\u0648\u0632."}},{id:"q2-04",chapter:2,question:{en:"What is a trial balance for, and what are its limitations?",fa:"\u062A\u0631\u0627\u0632 \u0622\u0632\u0645\u0627\u06CC\u0634\u06CC \u0628\u0631\u0627\u06CC \u0686\u06CC\u0633\u062A \u0648 \u0686\u0647 \u0645\u062D\u062F\u0648\u062F\u06CC\u062A\u06CC \u062F\u0627\u0631\u062F\u061F"},answer:{en:"A trial balance lists all account balances to check that total debits equal total credits, and it is the starting point for financial statements. Its limitation: it only proves the books balance. It cannot find errors like a transaction that was never recorded, recorded twice, or posted to the wrong account with the right amount.",fa:"\u062A\u0631\u0627\u0632 \u0622\u0632\u0645\u0627\u06CC\u0634\u06CC \u0645\u0627\u0646\u062F\u0647 \u0647\u0645\u0647\u0654 \u062D\u0633\u0627\u0628\u200C\u0647\u0627 \u0631\u0627 \u0641\u0647\u0631\u0633\u062A \u0645\u06CC\u200C\u06A9\u0646\u062F \u062A\u0627 \u0628\u0631\u0631\u0633\u06CC \u0634\u0648\u062F \u062C\u0645\u0639 \u062F\u0628\u06CC\u062A \u0628\u0627 \u062C\u0645\u0639 \u06A9\u0631\u06CC\u062F\u06CC\u062A \u0628\u0631\u0627\u0628\u0631 \u0627\u0633\u062A\u060C \u0648 \u0646\u0642\u0637\u0647\u0654 \u0634\u0631\u0648\u0639 \u0635\u0648\u0631\u062A\u200C\u0647\u0627\u06CC \u0645\u0627\u0644\u06CC \u0627\u0633\u062A. \u0645\u062D\u062F\u0648\u062F\u06CC\u062A\u0634: \u0641\u0642\u0637 \u062A\u0639\u0627\u062F\u0644 \u0631\u0627 \u062B\u0627\u0628\u062A \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0627\u0634\u062A\u0628\u0627\u0647\u0627\u062A\u06CC \u0645\u062B\u0644 \u0645\u0639\u0627\u0645\u0644\u0647\u200C\u0627\u06CC \u06A9\u0647 \u0627\u0635\u0644\u0627\u064B \u062B\u0628\u062A \u0646\u0634\u062F\u0647\u060C \u062F\u0648 \u0628\u0627\u0631 \u062B\u0628\u062A \u0634\u062F\u0647\u060C \u06CC\u0627 \u0628\u0627 \u0645\u0628\u0644\u063A \u062F\u0631\u0633\u062A \u062F\u0631 \u062D\u0633\u0627\u0628 \u0627\u0634\u062A\u0628\u0627\u0647 \u0631\u0641\u062A\u0647 \u0631\u0627 \u067E\u06CC\u062F\u0627 \u0646\u0645\u06CC\u200C\u06A9\u0646\u062F."}},{id:"q2-05",chapter:2,question:{en:"Why is cash received in advance recorded as a liability, not revenue?",fa:"\u0686\u0631\u0627 \u067E\u0648\u0644\u06CC \u06A9\u0647 \u0627\u0632 \u0642\u0628\u0644 \u062F\u0631\u06CC\u0627\u0641\u062A \u0645\u06CC\u200C\u0634\u0648\u062F \u0628\u062F\u0647\u06CC \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F\u060C \u0646\u0647 \u062F\u0631\u0622\u0645\u062F\u061F"},answer:{en:"Because the company has not done the work yet. It owes the customer either the service or the money back, so it is a liability (Unearned Revenue). It becomes revenue only when the work is done, following the revenue recognition principle.",fa:"\u0686\u0648\u0646 \u0634\u0631\u06A9\u062A \u0647\u0646\u0648\u0632 \u06A9\u0627\u0631 \u0631\u0627 \u0627\u0646\u062C\u0627\u0645 \u0646\u062F\u0627\u062F\u0647. \u0628\u0647 \u0645\u0634\u062A\u0631\u06CC \u06CC\u0627 \u062E\u062F\u0645\u062A \u0628\u062F\u0647\u06A9\u0627\u0631 \u0627\u0633\u062A \u06CC\u0627 \u067E\u0648\u0644\u0634 \u0631\u0627. \u067E\u0633 \u0628\u062F\u0647\u06CC \u0627\u0633\u062A (\u062F\u0631\u0622\u0645\u062F \u067E\u06CC\u0634\u200C\u062F\u0631\u06CC\u0627\u0641\u062A). \u0641\u0642\u0637 \u0648\u0642\u062A\u06CC \u06A9\u0627\u0631 \u0627\u0646\u062C\u0627\u0645 \u0634\u0648\u062F\u060C \u0637\u0628\u0642 \u0627\u0635\u0644 \u0634\u0646\u0627\u0633\u0627\u06CC\u06CC \u062F\u0631\u0622\u0645\u062F\u060C \u0628\u0647 \u062F\u0631\u0622\u0645\u062F \u062A\u0628\u062F\u06CC\u0644 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"q2-06",chapter:2,question:{en:"What does the debt ratio show, and why do lenders care about it?",fa:"\u0646\u0633\u0628\u062A \u0628\u062F\u0647\u06CC \u0686\u0647 \u0686\u06CC\u0632\u06CC \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0648 \u0686\u0631\u0627 \u0628\u0631\u0627\u06CC \u0648\u0627\u0645\u200C\u062F\u0647\u0646\u062F\u06AF\u0627\u0646 \u0645\u0647\u0645 \u0627\u0633\u062A\u061F"},answer:{en:"The debt ratio (total liabilities \xF7 total assets) shows what part of assets is financed by debt. Lenders care because a high ratio means more risk: the company must make fixed payments, and if business slows down it may not be able to repay. A lower ratio usually means a safer borrower.",fa:"\u0646\u0633\u0628\u062A \u0628\u062F\u0647\u06CC (\u06A9\u0644 \u0628\u062F\u0647\u06CC \xF7 \u06A9\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC) \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0686\u0647 \u0628\u062E\u0634\u06CC \u0627\u0632 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0628\u0627 \u0642\u0631\u0636 \u062A\u0623\u0645\u06CC\u0646 \u0634\u062F\u0647. \u0628\u0631\u0627\u06CC \u0648\u0627\u0645\u200C\u062F\u0647\u0646\u062F\u06AF\u0627\u0646 \u0645\u0647\u0645 \u0627\u0633\u062A \u0686\u0648\u0646 \u0646\u0633\u0628\u062A \u0628\u0627\u0644\u0627 \u06CC\u0639\u0646\u06CC \u0631\u06CC\u0633\u06A9 \u0628\u06CC\u0634\u062A\u0631: \u0634\u0631\u06A9\u062A \u0628\u0627\u06CC\u062F \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0647\u0627\u06CC \u062B\u0627\u0628\u062A \u062F\u0627\u0634\u062A\u0647 \u0628\u0627\u0634\u062F \u0648 \u0627\u06AF\u0631 \u06A9\u0627\u0631 \u06A9\u0646\u062F \u0634\u0648\u062F\u060C \u0634\u0627\u06CC\u062F \u0646\u062A\u0648\u0627\u0646\u062F \u0628\u062F\u0647\u06CC \u0631\u0627 \u0628\u062F\u0647\u062F. \u0646\u0633\u0628\u062A \u067E\u0627\u06CC\u06CC\u0646\u200C\u062A\u0631 \u0645\u0639\u0645\u0648\u0644\u0627\u064B \u06CC\u0639\u0646\u06CC \u0648\u0627\u0645\u200C\u06AF\u06CC\u0631\u0646\u062F\u0647\u0654 \u0627\u0645\u0646\u200C\u062A\u0631."}},{id:"q3-01",chapter:3,question:{en:"What is accrual accounting, and how is it different from cash-basis accounting?",fa:"\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062A\u0639\u0647\u062F\u06CC \u0686\u06CC\u0633\u062A \u0648 \u0686\u0647 \u0641\u0631\u0642\u06CC \u0628\u0627 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u0646\u0642\u062F\u06CC \u062F\u0627\u0631\u062F\u061F"},answer:{en:"Accrual accounting records revenue when it is earned and expenses when they are incurred, no matter when cash moves. Cash-basis accounting records them only when cash is received or paid. Accrual gives a truer picture of performance in each period, so GAAP requires it.",fa:"\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062A\u0639\u0647\u062F\u06CC \u062F\u0631\u0622\u0645\u062F \u0631\u0627 \u0648\u0642\u062A\u06CC \u06A9\u0633\u0628 \u0634\u0648\u062F \u0648 \u0647\u0632\u06CC\u0646\u0647 \u0631\u0627 \u0648\u0642\u062A\u06CC \u0627\u062A\u0641\u0627\u0642 \u0628\u06CC\u0641\u062A\u062F \u062B\u0628\u062A \u0645\u06CC\u200C\u06A9\u0646\u062F\u060C \u0645\u0647\u0645 \u0646\u06CC\u0633\u062A \u067E\u0648\u0644 \u06A9\u0650\u06CC \u062C\u0627\u0628\u0647\u200C\u062C\u0627 \u0634\u0648\u062F. \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u0646\u0642\u062F\u06CC \u0641\u0642\u0637 \u0648\u0642\u062A\u06CC \u067E\u0648\u0644 \u0628\u06CC\u0627\u06CC\u062F \u06CC\u0627 \u0628\u0631\u0648\u062F \u062B\u0628\u062A \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0631\u0648\u0634 \u062A\u0639\u0647\u062F\u06CC \u062A\u0635\u0648\u06CC\u0631 \u062F\u0631\u0633\u062A\u200C\u062A\u0631\u06CC \u0627\u0632 \u0639\u0645\u0644\u06A9\u0631\u062F \u0647\u0631 \u062F\u0648\u0631\u0647 \u0645\u06CC\u200C\u062F\u0647\u062F\u060C \u0628\u0631\u0627\u06CC \u0647\u0645\u06CC\u0646 GAAP \u0622\u0646 \u0631\u0627 \u0627\u0644\u0632\u0627\u0645\u06CC \u0645\u06CC\u200C\u06A9\u0646\u062F."}},{id:"q3-02",chapter:3,question:{en:"Why do we need adjusting entries at the end of a period?",fa:"\u0686\u0631\u0627 \u0622\u062E\u0631 \u062F\u0648\u0631\u0647 \u0628\u0647 \u062B\u0628\u062A\u200C\u0647\u0627\u06CC \u0627\u0635\u0644\u0627\u062D\u06CC \u0646\u06CC\u0627\u0632 \u062F\u0627\u0631\u06CC\u0645\u061F"},answer:{en:"Some revenues and expenses build up over time without a daily transaction, such as used supplies, expired insurance, depreciation, unpaid wages, or work done but not billed. Without adjustments, the financial statements would show wrong profit and wrong balances. Adjusting entries put each revenue and expense in the correct period.",fa:"\u0628\u0639\u0636\u06CC \u062F\u0631\u0622\u0645\u062F\u0647\u0627 \u0648 \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627 \u0628\u062F\u0648\u0646 \u0645\u0639\u0627\u0645\u0644\u0647\u0654 \u0631\u0648\u0632\u0627\u0646\u0647 \u0628\u0647\u200C\u0645\u0631\u0648\u0631 \u0627\u06CC\u062C\u0627\u062F \u0645\u06CC\u200C\u0634\u0648\u0646\u062F\u060C \u0645\u062B\u0644 \u0644\u0648\u0627\u0632\u0645 \u0645\u0635\u0631\u0641\u200C\u0634\u062F\u0647\u060C \u0628\u06CC\u0645\u0647\u0654 \u0645\u0646\u0642\u0636\u06CC\u200C\u0634\u062F\u0647\u060C \u0627\u0633\u062A\u0647\u0644\u0627\u06A9\u060C \u062F\u0633\u062A\u0645\u0632\u062F \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0646\u0634\u062F\u0647 \u06CC\u0627 \u06A9\u0627\u0631\u06CC \u06A9\u0647 \u0627\u0646\u062C\u0627\u0645 \u0634\u062F\u0647 \u0648\u0644\u06CC \u0635\u0648\u0631\u062A\u200C\u062D\u0633\u0627\u0628 \u0646\u0634\u062F\u0647. \u0628\u062F\u0648\u0646 \u0627\u0635\u0644\u0627\u062D\u060C \u0635\u0648\u0631\u062A\u200C\u0647\u0627\u06CC \u0645\u0627\u0644\u06CC \u0633\u0648\u062F \u0648 \u0645\u0627\u0646\u062F\u0647\u200C\u0647\u0627\u06CC \u0627\u0634\u062A\u0628\u0627\u0647 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u0646\u062F. \u062B\u0628\u062A\u200C\u0647\u0627\u06CC \u0627\u0635\u0644\u0627\u062D\u06CC \u064
