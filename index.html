 = counted amount; a shortage is a debit.",fa:"\u0641\u0631\u0648\u0634 = \u0639\u062F\u062F \u062F\u0633\u062A\u06AF\u0627\u0647\u061B \u0646\u0642\u062F = \u0639\u062F\u062F \u0634\u0645\u0627\u0631\u0634\u061B \u06A9\u0633\u0631\u06CC \u0633\u0645\u062A \u0628\u062F\u0647\u06A9\u0627\u0631."}},{id:"c6-05",chapter:6,level:2,type:"journal",question:{en:"The cash register record shows 400 but the cash counted is 403.",fa:"\u062B\u0628\u062A \u062F\u0633\u062A\u06AF\u0627\u0647 \u0635\u0646\u062F\u0648\u0642 \u06F4\u06F0\u06F0 \u0627\u0633\u062A \u0648\u0644\u06CC \u067E\u0648\u0644 \u0634\u0645\u0631\u062F\u0647\u200C\u0634\u062F\u0647 \u06F4\u06F0\u06F3 \u0627\u0633\u062A."},lines:[{account:"cash",side:"D",amount:403},{account:"cash_os",side:"C",amount:3},{account:"sales",side:"C",amount:400}],extra:["ar","bank_fee"],explanation:{en:"An overage is a credit.",fa:"\u0627\u0636\u0627\u0641\u0647 \u0635\u0646\u062F\u0648\u0642 \u0633\u0645\u062A \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631."}},{id:"c6-06",chapter:6,level:1,type:"journal",question:{en:"The company set up a $200 petty cash fund from its bank account.",fa:"\u0634\u0631\u06A9\u062A \u06CC\u06A9 \u062A\u0646\u062E\u0648\u0627\u0647\u200C\u06AF\u0631\u062F\u0627\u0646 \u06F2\u06F0\u06F0 \u062F\u0644\u0627\u0631\u06CC \u0627\u0632 \u062D\u0633\u0627\u0628 \u0628\u0627\u0646\u06A9\u06CC \u0627\u06CC\u062C\u0627\u062F \u06A9\u0631\u062F."},lines:[{account:"petty",side:"D",amount:200},{account:"cash",side:"C",amount:200}],extra:["office_sup_exp","postage_exp"],explanation:{en:"Setting up petty cash: debit Petty Cash, credit Cash.",fa:"\u0627\u06CC\u062C\u0627\u062F \u062A\u0646\u062E\u0648\u0627\u0647: \u062A\u0646\u062E\u0648\u0627\u0647\u200C\u06AF\u0631\u062F\u0627\u0646 \u0628\u062F\u0647\u06A9\u0627\u0631\u060C \u067E\u0648\u0644 \u0646\u0642\u062F \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631."}},{id:"c6-07",chapter:6,level:2,type:"journal",question:{en:"Petty cash is 300. Payments: postage 60, office supplies 90. At month-end 150 remains. Record the reimbursement.",fa:"\u062A\u0646\u062E\u0648\u0627\u0647\u200C\u06AF\u0631\u062F\u0627\u0646 \u06F3\u06F0\u06F0 \u0627\u0633\u062A. \u062E\u0631\u062C\u200C\u0647\u0627: \u067E\u0633\u062A \u06F6\u06F0\u060C \u0644\u0648\u0627\u0632\u0645 \u0627\u062F\u0627\u0631\u06CC \u06F9\u06F0. \u0622\u062E\u0631 \u0645\u0627\u0647 \u06F1\u06F5\u06F0 \u0645\u0627\u0646\u062F\u0647 \u0627\u0633\u062A. \u062B\u0628\u062A \u0634\u0627\u0631\u0698 \u062F\u0648\u0628\u0627\u0631\u0647\u061F"},lines:[{account:"postage_exp",side:"D",amount:60},{account:"office_sup_exp",side:"D",amount:90},{account:"cash",side:"C",amount:150}],extra:["petty","delivery_exp"],explanation:{en:"Reimbursement = 300 \u2212 150 = 150. The Petty Cash account is not touched.",fa:"\u0645\u0628\u0644\u063A \u0634\u0627\u0631\u0698 = \u06F3\u06F0\u06F0 \u2212 \u06F1\u06F5\u06F0 = \u06F1\u06F5\u06F0. \u062D\u0633\u0627\u0628 \u062A\u0646\u062E\u0648\u0627\u0647\u200C\u06AF\u0631\u062F\u0627\u0646 \u062F\u0633\u062A \u0646\u0645\u06CC\u200C\u062E\u0648\u0631\u062F."}},{id:"c6-08",chapter:6,level:2,type:"fill",question:{en:"Bank balance 5,000, deposits in transit 600, outstanding checks 820. What is the adjusted bank balance?",fa:"\u0645\u0648\u062C\u0648\u062F\u06CC \u0628\u0627\u0646\u06A9 \u06F5\u066C\u06F0\u06F0\u06F0\u060C \u0648\u0627\u0631\u06CC\u0632 \u062F\u0631 \u0631\u0627\u0647 \u06F6\u06F0\u06F0\u060C \u0686\u06A9\u200C\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0646\u0634\u062F\u0647 \u06F8\u06F2\u06F0. \u0645\u0648\u062C\u0648\u062F\u06CC \u0627\u0635\u0644\u0627\u062D\u200C\u0634\u062F\u0647\u0654 \u0637\u0631\u0641 \u0628\u0627\u0646\u06A9\u061F"},answer:4780,tolerance:.5,explanation:{en:"5,000 + 600 \u2212 820 = 4,780",fa:"\u06F5\u066C\u06F0\u06F0\u06F0 + \u06F6\u06F0\u06F0 \u2212 \u06F8\u06F2\u06F0 = \u06F4\u066C\u06F7\u06F8\u06F0"}},{id:"c6-09",chapter:6,level:3,type:"fill",question:{en:"Book balance 4,800, bank fee 20, interest earned 50, customer NSF check 200. What is the adjusted book balance?",fa:"\u0645\u0648\u062C\u0648\u062F\u06CC \u062F\u0641\u0627\u062A\u0631 \u06F4\u066C\u06F8\u06F0\u06F0\u060C \u06A9\u0627\u0631\u0645\u0632\u062F \u0628\u0627\u0646\u06A9 \u06F2\u06F0\u060C \u0633\u0648\u062F \u0628\u0627\u0646\u06A9\u06CC \u06F5\u06F0\u060C \u0686\u06A9 \u0628\u0631\u06AF\u0634\u062A\u06CC \u0645\u0634\u062A\u0631\u06CC \u06F2\u06F0\u06F0. \u0645\u0648\u062C\u0648\u062F\u06CC \u0627\u0635\u0644\u0627\u062D\u200C\u0634\u062F\u0647\u0654 \u0637\u0631\u0641 \u062F\u0641\u0627\u062A\u0631\u061F"},answer:4630,tolerance:.5,explanation:{en:"4,800 + 50 \u2212 20 \u2212 200 = 4,630",fa:"\u06F4\u066C\u06F8\u06F0\u06F0 + \u06F5\u06F0 \u2212 \u06F2\u06F0 \u2212 \u06F2\u06F0\u06F0 = \u06F4\u066C\u06F6\u06F3\u06F0"}},{id:"c6-10",chapter:6,level:3,type:"journal",question:{en:"The bank reconciliation shows a $200 NSF check from a customer. Record the entry.",fa:"\u062F\u0631 \u0635\u0648\u0631\u062A \u0645\u063A\u0627\u06CC\u0631\u062A \u0628\u0627\u0646\u06A9\u06CC \u06CC\u06A9 \u0686\u06A9 \u0628\u0631\u06AF\u0634\u062A\u06CC \u06F2\u06F0\u06F0 \u062F\u0644\u0627\u0631\u06CC \u0627\u0632 \u0645\u0634\u062A\u0631\u06CC \u067E\u06CC\u062F\u0627 \u0634\u062F. \u062B\u0628\u062A \u0644\u0627\u0632\u0645\u061F"},lines:[{account:"ar",side:"D",amount:200},{account:"cash",side:"C",amount:200}],extra:["bank_fee","sales"],explanation:{en:"The customer still owes us; the book Cash balance decreases.",fa:"\u0645\u0634\u062A\u0631\u06CC \u0647\u0646\u0648\u0632 \u0628\u062F\u0647\u06A9\u0627\u0631 \u0627\u0633\u062A\u061B \u067E\u0648\u0644 \u0646\u0642\u062F \u062F\u0641\u0627\u062A\u0631 \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"c6-11",chapter:6,level:3,type:"mcq",question:{en:"Which bank reconciliation item requires a journal entry?",fa:"\u06A9\u062F\u0627\u0645 \u0645\u0648\u0631\u062F \u0635\u0648\u0631\u062A \u0645\u063A\u0627\u06CC\u0631\u062A \u0628\u0627\u0646\u06A9\u06CC \u062B\u0628\u062A \u0631\u0648\u0632\u0646\u0627\u0645\u0647 \u0644\u0627\u0632\u0645 \u062F\u0627\u0631\u062F\u061F"},options:{en:["Deposit in transit","Outstanding check","Bank service fee","Bank error"],fa:["\u0648\u0627\u0631\u06CC\u0632 \u062F\u0631 \u0631\u0627\u0647","\u0686\u06A9 \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0646\u0634\u062F\u0647","\u06A9\u0627\u0631\u0645\u0632\u062F \u0628\u0627\u0646\u06A9","\u0627\u0634\u062A\u0628\u0627\u0647 \u0628\u0627\u0646\u06A9"]},answer:2,explanation:{en:"Only book-side items need journal entries.",fa:"\u0641\u0642\u0637 \u0645\u0648\u0627\u0631\u062F \u0637\u0631\u0641 \u062F\u0641\u0627\u062A\u0631 \u062B\u0628\u062A \u0631\u0648\u0632\u0646\u0627\u0645\u0647 \u0645\u06CC\u200C\u062E\u0648\u0627\u0647\u0646\u062F."}},{id:"c7-01",chapter:7,level:1,type:"journal",question:{en:"Using the direct write-off method, the company wrote off a customer's $520 account.",fa:"\u0634\u0631\u06A9\u062A \u0628\u0647 \u0631\u0648\u0634 \u062D\u0630\u0641 \u0645\u0633\u062A\u0642\u06CC\u0645 \u062A\u0635\u0645\u06CC\u0645 \u06AF\u0631\u0641\u062A \u062D\u0633\u0627\u0628 \u06F5\u06F2\u06F0 \u062F\u0644\u0627\u0631\u06CC \u06CC\u06A9 \u0645\u0634\u062A\u0631\u06CC \u0631\u0627 \u062D\u0630\u0641 \u06A9\u0646\u062F."},lines:[{account:"bad_debts",side:"D",amount:520},{account:"ar",side:"C",amount:520}],extra:["allowance","sales"],explanation:{en:"With direct write-off, the expense is recorded at the time of write-off.",fa:"\u062F\u0631 \u062D\u0630\u0641 \u0645\u0633\u062A\u0642\u06CC\u0645\u060C \u0647\u0645\u0627\u0646 \u0644\u062D\u0638\u0647 \u0647\u0632\u06CC\u0646\u0647 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"c7-02",chapter:7,level:2,type:"journal",question:{en:"At year-end, bad debts are estimated at 1,500 using the allowance method.",fa:"\u0622\u062E\u0631 \u0633\u0627\u0644\u060C \u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0633\u0648\u062E\u062A\u200C\u0634\u062F\u0647 \u0628\u0647 \u0631\u0648\u0634 \u0630\u062E\u06CC\u0631\u0647 \u06F1\u066C\u06F5\u06F0\u06F0 \u062A\u062E\u0645\u06CC\u0646 \u0632\u062F\u0647 \u0634\u062F."},lines:[{account:"bad_debts",side:"D",amount:1500},{account:"allowance",side:"C",amount:1500}],extra:["ar","cash"],explanation:{en:"With the allowance method, the expense is recorded in the year of the sale.",fa:"\u062F\u0631 \u0631\u0648\u0634 \u0630\u062E\u06CC\u0631\u0647\u060C \u0647\u0632\u06CC\u0646\u0647 \u062F\u0631 \u0647\u0645\u0627\u0646 \u0633\u0627\u0644 \u0641\u0631\u0648\u0634 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"c7-03",chapter:7,level:2,type:"journal",question:{en:"Using the allowance method, a customer's $520 account was written off.",fa:"\u0628\u0627 \u0631\u0648\u0634 \u0630\u062E\u06CC\u0631\u0647\u060C \u062D\u0633\u0627\u0628 \u06F5\u06F2\u06F0 \u062F\u0644\u0627\u0631\u06CC \u06CC\u06A9 \u0645\u0634\u062A\u0631\u06CC \u062D\u0630\u0641 \u0634\u062F."},lines:[{account:"allowance",side:"D",amount:520},{account:"ar",side:"C",amount:520}],extra:["bad_debts","cash"],explanation:{en:"No expense is recorded when writing off an account under the allowance method.",fa:"\u062F\u0631 \u062D\u0630\u0641 \u062D\u0633\u0627\u0628 \u0628\u0627 \u0631\u0648\u0634 \u0630\u062E\u06CC\u0631\u0647\u060C \u0647\u0632\u06CC\u0646\u0647\u200C\u0627\u06CC \u062B\u0628\u062A \u0646\u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"c7-04",chapter:7,level:1,type:"fill",question:{en:"Accounts receivable are 200,000 and the allowance is 2,400. What is the realizable value?",fa:"\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u06F2\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u0648 \u0630\u062E\u06CC\u0631\u0647 \u06F2\u066C\u06F4\u06F0\u06F0 \u0627\u0633\u062A. \u0627\u0631\u0632\u0634 \u0642\u0627\u0628\u0644 \u0628\u0627\u0632\u06CC\u0627\u0641\u062A\u061F"},answer:197600,tolerance:.5,explanation:{en:"200,000 \u2212 2,400 = 197,600",fa:"\u06F2\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F4\u06F0\u06F0 = \u06F1\u06F9\u06F7\u066C\u06F6\u06F0\u06F0"}},{id:"c7-05",chapter:7,level:2,type:"fill",question:{en:"Credit sales are 400,000 and 0.6% are uncollectible. What is bad debts expense using percent of sales?",fa:"\u0641\u0631\u0648\u0634 \u0646\u0633\u06CC\u0647 \u06F4\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u0627\u0633\u062A \u0648 \u06F0\u066B\u06F6\u066A \u0622\u0646 \u0633\u0648\u062E\u062A \u0645\u06CC\u200C\u0634\u0648\u062F. \u0647\u0632\u06CC\u0646\u0647\u0654 \u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0633\u0648\u062E\u062A\u200C\u0634\u062F\u0647 \u0628\u0647 \u0631\u0648\u0634 \u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u0641\u0631\u0648\u0634\u061F"},answer:2400,tolerance:.5,explanation:{en:"400,000 \xD7 0.6% = 2,400",fa:"\u06F4\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \xD7 \u06F0\u066B\u06F6\u066A = \u06F2\u066C\u06F4\u06F0\u06F0"}},{id:"c7-06",chapter:7,level:2,type:"fill",question:{en:"The required allowance is 2,500 and the allowance now has a 200 credit balance. What is the adjusting entry amount?",fa:"\u0645\u0627\u0646\u062F\u0647\u0654 \u0644\u0627\u0632\u0645 \u0630\u062E\u06CC\u0631\u0647 \u06F2\u066C\u06F5\u06F0\u06F0 \u0627\u0633\u062A \u0648 \u0630\u062E\u06CC\u0631\u0647 \u0627\u0644\u0627\u0646 \u06F2\u06F0\u06F0 \u0645\u0627\u0646\u062F\u0647\u0654 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631 \u062F\u0627\u0631\u062F. \u0645\u0628\u0644\u063A \u062B\u0628\u062A \u0627\u0635\u0644\u0627\u062D\u06CC\u061F"},answer:2300,tolerance:.5,explanation:{en:"2,500 \u2212 200 = 2,300",fa:"\u06F2\u066C\u06F5\u06F0\u06F0 \u2212 \u06F2\u06F0\u06F0 = \u06F2\u066C\u06F3\u06F0\u06F0"}},{id:"c7-07",chapter:7,level:3,type:"fill",question:{en:"The required allowance is 2,228 and the allowance now has a 500 debit balance. What is the adjusting entry amount?",fa:"\u0645\u0627\u0646\u062F\u0647\u0654 \u0644\u0627\u0632\u0645 \u0630\u062E\u06CC\u0631\u0647 \u06F2\u066C\u06F2\u06F2\u06F8 \u0627\u0633\u062A \u0648 \u0630\u062E\u06CC\u0631\u0647 \u0627\u0644\u0627\u0646 \u06F5\u06F0\u06F0 \u0645\u0627\u0646\u062F\u0647\u0654 \u0628\u062F\u0647\u06A9\u0627\u0631 \u062F\u0627\u0631\u062F. \u0645\u0628\u0644\u063A \u062B\u0628\u062A \u0627\u0635\u0644\u0627\u062D\u06CC\u061F"},answer:2728,tolerance:.5,explanation:{en:"With a debit balance we add: 2,228 + 500 = 2,728",fa:"\u0628\u0627 \u0645\u0627\u0646\u062F\u0647\u0654 \u0628\u062F\u0647\u06A9\u0627\u0631 \u062C\u0645\u0639 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645: \u06F2\u066C\u06F2\u06F2\u06F8 + \u06F5\u06F0\u06F0 = \u06F2\u066C\u06F7\u06F2\u06F8"}},{id:"c7-08",chapter:7,level:2,type:"fill",question:{en:"A 10,000 note at 12% for 90 days (360-day year). What is the interest?",fa:"\u0633\u0646\u062F\u06CC \u0628\u0647 \u0645\u0628\u0644\u063A \u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \u0628\u0627 \u0646\u0631\u062E \u06F1\u06F2\u066A \u0628\u0631\u0627\u06CC \u06F9\u06F0 \u0631\u0648\u0632 (\u0633\u0627\u0644 \u06F3\u06F6\u06F0 \u0631\u0648\u0632\u0647). \u0628\u0647\u0631\u0647 \u0686\u0642\u062F\u0631 \u0627\u0633\u062A\u061F"},answer:300,tolerance:.5,explanation:{en:"10,000 \xD7 12% \xD7 90/360 = 300",fa:"\u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \xD7 \u06F1\u06F2\u066A \xD7 \u06F9\u06F0/\u06F3\u06F6\u06F0 = \u06F3\u06F0\u06F0"}},{id:"c7-09",chapter:7,level:3,type:"journal",question:{en:"A 90-day, 12%, 10,000 note was collected at maturity.",fa:"\u0633\u0646\u062F \u06F9\u06F0 \u0631\u0648\u0632\u0647\u0654 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \u0628\u0627 \u0646\u0631\u062E \u06F1\u06F2\u066A \u0633\u0631 \u0645\u0648\u0639\u062F \u0648\u0635\u0648\u0644 \u0634\u062F."},lines:[{account:"cash",side:"D",amount:10300},{account:"interest_rev",side:"C",amount:300},{account:"notes_rec",side:"C",amount:1e4}],extra:["ar","interest_rec"],explanation:{en:"The principal leaves Notes Receivable and the interest is revenue.",fa:"\u0627\u0635\u0644 \u0627\u0632 \u0627\u0633\u0646\u0627\u062F \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0628\u0647\u0631\u0647 \u062F\u0631\u0622\u0645\u062F \u0627\u0633\u062A."}},{id:"c7-10",chapter:7,level:3,type:"mcq",question:{en:"Which estimation method gives the EXPENSE amount directly, ignoring the current allowance balance?",fa:"\u06A9\u062F\u0627\u0645 \u0631\u0648\u0634 \u062A\u062E\u0645\u06CC\u0646 \xAB\u0645\u0633\u062A\u0642\u06CC\u0645\u0627\u064B \u0645\u0628\u0644\u063A \u0647\u0632\u06CC\u0646\u0647\xBB \u0631\u0627 \u0645\u06CC\u200C\u062F\u0647\u062F\u060C \u0628\u062F\u0648\u0646 \u062A\u0648\u062C\u0647 \u0628\u0647 \u0645\u0627\u0646\u062F\u0647\u0654 \u0641\u0639\u0644\u06CC \u0630\u062E\u06CC\u0631\u0647\u061F"},options:{en:["Percent of sales","Percent of receivables","Aging of receivables","Direct write-off"],fa:["\u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u0641\u0631\u0648\u0634","\u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627","\u0633\u0646\u06CC \u06A9\u0631\u062F\u0646 \u062D\u0633\u0627\u0628\u200C\u0647\u0627","\u062D\u0630\u0641 \u0645\u0633\u062A\u0642\u06CC\u0645"]},answer:0,explanation:{en:"Percent of sales is the income statement approach.",fa:"\u0631\u0648\u0634 \u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u0641\u0631\u0648\u0634 \u0631\u0648\u06CC\u06A9\u0631\u062F \u0635\u0648\u0631\u062A \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646 \u0627\u0633\u062A."}},{id:"c7-11",chapter:7,level:3,type:"fill",question:{en:"Net sales are 600,000 and average accounts receivable are 50,000. What is receivables turnover?",fa:"\u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635 \u06F6\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u0648 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u06F5\u06F0\u066C\u06F0\u06F0\u06F0. \u06AF\u0631\u062F\u0634 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627\u061F"},answer:12,tolerance:.5,explanation:{en:"600,000 \xF7 50,000 = 12",fa:"\u06F6\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \xF7 \u06F5\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F1\u06F2"}},{id:"c8-01",chapter:8,level:1,type:"mcq",question:{en:"Which asset is NOT depreciated?",fa:"\u06A9\u062F\u0627\u0645 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0645\u0633\u062A\u0647\u0644\u06A9 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},options:{en:["Building","Equipment","Land","Vehicle"],fa:["\u0633\u0627\u062E\u062A\u0645\u0627\u0646","\u062A\u062C\u0647\u06CC\u0632\u0627\u062A","\u0632\u0645\u06CC\u0646","\u0648\u0633\u06CC\u0644\u0647\u0654 \u0646\u0642\u0644\u06CC\u0647"]},answer:2,explanation:{en:"Land does not have a limited useful life.",fa:"\u0632\u0645\u06CC\u0646 \u0639\u0645\u0631 \u0645\u062D\u062F\u0648\u062F \u0646\u062F\u0627\u0631\u062F."}},{id:"c8-02",chapter:8,level:1,type:"fill",question:{en:"Machine price 9,000, shipping 300, installation 700. What is the cost?",fa:"\u0642\u06CC\u0645\u062A \u0645\u0627\u0634\u06CC\u0646 \u06F9\u066C\u06F0\u06F0\u06F0\u060C \u062D\u0645\u0644 \u06F3\u06F0\u06F0 \u0648 \u0646\u0635\u0628 \u06F7\u06F0\u06F0. \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647\u061F"},answer:1e4,tolerance:.5,explanation:{en:"All costs to get it ready for use: 10,000",fa:"\u0647\u0645\u0647\u0654 \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627\u06CC \u0644\u0627\u0632\u0645 \u0628\u0631\u0627\u06CC \u0622\u0645\u0627\u062F\u0647\u200C\u0633\u0627\u0632\u06CC: \u06F1\u06F0\u066C\u06F0\u06F0\u06F0"}},{id:"c8-03",chapter:8,level:1,type:"fill",question:{en:"Cost 10,000, salvage 1,000, life 5 years. What is annual straight-line depreciation?",fa:"\u0628\u0647\u0627 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0633\u0642\u0627\u0637 \u06F1\u066C\u06F0\u06F0\u06F0\u060C \u0639\u0645\u0631 \u06F5 \u0633\u0627\u0644. \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644\u0627\u0646\u0647\u0654 \u062E\u0637 \u0645\u0633\u062A\u0642\u06CC\u0645\u061F"},answer:1800,tolerance:.5,explanation:{en:"(10,000 \u2212 1,000) \xF7 5 = 1,800",fa:"(\u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u066C\u06F0\u06F0\u06F0) \xF7 \u06F5 = \u06F1\u066C\u06F8\u06F0\u06F0"}},{id:"c8-04",chapter:8,level:2,type:"fill",question:{en:"Cost 10,000, salvage 1,000, total output 36,000 units. This year 7,000 units were produced. What is this year's units-of-production depreciation?",fa:"\u0628\u0647\u0627 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0633\u0642\u0627\u0637 \u06F1\u066C\u06F0\u06F0\u06F0\u060C \u06A9\u0644 \u062A\u0648\u0644\u06CC\u062F \u06F3\u06F6\u066C\u06F0\u06F0\u06F0 \u0648\u0627\u062D\u062F. \u0627\u0645\u0633\u0627\u0644 \u06F7\u066C\u06F0\u06F0\u06F0 \u0648\u0627\u062D\u062F \u062A\u0648\u0644\u06CC\u062F \u0634\u062F. \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0627\u0645\u0633\u0627\u0644 (\u0648\u0627\u062D\u062F \u062A\u0648\u0644\u06CC\u062F)\u061F"},answer:1750,tolerance:.5,explanation:{en:"Rate = 9,000 \xF7 36,000 = 0.25; 7,000 \xD7 0.25 = 1,750",fa:"\u0646\u0631\u062E = \u06F9\u066C\u06F0\u06F0\u06F0 \xF7 \u06F3\u06F6\u066C\u06F0\u06F0\u06F0 = \u06F0\u066B\u06F2\u06F5\u061B \u06F7\u066C\u06F0\u06F0\u06F0 \xD7 \u06F0\u066B\u06F2\u06F5 = \u06F1\u066C\u06F7\u06F5\u06F0"}},{id:"c8-05",chapter:8,level:2,type:"fill",question:{en:"Cost 10,000, salvage 1,000, life 5 years. What is first-year double-declining-balance depreciation?",fa:"\u0628\u0647\u0627 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0633\u0642\u0627\u0637 \u06F1\u066C\u06F0\u06F0\u06F0\u060C \u0639\u0645\u0631 \u06F5 \u0633\u0627\u0644. \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644 \u0627\u0648\u0644 \u0628\u0647 \u0631\u0648\u0634 \u0646\u0632\u0648\u0644\u06CC \u0645\u0636\u0627\u0639\u0641\u061F"},answer:4e3,tolerance:.5,explanation:{en:"Rate = 2 \xF7 5 = 40%; 10,000 \xD7 40% = 4,000 (salvage is ignored in the rate)",fa:"\u0646\u0631\u062E = \u06F2\xF7\u06F5 = \u06F4\u06F0\u066A\u061B \u06F1\u06F0\u066C\u06F0\u06F0\u06F0 \xD7 \u06F4\u06F0\u066A = \u06F4\u066C\u06F0\u06F0\u06F0 (\u0627\u0633\u0642\u0627\u0637 \u062F\u0631 \u0646\u0631\u062E \u0644\u062D\u0627\u0638 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F)"}},{id:"c8-06",chapter:8,level:3,type:"fill",question:{en:"Same asset (cost 10,000, 5-year life, double-declining-balance): what is second-year depreciation?",fa:"\u0647\u0645\u0627\u0646 \u062F\u0627\u0631\u0627\u06CC\u06CC (\u0628\u0647\u0627 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0639\u0645\u0631 \u06F5 \u0633\u0627\u0644\u060C \u0646\u0632\u0648\u0644\u06CC \u0645\u0636\u0627\u0639\u0641): \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644 \u062F\u0648\u0645\u061F"},answer:2400,tolerance:.5,explanation:{en:"Book value at the start of year 2 = 6,000; \xD7 40% = 2,400",fa:"\u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u0627\u0648\u0644 \u0633\u0627\u0644 \u062F\u0648\u0645 = \u06F6\u066C\u06F0\u06F0\u06F0\u061B \xD7 \u06F4\u06F0\u066A = \u06F2\u066C\u06F4\u06F0\u06F0"}},{id:"c8-07",chapter:8,level:2,type:"fill",question:{en:"Annual depreciation is 1,800 and the asset was bought on October 1. What is depreciation for the first year (to December 31)?",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644\u0627\u0646\u0647 \u06F1\u066C\u06F8\u06F0\u06F0 \u0627\u0633\u062A \u0648 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0627\u0648\u0644 \u0627\u06A9\u062A\u0628\u0631 \u062E\u0631\u06CC\u062F\u0647 \u0634\u062F. \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0633\u0627\u0644 \u0627\u0648\u0644 (\u062A\u0627 \u06F3\u06F1 \u062F\u0633\u0627\u0645\u0628\u0631)\u061F"},answer:450,tolerance:.5,explanation:{en:"1,800 \xD7 3/12 = 450",fa:"\u06F1\u066C\u06F8\u06F0\u06F0 \xD7 \u06F3/\u06F1\u06F2 = \u06F4\u06F5\u06F0"}},{id:"c8-08",chapter:8,level:2,type:"journal",question:{en:"Equipment costing 8,000 with accumulated depreciation of 6,000 was sold for 3,000 cash.",fa:"\u062A\u062C\u0647\u06CC\u0632\u0627\u062A\u06CC \u0628\u0627 \u0628\u0647\u0627\u06CC \u06F8\u066C\u06F0\u0 tained"],explanation:{en:"Treasury stock reduces equity; it is not an asset.",fa:"\u0633\u0647\u0627\u0645 \u062E\u0632\u0627\u0646\u0647 \u0627\u0632 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F\u061B \u062F\u0627\u0631\u0627\u06CC\u06CC \u0646\u06CC\u0633\u062A."}},{id:"c11-09",chapter:11,level:3,type:"fill",question:{en:"Cumulative preferred stock of 100,000 at 9% has one year of dividends in arrears. This year 20,000 of dividends were declared. How much do common stockholders get?",fa:"\u0633\u0647\u0627\u0645 \u0645\u0645\u062A\u0627\u0632 \u0627\u0646\u0628\u0627\u0634\u062A\u0646\u06CC \u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u0628\u0627 \u0633\u0648\u062F \u06F9\u066A\u060C \u06CC\u06A9 \u0633\u0627\u0644 \u0633\u0648\u062F \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0646\u0634\u062F\u0647 \u062F\u0627\u0631\u062F. \u0627\u0645\u0633\u0627\u0644 \u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \u0633\u0648\u062F \u0627\u0639\u0644\u0627\u0645 \u0634\u062F. \u0633\u0647\u0645 \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC \u0686\u0642\u062F\u0631 \u0627\u0633\u062A\u061F"},answer:2e3,tolerance:.5,explanation:{en:"Preferred: 9,000 in arrears + 9,000 this year = 18,000; common: 20,000 \u2212 18,000 = 2,000",fa:"\u0645\u0645\u062A\u0627\u0632: \u06F9\u066C\u06F0\u06F0\u06F0 \u0633\u0627\u0644 \u0642\u0628\u0644 + \u06F9\u066C\u06F0\u06F0\u06F0 \u0627\u0645\u0633\u0627\u0644 = \u06F1\u06F8\u066C\u06F0\u06F0\u06F0\u061B \u0639\u0627\u062F\u06CC: \u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u06F8\u066C\u06F0\u06F0\u06F0 = \u06F2\u066C\u06F0\u06F0\u06F0"}},{id:"c11-10",chapter:11,level:3,type:"fill",question:{en:"Net income 100,000, preferred dividends 20,000, 40,000 common shares. What is EPS?",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u0645\u0645\u062A\u0627\u0632 \u06F2\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC \u06F4\u06F0\u066C\u06F0\u06F0\u06F0 \u0633\u0647\u0645. \u0633\u0648\u062F \u0647\u0631 \u0633\u0647\u0645\u061F"},answer:2,tolerance:.01,explanation:{en:"(100,000 \u2212 20,000) \xF7 40,000 = 2",fa:"(\u06F1\u06F0\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u06F0\u066C\u06F0\u06F0\u06F0) \xF7 \u06F4\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F2"}},{id:"c11-11",chapter:11,level:3,type:"fill",question:{en:"The share price is 30 and EPS is 2. What is the price-earnings ratio?",fa:"\u0642\u06CC\u0645\u062A \u0633\u0647\u0645 \u06F3\u06F0 \u0648 \u0633\u0648\u062F \u0647\u0631 \u0633\u0647\u0645 \u06F2 \u0627\u0633\u062A. \u0646\u0633\u0628\u062A \u0642\u06CC\u0645\u062A \u0628\u0647 \u0633\u0648\u062F\u061F"},answer:15,tolerance:.5,explanation:{en:"30 \xF7 2 = 15",fa:"\u06F3\u06F0 \xF7 \u06F2 = \u06F1\u06F5"}},{id:"c12-01",chapter:12,level:1,type:"mcq",question:{en:"In which section of the statement of cash flows is buying equipment for cash reported?",fa:"\u062E\u0631\u06CC\u062F \u062A\u062C\u0647\u06CC\u0632\u0627\u062A \u0646\u0642\u062F\u06CC \u062F\u0631 \u06A9\u062F\u0627\u0645 \u0628\u062E\u0634 \u0635\u0648\u0631\u062A \u062C\u0631\u06CC\u0627\u0646 \u0648\u062C\u0648\u0647 \u0646\u0642\u062F \u0645\u06CC\u200C\u0622\u06CC\u062F\u061F"},options:{en:["Operating","Investing","Financing","Not reported"],fa:["\u0639\u0645\u0644\u06CC\u0627\u062A\u06CC","\u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC","\u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC","\u0646\u0645\u06CC\u200C\u0622\u06CC\u062F"]},answer:1,explanation:{en:"Buying and selling long-term assets \u2192 investing.",fa:"\u062E\u0631\u06CC\u062F \u0648 \u0641\u0631\u0648\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC \u0628\u0644\u0646\u062F\u0645\u062F\u062A \u2190 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC."}},{id:"c12-02",chapter:12,level:1,type:"mcq",question:{en:"In which section is paying dividends reported?",fa:"\u067E\u0631\u062F\u0627\u062E\u062A \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u062F\u0631 \u06A9\u062F\u0627\u0645 \u0628\u062E\u0634 \u0645\u06CC\u200C\u0622\u06CC\u062F\u061F"},options:{en:["Operating","Investing","Financing","Not reported"],fa:["\u0639\u0645\u0644\u06CC\u0627\u062A\u06CC","\u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC","\u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC","\u0646\u0645\u06CC\u200C\u0622\u06CC\u062F"]},answer:2,explanation:{en:"Transactions with owners and lenders \u2192 financing.",fa:"\u0645\u0639\u0627\u0645\u0644\u0627\u062A \u0628\u0627 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u0648 \u0648\u0627\u0645\u200C\u062F\u0647\u0646\u062F\u06AF\u0627\u0646 \u2190 \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC."}},{id:"c12-03",chapter:12,level:1,type:"mcq",question:{en:"In which section is cash received from customers reported?",fa:"\u062F\u0631\u06CC\u0627\u0641\u062A \u067E\u0648\u0644 \u0627\u0632 \u0645\u0634\u062A\u0631\u06CC\u200C\u0647\u0627 \u062F\u0631 \u06A9\u062F\u0627\u0645 \u0628\u062E\u0634 \u0645\u06CC\u200C\u0622\u06CC\u062F\u061F"},options:{en:["Operating","Investing","Financing","Not reported"],fa:["\u0639\u0645\u0644\u06CC\u0627\u062A\u06CC","\u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC","\u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC","\u0646\u0645\u06CC\u200C\u0622\u06CC\u062F"]},answer:0,explanation:{en:"Day-to-day business \u2192 operating.",fa:"\u06A9\u0627\u0631 \u0631\u0648\u0632\u0645\u0631\u0647 \u2190 \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC."}},{id:"c12-04",chapter:12,level:2,type:"mcq",question:{en:"How is buying land by issuing common stock (no cash) reported?",fa:"\u062E\u0631\u06CC\u062F \u0632\u0645\u06CC\u0646 \u0628\u0627 \u0635\u062F\u0648\u0631 \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC (\u0628\u062F\u0648\u0646 \u067E\u0648\u0644) \u0686\u0637\u0648\u0631 \u06AF\u0632\u0627\u0631\u0634 \u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},options:{en:["Operating","Investing","Financing","Disclosed separately"],fa:["\u0639\u0645\u0644\u06CC\u0627\u062A\u06CC","\u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC","\u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC","\u062C\u062F\u0627\u06AF\u0627\u0646\u0647 \u0627\u0641\u0634\u0627 \u0645\u06CC\u200C\u0634\u0648\u062F"]},answer:3,explanation:{en:"A noncash activity \u2192 disclosed separately.",fa:"\u0641\u0639\u0627\u0644\u06CC\u062A \u063A\u06CC\u0631\u0646\u0642\u062F\u06CC \u2190 \u062C\u062F\u0627\u06AF\u0627\u0646\u0647 \u0627\u0641\u0634\u0627."}},{id:"c12-05",chapter:12,level:2,type:"mcq",question:{en:"In the indirect method, how is depreciation treated?",fa:"\u062F\u0631 \u0631\u0648\u0634 \u063A\u06CC\u0631\u0645\u0633\u062A\u0642\u06CC\u0645\u060C \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0686\u0637\u0648\u0631 \u0628\u0631\u062E\u0648\u0631\u062F \u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},options:{en:["Subtracted from net income","Added to net income","Reported in investing","Ignored"],fa:["\u0627\u0632 \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F","\u0628\u0647 \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0627\u0636\u0627\u0641\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F","\u062F\u0631 \u0628\u062E\u0634 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC \u0645\u06CC\u200C\u0622\u06CC\u062F","\u0646\u0627\u062F\u06CC\u062F\u0647 \u06AF\u0631\u0641\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F"]},answer:1,explanation:{en:"Depreciation is a noncash expense that reduced net income, so it is added back.",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0647\u0632\u06CC\u0646\u0647\u0654 \u063A\u06CC\u0631\u0646\u0642\u062F\u06CC \u0627\u0633\u062A \u0648 \u0633\u0648\u062F \u0631\u0627 \u06A9\u0645 \u06A9\u0631\u062F\u0647 \u0628\u0648\u062F\u060C \u067E\u0633 \u0628\u0631\u0645\u06CC\u200C\u06AF\u0631\u062F\u062F."}},{id:"c12-06",chapter:12,level:2,type:"mcq",question:{en:"Accounts receivable increased this year. What do we do in the indirect method?",fa:"\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u0627\u0645\u0633\u0627\u0644 \u0632\u06CC\u0627\u062F \u0634\u062F\u0647. \u062F\u0631 \u0631\u0648\u0634 \u063A\u06CC\u0631\u0645\u0633\u062A\u0642\u06CC\u0645 \u0686\u0647 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645\u061F"},options:{en:["Add it","Subtract it","Move it to financing","Nothing"],fa:["\u0627\u0636\u0627\u0641\u0647 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645","\u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645","\u0628\u0647 \u0628\u062E\u0634 \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC \u0645\u06CC\u200C\u0628\u0631\u06CC\u0645","\u0647\u06CC\u0686"]},answer:1,explanation:{en:"An increase in a current asset \u2192 subtract.",fa:"\u0627\u0641\u0632\u0627\u06CC\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC \u062C\u0627\u0631\u06CC \u2190 \u06A9\u0645 \u06A9\u0646\u06CC\u062F."}},{id:"c12-07",chapter:12,level:2,type:"fill",question:{en:"Net income 38,000, depreciation 24,000, increase in receivables 2,000. What is operating cash flow?",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u06F3\u06F8\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u06F2\u06F4\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0641\u0632\u0627\u06CC\u0634 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u06F2\u066C\u06F0\u06F0\u06F0. \u062C\u0631\u06CC\u0627\u0646 \u0646\u0642\u062F \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC\u061F"},answer:6e4,tolerance:.5,explanation:{en:"38,000 + 24,000 \u2212 2,000 = 60,000",fa:"\u06F3\u06F8\u066C\u06F0\u06F0\u06F0 + \u06F2\u06F4\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F0\u06F0\u06F0 = \u06F6\u06F0\u066C\u06F0\u06F0\u06F0"}},{id:"c12-08",chapter:12,level:3,type:"fill",question:{en:"Net income 38,000, depreciation 24,000, loss on sale of assets 6,000, gain on sale of assets 16,000, increase in receivables 2,000, increase in payables 1,000. What is operating cash flow?",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u06F3\u06F8\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u06F2\u06F4\u066C\u06F0\u06F0\u06F0\u060C \u0632\u06CC\u0627\u0646 \u0641\u0631\u0648\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC \u06F6\u066C\u06F0\u06F0\u06F0\u060C \u0633\u0648\u062F \u0641\u0631\u0648\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC \u06F1\u06F6\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0641\u0632\u0627\u06CC\u0634 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u06F2\u066C\u06F0\u06F0\u06F0\u060C \u0627\u0641\u0632\u0627\u06CC\u0634 \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC\u200C\u0647\u0627 \u06F1\u066C\u06F0\u06F0\u06F0. \u062C\u0631\u06CC\u0627\u0646 \u0646\u0642\u062F \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC\u061F"},answer:51e3,tolerance:.5,explanation:{en:"38,000 + 24,000 + 6,000 \u2212 16,000 \u2212 2,000 + 1,000 = 51,000",fa:"\u06F3\u06F8\u066C\u06F0\u06F0\u06F0 + \u06F2\u06F4\u066C\u06F0\u06F0\u06F0 + \u06F6\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u06F6\u066C\u06F0\u06F0\u06F0 \u2212 \u06F2\u066C\u06F0\u06F0\u06F0 + \u06F1\u066C\u06F0\u06F0\u06F0 = \u06F5\u06F1\u066C\u06F0\u06F0\u06F0"}},{id:"c12-09",chapter:12,level:2,type:"fill",question:{en:"Operating cash flow 20,000, investing \u221215,000, financing 5,000. What is the net change in cash?",fa:"\u062C\u0631\u06CC\u0627\u0646 \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \u06F2\u06F0\u066C\u06F0\u06F0\u06F0\u060C \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC -\u06F1\u06F5\u066C\u06F0\u06F0\u06F0\u060C \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC \u06F5\u066C\u06F0\u06F0\u06F0. \u062A\u063A\u06CC\u06CC\u0631 \u062E\u0627\u0644\u0635 \u067E\u0648\u0644 \u0646\u0642\u062F\u061F"},answer:1e4,tolerance:.5,explanation:{en:"20,000 \u2212 15,000 + 5,000 = 10,000",fa:"\u06F2\u06F0\u066C\u06F0\u06F0\u06F0 \u2212 \u06F1\u06F5\u066C\u06F0\u06F0\u06F0 + \u06F5\u066C\u06F0\u06F0\u06F0 = \u06F1\u06F0\u066C\u06F0\u06F0\u06F0"}},{id:"c12-10",chapter:12,level:2,type:"fill",question:{en:"Beginning cash is 12,000 and the net change is 10,000. What is ending cash?",fa:"\u067E\u0648\u0644 \u0646\u0642\u062F \u0627\u0648\u0644 \u0633\u0627\u0644 \u06F1\u06F2\u066C\u06F0\u06F0\u06F0 \u0648 \u062A\u063A\u06CC\u06CC\u0631 \u062E\u0627\u0644\u0635 \u06F1\u06F0\u066C\u06F0\u06F0\u06F0. \u067E\u0648\u0644 \u0646\u0642\u062F \u067E\u0627\u06CC\u0627\u0646 \u0633\u0627\u0644\u061F"},answer:22e3,tolerance:.5,explanation:{en:"12,000 + 10,000 = 22,000",fa:"\u06F1\u06F2\u066C\u06F0\u06F0\u06F0 + \u06F1\u06F0\u066C\u06F0\u06F0\u06F0 = \u06F2\u06F2\u066C\u06F0\u06F0\u06F0"}},{id:"c12-11",chapter:12,level:3,type:"statement",question:{en:"Put each cash flow in the right section and compute the net change in cash. (Positive = cash in, negative = cash out)",fa:"\u0647\u0631 \u062C\u0631\u06CC\u0627\u0646 \u0646\u0642\u062F\u06CC \u0631\u0627 \u062F\u0631 \u0628\u062E\u0634 \u062F\u0631\u0633\u062A\u0634 \u0628\u06AF\u0630\u0627\u0631\u06CC\u062F \u0648 \u062A\u063A\u06CC\u06CC\u0631 \u062E\u0627\u0644\u0635 \u067E\u0648\u0644 \u0646\u0642\u062F \u0631\u0627 \u062D\u0633\u0627\u0628 \u06A9\u0646\u06CC\u062F. (\u0639\u062F\u062F \u0645\u062B\u0628\u062A = \u0648\u0631\u0648\u062F \u067E\u0648\u0644\u060C \u0645\u0646\u0641\u06CC = \u062E\u0631\u0648\u062C)"},categories:{en:["Operating","Investing","Financing"],fa:["\u0639\u0645\u0644\u06CC\u0627\u062A\u06CC","\u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC","\u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC"]},items:[{name:{en:"Cash from customers",fa:"\u062F\u0631\u06CC\u0627\u0641\u062A \u0627\u0632 \u0645\u0634\u062A\u0631\u06CC\u200C\u0647\u0627"},amount:5e4,category:0},{name:{en:"Salaries paid",fa:"\u067E\u0631\u062F\u0627\u062E\u062A \u062D\u0642\u0648\u0642"},amount:-18e3,category:0},{name:{en:"Paid to suppliers",fa:"\u067E\u0631\u062F\u0627\u062E\u062A \u0628\u0647 \u0641\u0631\u0648\u0634\u0646\u062F\u06AF\u0627\u0646"},amount:-12e3,category:0},{name:{en:"Equipment purchased",fa:"\u062E\u0631\u06CC\u062F \u062A\u062C\u0647\u06CC\u0632\u0627\u062A"},amount:-15e3,category:1},{name:{en:"Land sold",fa:"\u0641\u0631\u0648\u0634 \u0632\u0645\u06CC\u0646"},amount:3e3,category:1},{name:{en:"Loan received",fa:"\u062F\u0631\u06CC\u0627\u0641\u062A \u0648\u0627\u0645"},amount:1e4,category:2},{name:{en:"Dividends paid",fa:"\u067E\u0631\u062F\u0627\u062E\u062A \u0633\u0648\u062F \u0633\u0647\u0627\u0645"},amount:-8e3,category:2}],targetLabel:{en:"Net change in cash",fa:"\u062A\u063A\u06CC\u06CC\u0631 \u062E\u0627\u0644\u0635 \u067E\u0648\u0644 \u0646\u0642\u062F"},target:1e4,explanation:{en:"Operating 20,000 + investing (\u221212,000) + financing 2,000 = 10,000",fa:"\u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \u06F2\u06F0\u066C\u06F0\u06F0\u06F0 + \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC (\u06F1\u06F2\u066C\u06F0\u06F0\u06F0\u2212) + \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC \u06F2\u066C\u06F0\u06F0\u06F0 = \u06F1\u06F0\u066C\u06F0\u06F0\u06F0"}}];var sh=[{id:"f1-01",chapter:1,front:{en:"Accounting Equation",fa:"\u0645\u0639\u0627\u062F\u0644\u0647\u0654 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC"},back:{en:"Assets = Liabilities + Equity",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 = \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 + \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645"}},{id:"f1-02",chapter:1,front:{en:"Asset",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC"},back:{en:"A resource the company owns that gives future benefit, like cash and equipment.",fa:"\u0645\u0646\u0628\u0639\u06CC \u06A9\u0647 \u0645\u0627\u0644 \u0634\u0631\u06A9\u062A \u0627\u0633\u062A \u0648 \u062F\u0631 \u0622\u06CC\u0646\u062F\u0647 \u0641\u0627\u06CC\u062F\u0647 \u062F\u0627\u0631\u062F\u060C \u0645\u062B\u0644 \u067E\u0648\u0644 \u0646\u0642\u062F \u0648 \u062A\u062C\u0647\u06CC\u0632\u0627\u062A."}},{id:"f1-03",chapter:1,front:{en:"Liability",fa:"\u0628\u062F\u0647\u06CC"},back:{en:"An obligation to pay others, like accounts payable.",fa:"\u062A\u0639\u0647\u062F \u0634\u0631\u06A9\u062A \u0628\u0647 \u067E\u0631\u062F\u0627\u062E\u062A \u0628\u0647 \u062F\u06CC\u06AF\u0631\u0627\u0646\u060C \u0645\u062B\u0644 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC."}},{id:"f1-04",chapter:1,front:{en:"Equity",fa:"\u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645"},back:{en:"The owners' claim on assets after subtracting liabilities.",fa:"\u0633\u0647\u0645 \u0635\u0627\u062D\u0628\u0627\u0646 \u0634\u0631\u06A9\u062A \u0627\u0632 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u060C \u0628\u0639\u062F \u0627\u0632 \u06A9\u0645 \u06A9\u0631\u062F\u0646 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627."}},{id:"f1-05",chapter:1,front:{en:"Cost Principle",fa:"\u0627\u0635\u0644 \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647"},back:{en:"Assets are recorded at the actual transaction price.",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0628\u0627 \u0642\u06CC\u0645\u062A \u0648\u0627\u0642\u0639\u06CC \u0645\u0639\u0627\u0645\u0644\u0647 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u0646\u062F."}},{id:"f1-06",chapter:1,front:{en:"Revenue Recognition Principle",fa:"\u0627\u0635\u0644 \u0634\u0646\u0627\u0633\u0627\u06CC\u06CC \u062F\u0631\u0622\u0645\u062F"},back:{en:"Revenue is recorded when the work is done.",fa:"\u062F\u0631\u0622\u0645\u062F \u0648\u0642\u062A\u06CC \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F \u06A9\u0647 \u06A9\u0627\u0631 \u0627\u0646\u062C\u0627\u0645 \u0634\u062F\u0647 \u0628\u0627\u0634\u062F."}},{id:"f1-07",chapter:1,front:{en:"Return on Assets",fa:"\u0628\u0627\u0632\u062F\u0647 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"},back:{en:"Net income \xF7 Average total assets",fa:"\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \xF7 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u06A9\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"}},{id:"f1-08",chapter:1,front:{en:"External Users",fa:"\u0627\u0633\u062A\u0641\u0627\u062F\u0647\u200C\u06A9\u0646\u0646\u062F\u06AF\u0627\u0646 \u0628\u06CC\u0631\u0648\u0646\u06CC"},back:{en:"People outside the company, like shareholders and banks.",fa:"\u0627\u0641\u0631\u0627\u062F\u06CC \u0628\u06CC\u0631\u0648\u0646 \u0627\u0632 \u0634\u0631\u06A9\u062A\u060C \u0645\u062B\u0644 \u0633\u0647\u0627\u0645\u200C\u062F\u0627\u0631\u0627\u0646 \u0648 \u0628\u0627\u0646\u06A9\u200C\u0647\u0627."}},{id:"f2-01",chapter:2,front:{en:"Debit",fa:"\u0628\u062F\u0647\u06A9\u0627\u0631"},back:{en:"The left side of an account.",fa:"\u0633\u0645\u062A \u0686\u067E \u062D\u0633\u0627\u0628."}},{id:"f2-02",chapter:2,front:{en:"Credit",fa:"\u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631"},back:{en:"The right side of an account.",fa:"\u0633\u0645\u062A \u0631\u0627\u0633\u062A \u062D\u0633\u0627\u0628."}},{id:"f2-03",chapter:2,front:{en:"Double-Entry Accounting",fa:"\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062F\u0648\u0637\u0631\u0641\u0647"},back:{en:"Every transaction affects at least two accounts and debits = credits.",fa:"\u0647\u0631 \u0645\u0639\u0627\u0645\u0644\u0647 \u062D\u062F\u0627\u0642\u0644 \u062F\u0648 \u062D\u0633\u0627\u0628 \u0631\u0627 \u062A\u063A\u06CC\u06CC\u0631 \u0645\u06CC\u200C\u062F\u0647\u062F \u0648 \u0628\u062F\u0647\u06A9\u0627\u0631 = \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631."}},{id:"f2-04",chapter:2,front:{en:"Journal",fa:"\u062F\u0641\u062A\u0631 \u0631\u0648\u0632\u0646\u0627\u0645\u0647"},back:{en:"Where transactions are first recorded in date order.",fa:"\u062C\u0627\u06CC\u06CC \u06A9\u0647 \u0645\u0639\u0627\u0645\u0644\u0627\u062A \u0628\u0647 \u062A\u0631\u062A\u06CC\u0628 \u062A\u0627\u0631\u06CC\u062E \u0627\u0648\u0644 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u0646\u062F."}},{id:"f2-05",chapter:2,front:{en:"Ledger",fa:"\u062F\u0641\u062A\u0631 \u06A9\u0644"},back:{en:"The collection of all the company's accounts and their balances.",fa:"\u0645\u062C\u0645\u0648\u0639\u0647\u0654 \u0647\u0645\u0647\u0654 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u0634\u0631\u06A9\u062A \u0628\u0627 \u0645\u0627\u0646\u062F\u0647\u200C\u0647\u0627\u06CC\u0634\u0627\u0646."}},{id:"f2-06",chapter:2,front:{en:"Trial Balance",fa:"\u062A\u0631\u0627\u0632 \u0622\u0632\u0645\u0627\u06CC\u0634\u06CC"},back:{en:"A list of all account balances to check that debits equal credits.",fa:"\u0641\u0647\u0631\u0633\u062A \u0645\u0627\u0646\u062F\u0647\u200C\u0647\u0627\u06CC \u0647\u0645\u0647\u0654 \u062D\u0633\u0627\u0628\u200C\u0647\u0627 \u0628\u0631\u0627\u06CC \u0628\u0631\u0631\u0633\u06CC \u0628\u0631\u0627\u0628\u0631\u06CC \u0628\u062F\u0647\u06A9\u0627\u0631 \u0648 \u0628\u0633\u062A\u0627\u0646\u06A9\u0627\u0631."}},{id:"f2-07",chapter:2,front:{en:"Normal Balance",fa:"\u0645\u0627\u0646\u062F\u0647\u0654 \u0639\u0627\u062F\u06CC"},back:{en:"The side that increases an account.",fa:"\u0637\u0631\u0641\u06CC \u06A9\u0647 \u062D\u0633\u0627\u0628 \u0628\u0627 \u0622\u0646 \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"f2-08",chapter:2,front:{en:"Debt Ratio",fa:"\u0646\u0633\u0628\u062A \u0628\u062F\u0647\u06CC"},back:{en:"Total liabilities \xF7 Total assets",fa:"\u06A9\u0644 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627 \xF7 \u06A9\u0644 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627"}},{id:"f3-01",chapter:3,front:{en:"Accrual Basis Accounting",fa:"\u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062A\u0639\u0647\u062F\u06CC"},back:{en:"Recording revenues and expenses in the period they occur, not when cash moves.",fa:"\u062B\u0628\u062A \u062F\u0631\u0622\u0645\u062F \u0648 \u0647\u0632\u06CC\u0646\u0647 \u062F\u0631 \u062F\u0648\u0631\u0647\u0654 \u0648\u0642\u0648\u0639\u060C \u0646\u0647 \u0632\u0645\u0627\u0646 \u062C\u0627\u0628\u0647\u200C\u062C\u0627\u06CC\u06CC \u067E\u0648\u0644."}},{id:"f3-02",chapter:3,front:{en:"Prepaid Expense",fa:"\u067E\u06CC\u0634\u200C\u067E\u0631\u062F\u0627\u062E\u062A \u0647\u0632\u06CC\u0646\u0647"},back:{en:"An expense paid in advance, like insurance.",fa:"\u0647\u0632\u06CC\u0646\u0647\u200C\u0627\u06CC \u06A9\u0647 \u067E\u0648\u0644\u0634 \u0627\u0632 \u0642\u0628\u0644 \u062F\u0627\u062F\u0647 \u0634\u062F\u0647\u060C \u0645\u062B\u0644 \u0628\u06CC\u0645\u0647."}},{id:"f3-03",chapter:3,front:{en:"Unearned Revenue",fa:"\u062F\u0631\u0622\u0645\u062F \u067E\u06CC\u0634\u200C\u062F\u0631\u06CC\u0627\u0641\u062A"},back:{en:"Cash received in advance for work not yet done. It is a liability.",fa:"\u067E\u0648\u0644\u06CC \u06A9\u0647 \u0627\u0632 \u0642\u0628\u0644 \u06AF\u0631\u0641\u062A\u0647 \u0634\u062F\u0647 \u0648\u0644\u06CC \u06A9\u0627\u0631\u0634 \u0647\u0646\u0648\u0632 \u0627\u0646\u062C\u0627\u0645 \u0646\u0634\u062F\u0647. \u0628\u062F\u0647\u06CC \u0627\u0633\u062A."}},{id:"f3-04",chapter:3,front:{en:"Accrued Expense",fa:"\u0647\u0632\u06CC\u0646\u0647\u0654 \u0645\u0639\u0648\u0642"},back:{en:"An expense incurred but not yet paid.",fa:"\u0647\u0632\u06CC\u0646\u0647\u200C\u0627\u06CC \u06A9\u0647 \u0627\u062A\u0641\u0627\u0642 \u0627\u0641\u062A\u0627\u062F\u0647 \u0648\u0644\u06CC \u0647\u0646\u0648\u0632 \u067E\u0631\u062F\u0627\u062E\u062A \u0646\u0634\u062F\u0647."}},{id:"f3-05",chapter:3,front:{en:"Accrued Revenue",fa:"\u062F\u0631\u0622\u0645\u062F \u0645\u0639\u0648\u0642"},back:{en:"Revenue earned but not yet received.",fa:"\u062F\u0631\u0622\u0645\u062F\u06CC \u06A9\u0647 \u06A9\u0633\u0628 \u0634\u062F\u0647 \u0648\u0644\u06CC \u067E\u0648\u0644\u0634 \u0647\u0646\u0648\u0632 \u0646\u06CC\u0627\u0645\u062F\u0647."}},{id:"f3-06",chapter:3,front:{en:"Accumulated Depreciation",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0627\u0646\u0628\u0627\u0634\u062A\u0647"},back:{en:"Total depreciation on an asset to date; subtracted from its cost.",fa:"\u062C\u0645\u0639 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u06CC\u06A9 \u062F\u0627\u0631\u0627\u06CC\u06CC \u062A\u0627 \u0627\u0645\u0631\u0648\u0632\u061B \u0627\u0632 \u0628\u0647\u0627\u06CC \u0622\u0646 \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"f3-07",chapter:3,front:{en:"Closing Entries",fa:"\u062B\u0628\u062A\u200C\u0647\u0627\u06CC \u0628\u0633\u062A\u0646"},back:{en:"Resetting temporary accounts to zero and moving their balances to retained earnings.",fa:"\u0635\u0641\u0631 \u06A9\u0631\u062F\u0646 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u0645\u0648\u0642\u062A \u0648 \u0627\u0646\u062A\u0642\u0627\u0644 \u0645\u0627\u0646\u062F\u0647\u0654 \u0622\u0646\u200C\u0647\u0627 \u0628\u0647 \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647."}},{id:"f3-08",chapter:3,front:{en:"Current Ratio",fa:"\u0646\u0633\u0628\u062A \u062C\u0627\u0631\u06CC"},back:{en:"Current assets \xF7 Current liabilities",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC \u062C\u0627\u0631\u06CC \xF7 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627\u06CC \u062C\u0627\u0631\u06CC"}},{id:"f4-01",chapter:4,front:{en:"Cost of Goods Sold",fa:"\u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647"},back:{en:"The cost of the goods that were sold.",fa:"\u0642\u06CC\u0645\u062A\u06CC \u06A9\u0647 \u0628\u0631\u0627\u06CC \u06A9\u0627\u0644\u0627\u0647\u0627\u06CC \u0641\u0631\u0648\u062E\u062A\u0647\u200C\u0634\u062F\u0647 \u067E\u0631\u062F\u0627\u062E\u062A\u0647 \u0628\u0648\u062F\u06CC\u0645."}},{id:"f4-02",chapter:4,front:{en:"Gross Profit",fa:"\u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635"},back:{en:"Net sales \u2212 Cost of goods sold",fa:"\u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635 \u2212 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647"}},{id:"f4-03",chapter:4,front:{en:"Perpetual Inventory System",fa:"\u0633\u06CC\u0633\u062A\u0645 \u062F\u0627\u0626\u0645\u06CC"},back:{en:"Records cost of goods sold after every sale.",fa:"\u062B\u0628\u062A \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0628\u0639\u062F \u0627\u0632 \u0647\u0631 \u0641\u0631\u0648\u0634."}},{id:"f4-04",chapter:4,front:{en:"Periodic Inventory System",fa:"\u0633\u06CC\u0633\u062A\u0645 \u0627\u062F\u0648\u0627\u0631\u06CC"},back:{en:"Computes cost of goods sold only at period-end.",fa:"\u0645\u062D\u0627\u0633\u0628\u0647\u0654 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0641\u0642\u0637 \u0622\u062E\u0631 \u062F\u0648\u0631\u0647."}},{id:"f4-05",chapter:4,front:{en:"FOB Shipping Point",fa:"\u062A\u062D\u0648\u06CC\u0644 \u062F\u0631 \u0645\u0628\u062F\u0623"},back:{en:"Goods belong to the buyer once shipped; the buyer pays shipping.",fa:"\u06A9\u0627\u0644\u0627 \u0627\u0632 \u0644\u062D\u0638\u0647\u0654 \u0627\u0631\u0633\u0627\u0644 \u0645\u0627\u0644 \u062E\u0631\u06CC\u062F\u0627\u0631 \u0627\u0633\u062A\u061B \u062E\u0631\u06CC\u062F\u0627\u0631 \u062D\u0645\u0644 \u0631\u0627 \u0645\u06CC\u200C\u062F\u0647\u062F."}},{id:"f4-06",chapter:4,front:{en:"FOB Destination",fa:"\u062A\u062D\u0648\u06CC\u0644 \u062F\u0631 \u0645\u0642\u0635\u062F"},back:{en:"Goods belong to the buyer when they arrive; the seller pays shipping.",fa:"\u06A9\u0627\u0644\u0627 \u0648\u0642\u062A\u06CC \u0628\u0631\u0633\u062F \u0645\u0627\u0644 \u062E\u0631\u06CC\u062F\u0627\u0631 \u0627\u0633\u062A\u061B \u0641\u0631\u0648\u0634\u0646\u062F\u0647 \u062D\u0645\u0644 \u0631\u0627 \u0645\u06CC\u200C\u062F\u0647\u062F."}},{id:"f4-07",chapter:4,front:{en:"Sales Discounts",fa:"\u062A\u062E\u0641\u06CC\u0641\u0627\u062A \u0641\u0631\u0648\u0634"},back:{en:"A discount the seller gives for early payment.",fa:"\u062A\u062E\u0641\u06CC\u0641\u06CC \u06A9\u0647 \u0641\u0631\u0648\u0634\u0646\u062F\u0647 \u0628\u0631\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A \u0632\u0648\u062F\u0647\u0646\u06AF\u0627\u0645 \u0645\u06CC\u200C\u062F\u0647\u062F."}},{id:"f4-08",chapter:4,front:{en:"Inventory Shrinkage",fa:"\u06A9\u0633\u0631\u06CC \u0627\u0646\u0628\u0627\u0631"},back:{en:"Lost or stolen inventory; records \u2212 count.",fa:"\u06A9\u0627\u0644\u0627\u06CC \u06AF\u0645\u200C\u0634\u062F\u0647 \u06CC\u0627 \u062F\u0632\u062F\u06CC\u062F\u0647\u200C\u0634\u062F\u0647\u061B \u0645\u0648\u062C\u0648\u062F\u06CC \u062F\u0641\u0627\u062A\u0631 \u2212 \u0634\u0645\u0627\u0631\u0634."}},{id:"f5-01",chapter:5,front:{en:"FIFO",fa:"\u0627\u0648\u0644 \u0642\u062F\u06CC\u0645\u06CC\u200C\u0647\u0627"},back:{en:"The oldest goods are sold first.",fa:"\u0642\u062F\u06CC\u0645\u06CC\u200C\u062A\u0631\u06CC\u0646 \u06A9\u0627\u0644\u0627 \u0627\u0648\u0644 \u0641\u0631\u0648\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"f5-02",chapter:5,front:{en:"LIFO",fa:"\u0627\u0648\u0644 \u062C\u062F\u06CC\u062F\u0647\u0627"},back:{en:"The newest goods are sold first.",fa:"\u062C\u062F\u06CC\u062F\u062A\u0631\u06CC\u0646 \u06A9\u0627\u0644\u0627 \u0627\u0648\u0644 \u0641\u0631\u0648\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"f5-03",chapter:5,front:{en:"Weighted Average",fa:"\u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0648\u0632\u0648\u0646"},back:{en:"The average cost of all goods available.",fa:"\u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0642\u06CC\u0645\u062A \u0647\u0645\u0647\u0654 \u06A9\u0627\u0644\u0627\u0647\u0627\u06CC \u0645\u0648\u062C\u0648\u062F."}},{id:"f5-04",chapter:5,front:{en:"Specific Identification",fa:"\u0634\u0646\u0627\u0633\u0627\u06CC\u06CC \u0648\u06CC\u0698\u0647"},back:{en:"Uses the exact cost of the item sold.",fa:"\u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0627\u0632 \u0642\u06CC\u0645\u062A \u062F\u0642\u06CC\u0642 \u0647\u0645\u0627\u0646 \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u062E\u062A\u0647\u200C\u0634\u062F\u0647."}},{id:"f5-05",chapter:5,front:{en:"Consignor",fa:"\u0627\u0645\u0627\u0646\u062A\u200C\u06AF\u0630\u0627\u0631"},back:{en:"The owner of goods another store sells; they stay in its inventory.",fa:"\u0635\u0627\u062D\u0628 \u06A9\u0627\u0644\u0627\u06CC\u06CC \u06A9\u0647 \u062F\u06CC\u06AF\u0631\u06CC \u0628\u0631\u0627\u06CC\u0634 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u062F\u061B \u06A9\u0627\u0644\u0627 \u062F\u0631 \u0645\u0648\u062C\u0648\u062F\u06CC \u0627\u0648\u0633\u062A."}},{id:"f5-06",chapter:5,front:{en:"Consignee",fa:"\u0627\u0645\u0627\u0646\u062A\u200C\u062F\u0627\u0631"},back:{en:"The store selling another's goods; they are not in its inventory.",fa:"\u0645\u063A\u0627\u0632\u0647\u200C\u0627\u06CC \u06A9\u0647 \u06A9\u0627\u0644\u0627\u06CC \u062F\u06CC\u06AF\u0631\u06CC \u0631\u0627 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u062F\u061B \u062F\u0631 \u0645\u0648\u062C\u0648\u062F\u06CC\u200C\u0627\u0634 \u0646\u0645\u06CC\u200C\u0622\u06CC\u062F."}},{id:"f5-07",chapter:5,front:{en:"Lower of Cost or Market",fa:"\u0627\u0642\u0644 \u0628\u0647\u0627 \u06CC\u0627 \u0628\u0627\u0632\u0627\u0631"},back:{en:"Report inventory at the lower of cost and replacement cost.",fa:"\u06AF\u0632\u0627\u0631\u0634 \u0645\u0648\u062C\u0648\u062F\u06CC \u0628\u0627 \u06A9\u0645\u062A\u0631\u06CC\u0646\u0650 \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647 \u0648 \u0642\u06CC\u0645\u062A \u062E\u0631\u06CC\u062F \u062F\u0648\u0628\u0627\u0631\u0647."}},{id:"f5-08",chapter:5,front:{en:"Net Realizable Value",fa:"\u0627\u0631\u0632\u0634 \u062E\u0627\u0644\u0635 \u0628\u0627\u0632\u06CC\u0627\u0641\u062A\u0646\u06CC"},back:{en:"Selling price minus costs to sell.",fa:"\u0642\u06CC\u0645\u062A \u0641\u0631\u0648\u0634 \u0645\u0646\u0647\u0627\u06CC \u0647\u0632\u06CC\u0646\u0647\u0654 \u0641\u0631\u0648\u0634."}},{id:"f6-01",chapter:6,front:{en:"Internal Control",fa:"\u06A9\u0646\u062A\u0631\u0644 \u062F\u0627\u062E\u0644\u06CC"},back:{en:"Policies that protect assets and make accounting reliable.",fa:"\u0633\u06CC\u0627\u0633\u062A\u200C\u0647\u0627\u06CC\u06CC \u0628\u0631\u0627\u06CC \u062D\u0641\u0627\u0638\u062A \u0627\u0632 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0648 \u0642\u0627\u0628\u0644 \u0627\u0639\u062A\u0645\u0627\u062F \u06A9\u0631\u062F\u0646 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC."}},{id:"f6-02",chapter:6,front:{en:"Fraud Triangle",fa:"\u0645\u062B\u0644\u062B \u062A\u0642\u0644\u0628"},back:{en:"Opportunity, pressure, and rationalization.",fa:"\u0641\u0631\u0635\u062A\u060C \u0641\u0634\u0627\u0631 \u0648 \u062A\u0648\u062C\u06CC\u0647."}},{id:"f6-03",chapter:6,front:{en:"Collusion",fa:"\u062A\u0628\u0627\u0646\u06CC"},back:{en:"Two or more people secretly working together to get around controls.",fa:"\u0647\u0645\u06A9\u0627\u0631\u06CC \u067E\u0646\u0647\u0627\u0646\u06CC \u062F\u0648 \u06CC\u0627 \u0686\u0646\u062F \u0646\u0641\u0631 \u0628\u0631\u0627\u06CC \u062F\u0648\u0631 \u0632\u062F\u0646 \u06A9\u0646\u062A\u0631\u0644\u200C\u0647\u0627."}},{id:"f6-04",chapter:6,front:{en:"Petty Cash",fa:"\u062A\u0646\u062E\u0648\u0627\u0647\u200C\u06AF\u0631\u062F\u0627\u0646"},back:{en:"A small cash fund for minor payments.",fa:"\u0635\u0646\u062F\u0648\u0642 \u06A9\u0648\u0686\u06A9 \u067E\u0648\u0644 \u0646\u0642\u062F \u0628\u0631\u0627\u06CC \u062E\u0631\u062C\u200C\u0647\u0627\u06CC \u0631\u06CC\u0632."}},{id:"f6-05",chapter:6,front:{en:"Cash Over and Short",fa:"\u0627\u0636\u0627\u0641\u0647 \u0648 \u06A9\u0633\u0631\u06CC \u0635\u0646\u062F\u0648\u0642"},back:{en:"The difference between cash counted and the register record.",fa:"\u0641\u0631\u0642 \u067E\u0648\u0644 \u0634\u0645\u0631\u062F\u0647\u200C\u0634\u062F\u0647 \u0628\u0627 \u062B\u0628\u062A \u062F\u0633\u062A\u06AF\u0627\u0647 \u0635\u0646\u062F\u0648\u0642."}},{id:"f6-06",chapter:6,front:{en:"Deposit in Transit",fa:"\u0648\u0627\u0631\u06CC\u0632 \u062F\u0631 \u0631\u0627\u0647"},back:{en:"Cash deposited but not yet recorded by the bank; add to the bank side.",fa:"\u067E\u0648\u0644\u06CC \u06A9\u0647 \u0648\u0627\u0631\u06CC\u0632 \u0634\u062F\u0647 \u0648\u0644\u06CC \u0628\u0627\u0646\u06A9 \u0647\u0646\u0648\u0632 \u062B\u0628\u062A \u0646\u06A9\u0631\u062F\u0647\u061B \u0628\u0647 \u0637\u0631\u0641 \u0628\u0627\u0646\u06A9 \u0627\u0636\u0627\u0641\u0647."}},{id:"f6-07",chapter:6,front:{en:"Outstanding Check",fa:"\u0686\u06A9 \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0646\u0634\u062F\u0647"},back:{en:"A check written but not yet cleared by the bank; subtract from the bank side.",fa:"\u0686\u06A9\u06CC \u06A9\u0647 \u062F\u0627\u062F\u0647 \u0634\u062F\u0647 \u0648\u0644\u06CC \u0647\u0646\u0648\u0632 \u0628\u0647 \u0628\u0627\u0646\u06A9 \u0646\u0631\u0633\u06CC\u062F\u0647\u061B \u0627\u0632 \u0637\u0631\u0641 \u0628\u0627\u0646\u06A9 \u06A9\u0645."}},{id:"f6-08",chapter:6,front:{en:"NSF Check",fa:"\u0686\u06A9 \u0628\u0631\u06AF\u0634\u062A\u06CC"},back:{en:"A customer check returned for insufficient funds; subtract from the book side.",fa:"\u0686\u06A9 \u0645\u0634\u062A\u0631\u06CC \u06A9\u0647 \u062D\u0633\u0627\u0628\u0634 \u067E\u0648\u0644 \u0646\u062F\u0627\u0634\u062A\u061B \u0627\u0632 \u0637\u0631\u0641 \u062F\u0641\u0627\u062A\u0631 \u06A9\u0645."}},{id:"f7-01",chapter:7,front:{en:"Accounts Receivable",fa:"\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC"},back:{en:"Amounts customers owe from credit sales.",fa:"\u067E\u0648\u0644\u06CC \u06A9\u0647 \u0645\u0634\u062A\u0631\u06CC\u200C\u0647\u0627 \u0628\u0627\u0628\u062A \u0641\u0631\u0648\u0634 \u0646\u0633\u06CC\u0647 \u0628\u062F\u0647\u06A9\u0627\u0631\u0646\u062F."}},{id:"f7-02",chapter:7,front:{en:"Direct Write-Off Method",fa:"\u0631\u0648\u0634 \u062D\u0630\u0641 \u0645\u0633\u062A\u0642\u06CC\u0645"},back:{en:"Records the expense only when sure the cash will not come.",fa:"\u062B\u0628\u062A \u0647\u0632\u06CC\u0646\u0647 \u0641\u0642\u0637 \u0648\u0642\u062A\u06CC \u0645\u0637\u0645\u0626\u0646 \u0634\u062F\u06CC\u0645 \u067E\u0648\u0644 \u0646\u0645\u06CC\u200C\u0622\u06CC\u062F."}},{id:"f7-03",chapter:7,front:{en:"Allowance Method",fa:"\u0631\u0648\u0634 \u0630\u062E\u06CC\u0631\u0647"},back:{en:"Estimates bad debts in the same period as the sale.",fa:"\u062A\u062E\u0645\u06CC\u0646 \u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0633\u0648\u062E\u062A\u200C\u0634\u062F\u0647 \u062F\u0631 \u0647\u0645\u0627\u0646 \u062F\u0648\u0631\u0647\u0654 \u0641\u0631\u0648\u0634."}},{id:"f7-04",chapter:7,front:{en:"Allowance for Doubtful Accounts",fa:"\u0630\u062E\u06CC\u0631\u0647\u0654 \u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0645\u0634\u06A9\u0648\u06A9\u200C\u0627\u0644\u0648\u0635\u0648\u0644"},back:{en:"A contra account to receivables for amounts likely uncollectible.",fa:"\u062D\u0633\u0627\u0628 \u06A9\u0627\u0647\u0646\u062F\u0647\u0654 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u0628\u0631\u0627\u06CC \u0645\u0628\u0627\u0644\u063A \u0627\u062D\u062A\u0645\u0627\u0644\u0627\u064B \u063A\u06CC\u0631\u0642\u0627\u0628\u0644 \u0648\u0635\u0648\u0644."}},{id:"f7-05",chapter:7,front:{en:"Aging of Receivables",fa:"\u0633\u0646\u06CC \u06A9\u0631\u062F\u0646 \u062D\u0633\u0627\u0628\u200C\u0647\u0627"},back:{en:"Grouping receivables by how long they are past due and applying a bad-debt percent to each group.",fa:"\u062A\u0642\u0633\u06CC\u0645 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u0628\u0631 \u0627\u0633\u0627\u0633 \u0645\u062F\u062A \u06AF\u0630\u0634\u062A\u0647 \u0648 \u0627\u0639\u0645\u0627\u0644 \u062F\u0631\u0635\u062F \u0633\u0648\u062E\u062A \u0628\u0647 \u0647\u0631 \u06AF\u0631\u0648\u0647."}},{id:"f7-06",chapter:7,front:{en:"Note Receivable",fa:"\u0633\u0646\u062F \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC"},back:{en:"A customer's written promise to pay an amount with interest on a set date.",fa:"\u0642\u0648\u0644 \u06A9\u062A\u0628\u06CC \u0645\u0634\u062A\u0631\u06CC \u0628\u0647 \u067E\u0631\u062F\u0627\u062E\u062A \u0645\u0628\u0644\u063A\u06CC \u0628\u0627 \u0628\u0647\u0631\u0647 \u062F\u0631 \u062A\u0627\u0631\u06CC\u062E \u0645\u0639\u06CC\u0646."}},{id:"f7-07",chapter:7,front:{en:"Dishonored Note",fa:"\u0633\u0646\u062F \u0646\u06A9\u0648\u0644\u200C\u0634\u062F\u0647"},back:{en:"A note not paid at maturity.",fa:"\u0633\u0646\u062F\u06CC \u06A9\u0647 \u0633\u0631 \u0645\u0648\u0639\u062F \u067E\u0631\u062F\u0627\u062E\u062A \u0646\u0634\u062F\u0647."}},{id:"f7-08",chapter:7,front:{en:"Accounts Receivable Turnover",fa:"\u06AF\u0631\u062F\u0634 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627"},back:{en:"Net sales \xF7 Average receivables",fa:"\u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635 \xF7 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627"}},{id:"f8-01",chapter:8,front:{en:"Plant Asset",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC \u062B\u0627\u0628\u062A"},back:{en:"A tangible asset used in operations for more than one year.",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC \u0645\u0644\u0645\u0648\u0633\u06CC \u06A9\u0647 \u0628\u06CC\u0634 \u0627\u0632 \u06CC\u06A9 \u0633\u0627\u0644 \u062F\u0631 \u06A9\u0627\u0631 \u0634\u0631\u06A9\u062A \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"f8-02",chapter:8,front:{en:"Depreciation",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9"},back:{en:"Allocating an asset's cost over its useful life.",fa:"\u067E\u062E\u0634 \u06A9\u0631\u062F\u0646 \u0628\u0647\u0627\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC \u0628\u06CC\u0646 \u0633\u0627\u0644\u200C\u0647\u0627\u06CC \u0 ill",fa:"\u0633\u0631\u0642\u0641\u0644\u06CC"},back:{en:"The amount paid in buying a company above the fair value of its net assets.",fa:"\u0645\u0628\u0644\u063A\u06CC \u06A9\u0647 \u062F\u0631 \u062E\u0631\u06CC\u062F \u06CC\u06A9 \u0634\u0631\u06A9\u062A \u0628\u06CC\u0634 \u0627\u0632 \u0627\u0631\u0632\u0634 \u062E\u0627\u0644\u0635 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC\u0634 \u067E\u0631\u062F\u0627\u062E\u062A \u0634\u062F\u0647."}},{id:"f9-01",chapter:9,front:{en:"Current Liability",fa:"\u0628\u062F\u0647\u06CC \u062C\u0627\u0631\u06CC"},back:{en:"A liability due within one year.",fa:"\u0628\u062F\u0647\u06CC\u200C\u0627\u06CC \u06A9\u0647 \u0638\u0631\u0641 \u06CC\u06A9 \u0633\u0627\u0644 \u067E\u0631\u062F\u0627\u062E\u062A \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"f9-02",chapter:9,front:{en:"Sales Taxes Payable",fa:"\u0645\u0627\u0644\u06CC\u0627\u062A \u0641\u0631\u0648\u0634 \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC"},back:{en:"Tax collected from customers that must be paid to the government.",fa:"\u0645\u0627\u0644\u06CC\u0627\u062A\u06CC \u06A9\u0647 \u0627\u0632 \u0645\u0634\u062A\u0631\u06CC \u06AF\u0631\u0641\u062A\u0647 \u0634\u062F\u0647 \u0648 \u0628\u0627\u06CC\u062F \u0628\u0647 \u062F\u0648\u0644\u062A \u062F\u0627\u062F\u0647 \u0634\u0648\u062F."}},{id:"f9-03",chapter:9,front:{en:"Gross Pay",fa:"\u062D\u0642\u0648\u0642 \u0646\u0627\u062E\u0627\u0644\u0635"},back:{en:"Total pay before deductions.",fa:"\u06A9\u0644 \u062D\u0642\u0648\u0642 \u0642\u0628\u0644 \u0627\u0632 \u06A9\u0633\u0648\u0631\u0627\u062A."}},{id:"f9-04",chapter:9,front:{en:"Net Pay",fa:"\u062D\u0642\u0648\u0642 \u062E\u0627\u0644\u0635"},back:{en:"Gross pay minus deductions.",fa:"\u062D\u0642\u0648\u0642 \u0646\u0627\u062E\u0627\u0644\u0635 \u0645\u0646\u0647\u0627\u06CC \u06A9\u0633\u0648\u0631\u0627\u062A."}},{id:"f9-05",chapter:9,front:{en:"FICA Taxes",fa:"\u0645\u0627\u0644\u06CC\u0627\u062A \u062A\u0623\u0645\u06CC\u0646 \u0627\u062C
