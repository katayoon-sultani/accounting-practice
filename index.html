7\u0631 \u062F\u0631\u0622\u0645\u062F \u0648 \u0647\u0632\u06CC\u0646\u0647 \u0631\u0627 \u062F\u0631 \u062F\u0648\u0631\u0647\u0654 \u062F\u0631\u0633\u062A\u0634 \u0645\u06CC\u200C\u06AF\u0630\u0627\u0631\u0646\u062F."}},{id:"q3-03",chapter:3,question:{en:"What are the four types of adjusting entries? Give one example of each.",fa:"\u0686\u0647\u0627\u0631 \u0646\u0648\u0639 \u062B\u0628\u062A \u0627\u0635\u0644\u0627\u062D\u06CC \u06A9\u062F\u0627\u0645\u200C\u0627\u0646\u062F\u061F \u0628\u0631\u0627\u06CC \u0647\u0631 \u06A9\u062F\u0627\u0645 \u06CC\u06A9 \u0645\u062B\u0627\u0644 \u0628\u0632\u0646\u06CC\u062F."},answer:{en:"(1) Prepaid expenses: paid in advance, then used up, e.g. insurance. (2) Unearned revenues: received in advance, then earned, e.g. a customer deposit. (3) Accrued expenses: incurred but not yet paid, e.g. wages owed at month-end. (4) Accrued revenues: earned but not yet received, e.g. work done but not billed.",fa:"(\u06F1) \u067E\u06CC\u0634\u200C\u067E\u0631\u062F\u0627\u062E\u062A \u0647\u0632\u06CC\u0646\u0647: \u0627\u0632 \u0642\u0628\u0644 \u067E\u0631\u062F\u0627\u062E\u062A \u0634\u062F\u0647 \u0648 \u0628\u0639\u062F \u0645\u0635\u0631\u0641 \u0645\u06CC\u200C\u0634\u0648\u062F\u060C \u0645\u062B\u0644 \u0628\u06CC\u0645\u0647. (\u06F2) \u067E\u06CC\u0634\u200C\u062F\u0631\u06CC\u0627\u0641\u062A \u062F\u0631\u0622\u0645\u062F: \u0627\u0632 \u0642\u0628\u0644 \u062F\u0631\u06CC\u0627\u0641\u062A \u0634\u062F\u0647 \u0648 \u0628\u0639\u062F \u06A9\u0633\u0628 \u0645\u06CC\u200C\u0634\u0648\u062F\u060C \u0645\u062B\u0644 \u0628\u06CC\u0639\u0627\u0646\u0647\u0654 \u0645\u0634\u062A\u0631\u06CC. (\u06F3) \u0647\u0632\u06CC\u0646\u0647\u0654 \u0645\u0639\u0648\u0642: \u0627\u062A\u0641\u0627\u0642 \u0627\u0641\u062A\u0627\u062F\u0647 \u0648\u0644\u06CC \u067E\u0631\u062F\u0627\u062E\u062A \u0646\u0634\u062F\u0647\u060C \u0645\u062B\u0644 \u062F\u0633\u062A\u0645\u0632\u062F \u0622\u062E\u0631 \u0645\u0627\u0647. (\u06F4) \u062F\u0631\u0622\u0645\u062F \u0645\u0639\u0648\u0642: \u06A9\u0633\u0628 \u0634\u062F\u0647 \u0648\u0644\u06CC \u067E\u0648\u0644\u0634 \u0646\u06CC\u0627\u0645\u062F\u0647\u060C \u0645\u062B\u0644 \u06A9\u0627\u0631\u06CC \u06A9\u0647 \u0627\u0646\u062C\u0627\u0645 \u0634\u062F\u0647 \u0648\u0644\u06CC \u0635\u0648\u0631\u062A\u200C\u062D\u0633\u0627\u0628 \u0646\u0634\u062F\u0647."}},{id:"q3-04",chapter:3,question:{en:"Why is depreciation recorded in Accumulated Depreciation instead of reducing the asset directly?",fa:"\u0686\u0631\u0627 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u062F\u0631 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0645\u0633\u062A\u0642\u06CC\u0645 \u0627\u0632 \u062F\u0627\u0631\u0627\u06CC\u06CC \u06A9\u0645 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},answer:{en:"So that the balance sheet keeps showing the asset's original cost and, separately, how much of it has been used up. Users can see both what was paid and the remaining book value. It is also only an estimate, so keeping it separate is more transparent.",fa:"\u062A\u0627 \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647 \u0647\u0645 \u0628\u0647\u0627\u06CC \u0627\u0635\u0644\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC \u0631\u0627 \u0646\u0634\u0627\u0646 \u062F\u0647\u062F \u0648 \u0647\u0645 \u062C\u062F\u0627\u06AF\u0627\u0646\u0647 \u0627\u06CC\u0646\u06A9\u0647 \u0686\u0642\u062F\u0631\u0634 \u0645\u0635\u0631\u0641 \u0634\u062F\u0647. \u0627\u0633\u062A\u0641\u0627\u062F\u0647\u200C\u06A9\u0646\u0646\u062F\u06AF\u0627\u0646 \u0647\u0645 \u0645\u0628\u0644\u063A \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0634\u062F\u0647 \u0631\u0627 \u0645\u06CC\u200C\u0628\u06CC\u0646\u0646\u062F \u0648 \u0647\u0645 \u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u0628\u0627\u0642\u06CC\u200C\u0645\u0627\u0646\u062F\u0647 \u0631\u0627. \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0641\u0642\u0637 \u06CC\u06A9 \u062A\u062E\u0645\u06CC\u0646 \u0627\u0633\u062A\u060C \u067E\u0633 \u062C\u062F\u0627 \u0646\u06AF\u0647 \u062F\u0627\u0634\u062A\u0646\u0634 \u0634\u0641\u0627\u0641\u200C\u062A\u0631 \u0627\u0633\u062A."}},{id:"q3-05",chapter:3,question:{en:"Why do we make closing entries, and which accounts are closed?",fa:"\u0686\u0631\u0627 \u062B\u0628\u062A\u200C\u0647\u0627\u06CC \u0628\u0633\u062A\u0646 \u0627\u0646\u062C\u0627\u0645 \u0645\u06CC\u200C\u062F\u0647\u06CC\u0645 \u0648 \u06A9\u062F\u0627\u0645 \u062D\u0633\u0627\u0628\u200C\u0647\u0627 \u0628\u0633\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F\u061F"},answer:{en:"Revenues, expenses, and dividends are temporary accounts that measure one period. Closing entries reset them to zero so the next period starts fresh, and move their net effect into Retained Earnings. Permanent accounts (assets, liabilities, equity) are not closed.",fa:"\u062F\u0631\u0622\u0645\u062F\u060C \u0647\u0632\u06CC\u0646\u0647 \u0648 \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u0645\u0648\u0642\u062A\u200C\u0627\u0646\u062F \u06A9\u0647 \u0641\u0642\u0637 \u06CC\u06A9 \u062F\u0648\u0631\u0647 \u0631\u0627 \u0627\u0646\u062F\u0627\u0632\u0647 \u0645\u06CC\u200C\u06AF\u06CC\u0631\u0646\u062F. \u062B\u0628\u062A\u200C\u0647\u0627\u06CC \u0628\u0633\u062A\u0646 \u0622\u0646\u200C\u0647\u0627 \u0631\u0627 \u0635\u0641\u0631 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F \u062A\u0627 \u062F\u0648\u0631\u0647\u0654 \u0628\u0639\u062F \u0627\u0632 \u0635\u0641\u0631 \u0634\u0631\u0648\u0639 \u0634\u0648\u062F \u0648 \u0627\u062B\u0631 \u062E\u0627\u0644\u0635\u0634\u0627\u0646 \u0631\u0627 \u0628\u0647 \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u0645\u0646\u062A\u0642\u0644 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F. \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0627\u0626\u0645\u06CC (\u062F\u0627\u0631\u0627\u06CC\u06CC\u060C \u0628\u062F\u0647\u06CC\u060C \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645) \u0628\u0633\u062A\u0647 \u0646\u0645\u06CC\u200C\u0634\u0648\u0646\u062F."}},{id:"q3-06",chapter:3,question:{en:"What do profit margin and current ratio tell us?",fa:"\u062D\u0627\u0634\u06CC\u0647\u0654 \u0633\u0648\u062F \u0648 \u0646\u0633\u0628\u062A \u062C\u0627\u0631\u06CC \u0686\u0647 \u0686\u06CC\u0632\u06CC \u0628\u0647 \u0645\u0627 \u0645\u06CC\u200C\u06AF\u0648\u06CC\u0646\u062F\u061F"},answer:{en:"Profit margin (net income \xF7 net sales) shows how much of each sales dollar becomes profit, a measure of profitability. Current ratio (current assets \xF7 current liabilities) shows whether the company can pay its short-term debts, a measure of liquidity. A company can be profitable but have poor liquidity, so both matter.",fa:"\u062D\u0627\u0634\u06CC\u0647\u0654 \u0633\u0648\u062F (\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \xF7 \u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635) \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0627\u0632 \u0647\u0631 \u062F\u0644\u0627\u0631 \u0641\u0631\u0648\u0634 \u0686\u0642\u062F\u0631 \u0633\u0648\u062F \u0645\u06CC\u200C\u0645\u0627\u0646\u062F\u060C \u06CC\u0639\u0646\u06CC \u0633\u0648\u062F\u0622\u0648\u0631\u06CC. \u0646\u0633\u0628\u062A \u062C\u0627\u0631\u06CC (\u062F\u0627\u0631\u0627\u06CC\u06CC \u062C\u0627\u0631\u06CC \xF7 \u0628\u062F\u0647\u06CC \u062C\u0627\u0631\u06CC) \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0634\u0631\u06A9\u062A \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0628\u062F\u0647\u06CC\u200C\u0647\u0627\u06CC \u06A9\u0648\u062A\u0627\u0647\u200C\u0645\u062F\u062A\u0634 \u0631\u0627 \u0628\u067E\u0631\u062F\u0627\u0632\u062F \u06CC\u0627 \u0646\u0647\u060C \u06CC\u0639\u0646\u06CC \u0646\u0642\u062F\u0634\u0648\u0646\u062F\u06AF\u06CC. \u0634\u0631\u06A9\u062A \u0645\u0645\u06A9\u0646 \u0627\u0633\u062A \u0633\u0648\u062F\u0622\u0648\u0631 \u0628\u0627\u0634\u062F \u0648\u0644\u06CC \u0646\u0642\u062F\u0634\u0648\u0646\u062F\u06AF\u06CC \u0636\u0639\u06CC\u0641\u06CC \u062F\u0627\u0634\u062A\u0647 \u0628\u0627\u0634\u062F\u060C \u067E\u0633 \u0647\u0631 \u062F\u0648 \u0645\u0647\u0645\u200C\u0627\u0646\u062F."}},{id:"q4-01",chapter:4,question:{en:"How is a merchandising company different from a service company?",fa:"\u0634\u0631\u06A9\u062A \u0628\u0627\u0632\u0631\u06AF\u0627\u0646\u06CC \u0686\u0647 \u0641\u0631\u0642\u06CC \u0628\u0627 \u0634\u0631\u06A9\u062A \u062E\u062F\u0645\u0627\u062A\u06CC \u062F\u0627\u0631\u062F\u061F"},answer:{en:"A service company sells time and skills, so its income is revenues minus expenses. A merchandiser buys products and resells them, so it has an extra step: it subtracts cost of goods sold from net sales to find gross profit, and then subtracts operating expenses to find net income. It also has inventory on its balance sheet.",fa:"\u0634\u0631\u06A9\u062A \u062E\u062F\u0645\u0627\u062A\u06CC \u0648\u0642\u062A \u0648 \u0645\u0647\u0627\u0631\u062A \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u062F\u060C \u067E\u0633 \u0633\u0648\u062F\u0634 \u062F\u0631\u0622\u0645\u062F \u0645\u0646\u0647\u0627\u06CC \u0647\u0632\u06CC\u0646\u0647 \u0627\u0633\u062A. \u0634\u0631\u06A9\u062A \u0628\u0627\u0632\u0631\u06AF\u0627\u0646\u06CC \u06A9\u0627\u0644\u0627 \u0645\u06CC\u200C\u062E\u0631\u062F \u0648 \u062F\u0648\u0628\u0627\u0631\u0647 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u062F\u060C \u067E\u0633 \u06CC\u06A9 \u0645\u0631\u062D\u0644\u0647\u0654 \u0627\u0636\u0627\u0641\u0647 \u062F\u0627\u0631\u062F: \u0627\u0632 \u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u062F \u062A\u0627 \u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635 \u0628\u0647 \u062F\u0633\u062A \u0628\u06CC\u0627\u06CC\u062F\u060C \u0628\u0639\u062F \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627\u06CC \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0647\u0645\u0686\u0646\u06CC\u0646 \u0645\u0648\u062C\u0648\u062F\u06CC \u06A9\u0627\u0644\u0627 \u062F\u0631 \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647\u200C\u0627\u0634 \u062F\u0627\u0631\u062F."}},{id:"q4-02",chapter:4,question:{en:"What is the difference between a perpetual and a periodic inventory system? Why do most companies use perpetual?",fa:"\u0641\u0631\u0642 \u0633\u06CC\u0633\u062A\u0645 \u062F\u0627\u0626\u0645\u06CC \u0648 \u0627\u062F\u0648\u0627\u0631\u06CC \u0686\u06CC\u0633\u062A\u061F \u0686\u0631\u0627 \u0628\u06CC\u0634\u062A\u0631 \u0634\u0631\u06A9\u062A\u200C\u0647\u0627 \u0633\u06CC\u0633\u062A\u0645 \u062F\u0627\u0626\u0645\u06CC \u0631\u0627 \u0627\u0646\u062A\u062E\u0627\u0628 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F\u061F"},answer:{en:"A perpetual system updates inventory and cost of goods sold after every purchase and sale. A periodic system calculates cost of goods sold only at the end of the period by counting inventory. Most companies use perpetual because computers make it easy, and managers always know how much stock they have, which helps with reordering and spotting theft.",fa:"\u0633\u06CC\u0633\u062A\u0645 \u062F\u0627\u0626\u0645\u06CC \u0645\u0648\u062C\u0648\u062F\u06CC \u0648 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0631\u0627 \u0628\u0639\u062F \u0627\u0632 \u0647\u0631 \u062E\u0631\u06CC\u062F \u0648 \u0641\u0631\u0648\u0634 \u0628\u0647\u200C\u0631\u0648\u0632 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0633\u06CC\u0633\u062A\u0645 \u0627\u062F\u0648\u0627\u0631\u06CC \u0641\u0642\u0637 \u0622\u062E\u0631 \u062F\u0648\u0631\u0647 \u0628\u0627 \u0634\u0645\u0627\u0631\u0634 \u0627\u0646\u0628\u0627\u0631 \u0622\u0646 \u0631\u0627 \u062D\u0633\u0627\u0628 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0628\u06CC\u0634\u062A\u0631 \u0634\u0631\u06A9\u062A\u200C\u0647\u0627 \u0633\u06CC\u0633\u062A\u0645 \u062F\u0627\u0626\u0645\u06CC \u0631\u0627 \u0627\u0646\u062A\u062E\u0627\u0628 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F \u0686\u0648\u0646 \u06A9\u0627\u0645\u067E\u06CC\u0648\u062A\u0631 \u0622\u0646 \u0631\u0627 \u0622\u0633\u0627\u0646 \u06A9\u0631\u062F\u0647 \u0648 \u0645\u062F\u06CC\u0631\u0627\u0646 \u0647\u0645\u06CC\u0634\u0647 \u0645\u06CC\u200C\u062F\u0627\u0646\u0646\u062F \u0686\u0642\u062F\u0631 \u06A9\u0627\u0644\u0627 \u062F\u0627\u0631\u0646\u062F\u060C \u06A9\u0647 \u0628\u0631\u0627\u06CC \u0633\u0641\u0627\u0631\u0634 \u062F\u0648\u0628\u0627\u0631\u0647 \u0648 \u067E\u06CC\u062F\u0627 \u06A9\u0631\u062F\u0646 \u062F\u0632\u062F\u06CC \u0645\u0641\u06CC\u062F \u0627\u0633\u062A."}},{id:"q4-03",chapter:4,question:{en:"Why do sellers offer cash discounts like 2/10, n/30? Should buyers take them?",fa:"\u0686\u0631\u0627 \u0641\u0631\u0648\u0634\u0646\u062F\u0647\u200C\u0647\u0627 \u062A\u062E\u0641\u06CC\u0641 \u0646\u0642\u062F\u06CC \u0645\u062B\u0644 2/10, n/30 \u0645\u06CC\u200C\u062F\u0647\u0646\u062F\u061F \u0622\u06CC\u0627 \u062E\u0631\u06CC\u062F\u0627\u0631 \u0628\u0627\u06CC\u062F \u0627\u0632 \u0622\u0646 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u06A9\u0646\u062F\u061F"},answer:{en:"Sellers offer discounts to get paid sooner, which improves their cash flow and reduces the risk of not being paid. Buyers usually should take them, because saving 2% for paying 20 days early is like earning a very high annual interest rate, much more than a bank pays.",fa:"\u0641\u0631\u0648\u0634\u0646\u062F\u0647\u200C\u0647\u0627 \u062A\u062E\u0641\u06CC\u0641 \u0645\u06CC\u200C\u062F\u0647\u0646\u062F \u062A\u0627 \u0632\u0648\u062F\u062A\u0631 \u067E\u0648\u0644 \u0628\u06AF\u06CC\u0631\u0646\u062F\u060C \u06A9\u0647 \u062C\u0631\u06CC\u0627\u0646 \u0646\u0642\u062F\u0634\u0627\u0646 \u0631\u0627 \u0628\u0647\u062A\u0631 \u0645\u06CC\u200C\u06A9\u0646\u062F \u0648 \u0631\u06CC\u0633\u06A9 \u0648\u0635\u0648\u0644 \u0646\u0634\u062F\u0646 \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u062E\u0631\u06CC\u062F\u0627\u0631 \u0645\u0639\u0645\u0648\u0644\u0627\u064B \u0628\u0627\u06CC\u062F \u0627\u0632 \u0622\u0646 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u06A9\u0646\u062F\u060C \u0686\u0648\u0646 \u06F2\u066A \u0635\u0631\u0641\u0647\u200C\u062C\u0648\u06CC\u06CC \u0628\u0631\u0627\u06CC \u06F2\u06F0 \u0631\u0648\u0632 \u0632\u0648\u062F\u062A\u0631 \u067E\u0631\u062F\u0627\u062E\u062A\u0646 \u0645\u062B\u0644 \u06AF\u0631\u0641\u062A\u0646 \u06CC\u06A9 \u0646\u0631\u062E \u0628\u0647\u0631\u0647\u0654 \u0633\u0627\u0644\u0627\u0646\u0647\u0654 \u062E\u06CC\u0644\u06CC \u0628\u0627\u0644\u0627\u0633\u062A\u060C \u062E\u06CC\u0644\u06CC \u0628\u06CC\u0634\u062A\u0631 \u0627\u0632 \u0622\u0646\u0686\u0647 \u0628\u0627\u0646\u06A9 \u0645\u06CC\u200C\u062F\u0647\u062F."}},{id:"q4-04",chapter:4,question:{en:"Why does each sale in a perpetual system need two entries?",fa:"\u0686\u0631\u0627 \u062F\u0631 \u0633\u06CC\u0633\u062A\u0645 \u062F\u0627\u0626\u0645\u06CC \u0647\u0631 \u0641\u0631\u0648\u0634 \u062F\u0648 \u062B\u0628\u062A \u0644\u0627\u0632\u0645 \u062F\u0627\u0631\u062F\u061F"},answer:{en:"Because a sale has two effects. First, the company earns revenue at the selling price (debit Cash or Accounts Receivable, credit Sales). Second, the goods leave the shelf, so their cost must move from Inventory to Cost of Goods Sold. Recording both shows both the revenue and the cost of the sale.",fa:"\u0686\u0648\u0646 \u0641\u0631\u0648\u0634 \u062F\u0648 \u0627\u062B\u0631 \u062F\u0627\u0631\u062F. \u0627\u0648\u0644\u060C \u0634\u0631\u06A9\u062A \u0628\u0627 \u0642\u06CC\u0645\u062A \u0641\u0631\u0648\u0634 \u062F\u0631\u0622\u0645\u062F \u06A9\u0633\u0628 \u0645\u06CC\u200C\u06A9\u0646\u062F (\u067E\u0648\u0644 \u0646\u0642\u062F \u06CC\u0627 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u062F\u0628\u06CC\u062A\u060C \u0641\u0631\u0648\u0634 \u06A9\u0631\u06CC\u062F\u06CC\u062A). \u062F\u0648\u0645\u060C \u06A9\u0627\u0644\u0627 \u0627\u0632 \u0642\u0641\u0633\u0647 \u0645\u06CC\u200C\u0631\u0648\u062F\u060C \u067E\u0633 \u0628\u0647\u0627\u06CC \u0622\u0646 \u0627\u0632 \u0645\u0648\u062C\u0648\u062F\u06CC \u06A9\u0627\u0644\u0627 \u0628\u0647 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0645\u0646\u062A\u0642\u0644 \u0645\u06CC\u200C\u0634\u0648\u062F. \u062B\u0628\u062A \u0647\u0631 \u062F\u0648\u060C \u0647\u0645 \u062F\u0631\u0622\u0645\u062F \u0648 \u0647\u0645 \u0647\u0632\u06CC\u0646\u0647\u0654 \u0641\u0631\u0648\u0634 \u0631\u0627 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F."}},{id:"q4-05",chapter:4,question:{en:"What do FOB shipping point and FOB destination mean, and why do they matter?",fa:"FOB shipping point \u0648 FOB destination \u06CC\u0639\u0646\u06CC \u0686\u0647 \u0648 \u0686\u0631\u0627 \u0645\u0647\u0645\u200C\u0627\u0646\u062F\u061F"},answer:{en:"They tell us when ownership of the goods passes to the buyer. FOB shipping point: when the goods leave the seller, so the buyer pays shipping and owns goods in transit. FOB destination: when the goods arrive, so the seller pays shipping. They matter because they decide who records the shipping cost and whose inventory the goods are in.",fa:"\u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u0646\u062F \u0645\u0627\u0644\u06A9\u06CC\u062A \u06A9\u0627\u0644\u0627 \u06A9\u0650\u06CC \u0628\u0647 \u062E\u0631\u06CC\u062F\u0627\u0631 \u0645\u0646\u062A\u0642\u0644 \u0645\u06CC\u200C\u0634\u0648\u062F. FOB shipping point: \u0648\u0642\u062A\u06CC \u06A9\u0627\u0644\u0627 \u0627\u0632 \u0641\u0631\u0648\u0634\u0646\u062F\u0647 \u062E\u0627\u0631\u062C \u0634\u0648\u062F\u060C \u067E\u0633 \u062E\u0631\u06CC\u062F\u0627\u0631 \u0647\u0632\u06CC\u0646\u0647\u0654 \u062D\u0645\u0644 \u0631\u0627 \u0645\u06CC\u200C\u062F\u0647\u062F \u0648 \u0635\u0627\u062D\u0628 \u06A9\u0627\u0644\u0627\u06CC \u062F\u0631 \u0631\u0627\u0647 \u0627\u0633\u062A. FOB destination: \u0648\u0642\u062A\u06CC \u06A9\u0627\u0644\u0627 \u0628\u0631\u0633\u062F\u060C \u067E\u0633 \u0641\u0631\u0648\u0634\u0646\u062F\u0647 \u0647\u0632\u06CC\u0646\u0647\u0654 \u062D\u0645\u0644 \u0631\u0627 \u0645\u06CC\u200C\u062F\u0647\u062F. \u0645\u0647\u0645\u200C\u0627\u0646\u062F \u0686\u0648\u0646 \u062A\u0639\u06CC\u06CC\u0646 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F \u0686\u0647 \u06A9\u0633\u06CC \u0647\u0632\u06CC\u0646\u0647\u0654 \u062D\u0645\u0644 \u0631\u0627 \u062B\u0628\u062A \u06A9\u0646\u062F \u0648 \u06A9\u0627\u0644\u0627 \u062F\u0631 \u0645\u0648\u062C\u0648\u062F\u06CC \u0686\u0647 \u06A9\u0633\u06CC \u0628\u0627\u0634\u062F."}},{id:"q4-06",chapter:4,question:{en:"Why is a multiple-step income statement more useful than a single-step one?",fa:"\u0686\u0631\u0627 \u0635\u0648\u0631\u062A \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646 \u0686\u0646\u062F\u0645\u0631\u062D\u0644\u0647\u200C\u0627\u06CC \u0627\u0632 \u06CC\u06A9\u200C\u0645\u0631\u062D\u0644\u0647\u200C\u0627\u06CC \u0645\u0641\u06CC\u062F\u062A\u0631 \u0627\u0633\u062A\u061F"},answer:{en:"The multiple-step statement separates gross profit and income from operations from other items. This shows users whether the company makes enough on each product (gross profit) and whether its core business is profitable before non-operating items like interest. The single-step version shows the same net income but hides these details.",fa:"\u0635\u0648\u0631\u062A \u0686\u0646\u062F\u0645\u0631\u062D\u0644\u0647\u200C\u0627\u06CC \u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635 \u0648 \u0633\u0648\u062F \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \u0631\u0627 \u0627\u0632 \u0628\u0642\u06CC\u0647\u0654 \u0627\u0642\u0644\u0627\u0645 \u062C\u062F\u0627 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0627\u06CC\u0646 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0634\u0631\u06A9\u062A \u0627\u0632 \u0647\u0631 \u06A9\u0627\u0644\u0627 \u0633\u0648\u062F \u06A9\u0627\u0641\u06CC \u0645\u06CC\u200C\u0628\u0631\u062F (\u0633\u0648\u062F \u0646\u0627\u062E\u0627\u0644\u0635) \u0648 \u06A9\u0627\u0631 \u0627\u0635\u0644\u06CC\u200C\u0627\u0634 \u0642\u0628\u0644 \u0627\u0632 \u0627\u0642\u0644\u0627\u0645 \u063A\u06CC\u0631\u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \u0645\u062B\u0644 \u0628\u0647\u0631\u0647 \u0633\u0648\u062F\u0622\u0648\u0631 \u0627\u0633\u062A \u06CC\u0627 \u0646\u0647. \u0635\u0648\u0631\u062A \u06CC\u06A9\u200C\u0645\u0631\u062D\u0644\u0647\u200C\u0627\u06CC \u0647\u0645\u0627\u0646 \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0631\u0627 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0648\u0644\u06CC \u0627\u06CC\u0646 \u062C\u0632\u0626\u06CC\u0627\u062A \u0631\u0627 \u067E\u0646\u0647\u0627\u0646 \u0645\u06CC\u200C\u06A9\u0646\u062F."}},{id:"q5-01",chapter:5,question:{en:"Why do companies need inventory costing methods like FIFO, LIFO, and weighted average?",fa:"\u0686\u0631\u0627 \u0634\u0631\u06A9\u062A\u200C\u0647\u0627 \u0628\u0647 \u0631\u0648\u0634\u200C\u0647\u0627\u06CC \u0642\u06CC\u0645\u062A\u200C\u06AF\u0630\u0627\u0631\u06CC \u0645\u0648\u062C\u0648\u062F\u06CC \u0645\u062B\u0644 FIFO\u060C LIFO \u0648 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0648\u0632\u0648\u0646 \u0646\u06CC\u0627\u0632 \u062F\u0627\u0631\u0646\u062F\u061F"},answer:{en:"Because the same item is often bought at different prices over time, and identical units can't be told apart. The company needs a rule to decide which cost goes to cost of goods sold and which stays in ending inventory. Each method is a different, consistent rule.",fa:"\u0686\u0648\u0646 \u06CC\u06A9 \u06A9\u0627\u0644\u0627 \u0627\u063A\u0644\u0628 \u062F\u0631 \u0632\u0645\u0627\u0646\u200C\u0647\u0627\u06CC \u0645\u062E\u062A\u0644\u0641 \u0628\u0627 \u0642\u06CC\u0645\u062A\u200C\u0647\u0627\u06CC \u0645\u062E\u062A\u0644\u0641 \u062E\u0631\u06CC\u062F\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0648\u0627\u062D\u062F\u0647\u0627\u06CC \u06CC\u06A9\u0633\u0627\u0646 \u0631\u0627 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F \u0627\u0632 \u0647\u0645 \u062A\u0634\u062E\u06CC\u0635 \u062F\u0627\u062F. \u0634\u0631\u06A9\u062A \u0628\u0647 \u06CC\u06A9 \u0642\u0627\u0646\u0648\u0646 \u0646\u06CC\u0627\u0632 \u062F\u0627\u0631\u062F \u062A\u0627 \u062A\u0635\u0645\u06CC\u0645 \u0628\u06AF\u06CC\u0631\u062F \u06A9\u062F\u0627\u0645 \u0642\u06CC\u0645\u062A \u0628\u0647 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0628\u0631\u0648\u062F \u0648 \u06A9\u062F\u0627\u0645 \u062F\u0631 \u0645\u0648\u062C\u0648\u062F\u06CC \u067E\u0627\u06CC\u0627\u0646 \u062F\u0648\u0631\u0647 \u0628\u0645\u0627\u0646\u062F. \u0647\u0631 \u0631\u0648\u0634 \u06CC\u06A9 \u0642\u0627\u0646\u0648\u0646 \u0645\u062A\u0641\u0627\u0648\u062A \u0648 \u062B\u0627\u0628\u062A \u0627\u0633\u062A."}},{id:"q5-02",chapter:5,question:{en:"When prices are rising, how do FIFO and LIFO affect profit and taxes? Why?",fa:"\u0648\u0642\u062A\u06CC \u0642\u06CC\u0645\u062A\u200C\u0647\u0627 \u0628\u0627\u0644\u0627 \u0645\u06CC\u200C\u0631\u0648\u062F\u060C FIFO \u0648 LIFO \u0686\u0647 \u0627\u062B\u0631\u06CC \u0631\u0648\u06CC \u0633\u0648\u062F \u0648 \u0645\u0627\u0644\u06CC\u0627\u062A \u062F\u0627\u0631\u0646\u062F\u061F \u0686\u0631\u0627\u061F"},answer:{en:"FIFO sends the oldest, cheaper costs to cost of goods sold, so COGS is lower and profit (and taxes) higher; ending inventory shows recent costs. LIFO sends the newest, more expensive costs to COGS, so COGS is higher and profit and taxes are lower; ending inventory shows old, outdated costs. Weighted average falls in between.",fa:"FIFO \u0642\u06CC\u0645\u062A\u200C\u0647\u0627\u06CC \u0642\u062F\u06CC\u0645\u06CC \u0648 \u0627\u0631\u0632\u0627\u0646\u200C\u062A\u0631 \u0631\u0627 \u0628\u0647 \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \u0645\u06CC\u200C\u0641\u0631\u0633\u062A\u062F\u060C \u067E\u0633 \u0628\u0647\u0627 \u06A9\u0645\u062A\u0631 \u0648 \u0633\u0648\u062F (\u0648 \u0645\u0627\u0644\u06CC\u0627\u062A) \u0628\u06CC\u0634\u062A\u0631 \u0627\u0633\u062A\u061B \u0645\u0648\u062C\u0648\u062F\u06CC \u067E\u0627\u06CC\u0627\u0646 \u062F\u0648\u0631\u0647 \u0642\u06CC\u0645\u062A\u200C\u0647\u0627\u06CC \u062C\u062F\u06CC\u062F \u0631\u0627 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F. LIFO \u0642\u06CC\u0645\u062A\u200C\u0647\u0627\u06CC \u062C\u062F\u06CC\u062F \u0648 \u06AF\u0631\u0627\u0646\u200C\u062A\u0631 \u0631\u0627 \u0645\u06CC\u200C\u0641\u0631\u0633\u062A\u062F\u060C \u067E\u0633 \u0628\u0647\u0627 \u0628\u06CC\u0634\u062A\u0631 \u0648 \u0633\u0648\u062F \u0648 \u0645\u0627\u0644\u06CC\u0627\u062A \u06A9\u0645\u062A\u0631 \u0627\u0633\u062A\u061B \u0645\u0648\u062C\u0648\u062F\u06CC \u0642\u06CC\u0645\u062A\u200C\u0647\u0627\u06CC \u0642\u062F\u06CC\u0645\u06CC \u0631\u0627 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F. \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0648\u0632\u0648\u0646 \u0648\u0633\u0637 \u0627\u0633\u062A."}},{id:"q5-03",chapter:5,question:{en:"What is the consistency concept, and why does it matter for inventory methods?",fa:"\u0627\u0635\u0644 \u062B\u0628\u0627\u062A \u0631\u0648\u06CC\u0647 \u0686\u06CC\u0633\u062A \u0648 \u0686\u0631\u0627 \u0628\u0631\u0627\u06CC \u0631\u0648\u0634\u200C\u0647\u0627\u06CC \u0645\u0648\u062C\u0648\u062F\u06CC \u0645\u0647\u0645 \u0627\u0633\u062A\u061F"},answer:{en:"Consistency means a company should use the same accounting method from period to period. If it changed methods often, it could manage its profit, and users could not compare one year with another. A company may change methods, but it must explain the change and its effect.",fa:"\u062B\u0628\u0627\u062A \u0631\u0648\u06CC\u0647 \u06CC\u0639\u0646\u06CC \u0634\u0631\u06A9\u062A \u0628\u0627\u06CC\u062F \u0647\u0631 \u0633\u0627\u0644 \u0627\u0632 \u0647\u0645\u0627\u0646 \u0631\u0648\u0634 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u06A9\u0646\u062F. \u0627\u06AF\u0631 \u0645\u062F\u0627\u0645 \u0631\u0648\u0634 \u0631\u0627 \u0639\u0648\u0636 \u06A9\u0646\u062F\u060C \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0633\u0648\u062F \u0631\u0627 \u062F\u0633\u062A\u200C\u06A9\u0627\u0631\u06CC \u06A9\u0646\u062F \u0648 \u06A9\u0633\u06CC \u0646\u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0633\u0627\u0644\u200C\u0647\u0627 \u0631\u0627 \u0628\u0627 \u0647\u0645 \u0645\u0642\u0627\u06CC\u0633\u0647 \u06A9\u0646\u062F. \u0634\u0631\u06A9\u062A \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0631\u0648\u0634 \u0631\u0627 \u0639\u0648\u0636 \u06A9\u0646\u062F\u060C \u0648\u0644\u06CC \u0628\u0627\u06CC\u062F \u062A\u063A\u06CC\u06CC\u0631 \u0648 \u0627\u062B\u0631\u0634 \u0631\u0627 \u062A\u0648\u0636\u06CC\u062D \u062F\u0647\u062F."}},{id:"q5-04",chapter:5,question:{en:"What is the lower of cost or market rule, and why does it exist?",fa:"\u0642\u0627\u0639\u062F\u0647\u0654 \u0627\u0642\u0644 \u0628\u0647\u0627\u06CC \u062A\u0645\u0627\u0645\u200C\u0634\u062F\u0647 \u06CC\u0627 \u0627\u0631\u0632\u0634 \u0628\u0627\u0632\u0627\u0631 \u0686\u06CC\u0633\u062A \u0648 \u0686\u0631\u0627 \u0648\u062C\u0648\u062F \u062F\u0627\u0631\u062F\u061F"},answer:{en:"If the market (replacement) cost of inventory falls below its recorded cost, inventory must be reported at the lower amount, and the loss is recorded now. It exists because of conservatism: assets should not be shown at more than they are worth, so users are not misled about the company's value.",fa:"\u0627\u06AF\u0631 \u0627\u0631\u0632\u0634 \u0628\u0627\u0632\u0627\u0631 (\u0642\u06CC\u0645\u062A \u062E\u0631\u06CC\u062F \u062F\u0648\u0628\u0627\u0631\u0647\u0654) \u0645\u0648\u062C\u0648\u062F\u06CC \u0627\u0632 \u0628\u0647\u0627\u06CC \u062B\u0628\u062A\u200C\u0634\u062F\u0647\u200C\u0627\u0634 \u06A9\u0645\u062A\u0631 \u0634\u0648\u062F\u060C \u0645\u0648\u062C\u0648\u062F\u06CC \u0628\u0627\u06CC\u062F \u0628\u0627 \u0645\u0628\u0644\u063A \u06A9\u0645\u062A\u0631 \u06AF\u0632\u0627\u0631\u0634 \u0634\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646 \u0647\u0645\u06CC\u0646 \u062D\u0627\u0644\u0627 \u062B\u0628\u062A \u0634\u0648\u062F. \u0627\u06CC\u0646 \u0642\u0627\u0639\u062F\u0647 \u0628\u0647 \u062E\u0627\u0637\u0631 \u0627\u0635\u0644 \u0645\u062D\u0627\u0641\u0638\u0647\u200C\u06A9\u0627\u0631\u06CC \u0627\u0633\u062A: \u062F\u0627\u0631\u0627\u06CC\u06CC \u0646\u0628\u0627\u06CC\u062F \u0628\u06CC\u0634\u062A\u0631 \u0627\u0632 \u0627\u0631\u0632\u0634\u0634 \u0646\u0634\u0627\u0646 \u062F\u0627\u062F\u0647 \u0634\u0648\u062F \u062A\u0627 \u0627\u0633\u062A\u0641\u0627\u062F\u0647\u200C\u06A9\u0646\u0646\u062F\u06AF\u0627\u0646 \u06AF\u0645\u0631\u0627\u0647 \u0646\u0634\u0648\u0646\u062F."}},{id:"q5-05",chapter:5,question:{en:"Why does an inventory error affect two years of financial statements?",fa:"\u0686\u0631\u0627 \u0627\u0634\u062A\u0628\u0627\u0647 \u062F\u0631 \u0645\u0648\u062C\u0648\u062F\u06CC \u06A9\u0627\u0644\u0627 \u0631\u0648\u06CC \u062F\u0648 \u0633\u0627\u0644 \u0635\u0648\u0631\u062A\u200C\u0647\u0627\u06CC \u0645\u0627\u0644\u06CC \u0627\u062B\u0631 \u0645\u06CC\u200C\u06AF\u0630\u0627\u0631\u062F\u061F"},answer:{en:"Ending inventory of one year is the beginning inventory of the next. If ending inventory is overstated, this year's COGS is too low and profit too high. Next year, beginning inventory is too high, so COGS is too high and profit too low. The error reverses itself over the two years, but both years are wrong.",fa:"\u0645\u0648\u062C\u0648\u062F\u06CC \u067E\u0627\u06CC\u0627\u0646 \u06CC\u06A9 \u0633\u0627\u0644\u060C \u0645\u0648\u062C\u0648\u062F\u06CC \u0627\u0648\u0644 \u0633\u0627\u0644 \u0628\u0639\u062F \u0627\u0633\u062A. \u0627\u06AF\u0631 \u0645\u0648\u062C\u0648\u062F\u06CC \u067E\u0627\u06CC\u0627\u0646 \u0628\u06CC\u0634\u062A\u0631 \u0627\u0632 \u0648\u0627\u0642\u0639 \u062B\u0628\u062A \u0634\u0648\u062F\u060C \u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647\u0654 \u0627\u0645\u0633\u0627\u0644 \u06A9\u0645\u062A\u0631 \u0648 \u0633\u0648\u062F \u0628\u06CC\u0634\u062A\u0631 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0633\u0627\u0644 \u0628\u0639\u062F\u060C \u0645\u0648\u062C\u0648\u062F\u06CC \u0627\u0648\u0644 \u062F\u0648\u0631\u0647 \u0632\u06CC\u0627\u062F \u0627\u0633\u062A\u060C \u067E\u0633 \u0628\u0647\u0627 \u0628\u06CC\u0634\u062A\u0631 \u0648 \u0633\u0648\u062F \u06A9\u0645\u062A\u0631 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0627\u0634\u062A\u0628\u0627\u0647 \u062F\u0631 \u062F\u0648 \u0633\u0627\u0644 \u062E\u0648\u062F\u0634 \u0631\u0627 \u062E\u0646\u062B\u06CC \u0645\u06CC\u200C\u06A9\u0646\u062F\u060C \u0648\u0644\u06CC \u0647\u0631 \u062F\u0648 \u0633\u0627\u0644 \u063A\u0644\u0637\u200C\u0627\u0646\u062F."}},{id:"q5-06",chapter:5,question:{en:"What do inventory turnover and days' sales in inventory tell managers?",fa:"\u06AF\u0631\u062F\u0634 \u0645\u0648\u062C\u0648\u062F\u06CC \u0648 \u0631\u0648\u0632\u0647\u0627\u06CC \u0641\u0631\u0648\u0634 \u0645\u0648\u062C\u0648\u062F\u06CC \u0628\u0647 \u0645\u062F\u06CC\u0631\u0627\u0646 \u0686\u0647 \u0645\u06CC\u200C\u06AF\u0648\u06CC\u0646\u062F\u061F"},answer:{en:"Inventory turnover (COGS \xF7 average inventory) shows how many times inventory is sold and replaced in a year. Days' sales in inventory shows how many days current stock will last. Fast turnover means less cash tied up in goods; slow turnover may mean old or unpopular products. But too little inventory can cause lost sales.",fa:"\u06AF\u0631\u062F\u0634 \u0645\u0648\u062C\u0648\u062F\u06CC (\u0628\u0647\u0627\u06CC \u06A9\u0627\u0644\u0627\u06CC \u0641\u0631\u0648\u0634\u200C\u0631\u0641\u062A\u0647 \xF7 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0648\u062C\u0648\u062F\u06CC) \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0645\u0648\u062C\u0648\u062F\u06CC \u062F\u0631 \u0633\u0627\u0644 \u0686\u0646\u062F \u0628\u0627\u0631 \u0641\u0631\u0648\u062E\u062A\u0647 \u0648 \u062C\u0627\u06CC\u06AF\u0632\u06CC\u0646 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0631\u0648\u0632\u0647\u0627\u06CC \u0641\u0631\u0648\u0634 \u0645\u0648\u062C\u0648\u062F\u06CC \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u06A9\u0627\u0644\u0627\u06CC \u0641\u0639\u0644\u06CC \u0686\u0646\u062F \u0631\u0648\u0632 \u062F\u0648\u0627\u0645 \u0645\u06CC\u200C\u0622\u0648\u0631\u062F. \u06AF\u0631\u062F\u0634 \u0633\u0631\u06CC\u0639 \u06CC\u0639\u0646\u06CC \u067E\u0648\u0644 \u06A9\u0645\u062A\u0631\u06CC \u062F\u0631 \u06A9\u0627\u0644\u0627 \u06AF\u06CC\u0631 \u06A9\u0631\u062F\u0647\u061B \u06AF\u0631\u062F\u0634 \u06A9\u0646\u062F \u0645\u0645\u06A9\u0646 \u0627\u0633\u062A \u06CC\u0639\u0646\u06CC \u06A9\u0627\u0644\u0627\u06CC \u06A9\u0647\u0646\u0647 \u06CC\u0627 \u06A9\u0645\u200C\u0637\u0631\u0641\u062F\u0627\u0631. \u0648\u0644\u06CC \u0645\u0648\u062C\u0648\u062F\u06CC \u062E\u06CC\u0644\u06CC \u06A9\u0645 \u0647\u0645 \u0628\u0627\u0639\u062B \u0627\u0632 \u062F\u0633\u062A \u0631\u0641\u062A\u0646 \u0641\u0631\u0648\u0634 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"q6-01",chapter:6,question:{en:"What is internal control, and what are its main purposes?",fa:"\u06A9\u0646\u062A\u0631\u0644 \u062F\u0627\u062E\u0644\u06CC \u0686\u06CC\u0633\u062A \u0648 \u0647\u062F\u0641\u200C\u0647\u0627\u06CC \u0627\u0635\u0644\u06CC\u200C\u0627\u0634 \u06A9\u062F\u0627\u0645\u200C\u0627\u0646\u062F\u061F"},answer:{en:"Internal control is the set of policies and procedures a company uses to protect its assets, ensure reliable accounting, promote efficient operations, and make sure company policies are followed. It reduces the chance of theft, fraud, and errors.",fa:"\u06A9\u0646\u062A\u0631\u0644 \u062F\u0627\u062E\u0644\u06CC \u0645\u062C\u0645\u0648\u0639\u0647\u0654 \u0633\u06CC\u0627\u0633\u062A\u200C\u0647\u0627 \u0648 \u0631\u0648\u0634\u200C\u0647\u0627\u06CC\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0634\u0631\u06A9\u062A \u0628\u0631\u0627\u06CC \u062D\u0641\u0627\u0638\u062A \u0627\u0632 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u060C \u0642\u0627\u0628\u0644 \u0627\u0639\u062A\u0645\u0627\u062F \u06A9\u0631\u062F\u0646 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC\u060C \u06A9\u0627\u0631\u0622\u0645\u062F \u06A9\u0631\u062F\u0646 \u06A9\u0627\u0631\u0647\u0627 \u0648 \u0631\u0639\u0627\u06CC\u062A \u0642\u0648\u0627\u0646\u06CC\u0646 \u0634\u0631\u06A9\u062A \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0627\u062D\u062A\u0645\u0627\u0644 \u062F\u0632\u062F\u06CC\u060C \u062A\u0642\u0644\u0628 \u0648 \u0627\u0634\u062A\u0628\u0627\u0647 \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u062F."}},{id:"q6-02",chapter:6,question:{en:"Why should the person who handles cash not also keep the cash records?",fa:"\u0686\u0631\u0627 \u06A9\u0633\u06CC \u06A9\u0647 \u067E\u0648\u0644 \u0646\u0642\u062F \u0631\u0627 \u062C\u0627\u0628\u0647\u200C\u062C\u0627 \u0645\u06CC\u200C\u06A9\u0646\u062F \u0646\u0628\u0627\u06CC\u062F \u062F\u0641\u062A\u0631 \u067E\u0648\u0644 \u0646\u0642\u062F \u0631\u0627 \u0647\u0645 \u0628\u0646\u0648\u06CC\u0633\u062F\u061F"},answer:{en:"If one person does both, they could steal cash and change the records to hide it. Separating custody of assets from recordkeeping means the two people's work checks each other. Fraud would then require collusion between two people, which is much harder.",fa:"\u0627\u06AF\u0631 \u06CC\u06A9 \u0646\u0641\u0631 \u0647\u0631 \u062F\u0648 \u06A9\u0627\u0631 \u0631\u0627 \u0628\u06A9\u0646\u062F\u060C \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u067E\u0648\u0644 \u0628\u0631\u062F\u0627\u0631\u062F \u0648 \u062F\u0641\u062A\u0631 \u0631\u0627 \u0637\u0648\u0631\u06CC \u062A\u063A\u06CC\u06CC\u0631 \u062F\u0647\u062F \u06A9\u0647 \u067E\u0646\u0647\u0627\u0646 \u0628\u0645\u0627\u0646\u062F. \u062C\u062F\u0627 \u06A9\u0631\u062F\u0646 \u0646\u06AF\u0647\u062F\u0627\u0631\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC \u0627\u0632 \u062B\u0628\u062A \u0622\u0646 \u0628\u0627\u0639\u062B \u0645\u06CC\u200C\u0634\u0648\u062F \u06A9\u0627\u0631 \u062F\u0648 \u0646\u0641\u0631 \u0647\u0645\u062F\u06CC\u06AF\u0631 \u0631\u0627 \u06A9\u0646\u062A\u0631\u0644 \u06A9\u0646\u062F. \u0622\u0646 \u0648\u0642\u062A \u062A\u0642\u0644\u0628 \u0628\u0647 \u062A\u0628\u0627\u0646\u06CC \u062F\u0648 \u0646\u0641\u0631 \u0646\u06CC\u0627\u0632 \u062F\u0627\u0631\u062F \u06A9\u0647 \u062E\u06CC\u0644\u06CC \u0633\u062E\u062A\u200C\u062A\u0631 \u0627\u0633\u062A."}},{id:"q6-03",chapter:6,question:{en:"What is the fraud triangle, and which side can a company control?",fa:"\u0645\u062B\u0644\u062B \u062A\u0642\u0644\u0628 \u0686\u06CC\u0633\u062A \u0648 \u0634\u0631\u06A9\u062A \u06A9\u062F\u0627\u0645 \u0636\u0644\u0639 \u0622\u0646 \u0631\u0627 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u06A9\u0646\u062A\u0631\u0644 \u06A9\u0646\u062F\u061F"},answer:{en:"The fraud triangle says fraud happens when three things are present: opportunity (weak controls), pressure (e.g. money problems), and rationalization (the person convinces themselves it's OK). A company can mostly control opportunity, through strong internal controls.",fa:"\u0645\u062B\u0644\u062B \u062A\u0642\u0644\u0628 \u0645\u06CC\u200C\u06AF\u0648\u06CC\u062F \u062A\u0642\u0644\u0628 \u0648\u0642\u062A\u06CC \u0631\u062E \u0645\u06CC\u200C\u062F\u0647\u062F \u06A9\u0647 \u0633\u0647 \u0686\u06CC\u0632 \u0628\u0627\u0634\u062F: \u0641\u0631\u0635\u062A (\u06A9\u0646\u062A\u0631\u0644 \u0636\u0639\u06CC\u0641)\u060C \u0641\u0634\u0627\u0631 (\u0645\u062B\u0644\u0627\u064B \u0645\u0634\u06A9\u0644 \u0645\u0627\u0644\u06CC) \u0648 \u062A\u0648\u062C\u06CC\u0647 (\u0641\u0631\u062F \u062E\u0648\u062F\u0634 \u0631\u0627 \u0642\u0627\u0646\u0639 \u0645\u06CC\u200C\u06A9\u0646\u062F \u06A9\u0647 \u0627\u0634\u06A9\u0627\u0644\u06CC \u0646\u062F\u0627\u0631\u062F). \u0634\u0631\u06A9\u062A \u0628\u06CC\u0634\u062A\u0631 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0641\u0631\u0635\u062A \u0631\u0627 \u0628\u0627 \u06A9\u0646\u062A\u0631\u0644 \u062F\u0627\u062E\u0644\u06CC \u0642\u0648\u06CC \u06A9\u0646\u062A\u0631\u0644 \u06A9\u0646\u062F."}},{id:"q6-04",chapter:6,question:{en:"What are the limitations of internal control?",fa:"\u0645\u062D\u062F\u0648\u062F\u06CC\u062A\u200C\u0647\u0627\u06CC \u06A9\u0646\u062A\u0631\u0644 \u062F\u0627\u062E\u0644\u06CC \u06A9\u062F\u0627\u0645\u200C\u0627\u0646\u062F\u061F"},answer:{en:"Internal control cannot stop everything. Human error (carelessness, tiredness) can still happen. Two or more employees can collude to get around controls. And the cost of a control should not be more than its benefit, so some risks are accepted.",fa:"\u06A9\u0646\u062A\u0631\u0644 \u062F\u0627\u062E\u0644\u06CC \u0646\u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u062C\u0644\u0648\u06CC \u0647\u0645\u0647 \u0686\u06CC\u0632 \u0631\u0627 \u0628\u06AF\u06CC\u0631\u062F. \u0627\u0634\u062A\u0628\u0627\u0647 \u0627\u0646\u0633\u0627\u0646\u06CC (\u0628\u06CC\u200C\u062F\u0642\u062A\u06CC\u060C \u062E\u0633\u062A\u06AF\u06CC) \u0647\u0646\u0648\u0632 \u0645\u0645\u06A9\u0646 \u0627\u0633\u062A. \u062F\u0648 \u06CC\u0627 \u0686\u0646\u062F \u06A9\u0627\u0631\u0645\u0646\u062F \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u0646\u062F \u0628\u0627 \u062A\u0628\u0627\u0646\u06CC \u06A9\u0646\u062A\u0631\u0644\u200C\u0647\u0627 \u0631\u0627 \u062F\u0648\u0631 \u0628\u0632\u0646\u0646\u062F. \u0648 \u0647\u0632\u06CC\u0646\u0647\u0654 \u06CC\u06A9 \u06A9\u0646\u062A\u0631\u0644 \u0646\u0628\u0627\u06CC\u062F \u0627\u0632 \u0641\u0627\u06CC\u062F\u0647\u200C\u0627\u0634 \u0628\u06CC\u0634\u062A\u0631 \u0628\u0627\u0634\u062F\u060C \u067E\u0633 \u0628\u0639\u0636\u06CC \u0631\u06CC\u0633\u06A9\u200C\u0647\u0627 \u067E\u0630\u06CC\u0631\u0641\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F."}},{id:"q6-05",chapter:6,question:{en:"Why do companies use a petty cash fund?",fa:"\u0686\u0631\u0627 \u0634\u0631\u06A9\u062A\u200C\u0647\u0627 \u0627\u0632 \u062A\u0646\u062E\u0648\u0627\u0647\u200C\u06AF\u0631\u062F\u0627\u0646 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F\u061F"},answer:{en:"Writing a check or making a bank transfer for very small payments (postage, a few supplies) wastes time. A petty cash fund keeps a small, fixed amount of cash with one responsible person, who gets a receipt for every payment. The fund is reimbursed regularly, so small payments are still controlled and recorded.",fa:"\u0646\u0648\u0634\u062A\u0646 \u0686\u06A9 \u06CC\u0627 \u0627\u0646\u062A\u0642\u0627\u0644 \u0628\u0627\u0646\u06A9\u06CC \u0628\u0631\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0647\u0627\u06CC \u062E\u06CC\u0644\u06CC \u06A9\u0648\u0686\u06A9 (\u067E\u0633\u062A\u060C \u0686\u0646\u062F \u0648\u0633\u06CC\u0644\u0647\u0654 \u0627\u062F\u0627\u0631\u06CC) \u0648\u0642\u062A \u0631\u0627 \u062A\u0644\u0641 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u062A\u0646\u062E\u0648\u0627\u0647\u200C\u06AF\u0631\u062F\u0627\u0646 \u0645\u0628\u0644\u063A \u06A9\u0648\u0686\u06A9 \u0648 \u062B\u0627\u0628\u062A\u06CC \u0631\u0627 \u0646\u0632\u062F \u06CC\u06A9 \u0645\u0633\u0626\u0648\u0644 \u0646\u06AF\u0647 \u0645\u06CC\u200C\u062F\u0627\u0631\u062F \u06A9\u0647 \u0628\u0631\u0627\u06CC \u0647\u0631 \u067E\u0631\u062F\u0627\u062E\u062A \u0631\u0633\u06CC\u062F \u0645\u06CC\u200C\u06AF\u06CC\u0631\u062F. \u062A\u0646\u062E\u0648\u0627\u0647 \u0645\u0646\u0638\u0645 \u0634\u0627\u0631\u0698 \u0645\u06CC\u200C\u0634\u0648\u062F\u060C \u067E\u0633 \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0647\u0627\u06CC \u06A9\u0648\u0686\u06A9 \u0647\u0645 \u06A9\u0646\u062A\u0631\u0644 \u0648 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u0646\u062F."}},{id:"q6-06",chapter:6,question:{en:"Why is a bank reconciliation prepared, and why do only book-side items need journal entries?",fa:"\u0686\u0631\u0627 \u0635\u0648\u0631\u062A \u0645\u063A\u0627\u06CC\u0631\u062A \u0628\u0627\u0646\u06A9\u06CC \u062A\u0647\u06CC\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0686\u0631\u0627 \u0641\u0642\u0637 \u0627\u0642\u0644\u0627\u0645 \u0637\u0631\u0641 \u062F\u0641\u0627\u062A\u0631 \u062B\u0628\u062A \u0631\u0648\u0632\u0646\u0627\u0645\u0647 \u0644\u0627\u0632\u0645 \u062F\u0627\u0631\u0646\u062F\u061F"},answer:{en:"The bank balance and the book balance rarely match because of timing differences (deposits in transit, outstanding checks) and items the company didn't know about (bank fees, NSF checks, interest). The reconciliation explains the difference and catches errors or fraud. Only book-side items need entries, because those are things the company's own records are missing; bank-side items will be fixed by the bank.",fa:"\u0645\u0648\u062C\u0648\u062F\u06CC \u0628\u0627\u0646\u06A9 \u0648 \u062F\u0641\u0627\u062A\u0631 \u06A9\u0645\u062A\u0631 \u0628\u0627 \u0647\u0645 \u0628\u0631\u0627\u0628\u0631\u0646\u062F\u060C \u0628\u0647 \u062E\u0627\u0637\u0631 \u0641\u0627\u0635\u0644\u0647\u0654 \u0632\u0645\u0627\u0646\u06CC (\u0648\u0627\u0631\u06CC\u0632 \u062F\u0631 \u0631\u0627\u0647\u060C \u0686\u06A9 \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0646\u0634\u062F\u0647) \u0648 \u0686\u06CC\u0632\u0647\u0627\u06CC\u06CC \u06A9\u0647 \u0634\u0631\u06A9\u062A \u0627\u0632 \u0622\u0646 \u062E\u0628\u0631 \u0646\u062F\u0627\u0634\u062A (\u06A9\u0627\u0631\u0645\u0632\u062F \u0628\u0627\u0646\u06A9\u060C \u0686\u06A9 \u0628\u0631\u06AF\u0634\u062A\u06CC\u060C \u0633\u0648\u062F). \u0635\u0648\u0631\u062A \u0645\u063A\u0627\u06CC\u0631\u062A \u0627\u06CC\u0646 \u0641\u0631\u0642 \u0631\u0627 \u062A\u0648\u0636\u06CC\u062D \u0645\u06CC\u200C\u062F\u0647\u062F \u0648 \u0627\u0634\u062A\u0628\u0627\u0647 \u06CC\u0627 \u062A\u0642\u0644\u0628 \u0631\u0627 \u067E\u06CC\u062F\u0627 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0641\u0642\u0637 \u0627\u0642\u0644\u0627\u0645 \u0637\u0631\u0641 \u062F\u0641\u0627\u062A\u0631 \u062B\u0628\u062A \u0644\u0627\u0632\u0645 \u062F\u0627\u0631\u0646\u062F \u0686\u0648\u0646 \u062F\u0641\u0627\u062A\u0631 \u062E\u0648\u062F \u0634\u0631\u06A9\u062A \u0622\u0646\u200C\u0647\u0627 \u0631\u0627 \u0646\u062F\u0627\u0631\u062F\u061B \u0627\u0642\u0644\u0627\u0645 \u0637\u0631\u0641 \u0628\u0627\u0646\u06A9 \u0631\u0627 \u0628\u0627\u0646\u06A9 \u062F\u0631\u0633\u062A \u0645\u06CC\u200C\u06A9\u0646\u062F."}},{id:"q7-01",chapter:7,question:{en:"What are accounts receivable, and why do companies sell on credit if some customers won't pay?",fa:"\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u0686\u06CC\u0633\u062A \u0648 \u0686\u0631\u0627 \u0634\u0631\u06A9\u062A\u200C\u0647\u0627 \u0646\u0633\u06CC\u0647 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u0646\u062F \u0648\u0642\u062A\u06CC \u0628\u0639\u0636\u06CC \u0645\u0634\u062A\u0631\u06CC\u200C\u0647\u0627 \u067E\u0648\u0644 \u0646\u0645\u06CC\u200C\u062F\u0647\u0646\u062F\u061F"},answer:{en:"Accounts receivable are amounts customers owe from sales on credit. Companies sell on credit because it attracts more customers and increases sales. The extra profit from those sales is usually much larger than the cost of the few customers who don't pay.",fa:"\u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u0645\u0628\u0627\u0644\u063A\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0645\u0634\u062A\u0631\u06CC\u200C\u0647\u0627 \u0628\u0627\u0628\u062A \u0641\u0631\u0648\u0634 \u0646\u0633\u06CC\u0647 \u0628\u062F\u0647\u06A9\u0627\u0631\u0646\u062F. \u0634\u0631\u06A9\u062A\u200C\u0647\u0627 \u0646\u0633\u06CC\u0647 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u0646\u062F \u0686\u0648\u0646 \u0645\u0634\u062A\u0631\u06CC \u0628\u06CC\u0634\u062A\u0631\u06CC \u062C\u0630\u0628 \u0645\u06CC\u200C\u06A9\u0646\u062F \u0648 \u0641\u0631\u0648\u0634 \u0631\u0627 \u0632\u06CC\u0627\u062F \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0633\u0648\u062F \u0627\u0636\u0627\u0641\u0647\u0654 \u0627\u06CC\u0646 \u0641\u0631\u0648\u0634\u200C\u0647\u0627 \u0645\u0639\u0645\u0648\u0644\u0627\u064B \u062E\u06CC\u0644\u06CC \u0628\u06CC\u0634\u062A\u0631 \u0627\u0632 \u0636\u0631\u0631 \u0686\u0646\u062F \u0645\u0634\u062A\u0631\u06CC \u0627\u0633\u062A \u06A9\u0647 \u067E\u0648\u0644 \u0646\u0645\u06CC\u200C\u062F\u0647\u0646\u062F."}},{id:"q7-02",chapter:7,question:{en:"What is the problem with the direct write-off method? Why is the allowance method preferred?",fa:"\u0631\u0648\u0634 \u062D\u0630\u0641 \u0645\u0633\u062A\u0642\u06CC\u0645 \u0686\u0647 \u0645\u0634\u06A9\u0644\u06CC \u062F\u0627\u0631\u062F\u061F \u0686\u0631\u0627 \u0631\u0648\u0634 \u0630\u062E\u06CC\u0631\u0647 \u062A\u0631\u062C\u06CC\u062D \u062F\u0627\u062F\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},answer:{en:"The direct write-off method records bad debt expense only when an account is written off, often in a later year than the sale. This breaks the matching principle and overstates receivables. The allowance method estimates bad debts in the same period as the sale and reports receivables at the amount expected to be collected, so GAAP requires it unless amounts are immaterial.",fa:"\u0631\u0648\u0634 \u062D\u0630\u0641 \u0645\u0633\u062A\u0642\u06CC\u0645 \u0647\u0632\u06CC\u0646\u0647\u0654 \u0645\u0637\u0627\u0644\u0628\u0627\u062A \u0633\u0648\u062E\u062A\u200C\u0634\u062F\u0647 \u0631\u0627 \u0641\u0642\u0637 \u0648\u0642\u062A\u06CC \u062D\u0633\u0627\u0628\u06CC \u062D\u0630\u0641 \u0634\u0648\u062F \u062B\u0628\u062A \u0645\u06CC\u200C\u06A9\u0646\u062F\u060C \u06A9\u0647 \u0627\u063A\u0644\u0628 \u0633\u0627\u0644\u06CC \u0628\u0639\u062F \u0627\u0632 \u0641\u0631\u0648\u0634 \u0627\u0633\u062A. \u0627\u06CC\u0646 \u0627\u0635\u0644 \u062A\u0637\u0627\u0628\u0642 \u0631\u0627 \u0645\u06CC\u200C\u0634\u06A9\u0646\u062F \u0648 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u0631\u0627 \u0628\u06CC\u0634\u062A\u0631 \u0627\u0632 \u0648\u0627\u0642\u0639 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F. \u0631\u0648\u0634 \u0630\u062E\u06CC\u0631\u0647 \u0633\u0648\u062E\u062A \u0631\u0627 \u062F\u0631 \u0647\u0645\u0627\u0646 \u062F\u0648\u0631\u0647\u0654 \u0641\u0631\u0648\u0634 \u062A\u062E\u0645\u06CC\u0646 \u0645\u06CC\u200C\u0632\u0646\u062F \u0648 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u0631\u0627 \u0628\u0627 \u0645\u0628\u0644\u063A \u0642\u0627\u0628\u0644 \u0648\u0635\u0648\u0644 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F\u060C \u0628\u0631\u0627\u06CC \u0647\u0645\u06CC\u0646 GAAP \u0622\u0646 \u0631\u0627 \u0627\u0644\u0632\u0627\u0645\u06CC \u0645\u06CC\u200C\u06A9\u0646\u062F \u0645\u06AF\u0631 \u0645\u0628\u0627\u0644\u063A \u0646\u0627\u0686\u06CC\u0632 \u0628\u0627\u0634\u0646\u062F."}},{id:"q7-03",chapter:7,question:{en:"Why is no expense recorded when an account is written off under the allowance method?",fa:"\u0686\u0631\u0627 \u062F\u0631 \u0631\u0648\u0634 \u0630\u062E\u06CC\u0631\u0647\u060C \u0647\u0646\u06AF\u0627\u0645 \u062D\u0630\u0641 \u06CC\u06A9 \u062D\u0633\u0627\u0628 \u0647\u06CC\u0686 \u0647\u0632\u06CC\u0646\u0647\u200C\u0627\u06CC \u062B\u0628\u062A \u0646\u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},answer:{en:"Because the expense was already recorded earlier, when bad debts were estimated at the end of the period. The write-off only removes a specific customer's balance from Accounts Receivable and uses up part of the Allowance. Total realizable value does not change.",fa:"\u0686\u0648\u0646 \u0647\u0632\u06CC\u0646\u0647 \u0642\u0628\u0644\u0627\u064B\u060C \u0648\u0642\u062A\u06CC \u0633\u0648\u062E\u062A \u0622\u062E\u0631 \u062F\u0648\u0631\u0647 \u062A\u062E\u0645\u06CC\u0646 \u0632\u062F\u0647 \u0634\u062F\u060C \u062B\u0628\u062A \u0634\u062F\u0647 \u0628\u0648\u062F. \u062D\u0630\u0641 \u0641\u0642\u0637 \u0645\u0627\u0646\u062F\u0647\u0654 \u06CC\u06A9 \u0645\u0634\u062A\u0631\u06CC \u062E\u0627\u0635 \u0631\u0627 \u0627\u0632 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u0628\u0631\u0645\u06CC\u200C\u062F\u0627\u0631\u062F \u0648 \u0628\u062E\u0634\u06CC \u0627\u0632 \u0630\u062E\u06CC\u0631\u0647 \u0631\u0627 \u0645\u0635\u0631\u0641 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0627\u0631\u0632\u0634 \u0642\u0627\u0628\u0644 \u0628\u0627\u0632\u06CC\u0627\u0641\u062A \u06A9\u0644 \u062A\u063A\u06CC\u06CC\u0631 \u0646\u0645\u06CC\u200C\u06A9\u0646\u062F."}},{id:"q7-04",chapter:7,question:{en:"How do the percent of sales and aging methods differ in purpose?",fa:"\u0631\u0648\u0634 \u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u0641\u0631\u0648\u0634 \u0648 \u0631\u0648\u0634 \u0633\u0646\u06CC \u06A9\u0631\u062F\u0646 \u062F\u0631 \u0647\u062F\u0641 \u0686\u0647 \u0641\u0631\u0642\u06CC \u062F\u0627\u0631\u0646\u062F\u061F"},answer:{en:"The percent of sales method focuses on the income statement: it estimates this year's bad debt expense directly from sales. The percent of receivables and aging methods focus on the balance sheet: they estimate the correct ending Allowance balance, so the current allowance balance must be considered. Aging is more accurate because older debts are less likely to be collected.",fa:"\u0631\u0648\u0634 \u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u0641\u0631\u0648\u0634 \u0631\u0648\u06CC \u0635\u0648\u0631\u062A \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646 \u062A\u0645\u0631\u06A9\u0632 \u062F\u0627\u0631\u062F: \u0647\u0632\u06CC\u0646\u0647\u0654 \u0633\u0648\u062E\u062A \u0627\u0645\u0633\u0627\u0644 \u0631\u0627 \u0645\u0633\u062A\u0642\u06CC\u0645 \u0627\u0632 \u0641\u0631\u0648\u0634 \u062A\u062E\u0645\u06CC\u0646 \u0645\u06CC\u200C\u0632\u0646\u062F. \u0631\u0648\u0634 \u062F\u0631\u0635\u062F\u06CC \u0627\u0632 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u0648 \u0633\u0646\u06CC \u06A9\u0631\u062F\u0646 \u0631\u0648\u06CC \u062A\u0631\u0627\u0632\u0646\u0627\u0645\u0647 \u062A\u0645\u0631\u06A9\u0632 \u062F\u0627\u0631\u0646\u062F: \u0645\u0627\u0646\u062F\u0647\u0654 \u062F\u0631\u0633\u062A \u0630\u062E\u06CC\u0631\u0647 \u0631\u0627 \u062A\u062E\u0645\u06CC\u0646 \u0645\u06CC\u200C\u0632\u0646\u0646\u062F\u060C \u067E\u0633 \u0645\u0627\u0646\u062F\u0647\u0654 \u0641\u0639\u0644\u06CC \u0630\u062E\u06CC\u0631\u0647 \u0628\u0627\u06CC\u062F \u062F\u0631 \u0646\u0638\u0631 \u06AF\u0631\u0641\u062A\u0647 \u0634\u0648\u062F. \u0633\u0646\u06CC \u06A9\u0631\u062F\u0646 \u062F\u0642\u06CC\u0642\u200C\u062A\u0631 \u0627\u0633\u062A \u0686\u0648\u0646 \u0628\u062F\u0647\u06CC\u200C\u0647\u0627\u06CC \u0642\u062F\u06CC\u0645\u06CC\u200C\u062A\u0631 \u0627\u062D\u062A\u0645\u0627\u0644 \u0648\u0635\u0648\u0644 \u06A9\u0645\u062A\u0631\u06CC \u062F\u0627\u0631\u0646\u062F."}},{id:"q7-05",chapter:7,question:{en:"What is a note receivable, and why might a company accept one instead of an account receivable?",fa:"\u0633\u0646\u062F \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u0686\u06CC\u0633\u062A \u0648 \u0686\u0631\u0627 \u0634\u0631\u06A9\u062A \u0645\u0645\u06A9\u0646 \u0627\u0633\u062A \u0628\u0647 \u062C\u0627\u06CC \u062D\u0633\u0627\u0628 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u0622\u0646 \u0631\u0627 \u0642\u0628\u0648\u0644 \u06A9\u0646\u062F\u061F"},answer:{en:"A note receivable is a written promise from a customer to pay a set amount, usually with interest, on a specific date. A company may accept one for a large sale or to give a late-paying customer more time, because the note is legally stronger and earns interest.",fa:"\u0633\u0646\u062F \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u0642\u0648\u0644 \u06A9\u062A\u0628\u06CC \u0645\u0634\u062A\u0631\u06CC \u0628\u0631\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A \u0645\u0628\u0644\u063A \u0645\u0639\u06CC\u0646\u060C \u0645\u0639\u0645\u0648\u0644\u0627\u064B \u0628\u0627 \u0628\u0647\u0631\u0647\u060C \u062F\u0631 \u062A\u0627\u0631\u06CC\u062E \u0645\u0634\u062E\u0635 \u0627\u0633\u062A. \u0634\u0631\u06A9\u062A \u0645\u0645\u06A9\u0646 \u0627\u0633\u062A \u0628\u0631\u0627\u06CC \u06CC\u06A9 \u0641\u0631\u0648\u0634 \u0628\u0632\u0631\u06AF \u06CC\u0627 \u0628\u0631\u0627\u06CC \u062F\u0627\u062F\u0646 \u0645\u0647\u0644\u062A \u0628\u06CC\u0634\u062A\u0631 \u0628\u0647 \u0645\u0634\u062A\u0631\u06CC \u062F\u06CC\u0631\u06A9\u0631\u062F \u0622\u0646 \u0631\u0627 \u0642\u0628\u0648\u0644 \u06A9\u0646\u062F\u060C \u0686\u0648\u0646 \u0633\u0646\u062F \u0627\u0632 \u0646\u0638\u0631 \u0642\u0627\u0646\u0648\u0646\u06CC \u0645\u062D\u06A9\u0645\u200C\u062A\u0631 \u0627\u0633\u062A \u0648 \u0628\u0647\u0631\u0647 \u0647\u0645 \u0645\u06CC\u200C\u0622\u0648\u0631\u062F."}},{id:"q7-06",chapter:7,question:{en:"What does accounts receivable turnover tell us?",fa:"\u06AF\u0631\u062F\u0634 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u0686\u0647 \u0686\u06CC\u0632\u06CC \u0628\u0647 \u0645\u0627 \u0645\u06CC\u200C\u06AF\u0648\u06CC\u062F\u061F"},answer:{en:"Accounts receivable turnover (net sales \xF7 average accounts receivable) shows how many times a year the company collects its average receivables. A higher number means customers pay faster, so cash comes in sooner. A falling number may mean weak credit policies or collection problems.",fa:"\u06AF\u0631\u062F\u0634 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 (\u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635 \xF7 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627) \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0634\u0631\u06A9\u062A \u062F\u0631 \u0633\u0627\u0644 \u0686\u0646\u062F \u0628\u0627\u0631 \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0637\u0627\u0644\u0628\u0627\u062A\u0634 \u0631\u0627 \u0648\u0635\u0648\u0644 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0639\u062F\u062F \u0628\u0627\u0644\u0627\u062A\u0631 \u06CC\u0639\u0646\u06CC \u0645\u0634\u062A\u0631\u06CC\u200C\u0647\u0627 \u0633\u0631\u06CC\u0639\u200C\u062A\u0631 \u067E\u0648\u0644 \u0645\u06CC\u200C\u062F\u0647\u0646\u062F \u0648 \u067E\u0648\u0644 \u0632\u0648\u062F\u062A\u0631 \u0645\u06CC\u200C\u0622\u06CC\u062F. \u06A9\u0627\u0647\u0634 \u0627\u06CC\u0646 \u0639\u062F\u062F \u0645\u0645\u06A9\u0646 \u0627\u0633\u062A \u06CC\u0639\u0646\u06CC \u0633\u06CC\u0627\u0633\u062A \u0627\u0639\u062A\u0628\u0627\u0631\u06CC \u0636\u0639\u06CC\u0641 \u06CC\u0627 \u0645\u0634\u06A9\u0644 \u0648\u0635\u0648\u0644."}},{id:"q8-01",chapter:8,question:{en:"What is depreciation, and what is it NOT?",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0686\u06CC\u0633\u062A \u0648 \u0686\u0647 \u0686\u06CC\u0632\u06CC \u0646\u06CC\u0633\u062A\u061F"},answer:{en:"Depreciation is the process of allocating a plant asset's cost to expense over its useful life, to match the cost with the revenue the asset helps earn. It is NOT a measure of the asset's market value, and it is NOT cash set aside to replace the asset.",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0641\u0631\u0627\u06CC\u0646\u062F \u067E\u062E\u0634 \u06A9\u0631\u062F\u0646 \u0628\u0647\u0627\u06CC \u06CC\u06A9 \u062F\u0627\u0631\u0627\u06CC\u06CC \u062B\u0627\u0628\u062A \u0628\u0647\u200C\u0639\u0646\u0648\u0627\u0646 \u0647\u0632\u06CC\u0646\u0647 \u062F\u0631 \u0637\u0648\u0644 \u0639\u0645\u0631 \u0645\u0641\u06CC\u062F \u0622\u0646 \u0627\u0633\u062A\u060C \u062A\u0627 \u0647\u0632\u06CC\u0646\u0647 \u0628\u0627 \u062F\u0631\u0622\u0645\u062F\u06CC \u06A9\u0647 \u062F\u0627\u0631\u0627\u06CC\u06CC \u06A9\u0645\u06A9 \u0628\u0647 \u06A9\u0633\u0628\u0634 \u0645\u06CC\u200C\u06A9\u0646\u062F \u062A\u0637\u0627\u0628\u0642 \u067E\u06CC\u062F\u0627 \u06A9\u0646\u062F. \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0627\u0631\u0632\u0634 \u0628\u0627\u0632\u0627\u0631 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0631\u0627 \u0646\u0634\u0627\u0646 \u0646\u0645\u06CC\u200C\u062F\u0647\u062F \u0648 \u067E\u0648\u0644\u06CC \u0647\u0645 \u0646\u06CC\u0633\u062A \u06A9\u0647 \u0628\u0631\u0627\u06CC \u062C\u0627\u06CC\u06AF\u0632\u06CC\u0646\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC \u06A9\u0646\u0627\u0631 \u06AF\u0630\u0627\u0634\u062A\u0647 \u0634\u0648\u062F."}},{id:"q8-02",chapter:8,question:{en:"Why are there different depreciation methods? When would a company choose each?",fa:"\u0686\u0631\u0627 \u0631\u0648\u0634\u200C\u0647\u0627\u06CC \u0645\u062E\u062A\u0644\u0641 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u062F\u0627\u0631\u06CC\u0645\u061F \u0634\u0631\u06A9\u062A \u06A9\u0650\u06CC \u0647\u0631 \u06A9\u062F\u0627\u0645 \u0631\u0627 \u0627\u0646\u062A\u062E\u0627\u0628 \u0645\u06CC\u200C\u06A9\u0646\u062F\u061F"},answer:{en:"Assets are used up in different ways. Straight-line suits assets that give equal benefit each year, like a building. Units-of-production suits assets whose wear depends on use, like a delivery truck or machine. Double-declining-balance suits assets that are most useful when new, like computers. The goal is to match expense with the benefit received.",fa:"\u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0628\u0647 \u0634\u06A9\u0644\u200C\u0647\u0627\u06CC \u0645\u062E\u062A\u0644\u0641 \u0645\u0635\u0631\u0641 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F. \u062E\u0637 \u0645\u0633\u062A\u0642\u06CC\u0645 \u0628\u0631\u0627\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0647\u0631 \u0633\u0627\u0644 \u0641\u0627\u06CC\u062F\u0647\u0654 \u06CC\u06A9\u0633\u0627\u0646\u06CC \u062F\u0627\u0631\u0646\u062F\u060C \u0645\u062B\u0644 \u0633\u0627\u062E\u062A\u0645\u0627\u0646. \u0648\u0627\u062D\u062F \u062A\u0648\u0644\u06CC\u062F \u0628\u0631\u0627\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0641\u0631\u0633\u0648\u062F\u06AF\u06CC\u200C\u0634\u0627\u0646 \u0628\u0647 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0628\u0633\u062A\u06AF\u06CC \u062F\u0627\u0631\u062F\u060C \u0645\u062B\u0644 \u0645\u0648\u062A\u0631 \u06CC\u0627 \u0645\u0627\u0634\u06CC\u0646\u200C\u0622\u0644\u0627\u062A. \u0646\u0632\u0648\u0644\u06CC \u0645\u0636\u0627\u0639\u0641 \u0628\u0631\u0627\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0648\u0642\u062A\u06CC \u0646\u0648 \u0647\u0633\u062A\u0646\u062F \u0645\u0641\u06CC\u062F\u062A\u0631\u0646\u062F\u060C \u0645\u062B\u0644 \u06A9\u0627\u0645\u067E\u06CC\u0648\u062A\u0631. \u0647\u062F\u0641\u060C \u062A\u0637\u0627\u0628\u0642 \u0647\u0632\u06CC\u0646\u0647 \u0628\u0627 \u0641\u0627\u06CC\u062F\u0647 \u0627\u0633\u062A."}},{id:"q8-03",chapter:8,question:{en:"What is the difference between a capital expenditure and a revenue expenditure?",fa:"\u0641\u0631\u0642 \u0645\u062E\u0627\u0631\u062C \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u0627\u06CC \u0648 \u0645\u062E\u0627\u0631\u062C \u062F\u0631\u0622\u0645\u062F\u06CC \u0686\u06CC\u0633\u062A\u061F"},answer:{en:"A capital expenditure extends an asset's life, increases its capacity, or improves it (e.g. a new engine), so it is added to the asset's cost and depreciated. A revenue expenditure keeps the asset in normal working order (e.g. an oil change or small repair), so it is expensed right away. Getting this wrong misstates both profit and assets.",fa:"\u0645\u062E\u0627\u0631\u062C \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u0627\u06CC \u0639\u0645\u0631 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0631\u0627 \u0628\u06CC\u0634\u062A\u0631\u060C \u0638\u0631\u0641\u06CC\u062A\u0634 \u0631\u0627 \u0632\u06CC\u0627\u062F\u062A\u0631 \u06CC\u0627 \u0622\u0646 \u0631\u0627 \u0628\u0647\u062A\u0631 \u0645\u06CC\u200C\u06A9\u0646\u062F (\u0645\u062B\u0644\u0627\u064B \u0645\u0648\u062A\u0648\u0631 \u062C\u062F\u06CC\u062F)\u060C \u067E\u0633 \u0628\u0647 \u0628\u0647\u0627\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC \u0627\u0636\u0627\u0641\u0647 \u0648 \u0645\u0633\u062A\u0647\u0644\u06A9 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0645\u062E\u0627\u0631\u062C \u062F\u0631\u0622\u0645\u062F\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC \u0631\u0627 \u0641\u0642\u0637 \u062F\u0631 \u062D\u0627\u0644\u062A \u06A9\u0627\u0631 \u0639\u0627\u062F\u06CC \u0646\u06AF\u0647 \u0645\u06CC\u200C\u062F\u0627\u0631\u062F (\u0645\u062B\u0644\u0627\u064B \u062A\u0639\u0648\u06CC\u0636 \u0631\u0648\u063A\u0646 \u06CC\u0627 \u062A\u0639\u0645\u06CC\u0631 \u06A9\u0648\u0686\u06A9)\u060C \u067E\u0633 \u0641\u0648\u0631\u0627\u064B \u0647\u0632\u06CC\u0646\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0627\u0634\u062A\u0628\u0627\u0647 \u062F\u0631 \u0627\u06CC\u0646\u060C \u0647\u0645 \u0633\u0648\u062F \u0648 \u0647\u0645 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627 \u0631\u0627 \u063A\u0644\u0637 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F."}},{id:"q8-04",chapter:8,question:{en:"Why does a change in estimated useful life affect only current and future years?",fa:"\u0686\u0631\u0627 \u062A\u063A\u06CC\u06CC\u0631 \u062F\u0631 \u062A\u062E\u0645\u06CC\u0646 \u0639\u0645\u0631 \u0645\u0641\u06CC\u062F \u0641\u0642\u0637 \u0631\u0648\u06CC \u0633\u0627\u0644 \u062C\u0627\u0631\u06CC \u0648 \u0622\u06CC\u0646\u062F\u0647 \u0627\u062B\u0631 \u062F\u0627\u0631\u062F\u061F"},answer:{en:"Depreciation is based on estimates made with the best information at the time. When new information arrives, past years are not wrong, so they are not restated. The remaining book value is simply spread over the new remaining life. This keeps past statements stable and reliable.",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0628\u0631 \u0627\u0633\u0627\u0633 \u062A\u062E\u0645\u06CC\u0646\u200C\u0647\u0627\u06CC\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0628\u0627 \u0628\u0647\u062A\u0631\u06CC\u0646 \u0627\u0637\u0644\u0627\u0639\u0627\u062A \u0647\u0645\u0627\u0646 \u0632\u0645\u0627\u0646 \u0632\u062F\u0647 \u0634\u062F\u0647. \u0648\u0642\u062A\u06CC \u0627\u0637\u0644\u0627\u0639\u0627\u062A \u062C\u062F\u06CC\u062F \u0645\u06CC\u200C\u0631\u0633\u062F\u060C \u0633\u0627\u0644\u200C\u0647\u0627\u06CC \u06AF\u0630\u0634\u062A\u0647 \u063A\u0644\u0637 \u0646\u0628\u0648\u062F\u0647\u200C\u0627\u0646\u062F\u060C \u067E\u0633 \u0627\u0635\u0644\u0627\u062D \u0646\u0645\u06CC\u200C\u0634\u0648\u0646\u062F. \u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u0628\u0627\u0642\u06CC\u200C\u0645\u0627\u0646\u062F\u0647 \u0641\u0642\u0637 \u0631\u0648\u06CC \u0639\u0645\u0631 \u0628\u0627\u0642\u06CC\u200C\u0645\u0627\u0646\u062F\u0647\u0654 \u062C\u062F\u06CC\u062F \u067E\u062E\u0634 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0627\u06CC\u0646 \u06A9\u0627\u0631 \u0635\u0648\u0631\u062A\u200C\u0647\u0627\u06CC \u06AF\u0630\u0634\u062A\u0647 \u0631\u0627 \u062B\u0627\u0628\u062A \u0648 \u0642\u0627\u0628\u0644 \u0627\u0639\u062A\u0645\u0627\u062F \u0646\u06AF\u0647 \u0645\u06CC\u200C\u062F\u0627\u0631\u062F."}},{id:"q8-05",chapter:8,question:{en:"Why is a gain or loss recorded when a plant asset is sold?",fa:"\u0686\u0631\u0627 \u0647\u0646\u06AF\u0627\u0645 \u0641\u0631\u0648\u0634 \u062F\u0627\u0631\u0627\u06CC\u06CC \u062B\u0627\u0628\u062A \u0633\u0648\u062F \u06CC\u0627 \u0632\u06CC\u0627\u0646 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},answer:{en:"Because the cash received rarely equals the asset's book value. Book value is only an estimate based on depreciation, not market value. If the company receives more than book value, it records a gain; if less, a loss. Depreciation must first be updated to the date of sale so book value is correct.",fa:"\u0686\u0648\u0646 \u067E\u0648\u0644 \u062F\u0631\u06CC\u0627\u0641\u062A\u06CC \u06A9\u0645\u062A\u0631 \u0628\u0627 \u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u062F\u0627\u0631\u0627\u06CC\u06CC \u0628\u0631\u0627\u0628\u0631 \u0627\u0633\u062A. \u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u0641\u0642\u0637 \u06CC\u06A9 \u062A\u062E\u0645\u06CC\u0646 \u0628\u0631 \u0627\u0633\u0627\u0633 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0627\u0633\u062A\u060C \u0646\u0647 \u0627\u0631\u0632\u0634 \u0628\u0627\u0632\u0627\u0631. \u0627\u06AF\u0631 \u0634\u0631\u06A9\u062A \u0628\u06CC\u0634\u062A\u0631 \u0627\u0632 \u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u0628\u06AF\u06CC\u0631\u062F \u0633\u0648\u062F\u060C \u0648 \u0627\u06AF\u0631 \u06A9\u0645\u062A\u0631 \u0628\u06AF\u06CC\u0631\u062F \u0632\u06CC\u0627\u0646 \u062B\u0628\u062A \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0627\u0648\u0644 \u0628\u0627\u06CC\u062F \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u062A\u0627 \u062A\u0627\u0631\u06CC\u062E \u0641\u0631\u0648\u0634 \u0628\u0647\u200C\u0631\u0648\u0632 \u0634\u0648\u062F \u062A\u0627 \u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u062F\u0631\u0633\u062A \u0628\u0627\u0634\u062F."}},{id:"q8-06",chapter:8,question:{en:"What are natural resources and intangible assets, and how are their costs expensed?",fa:"\u0645\u0646\u0627\u0628\u0639 \u0637\u0628\u06CC\u0639\u06CC \u0648 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC \u0646\u0627\u0645\u0634\u0647\u0648\u062F \u0686\u06CC\u0633\u062A\u0646\u062F \u0648 \u0628\u0647\u0627\u06CC\u0634\u0627\u0646 \u0686\u0637\u0648\u0631 \u0647\u0632\u06CC\u0646\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},answer:{en:"Natural resources (mines, oil wells, forests) are used up by extraction, so their cost is expensed through depletion based on units extracted. Intangible assets (patents, copyrights, franchises) have no physical form but give legal rights, so their cost is expensed through amortization over their useful or legal life. Goodwill is not amortized.",fa:"\u0645\u0646\u0627\u0628\u0639 \u0637\u0628\u06CC\u0639\u06CC (\u0645\u0639\u062F\u0646\u060C \u0686\u0627\u0647 \u0646\u0641\u062A\u060C \u062C\u0646\u06AF\u0644) \u0628\u0627 \u0627\u0633\u062A\u062E\u0631\u0627\u062C \u0645\u0635\u0631\u0641 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F\u060C \u067E\u0633 \u0628\u0647\u0627\u06CC\u0634\u0627\u0646 \u0628\u0627 \u062A\u062E\u0644\u06CC\u0647 \u0628\u0631 \u0627\u0633\u0627\u0633 \u0648\u0627\u062D\u062F\u0647\u0627\u06CC \u0627\u0633\u062A\u062E\u0631\u0627\u062C\u200C\u0634\u062F\u0647 \u0647\u0632\u06CC\u0646\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F. \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC \u0646\u0627\u0645\u0634\u0647\u0648\u062F (\u062D\u0642 \u0627\u062E\u062A\u0631\u0627\u0639\u060C \u062D\u0642 \u0646\u0634\u0631\u060C \u0627\u0645\u062A\u06CC\u0627\u0632) \u0634\u06A9\u0644 \u0641\u06CC\u0632\u06CC\u06A9\u06CC \u0646\u062F\u0627\u0631\u0646\u062F \u0648\u0644\u06CC \u062D\u0642 \u0642\u0627\u0646\u0648\u0646\u06CC \u0645\u06CC\u200C\u062F\u0647\u0646\u062F\u060C \u067E\u0633 \u0628\u0647\u0627\u06CC\u0634\u0627\u0646 \u0628\u0627 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0646\u0627\u0645\u0634\u0647\u0648\u062F \u062F\u0631 \u0637\u0648\u0644 \u0639\u0645\u0631 \u0645\u0641\u06CC\u062F \u06CC\u0627 \u0642\u0627\u0646\u0648\u0646\u06CC \u0647\u0632\u06CC\u0646\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0633\u0631\u0642\u0641\u0644\u06CC \u0645\u0633\u062A\u0647\u0644\u06A9 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"q9-01",chapter:9,question:{en:"What is a liability, and how do we decide whether it is current or long-term?",fa:"\u0628\u062F\u0647\u06CC \u0686\u06CC\u0633\u062A \u0648 \u0686\u0637\u0648\u0631 \u062A\u0639\u06CC\u06CC\u0646 \u0645\u06CC\u200C\u06A9\u0646\u06CC\u0645 \u062C\u0627\u0631\u06CC \u0627\u0633\u062A \u06CC\u0627 \u0628\u0644\u0646\u062F\u0645\u062F\u062A\u061F"},answer:{en:"A liability is a present obligation to pay cash, provide goods, or perform services in the future because of a past event. It is current if it is due within one year (or the operating cycle, if longer); otherwise it is long-term. The split helps users judge whether the company can pay what is due soon.",fa:"\u0628\u062F\u0647\u06CC \u062A\u0639\u0647\u062F \u0641\u0639\u0644\u06CC \u0628\u0631\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A \u067E\u0648\u0644\u060C \u062F\u0627\u062F\u0646 \u06A9\u0627\u0644\u0627 \u06CC\u0627 \u0627\u0646\u062C\u0627\u0645 \u062E\u062F\u0645\u062A \u062F\u0631 \u0622\u06CC\u0646\u062F\u0647 \u0628\u0647 \u062E\u0627\u0637\u0631 \u06CC\u06A9 \u0631\u0648\u06CC\u062F\u0627\u062F \u06AF\u0630\u0634\u062A\u0647 \u0627\u0633\u062A. \u0627\u06AF\u0631 \u0638\u0631\u0641 \u06CC\u06A9 \u0633\u0627\u0644 (\u06CC\u0627 \u06CC\u06A9 \u0686\u0631\u062E\u0647\u0654 \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC\u060C \u0627\u06AF\u0631 \u0637\u0648\u0644\u0627\u0646\u06CC\u200C\u062A\u0631 \u0628\u0627\u0634\u062F) \u0633\u0631\u0631\u0633\u06CC\u062F \u0634\u0648\u062F \u062C\u0627\u0631\u06CC \u0627\u0633\u062A\u061B \u0648\u06AF\u0631\u0646\u0647 \u0628\u0644\u0646\u062F\u0645\u062F\u062A. \u0627\u06CC\u0646 \u062A\u0642\u0633\u06CC\u0645 \u0628\u0647 \u0627\u0633\u062A\u0641\u0627\u062F\u0647\u200C\u06A9\u0646\u0646\u062F\u06AF\u0627\u0646 \u06A9\u0645\u06A9 \u0645\u06CC\u200C\u06A9\u0646\u062F \u0628\u0641\u0647\u0645\u0646\u062F \u0634\u0631\u06A9\u062A \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0628\u062F\u0647\u06CC\u200C\u0647\u0627\u06CC \u0646\u0632\u062F\u06CC\u06A9 \u0631\u0627 \u0628\u067E\u0631\u062F\u0627\u0632\u062F \u06CC\u0627 \u0646\u0647."}},{id:"q9-02",chapter:9,question:{en:"Why is sales tax collected from customers a liability and not revenue?",fa:"\u0686\u0631\u0627 \u0645\u0627\u0644\u06CC\u0627\u062A \u0641\u0631\u0648\u0634\u06CC \u06A9\u0647 \u0627\u0632 \u0645\u0634\u062A\u0631\u06CC \u06AF\u0631\u0641\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F \u0628\u062F\u0647\u06CC \u0627\u0633\u062A\u060C \u0646\u0647 \u062F\u0631\u0622\u0645\u062F\u061F"},answer:{en:"The company collects sales tax on behalf of the government. The money never belongs to the company; it must be paid to the government. So it is recorded as Sales Taxes Payable, a liability, not as revenue.",fa:"\u0634\u0631\u06A9\u062A \u0645\u0627\u0644\u06CC\u0627\u062A \u0641\u0631\u0648\u0634 \u0631\u0627 \u0627\u0632 \u0637\u0631\u0641 \u062F\u0648\u0644\u062A \u062C\u0645\u0639 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0627\u06CC\u0646 \u067E\u0648\u0644 \u0647\u06CC\u0686\u200C\u0648\u0642\u062A \u0645\u0627\u0644 \u0634\u0631\u06A9\u062A \u0646\u06CC\u0633\u062A \u0648 \u0628\u0627\u06CC\u062F \u0628\u0647 \u062F\u0648\u0644\u062A \u067E\u0631\u062F\u0627\u062E\u062A \u0634\u0648\u062F. \u067E\u0633 \u0628\u0647\u200C\u0639\u0646\u0648\u0627\u0646 \u0645\u0627\u0644\u06CC\u0627\u062A \u0641\u0631\u0648\u0634 \u067E\u0631\u062F\u0627\u062E\u062A\u0646\u06CC\u060C \u06CC\u0639\u0646\u06CC \u0628\u062F\u0647\u06CC\u060C \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F \u0646\u0647 \u062F\u0631\u0622\u0645\u062F."}},{id:"q9-03",chapter:9,question:{en:"What is the difference between employee payroll deductions and employer payroll taxes?",fa:"\u0641\u0631\u0642 \u06A9\u0633\u0648\u0631\u0627\u062A \u062D\u0642\u0648\u0642 \u06A9\u0627\u0631\u0645\u0646\u062F \u0648 \u0645\u0627\u0644\u06CC\u0627\u062A \u062D\u0642\u0648\u0642 \u06A9\u0627\u0631\u0641\u0631\u0645\u0627 \u0686\u06CC\u0633\u062A\u061F"},answer:{en:"Employee deductions (income tax, the employee's FICA) are taken out of the employee's gross pay; the company only holds them and pays them to the government, so they are liabilities but not company expenses. Employer payroll taxes (the employer's FICA, FUTA, SUTA) are paid by the company itself, so they are an additional expense on top of wages.",fa:"\u06A9\u0633\u0648\u0631\u0627\u062A \u06A9\u0627\u0631\u0645\u0646\u062F (\u0645\u0627\u0644\u06CC\u0627\u062A \u0628\u0631 \u062F\u0631\u0622\u0645\u062F\u060C \u0633\u0647\u0645 \u062A\u0623\u0645\u06CC\u0646 \u0627\u062C\u062A\u0645\u0627\u0639\u06CC \u06A9\u0627\u0631\u0645\u0646\u062F) \u0627\u0632 \u062D\u0642\u0648\u0642 \u0646\u0627\u062E\u0627\u0644\u0635 \u06A9\u0627\u0631\u0645\u0646\u062F \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F\u061B \u0634\u0631\u06A9\u062A \u0641\u0642\u0637 \u0622\u0646 \u0631\u0627 \u0646\u06AF\u0647 \u0645\u06CC\u200C\u062F\u0627\u0631\u062F \u0648 \u0628\u0647 \u062F\u0648\u0644\u062A \u0645\u06CC\u200C\u062F\u0647\u062F\u060C \u067E\u0633 \u0628\u062F\u0647\u06CC \u0627\u0633\u062A \u0648\u0644\u06CC \u0647\u0632\u06CC\u0646\u0647\u0654 \u0634\u0631\u06A9\u062A \u0646\u06CC\u0633\u062A. \u0645\u0627\u0644\u06CC\u0627\u062A \u062D\u0642\u0648\u0642 \u06A9\u0627\u0631\u0641\u0631\u0645\u0627 (\u0633\u0647\u0645 \u062A\u0623\u0645\u06CC\u0646 \u0627\u062C\u062A\u0645\u0627\u0639\u06CC \u06A9\u0627\u0631\u0641\u0631\u0645\u0627\u060C \u0628\u06CC\u0645\u0647\u0654 \u0628\u06CC\u06A9\u0627\u0631\u06CC \u0641\u062F\u0631\u0627\u0644 \u0648 \u0627\u06CC\u0627\u0644\u062A\u06CC) \u0631\u0627 \u062E\u0648\u062F \u0634\u0631\u06A9\u062A \u0645\u06CC\u200C\u067E\u0631\u062F\u0627\u0632\u062F\u060C \u067E\u0633 \u06CC\u06A9 \u0647\u0632\u06CC\u0646\u0647\u0654 \u0627\u0636\u0627\u0641\u0647 \u0631\u0648\u06CC \u062D\u0642\u0648\u0642 \u0627\u0633\u062A."}},{id:"q9-04",chapter:9,question:{en:"Why are warranty costs recorded in the year of the sale, even though repairs happen later?",fa:"\u0686\u0631\u0627 \u0647\u0632\u06CC\u0646\u0647\u0654 \u06AF\u0627\u0631\u0627\u0646\u062A\u06CC \u062F\u0631 \u0633\u0627\u0644 \u0641\u0631\u0648\u0634 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F\u060C \u0628\u0627 \u0627\u06CC\u0646\u06A9\u0647 \u062A\u0639\u0645\u06CC\u0631\u0627\u062A \u0628\u0639\u062F\u0627\u064B \u0627\u0646\u062C\u0627\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},answer:{en:"Because of the matching principle. The warranty is part of what the company promised when it made the sale, so its cost belongs to the same period as the sales revenue. The company estimates the cost and records Warranty Expense and an Estimated Warranty Liability; later repairs reduce the liability.",fa:"\u0628\u0647 \u062E\u0627\u0637\u0631 \u0627\u0635\u0644 \u062A\u0637\u0627\u0628\u0642. \u06AF\u0627\u0631\u0627\u0646\u062A\u06CC \u0628\u062E\u0634\u06CC \u0627\u0632 \u0642\u0648\u0644\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0634\u0631\u06A9\u062A \u0647\u0646\u06AF\u0627\u0645 \u0641\u0631\u0648\u0634 \u062F\u0627\u062F\u0647\u060C \u067E\u0633 \u0647\u0632\u06CC\u0646\u0647\u200C\u0627\u0634 \u0645\u0627\u0644 \u0647\u0645\u0627\u0646 \u062F\u0648\u0631\u0647\u0654 \u062F\u0631\u0622\u0645\u062F \u0641\u0631\u0648\u0634 \u0627\u0633\u062A. \u0634\u0631\u06A9\u062A \u0647\u0632\u06CC\u0646\u0647 \u0631\u0627 \u062A\u062E\u0645\u06CC\u0646 \u0645\u06CC\u200C\u0632\u0646\u062F \u0648 \u0647\u0632\u06CC\u0646\u0647\u0654 \u06AF\u0627\u0631\u0627\u0646\u062A\u06CC \u0648 \u0628\u062F\u0647\u06CC \u062A\u062E\u0645\u06CC\u0646\u06CC \u06AF\u0627\u0631\u0627\u0646\u062A\u06CC \u062B\u0628\u062A \u0645\u06CC\u200C\u06A9\u0646\u062F\u061B \u062A\u0639\u0645\u06CC\u0631\u0627\u062A \u0628\u0639\u062F\u06CC \u0627\u06CC\u0646 \u0628\u062F\u0647\u06CC \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F."}},{id:"q9-05",chapter:9,question:{en:"What is a contingent liability, and how is it reported?",fa:"\u0628\u062F\u0647\u06CC \u0627\u062D\u062A\u0645\u0627\u0644\u06CC \u0686\u06CC\u0633\u062A \u0648 \u0686\u0637\u0648\u0631 \u06AF\u0632\u0627\u0631\u0634 \u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},answer:{en:"A contingent liability depends on a future event, such as losing a lawsuit. If the loss is probable and can be estimated, it is recorded. If it is reasonably possible, it is only disclosed in the notes. If it is remote, nothing is needed. This keeps users informed without recording uncertain amounts as certain.",fa:"\u0628\u062F\u0647\u06CC \u0627\u062D\u062A\u0645\u0627\u0644\u06CC \u0628\u0647 \u06CC\u06A9 \u0631\u0648\u06CC\u062F\u0627\u062F \u0622\u06CC\u0646\u062F\u0647 \u0628\u0633\u062A\u06AF\u06CC \u062F\u0627\u0631\u062F\u060C \u0645\u062B\u0644 \u0628\u0627\u062E\u062A\u0646 \u06CC\u06A9 \u062F\u0639\u0648\u0627\u06CC \u062D\u0642\u0648\u0642\u06CC. \u0627\u06AF\u0631 \u0632\u06CC\u0627\u0646 \u0645\u062D\u062A\u0645\u0644 \u0628\u0627\u0634\u062F \u0648 \u0642\u0627\u0628\u0644 \u062A\u062E\u0645\u06CC\u0646\u060C \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F. \u0627\u06AF\u0631 \u0628\u0647\u200C\u0637\u0648\u0631 \u0645\u0639\u0642\u0648\u0644 \u0645\u0645\u06A9\u0646 \u0628\u0627\u0634\u062F\u060C \u0641\u0642\u0637 \u062F\u0631 \u06CC\u0627\u062F\u062F\u0627\u0634\u062A\u200C\u0647\u0627 \u0627\u0641\u0634\u0627 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0627\u06AF\u0631 \u0628\u0639\u06CC\u062F \u0628\u0627\u0634\u062F\u060C \u06A9\u0627\u0631\u06CC \u0644\u0627\u0632\u0645 \u0646\u06CC\u0633\u062A. \u0627\u06CC\u0646 \u06A9\u0627\u0631 \u0627\u0633\u062A\u0641\u0627\u062F\u0647\u200C\u06A9\u0646\u0646\u062F\u06AF\u0627\u0646 \u0631\u0627 \u0622\u06AF\u0627\u0647 \u0646\u06AF\u0647 \u0645\u06CC\u200C\u062F\u0627\u0631\u062F \u0628\u062F\u0648\u0646 \u0627\u06CC\u0646\u06A9\u0647 \u0645\u0628\u0627\u0644\u063A \u0646\u0627\u0645\u0637\u0645\u0626\u0646 \u0631\u0627 \u0642\u0637\u0639\u06CC \u062B\u0628\u062A \u06A9\u0646\u062F."}},{id:"q9-06",chapter:9,question:{en:"What does times interest earned show, and why do lenders use it?",fa:"\u0646\u0633\u06
