28\u062A \u067E\u0648\u0634\u0634 \u0628\u0647\u0631\u0647 \u0686\u0647 \u0686\u06CC\u0632\u06CC \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0648 \u0686\u0631\u0627 \u0648\u0627\u0645\u200C\u062F\u0647\u0646\u062F\u06AF\u0627\u0646 \u0627\u0632 \u0622\u0646 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F\u061F"},answer:{en:"Times interest earned (income before interest and taxes \xF7 interest expense) shows how many times a company's earnings can cover its interest payments. Lenders use it to judge risk: a high number means the company can easily pay interest even if profits fall; a low number means it could struggle.",fa:"\u0646\u0633\u0628\u062A \u067E\u0648\u0634\u0634 \u0628\u0647\u0631\u0647 (\u0633\u0648\u062F \u0642\u0628\u0644 \u0627\u0632 \u0628\u0647\u0631\u0647 \u0648 \u0645\u0627\u0644\u06CC\u0627\u062A \xF7 \u0647\u0632\u06CC\u0646\u0647\u0654 \u0628\u0647\u0631\u0647) \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0633\u0648\u062F \u0634\u0631\u06A9\u062A \u0686\u0646\u062F \u0628\u0631\u0627\u0628\u0631 \u0628\u0647\u0631\u0647\u200C\u0627\u0634 \u0627\u0633\u062A. \u0648\u0627\u0645\u200C\u062F\u0647\u0646\u062F\u06AF\u0627\u0646 \u0628\u0631\u0627\u06CC \u0633\u0646\u062C\u0634 \u0631\u06CC\u0633\u06A9 \u0627\u0632 \u0622\u0646 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F: \u0639\u062F\u062F \u0628\u0627\u0644\u0627 \u06CC\u0639\u0646\u06CC \u0634\u0631\u06A9\u062A \u062D\u062A\u06CC \u0627\u06AF\u0631 \u0633\u0648\u062F\u0634 \u06A9\u0645 \u0634\u0648\u062F\u060C \u0631\u0627\u062D\u062A \u0628\u0647\u0631\u0647 \u0631\u0627 \u0645\u06CC\u200C\u067E\u0631\u062F\u0627\u0632\u062F\u061B \u0639\u062F\u062F \u067E\u0627\u06CC\u06CC\u0646 \u06CC\u0639\u0646\u06CC \u0645\u0645\u06A9\u0646 \u0627\u0633\u062A \u0628\u0647 \u0645\u0634\u06A9\u0644 \u0628\u062E\u0648\u0631\u062F."}},{id:"q10-01",chapter:10,question:{en:"What are bonds, and why would a company issue bonds instead of stock?",fa:"\u0627\u0648\u0631\u0627\u0642 \u0642\u0631\u0636\u0647 \u0686\u06CC\u0633\u062A \u0648 \u0686\u0631\u0627 \u0634\u0631\u06A9\u062A \u0628\u0647 \u062C\u0627\u06CC \u0633\u0647\u0627\u0645 \u0627\u0648\u0631\u0627\u0642 \u0642\u0631\u0636\u0647 \u0645\u0646\u062A\u0634\u0631 \u0645\u06CC\u200C\u06A9\u0646\u062F\u061F"},answer:{en:"Bonds are long-term debt: the company borrows from many investors and promises to pay periodic interest and repay the par value at maturity. A company may prefer bonds because owners keep control (bondholders don't vote), interest is tax-deductible, and if the company earns more than the interest rate, owners' returns increase.",fa:"\u0627\u0648\u0631\u0627\u0642 \u0642\u0631\u0636\u0647 \u0628\u062F\u0647\u06CC \u0628\u0644\u0646\u062F\u0645\u062F\u062A \u0627\u0633\u062A: \u0634\u0631\u06A9\u062A \u0627\u0632 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u0627\u0646 \u0632\u06CC\u0627\u062F\u06CC \u0642\u0631\u0636 \u0645\u06CC\u200C\u06AF\u06CC\u0631\u062F \u0648 \u0642\u0648\u0644 \u0645\u06CC\u200C\u062F\u0647\u062F \u0628\u0647\u0631\u0647\u0654 \u062F\u0648\u0631\u0647\u200C\u0627\u06CC \u0628\u062F\u0647\u062F \u0648 \u062F\u0631 \u0633\u0631\u0631\u0633\u06CC\u062F \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0631\u0627 \u0628\u0631\u06AF\u0631\u062F\u0627\u0646\u062F. \u0634\u0631\u06A9\u062A \u0645\u0645\u06A9\u0646 \u0627\u0633\u062A \u0627\u0648\u0631\u0627\u0642 \u0631\u0627 \u062A\u0631\u062C\u06CC\u062D \u062F\u0647\u062F \u0686\u0648\u0646 \u0635\u0627\u062D\u0628\u0627\u0646 \u06A9\u0646\u062A\u0631\u0644 \u0631\u0627 \u0646\u06AF\u0647 \u0645\u06CC\u200C\u062F\u0627\u0631\u0646\u062F (\u062F\u0627\u0631\u0646\u062F\u06AF\u0627\u0646 \u0627\u0648\u0631\u0627\u0642 \u0631\u0623\u06CC \u0646\u062F\u0627\u0631\u0646\u062F)\u060C \u0628\u0647\u0631\u0647 \u0627\u0632 \u0645\u0627\u0644\u06CC\u0627\u062A \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F\u060C \u0648 \u0627\u06AF\u0631 \u0634\u0631\u06A9\u062A \u0628\u06CC\u0634\u062A\u0631 \u0627\u0632 \u0646\u0631\u062E \u0628\u0647\u0631\u0647 \u0633\u0648\u062F \u06A9\u0646\u062F\u060C \u0628\u0627\u0632\u062F\u0647 \u0635\u0627\u062D\u0628\u0627\u0646 \u0628\u06CC\u0634\u062A\u0631 \u0645\u06CC\u200C\u0634\u0648\u062F."}},{id:"q10-02",chapter:10,question:{en:"What are the risks of bond financing?",fa:"\u0631\u06CC\u0633\u06A9\u200C\u0647\u0627\u06CC \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC \u0628\u0627 \u0627\u0648\u0631\u0627\u0642 \u0642\u0631\u0636\u0647 \u0686\u06CC\u0633\u062A\u061F"},answer:{en:"Bonds require fixed interest payments and repayment of par at maturity, whether the company is doing well or not. If earnings fall, these fixed payments can cause financial trouble or even bankruptcy. Stock has no required payments, so it is less risky for the company.",fa:"\u0627\u0648\u0631\u0627\u0642 \u0642\u0631\u0636\u0647 \u067E\u0631\u062F\u0627\u062E\u062A \u0628\u0647\u0631\u0647\u0654 \u062B\u0627\u0628\u062A \u0648 \u0628\u0627\u0632\u067E\u0631\u062F\u0627\u062E\u062A \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u062F\u0631 \u0633\u0631\u0631\u0633\u06CC\u062F \u0631\u0627 \u0644\u0627\u0632\u0645 \u062F\u0627\u0631\u062F\u060C \u0686\u0647 \u0634\u0631\u06A9\u062A \u062E\u0648\u0628 \u06A9\u0627\u0631 \u06A9\u0646\u062F \u0686\u0647 \u0646\u0647. \u0627\u06AF\u0631 \u0633\u0648\u062F \u06A9\u0645 \u0634\u0648\u062F\u060C \u0627\u06CC\u0646 \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0647\u0627\u06CC \u062B\u0627\u0628\u062A \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0645\u0634\u06A9\u0644 \u0645\u0627\u0644\u06CC \u06CC\u0627 \u062D\u062A\u06CC \u0648\u0631\u0634\u06A9\u0633\u062A\u06AF\u06CC \u0627\u06CC\u062C\u0627\u062F \u06A9\u0646\u062F. \u0633\u0647\u0627\u0645 \u067E\u0631\u062F\u0627\u062E\u062A \u0627\u062C\u0628\u0627\u0631\u06CC \u0646\u062F\u0627\u0631\u062F\u060C \u067E\u0633 \u0628\u0631\u0627\u06CC \u0634\u0631\u06A9\u062A \u06A9\u0645\u200C\u0631\u06CC\u0633\u06A9\u200C\u062A\u0631 \u0627\u0633\u062A."}},{id:"q10-03",chapter:10,question:{en:"Why do bonds sell at a discount or a premium?",fa:"\u0686\u0631\u0627 \u0627\u0648\u0631\u0627\u0642 \u0642\u0631\u0636\u0647 \u0628\u0627 \u06A9\u0633\u0631 \u06CC\u0627 \u0628\u0627 \u0635\u0631\u0641 \u0641\u0631\u0648\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F\u061F"},answer:{en:"The contract rate is fixed when the bond is printed, but the market rate changes. If the contract rate is lower than the market rate, investors won't pay full price, so the bond sells at a discount. If the contract rate is higher, investors pay extra, so it sells at a premium. This adjusts the bond's real return to the market rate.",fa:"\u0646\u0631\u062E \u0627\u0648\u0631\u0627\u0642 \u0647\u0646\u06AF\u0627\u0645 \u0686\u0627\u067E \u062B\u0627\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F\u060C \u0648\u0644\u06CC \u0646\u0631\u062E \u0628\u0627\u0632\u0627\u0631 \u062A\u063A\u06CC\u06CC\u0631 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0627\u06AF\u0631 \u0646\u0631\u062E \u0627\u0648\u0631\u0627\u0642 \u06A9\u0645\u062A\u0631 \u0627\u0632 \u0646\u0631\u062E \u0628\u0627\u0632\u0627\u0631 \u0628\u0627\u0634\u062F\u060C \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u0627\u0646 \u0642\u06CC\u0645\u062A \u06A9\u0627\u0645\u0644 \u0646\u0645\u06CC\u200C\u062F\u0647\u0646\u062F\u060C \u067E\u0633 \u0628\u0627 \u06A9\u0633\u0631 \u0641\u0631\u0648\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0627\u06AF\u0631 \u0646\u0631\u062E \u0627\u0648\u0631\u0627\u0642 \u0628\u06CC\u0634\u062A\u0631 \u0628\u0627\u0634\u062F\u060C \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u0627\u0646 \u067E\u0648\u0644 \u0627\u0636\u0627\u0641\u0647 \u0645\u06CC\u200C\u062F\u0647\u0646\u062F\u060C \u067E\u0633 \u0628\u0627 \u0635\u0631\u0641 \u0641\u0631\u0648\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0627\u06CC\u0646 \u06A9\u0627\u0631 \u0628\u0627\u0632\u062F\u0647 \u0648\u0627\u0642\u0639\u06CC \u0627\u0648\u0631\u0627\u0642 \u0631\u0627 \u0628\u0627 \u0646\u0631\u062E \u0628\u0627\u0632\u0627\u0631 \u0647\u0645\u0627\u0647\u0646\u06AF \u0645\u06CC\u200C\u06A9\u0646\u062F."}},{id:"q10-04",chapter:10,question:{en:"Why is a bond discount or premium amortized over the life of the bond?",fa:"\u0686\u0631\u0627 \u06A9\u0633\u0631 \u06CC\u0627 \u0635\u0631\u0641 \u0627\u0648\u0631\u0627\u0642 \u0642\u0631\u0636\u0647 \u062F\u0631 \u0637\u0648\u0644 \u0639\u0645\u0631 \u0627\u0648\u0631\u0627\u0642 \u0645\u0633\u062A\u0647\u0644\u06A9 \u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},answer:{en:"A discount is extra interest the company will effectively pay (it receives less but repays full par), and a premium reduces its true interest cost. Amortizing them spreads this adjustment over every interest period, so interest expense each period reflects the true borrowing cost, and the carrying value moves to par by maturity.",fa:"\u06A9\u0633\u0631 \u062F\u0631 \u0648\u0627\u0642\u0639 \u0628\u0647\u0631\u0647\u0654 \u0627\u0636\u0627\u0641\u0647\u200C\u0627\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0634\u0631\u06A9\u062A \u0645\u06CC\u200C\u067E\u0631\u062F\u0627\u0632\u062F (\u06A9\u0645\u062A\u0631 \u0645\u06CC\u200C\u06AF\u06CC\u0631\u062F \u0648\u0644\u06CC \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u06A9\u0627\u0645\u0644 \u0631\u0627 \u067E\u0633 \u0645\u06CC\u200C\u062F\u0647\u062F) \u0648 \u0635\u0631\u0641 \u0647\u0632\u06CC\u0646\u0647\u0654 \u0648\u0627\u0642\u0639\u06CC \u0628\u0647\u0631\u0647 \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0622\u0646\u200C\u0647\u0627 \u0627\u06CC\u0646 \u0627\u0635\u0644\u0627\u062D \u0631\u0627 \u0631\u0648\u06CC \u0647\u0631 \u062F\u0648\u0631\u0647\u0654 \u0628\u0647\u0631\u0647 \u067E\u062E\u0634 \u0645\u06CC\u200C\u06A9\u0646\u062F \u062A\u0627 \u0647\u0632\u06CC\u0646\u0647\u0654 \u0628\u0647\u0631\u0647\u0654 \u0647\u0631 \u062F\u0648\u0631\u0647 \u0647\u0632\u06CC\u0646\u0647\u0654 \u0648\u0627\u0642\u0639\u06CC \u0642\u0631\u0636 \u0631\u0627 \u0646\u0634\u0627\u0646 \u062F\u0647\u062F \u0648 \u0627\u0631\u0632\u0634 \u062F\u0641\u062A\u0631\u06CC \u062A\u0627 \u0633\u0631\u0631\u0633\u06CC\u062F \u0628\u0647 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0628\u0631\u0633\u062F."}},{id:"q10-05",chapter:10,question:{en:"How is an installment note different from a bond?",fa:"\u0633\u0646\u062F \u0627\u0642\u0633\u0627\u0637\u06CC \u0686\u0647 \u0641\u0631\u0642\u06CC \u0628\u0627 \u0627\u0648\u0631\u0627\u0642 \u0642\u0631\u0636\u0647 \u062F\u0627\u0631\u062F\u061F"},answer:{en:"An installment note is usually a loan from one lender, repaid in a series of payments that include both interest and part of the principal, so the balance falls over time. A bond is usually sold to many investors, pays only interest during its life, and repays the full par value at maturity.",fa:"\u0633\u0646\u062F \u0627\u0642\u0633\u0627\u0637\u06CC \u0645\u0639\u0645\u0648\u0644\u0627\u064B \u0648\u0627\u0645 \u0627\u0632 \u06CC\u06A9 \u0648\u0627\u0645\u200C\u062F\u0647\u0646\u062F\u0647 \u0627\u0633\u062A \u06A9\u0647 \u0628\u0627 \u0686\u0646\u062F \u0642\u0633\u0637 \u067E\u0631\u062F\u0627\u062E\u062A \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0647\u0631 \u0642\u0633\u0637 \u0647\u0645 \u0628\u0647\u0631\u0647 \u062F\u0627\u0631\u062F \u0647\u0645 \u0628\u062E\u0634\u06CC \u0627\u0632 \u0627\u0635\u0644\u060C \u067E\u0633 \u0645\u0627\u0646\u062F\u0647 \u0628\u0647\u200C\u0645\u0631\u0648\u0631 \u06A9\u0645 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0627\u0648\u0631\u0627\u0642 \u0642\u0631\u0636\u0647 \u0645\u0639\u0645\u0648\u0644\u0627\u064B \u0628\u0647 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u0627\u0646 \u0632\u06CC\u0627\u062F\u06CC \u0641\u0631\u0648\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F\u060C \u062F\u0631 \u0637\u0648\u0644 \u0639\u0645\u0631\u0634 \u0641\u0642\u0637 \u0628\u0647\u0631\u0647 \u0645\u06CC\u200C\u062F\u0647\u062F \u0648 \u062F\u0631 \u0633\u0631\u0631\u0633\u06CC\u062F \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u06A9\u0627\u0645\u0644 \u0631\u0627 \u0628\u0631\u0645\u06CC\u200C\u06AF\u0631\u062F\u0627\u0646\u062F."}},{id:"q10-06",chapter:10,question:{en:"What does the debt-to-equity ratio show?",fa:"\u0646\u0633\u0628\u062A \u0628\u062F\u0647\u06CC \u0628\u0647 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u0686\u0647 \u0686\u06CC\u0632\u06CC \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F\u061F"},answer:{en:"Debt-to-equity (total liabilities \xF7 total equity) compares how much of the company is financed by creditors versus owners. A higher ratio means more debt and more risk from fixed payments, but it can also boost owners' returns. Lenders and investors use it to judge financial risk.",fa:"\u0646\u0633\u0628\u062A \u0628\u062F\u0647\u06CC \u0628\u0647 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 (\u06A9\u0644 \u0628\u062F\u0647\u06CC \xF7 \u06A9\u0644 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645) \u0645\u0642\u0627\u06CC\u0633\u0647 \u0645\u06CC\u200C\u06A9\u0646\u062F \u0686\u0647 \u0628\u062E\u0634\u06CC \u0627\u0632 \u0634\u0631\u06A9\u062A \u0628\u0627 \u067E\u0648\u0644 \u0637\u0644\u0628\u06A9\u0627\u0631\u0627\u0646 \u0648 \u0686\u0647 \u0628\u062E\u0634\u06CC \u0628\u0627 \u067E\u0648\u0644 \u0635\u0627\u062D\u0628\u0627\u0646 \u062A\u0623\u0645\u06CC\u0646 \u0634\u062F\u0647. \u0646\u0633\u0628\u062A \u0628\u0627\u0644\u0627\u062A\u0631 \u06CC\u0639\u0646\u06CC \u0628\u062F\u0647\u06CC \u0628\u06CC\u0634\u062A\u0631 \u0648 \u0631\u06CC\u0633\u06A9 \u0628\u06CC\u0634\u062A\u0631 \u0627\u0632 \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0647\u0627\u06CC \u062B\u0627\u0628\u062A\u060C \u0648\u0644\u06CC \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0628\u0627\u0632\u062F\u0647 \u0635\u0627\u062D\u0628\u0627\u0646 \u0631\u0627 \u0647\u0645 \u0628\u06CC\u0634\u062A\u0631 \u06A9\u0646\u062F. \u0648\u0627\u0645\u200C\u062F\u0647\u0646\u062F\u06AF\u0627\u0646 \u0648 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u0627\u0646 \u0628\u0631\u0627\u06CC \u0633\u0646\u062C\u0634 \u0631\u06CC\u0633\u06A9 \u0645\u0627\u0644\u06CC \u0627\u0632 \u0622\u0646 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F."}},{id:"q11-01",chapter:11,question:{en:"What are the advantages and disadvantages of a corporation?",fa:"\u0645\u0632\u0627\u06CC\u0627 \u0648 \u0645\u0639\u0627\u06CC\u0628 \u0634\u0631\u06A9\u062A \u0633\u0647\u0627\u0645\u06CC \u0686\u06CC\u0633\u062A\u061F"},answer:{en:"Advantages: it is a separate legal entity, stockholders have limited liability (they can lose only what they invested), ownership is easy to transfer, it has continuous life, and it can raise large amounts of capital. Disadvantages: more government regulation, and double taxation (the corporation pays tax on income, and stockholders pay tax again on dividends).",fa:"\u0645\u0632\u0627\u06CC\u0627: \u0634\u062E\u0635\u06CC\u062A \u062D\u0642\u0648\u0642\u06CC \u062C\u062F\u0627 \u062F\u0627\u0631\u062F\u060C \u0633\u0647\u0627\u0645\u200C\u062F\u0627\u0631\u0627\u0646 \u0645\u0633\u0626\u0648\u0644\u06CC\u062A \u0645\u062D\u062F\u0648\u062F \u062F\u0627\u0631\u0646\u062F (\u0641\u0642\u0637 \u0633\u0631\u0645\u0627\u06CC\u0647\u0654 \u062E\u0648\u062F\u0634\u0627\u0646 \u0631\u0627 \u0627\u0632 \u062F\u0633\u062A \u0645\u06CC\u200C\u062F\u0647\u0646\u062F)\u060C \u0627\u0646\u062A\u0642\u0627\u0644 \u0645\u0627\u0644\u06A9\u06CC\u062A \u0622\u0633\u0627\u0646 \u0627\u0633\u062A\u060C \u0639\u0645\u0631 \u0646\u0627\u0645\u062D\u062F\u0648\u062F \u062F\u0627\u0631\u062F \u0648 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0633\u0631\u0645\u0627\u06CC\u0647\u0654 \u0632\u06CC\u0627\u062F\u06CC \u062C\u0645\u0639 \u06A9\u0646\u062F. \u0645\u0639\u0627\u06CC\u0628: \u0645\u0642\u0631\u0631\u0627\u062A \u062F\u0648\u0644\u062A\u06CC \u0628\u06CC\u0634\u062A\u0631 \u0648 \u0645\u0627\u0644\u06CC\u0627\u062A \u062F\u0648\u06AF\u0627\u0646\u0647 (\u0634\u0631\u06A9\u062A \u0631\u0648\u06CC \u0633\u0648\u062F \u0645\u0627\u0644\u06CC\u0627\u062A \u0645\u06CC\u200C\u062F\u0647\u062F \u0648 \u0633\u0647\u0627\u0645\u200C\u062F\u0627\u0631\u0627\u0646 \u062F\u0648\u0628\u0627\u0631\u0647 \u0631\u0648\u06CC \u0633\u0648\u062F \u0633\u0647\u0627\u0645)."}},{id:"q11-02",chapter:11,question:{en:"What is par value, and why is stock sold above par recorded in two accounts?",fa:"\u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0686\u06CC\u0633\u062A \u0648 \u0686\u0631\u0627 \u0633\u0647\u0627\u0645\u06CC \u06A9\u0647 \u0628\u0627\u0644\u0627\u062A\u0631 \u0627\u0632 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0641\u0631\u0648\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F \u062F\u0631 \u062F\u0648 \u062D\u0633\u0627\u0628 \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},answer:{en:"Par value is an arbitrary amount printed on each share; it is not the market value. When stock is sold above par, the par amount goes to Common Stock (legal capital) and the extra goes to Paid-In Capital in Excess of Par. This shows how much is legal capital and how much is extra money investors paid.",fa:"\u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0645\u0628\u0644\u063A\u06CC \u0642\u0631\u0627\u0631\u062F\u0627\u062F\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0631\u0648\u06CC \u0647\u0631 \u0633\u0647\u0645 \u0646\u0648\u0634\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0627\u0631\u0632\u0634 \u0628\u0627\u0632\u0627\u0631 \u0646\u06CC\u0633\u062A. \u0648\u0642\u062A\u06CC \u0633\u0647\u0627\u0645 \u0628\u0627\u0644\u0627\u062A\u0631 \u0627\u0632 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0641\u0631\u0648\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F\u060C \u0645\u0628\u0644\u063A \u0627\u0633\u0645\u06CC \u0628\u0647 \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC (\u0633\u0631\u0645\u0627\u06CC\u0647\u0654 \u0642\u0627\u0646\u0648\u0646\u06CC) \u0648 \u0645\u0627\u0632\u0627\u062F\u0634 \u0628\u0647 \u0635\u0631\u0641 \u0633\u0647\u0627\u0645 \u0645\u06CC\u200C\u0631\u0648\u062F. \u0627\u06CC\u0646 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0686\u0642\u062F\u0631 \u0633\u0631\u0645\u0627\u06CC\u0647\u0654 \u0642\u0627\u0646\u0648\u0646\u06CC \u0627\u0633\u062A \u0648 \u0686\u0642\u062F\u0631 \u067E\u0648\u0644 \u0627\u0636\u0627\u0641\u0647\u200C\u0627\u06CC \u06A9\u0647 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u0627\u0646 \u062F\u0627\u062F\u0646\u062F."}},{id:"q11-03",chapter:11,question:{en:"How are cash dividends, stock dividends, and stock splits different?",fa:"\u0633\u0648\u062F \u0646\u0642\u062F\u06CC\u060C \u0633\u0648\u062F \u0633\u0647\u0645\u06CC \u0648 \u062A\u062C\u0632\u06CC\u0647\u0654 \u0633\u0647\u0627\u0645 \u0686\u0647 \u0641\u0631\u0642\u06CC \u062F\u0627\u0631\u0646\u062F\u061F"},answer:{en:"A cash dividend pays cash to stockholders and reduces assets and retained earnings. A stock dividend gives extra shares instead of cash: it moves an amount from retained earnings to paid-in capital, but total equity does not change. A stock split only increases the number of shares and lowers par per share; it needs no journal entry and total equity does not change.",fa:"\u0633\u0648\u062F \u0646\u0642\u062F\u06CC \u0628\u0647 \u0633\u0647\u0627\u0645\u200C\u062F\u0627\u0631\u0627\u0646 \u067E\u0648\u0644 \u0645\u06CC\u200C\u062F\u0647\u062F \u0648 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0648 \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0633\u0648\u062F \u0633\u0647\u0645\u06CC \u0628\u0647 \u062C\u0627\u06CC \u067E\u0648\u0644 \u0633\u0647\u0645 \u0627\u0636\u0627\u0641\u0647 \u0645\u06CC\u200C\u062F\u0647\u062F: \u0645\u0628\u0644\u063A\u06CC \u0631\u0627 \u0627\u0632 \u0633\u0648\u062F \u0627\u0646\u0628\u0627\u0634\u062A\u0647 \u0628\u0647 \u0633\u0631\u0645\u0627\u06CC\u0647\u0654 \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0634\u062F\u0647 \u0645\u0646\u062A\u0642\u0644 \u0645\u06CC\u200C\u06A9\u0646\u062F \u0648\u0644\u06CC \u06A9\u0644 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u062A\u063A\u06CC\u06CC\u0631 \u0646\u0645\u06CC\u200C\u06A9\u0646\u062F. \u062A\u062C\u0632\u06CC\u0647\u0654 \u0633\u0647\u0627\u0645 \u0641\u0642\u0637 \u062A\u0639\u062F\u0627\u062F \u0633\u0647\u0627\u0645 \u0631\u0627 \u0632\u06CC\u0627\u062F \u0648 \u0627\u0631\u0632\u0634 \u0627\u0633\u0645\u06CC \u0647\u0631 \u0633\u0647\u0645 \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u062F\u061B \u062B\u0628\u062A \u0631\u0648\u0632\u0646\u0627\u0645\u0647 \u0646\u062F\u0627\u0631\u062F \u0648 \u06A9\u0644 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u062A\u063A\u06CC\u06CC\u0631 \u0646\u0645\u06CC\u200C\u06A9\u0646\u062F."}},{id:"q11-04",chapter:11,question:{en:"Why would an investor buy preferred stock instead of common stock?",fa:"\u0686\u0631\u0627 \u06CC\u06A9 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631 \u0645\u0645\u06A9\u0646 \u0627\u0633\u062A \u0633\u0647\u0627\u0645 \u0645\u0645\u062A\u0627\u0632 \u0631\u0627 \u0628\u0647 \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC \u062A\u0631\u062C\u06CC\u062D \u062F\u0647\u062F\u061F"},answer:{en:"Preferred stockholders receive dividends before common stockholders, and if the stock is cumulative, unpaid dividends from past years must be paid to them first. They also have priority over common stockholders if the company is liquidated. In exchange, they usually have no voting rights and a fixed dividend.",fa:"\u062F\u0627\u0631\u0646\u062F\u06AF\u0627\u0646 \u0633\u0647\u0627\u0645 \u0645\u0645\u062A\u0627\u0632 \u0642\u0628\u0644 \u0627\u0632 \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC \u0633\u0648\u062F \u0633\u0647\u0627\u0645 \u0645\u06CC\u200C\u06AF\u06CC\u0631\u0646\u062F\u060C \u0648 \u0627\u06AF\u0631 \u0633\u0647\u0627\u0645 \u0627\u0646\u0628\u0627\u0634\u062A\u0646\u06CC \u0628\u0627\u0634\u062F\u060C \u0633\u0648\u062F\u0647\u0627\u06CC \u067E\u0631\u062F\u0627\u062E\u062A\u200C\u0646\u0634\u062F\u0647\u0654 \u0633\u0627\u0644\u200C\u0647\u0627\u06CC \u0642\u0628\u0644 \u0647\u0645 \u0627\u0648\u0644 \u0628\u0647 \u0622\u0646\u200C\u0647\u0627 \u062F\u0627\u062F\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F. \u0627\u06AF\u0631 \u0634\u0631\u06A9\u062A \u0645\u0646\u062D\u0644 \u0634\u0648\u062F \u0647\u0645 \u0627\u0648\u0644\u0648\u06CC\u062A \u062F\u0627\u0631\u0646\u062F. \u062F\u0631 \u0639\u0648\u0636 \u0645\u0639\u0645\u0648\u0644\u0627\u064B \u062D\u0642 \u0631\u0623\u06CC \u0646\u062F\u0627\u0631\u0646\u062F \u0648 \u0633\u0648\u062F\u0634\u0627\u0646 \u062B\u0627\u0628\u062A \u0627\u0633\u062A."}},{id:"q11-05",chapter:11,question:{en:"What is treasury stock, and why do companies buy back their own shares?",fa:"\u0633\u0647\u0627\u0645 \u062E\u0632\u0627\u0646\u0647 \u0686\u06CC\u0633\u062A \u0648 \u0686\u0631\u0627 \u0634\u0631\u06A9\u062A\u200C\u0647\u0627 \u0633\u0647\u0627\u0645 \u062E\u0648\u062F\u0634\u0627\u0646 \u0631\u0627 \u067E\u0633 \u0645\u06CC\u200C\u062E\u0631\u0646\u062F\u061F"},answer:{en:"Treasury stock is the company's own stock that it bought back and holds. It is not an asset; it reduces stockholders' equity. Companies buy back shares to give them to employees, to raise the share price or earnings per share, to avoid a takeover, or to use excess cash.",fa:"\u0633\u0647\u0627\u0645 \u062E\u0632\u0627\u0646\u0647 \u0633\u0647\u0627\u0645 \u062E\u0648\u062F \u0634\u0631\u06A9\u062A \u0627\u0633\u062A \u06A9\u0647 \u0622\u0646 \u0631\u0627 \u067E\u0633 \u062E\u0631\u06CC\u062F\u0647 \u0648 \u0646\u06AF\u0647 \u062F\u0627\u0634\u062A\u0647. \u062F\u0627\u0631\u0627\u06CC\u06CC \u0646\u06CC\u0633\u062A \u0648 \u062D\u0642\u0648\u0642 \u0635\u0627\u062D\u0628\u0627\u0646 \u0633\u0647\u0627\u0645 \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u062F. \u0634\u0631\u06A9\u062A\u200C\u0647\u0627 \u0633\u0647\u0627\u0645 \u0631\u0627 \u067E\u0633 \u0645\u06CC\u200C\u062E\u0631\u0646\u062F \u062A\u0627 \u0628\u0647 \u06A9\u0627\u0631\u0645\u0646\u062F\u0627\u0646 \u0628\u062F\u0647\u0646\u062F\u060C \u0642\u06CC\u0645\u062A \u0633\u0647\u0645 \u06CC\u0627 \u0633\u0648\u062F \u0647\u0631 \u0633\u0647\u0645 \u0631\u0627 \u0628\u0627\u0644\u0627 \u0628\u0628\u0631\u0646\u062F\u060C \u062C\u0644\u0648\u06CC \u062A\u0635\u0627\u062D\u0628 \u0634\u0631\u06A9\u062A \u0631\u0627 \u0628\u06AF\u06CC\u0631\u0646\u062F\u060C \u06CC\u0627 \u0627\u0632 \u067E\u0648\u0644 \u0627\u0636\u0627\u0641\u0647 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u06A9\u0646\u0646\u062F."}},{id:"q11-06",chapter:11,question:{en:"What do earnings per share and the price-earnings ratio tell investors?",fa:"\u0633\u0648\u062F \u0647\u0631 \u0633\u0647\u0645 \u0648 \u0646\u0633\u0628\u062A \u0642\u06CC\u0645\u062A \u0628\u0647 \u0633\u0648\u062F \u0686\u0647 \u0686\u06CC\u0632\u06CC \u0628\u0647 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u0627\u0646 \u0645\u06CC\u200C\u06AF\u0648\u06CC\u0646\u062F\u061F"},answer:{en:"Earnings per share (net income minus preferred dividends, divided by common shares) shows how much profit belongs to each common share. The price-earnings ratio (market price \xF7 EPS) shows how much investors are willing to pay for each dollar of earnings; a high P/E usually means investors expect strong future growth.",fa:"\u0633\u0648\u062F \u0647\u0631 \u0633\u0647\u0645 (\u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0645\u0646\u0647\u0627\u06CC \u0633\u0648\u062F \u0645\u0645\u062A\u0627\u0632\u060C \u062A\u0642\u0633\u06CC\u0645 \u0628\u0631 \u062A\u0639\u062F\u0627\u062F \u0633\u0647\u0627\u0645 \u0639\u0627\u062F\u06CC) \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0686\u0642\u062F\u0631 \u0633\u0648\u062F \u0645\u0627\u0644 \u0647\u0631 \u0633\u0647\u0645 \u0639\u0627\u062F\u06CC \u0627\u0633\u062A. \u0646\u0633\u0628\u062A \u0642\u06CC\u0645\u062A \u0628\u0647 \u0633\u0648\u062F (\u0642\u06CC\u0645\u062A \u0628\u0627\u0632\u0627\u0631 \xF7 \u0633\u0648\u062F \u0647\u0631 \u0633\u0647\u0645) \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u0627\u0646 \u062D\u0627\u0636\u0631\u0646\u062F \u0628\u0631\u0627\u06CC \u0647\u0631 \u062F\u0644\u0627\u0631 \u0633\u0648\u062F \u0686\u0642\u062F\u0631 \u0628\u067E\u0631\u062F\u0627\u0632\u0646\u062F\u061B \u0646\u0633\u0628\u062A \u0628\u0627\u0644\u0627 \u0645\u0639\u0645\u0648\u0644\u0627\u064B \u06CC\u0639\u0646\u06CC \u0627\u0646\u062A\u0638\u0627\u0631 \u0631\u0634\u062F \u0642\u0648\u06CC \u062F\u0631 \u0622\u06CC\u0646\u062F\u0647."}},{id:"q12-01",chapter:12,question:{en:"What is the statement of cash flows, and why is it needed if we already have an income statement?",fa:"\u0635\u0648\u0631\u062A \u062C\u0631\u06CC\u0627\u0646 \u0648\u062C\u0648\u0647 \u0646\u0642\u062F \u0686\u06CC\u0633\u062A \u0648 \u0686\u0631\u0627 \u0644\u0627\u0632\u0645 \u0627\u0633\u062A \u0648\u0642\u062A\u06CC \u0635\u0648\u0631\u062A \u0633\u0648\u062F \u0648 \u0632\u06CC\u0627\u0646 \u062F\u0627\u0631\u06CC\u0645\u061F"},answer:{en:"It shows where a company's cash came from and where it went during a period. It is needed because profit is not the same as cash: under accrual accounting a company can report a big profit and still run out of cash, for example if customers haven't paid or it bought a lot of inventory. A company that can't pay its bills can fail even while profitable.",fa:"\u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u067E\u0648\u0644 \u0646\u0642\u062F \u0634\u0631\u06A9\u062A \u062F\u0631 \u06CC\u06A9 \u062F\u0648\u0631\u0647 \u0627\u0632 \u06A9\u062C\u0627 \u0622\u0645\u062F \u0648 \u06A9\u062C\u0627 \u0631\u0641\u062A. \u0644\u0627\u0632\u0645 \u0627\u0633\u062A \u0686\u0648\u0646 \u0633\u0648\u062F \u0628\u0627 \u067E\u0648\u0644 \u0646\u0642\u062F \u06CC\u06A9\u06CC \u0646\u06CC\u0633\u062A: \u062F\u0631 \u062D\u0633\u0627\u0628\u062F\u0627\u0631\u06CC \u062A\u0639\u0647\u062F\u06CC \u0634\u0631\u06A9\u062A \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0633\u0648\u062F \u0632\u06CC\u0627\u062F\u06CC \u0646\u0634\u0627\u0646 \u062F\u0647\u062F \u0648 \u0628\u0627\u0632 \u0647\u0645 \u067E\u0648\u0644 \u0646\u062F\u0627\u0634\u062A\u0647 \u0628\u0627\u0634\u062F\u060C \u0645\u062B\u0644\u0627\u064B \u0627\u06AF\u0631 \u0645\u0634\u062A\u0631\u06CC\u200C\u0647\u0627 \u067E\u0648\u0644 \u0646\u062F\u0627\u062F\u0647 \u0628\u0627\u0634\u0646\u062F \u06CC\u0627 \u06A9\u0627\u0644\u0627\u06CC \u0632\u06CC\u0627\u062F\u06CC \u062E\u0631\u06CC\u062F\u0647 \u0628\u0627\u0634\u062F. \u0634\u0631\u06A9\u062A\u06CC \u06A9\u0647 \u0646\u062A\u0648\u0627\u0646\u062F \u0642\u0628\u0636\u200C\u0647\u0627\u06CC\u0634 \u0631\u0627 \u0628\u067E\u0631\u062F\u0627\u0632\u062F\u060C \u062D\u062A\u06CC \u0628\u0627 \u0633\u0648\u062F \u0647\u0645 \u0634\u06A9\u0633\u062A \u0645\u06CC\u200C\u062E\u0648\u0631\u062F."}},{id:"q12-02",chapter:12,question:{en:"Why are cash flows split into operating, investing, and financing activities?",fa:"\u0686\u0631\u0627 \u062C\u0631\u06CC\u0627\u0646\u200C\u0647\u0627\u06CC \u0646\u0642\u062F\u06CC \u0628\u0647 \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC\u060C \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC \u0648 \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC \u062A\u0642\u0633\u06CC\u0645 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F\u061F"},answer:{en:"Each section tells a different story. Operating shows whether the core business produces cash, which is the most important sign of health. Investing shows whether the company is buying assets for the future or selling them off. Financing shows how much comes from or goes to lenders and owners. Two companies can have the same total change in cash for very different reasons.",fa:"\u0647\u0631 \u0628\u062E\u0634 \u062F\u0627\u0633\u062A\u0627\u0646 \u0645\u062A\u0641\u0627\u0648\u062A\u06CC \u0645\u06CC\u200C\u06AF\u0648\u06CC\u062F. \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u06A9\u0627\u0631 \u0627\u0635\u0644\u06CC \u067E\u0648\u0644 \u0645\u06CC\u200C\u0633\u0627\u0632\u062F \u06CC\u0627 \u0646\u0647\u060C \u06A9\u0647 \u0645\u0647\u0645\u200C\u062A\u0631\u06CC\u0646 \u0646\u0634\u0627\u0646\u0647\u0654 \u0633\u0644\u0627\u0645\u062A \u0627\u0633\u062A. \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0634\u0631\u06A9\u062A \u0628\u0631\u0627\u06CC \u0622\u06CC\u0646\u062F\u0647 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0645\u06CC\u200C\u062E\u0631\u062F \u06CC\u0627 \u062F\u0627\u0631\u0627\u06CC\u06CC\u200C\u0647\u0627\u06CC\u0634 \u0631\u0627 \u0645\u06CC\u200C\u0641\u0631\u0648\u0634\u062F. \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F \u0686\u0642\u062F\u0631 \u067E\u0648\u0644 \u0627\u0632 \u0648\u0627\u0645\u200C\u062F\u0647\u0646\u062F\u0647\u200C\u0647\u0627 \u0648 \u0635\u0627\u062D\u0628\u0627\u0646 \u0622\u0645\u062F\u0647 \u06CC\u0627 \u0628\u0647 \u0622\u0646\u200C\u0647\u0627 \u0631\u0641\u062A\u0647. \u062F\u0648 \u0634\u0631\u06A9\u062A \u0645\u0645\u06A9\u0646 \u0627\u0633\u062A \u062A\u063A\u06CC\u06CC\u0631 \u067E\u0648\u0644 \u06CC\u06A9\u0633\u0627\u0646\u06CC \u062F\u0627\u0634\u062A\u0647 \u0628\u0627\u0634\u0646\u062F \u0648\u0644\u06CC \u0628\u0647 \u062F\u0644\u0627\u06CC\u0644 \u06A9\u0627\u0645\u0644\u0627\u064B \u0645\u062A\u0641\u0627\u0648\u062A."}},{id:"q12-03",chapter:12,question:{en:"Why is depreciation added back to net income in the indirect method?",fa:"\u0686\u0631\u0627 \u062F\u0631 \u0631\u0648\u0634 \u063A\u06CC\u0631\u0645\u0633\u062A\u0642\u06CC\u0645 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0628\u0647 \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0627\u0636\u0627\u0641\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F\u061F"},answer:{en:"Depreciation is a non-cash expense. It reduced net income, but no cash was paid to anyone. The indirect method starts with net income and adds depreciation back to remove its effect, so the result shows the real cash from operations.",fa:"\u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0647\u0632\u06CC\u0646\u0647\u0654 \u063A\u06CC\u0631\u0646\u0642\u062F\u06CC \u0627\u0633\u062A. \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0631\u0627 \u06A9\u0645 \u06A9\u0631\u062F\u060C \u0648\u0644\u06CC \u0647\u06CC\u0686 \u067E\u0648\u0644\u06CC \u0628\u0647 \u06A9\u0633\u06CC \u067E\u0631\u062F\u0627\u062E\u062A \u0646\u0634\u062F. \u0631\u0648\u0634 \u063A\u06CC\u0631\u0645\u0633\u062A\u0642\u06CC\u0645 \u0627\u0632 \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0634\u0631\u0648\u0639 \u0645\u06CC\u200C\u06A9\u0646\u062F \u0648 \u0627\u0633\u062A\u0647\u0644\u0627\u06A9 \u0631\u0627 \u0628\u0631\u0645\u06CC\u200C\u06AF\u0631\u062F\u0627\u0646\u062F \u062A\u0627 \u0627\u062B\u0631\u0634 \u067E\u0627\u06A9 \u0634\u0648\u062F \u0648 \u0646\u062A\u06CC\u062C\u0647\u060C \u067E\u0648\u0644 \u0646\u0642\u062F \u0648\u0627\u0642\u0639\u06CC \u0627\u0632 \u0639\u0645\u0644\u06CC\u0627\u062A \u0631\u0627 \u0646\u0634\u0627\u0646 \u062F\u0647\u062F."}},{id:"q12-04",chapter:12,question:{en:"Why does an increase in accounts receivable reduce operating cash flow?",fa:"\u0686\u0631\u0627 \u0627\u0641\u0632\u0627\u06CC\u0634 \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC \u062C\u0631\u06CC\u0627\u0646 \u0646\u0642\u062F \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \u0631\u0627 \u06A9\u0645 \u0645\u06CC\u200C\u06A9\u0646\u062F\u061F"},answer:{en:"An increase in accounts receivable means sales were included in net income, but customers have not paid that money yet. So net income is higher than the cash actually collected, and the increase must be subtracted to find real operating cash.",fa:"\u0627\u0641\u0632\u0627\u06CC\u0634 \u062F\u0631\u06CC\u0627\u0641\u062A\u0646\u06CC\u200C\u0647\u0627 \u06CC\u0639\u0646\u06CC \u0641\u0631\u0648\u0634 \u062F\u0631 \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u062D\u0633\u0627\u0628 \u0634\u062F\u0647 \u0648\u0644\u06CC \u0645\u0634\u062A\u0631\u06CC\u200C\u0647\u0627 \u0647\u0646\u0648\u0632 \u067E\u0648\u0644\u0634 \u0631\u0627 \u0646\u062F\u0627\u062F\u0647\u200C\u0627\u0646\u062F. \u067E\u0633 \u0633\u0648\u062F \u062E\u0627\u0644\u0635 \u0627\u0632 \u067E\u0648\u0644 \u0648\u0627\u0642\u0639\u0627\u064B \u0648\u0635\u0648\u0644\u200C\u0634\u062F\u0647 \u0628\u06CC\u0634\u062A\u0631 \u0627\u0633\u062A \u0648 \u0627\u06CC\u0646 \u0627\u0641\u0632\u0627\u06CC\u0634 \u0628\u0627\u06CC\u062F \u06A9\u0645 \u0634\u0648\u062F \u062A\u0627 \u067E\u0648\u0644 \u0646\u0642\u062F \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \u0648\u0627\u0642\u0639\u06CC \u0628\u0647 \u062F\u0633\u062A \u0628\u06CC\u0627\u06CC\u062F."}},{id:"q12-05",chapter:12,question:{en:"A company's cash went up only because it took a large bank loan. Is that a good sign?",fa:"\u067E\u0648\u0644 \u0646\u0642\u062F \u06CC\u06A9 \u0634\u0631\u06A9\u062A \u0641\u0642\u0637 \u0628\u0647 \u0627\u06CC\u0646 \u062F\u0644\u06CC\u0644 \u0632\u06CC\u0627\u062F \u0634\u062F \u06A9\u0647 \u0648\u0627\u0645 \u0628\u0627\u0646\u06A9\u06CC \u0628\u0632\u0631\u06AF\u06CC \u06AF\u0631\u0641\u062A. \u0627\u06CC\u0646 \u0646\u0634\u0627\u0646\u0647\u0654 \u062E\u0648\u0628\u06CC \u0627\u0633\u062A\u061F"},answer:{en:"Not necessarily. The increase appears in financing activities, not operating. It means the company borrowed money it must repay with interest. If operating cash flow is weak or negative, the company may be using loans to survive, which is risky. Healthy companies get most of their cash from operations.",fa:"\u0644\u0632\u0648\u0645\u0627\u064B \u0646\u0647. \u0627\u06CC\u0646 \u0627\u0641\u0632\u0627\u06CC\u0634 \u062F\u0631 \u0628\u062E\u0634 \u062A\u0623\u0645\u06CC\u0646 \u0645\u0627\u0644\u06CC \u062F\u06CC\u062F\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F\u060C \u0646\u0647 \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC. \u06CC\u0639\u0646\u06CC \u0634\u0631\u06A9\u062A \u067E\u0648\u0644\u06CC \u0642\u0631\u0636 \u06AF\u0631\u0641\u062A\u0647 \u06A9\u0647 \u0628\u0627\u06CC\u062F \u0628\u0627 \u0628\u0647\u0631\u0647 \u067E\u0633 \u0628\u062F\u0647\u062F. \u0627\u06AF\u0631 \u062C\u0631\u06CC\u0627\u0646 \u0646\u0642\u062F \u0639\u0645\u0644\u06CC\u0627\u062A\u06CC \u0636\u0639\u06CC\u0641 \u06CC\u0627 \u0645\u0646\u0641\u06CC \u0628\u0627\u0634\u062F\u060C \u0634\u0631\u06A9\u062A \u0634\u0627\u06CC\u062F \u0628\u0631\u0627\u06CC \u0632\u0646\u062F\u0647 \u0645\u0627\u0646\u062F\u0646 \u0648\u0627\u0645 \u0645\u06CC\u200C\u06AF\u06CC\u0631\u062F\u060C \u06A9\u0647 \u067E\u0631\u0631\u06CC\u0633\u06A9 \u0627\u0633\u062A. \u0634\u0631\u06A9\u062A\u200C\u0647\u0627\u06CC \u0633\u0627\u0644\u0645 \u0628\u06CC\u0634\u062A\u0631 \u067E\u0648\u0644\u0634\u0627\u0646 \u0631\u0627 \u0627\u0632 \u0639\u0645\u0644\u06CC\u0627\u062A \u0645\u06CC\u200C\u0633\u0627\u0632\u0646\u062F."}},{id:"q12-06",chapter:12,question:{en:"Why is a large negative investing cash flow not always a bad sign? What are other limitations of this statement?",fa:"\u0686\u0631\u0627 \u0639\u062F\u062F \u0645\u0646\u0641\u06CC \u0628\u0632\u0631\u06AF \u062F\u0631 \u062C\u0631\u06CC\u0627\u0646 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC \u0647\u0645\u06CC\u0634\u0647 \u0646\u0634\u0627\u0646\u0647\u0654 \u0628\u062F\u06CC \u0646\u06CC\u0633\u062A\u061F \u0645\u062D\u062F\u0648\u062F\u06CC\u062A\u200C\u0647\u0627\u06CC \u062F\u06CC\u06AF\u0631 \u0627\u06CC\u0646 \u0635\u0648\u0631\u062A \u0686\u06CC\u0633\u062A\u061F"},answer:{en:"A negative investing number often means the company is buying new equipment or buildings to grow, which can be good for the future. Limitations: the statement shows only the past, one year can be misleading, noncash activities (like buying land with stock) are only disclosed separately, and it does not measure profitability, so it should be read with the income statement and balance sheet.",fa:"\u0639\u062F\u062F \u0645\u0646\u0641\u06CC \u062F\u0631 \u0633\u0631\u0645\u0627\u06CC\u0647\u200C\u06AF\u0630\u0627\u0631\u06CC \u0627\u063A\u0644\u0628 \u06CC\u0639\u0646\u06CC \u0634\u0631\u06A9\u062A \u0628\u0631\u0627\u06CC \u0631\u0634\u062F \u062A\u062C\u0647\u06CC\u0632\u0627\u062A \u06CC\u0627 \u0633\u0627\u062E\u062A\u0645\u0627\u0646 \u062C\u062F\u06CC\u062F \u0645\u06CC\u200C\u062E\u0631\u062F\u060C \u06A9\u0647 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0628\u0631\u0627\u06CC \u0622\u06CC\u0646\u062F\u0647 \u062E\u0648\u0628 \u0628\u0627\u0634\u062F. \u0645\u062D\u062F\u0648\u062F\u06CC\u062A\u200C\u0647\u0627: \u0641\u0642\u0637 \u06AF\u0630\u0634\u062A\u0647 \u0631\u0627 \u0646\u0634\u0627\u0646 \u0645\u06CC\u200C\u062F\u0647\u062F\u060C \u06CC\u06A9 \u0633\u0627\u0644 \u062A\u0646\u0647\u0627 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u06AF\u0645\u0631\u0627\u0647\u200C\u06A9\u0646\u0646\u062F\u0647 \u0628\u0627\u0634\u062F\u060C \u0641\u0639\u0627\u0644\u06CC\u062A\u200C\u0647\u0627\u06CC \u063A\u06CC\u0631\u0646\u0642\u062F\u06CC (\u0645\u062B\u0644 \u062E\u0631\u06CC\u062F \u0632\u0645\u06CC\u0646 \u0628\u0627 \u0633\u0647\u0627\u0645) \u0641\u0642\u0637 \u062C\u062F\u0627\u06AF\u0627\u0646\u0647 \u0627\u0641\u0634\u0627 \u0645\u06CC\u200C\u0634\u0648\
